<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flash Kartlar – Genel Cerrahi Sözlü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
html{scroll-padding-top:70px}
:root{
  --paper:#F6F7F4; --card:#FFFFFF; --ink:#18211D; --muted:#5E6B64; --line:#D5DBD6;
  --scrub:#1D4E89; --scrub-tint:#E4ECF6; --warn:#8A5200; --warn-bg:#FBF1DF;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121614; --card:#1A201D; --ink:#E4EAE6; --muted:#9AA8A0; --line:#2C3531;
  --scrub:#8DB8EA; --scrub-tint:#1B2635; --warn:#F0B86A; --warn-bg:#2D2414;}}
:root[data-theme="dark"]{
  --paper:#121614; --card:#1A201D; --ink:#E4EAE6; --muted:#9AA8A0; --line:#2C3531;
  --scrub:#8DB8EA; --scrub-tint:#1B2635; --warn:#F0B86A; --warn-bg:#2D2414;}

*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
a{color:var(--scrub)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--scrub);outline-offset:2px}


.bar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.barin{max-width:900px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px}
.bartitle{font-weight:600;flex:1}
.nav a{font-size:.95rem;font-weight:600;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:20px 24px 40px}
.info{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.scene{perspective:1400px}
.card{display:grid;width:100%;height:min(68vh,540px);text-align:left;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.card.flip{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 26px;display:flex;flex-direction:column}
.front{align-items:center;justify-content:center;text-align:center}
.front .topic{font-size:.85rem;color:var(--scrub);font-weight:600;margin-bottom:16px}
.front .qtext{font-size:1.5rem;font-weight:700;line-height:1.3;max-height:100%;overflow-y:auto;overflow-wrap:anywhere}
.front .hint,.back .hint{margin-top:22px;font-size:.85rem;color:var(--muted)}
.back{transform:rotateY(180deg);border-color:var(--scrub)}
.back .qsmall{flex:0 0 auto;max-height:5.5em;overflow-y:auto;font-size:.95rem;font-weight:700;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.card:not(.flip) .back,.card.flip .front{visibility:hidden}
#answer{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ans{font-family:var(--serif);white-space:pre-line;line-height:1.6;overflow-wrap:anywhere}
.ctrl{display:flex;gap:12px;margin-top:18px}
.ctrl button{flex:1;padding:13px 16px;border:1px solid var(--scrub);border-radius:10px;background:transparent;color:var(--scrub);font-weight:600;cursor:pointer}
.ctrl button#next{background:var(--scrub);color:var(--card)}
.ctrl button:disabled{opacity:.4;cursor:default}
.merged{font-family:var(--serif);font-size:1.04rem;line-height:1.62;max-width:72ch}
.merged h4{font-family:var(--sans);font-size:.98rem;margin:18px 0 6px}
.merged p{margin:0 0 10px}
.merged ul,.merged ol{margin:0 0 10px;padding-left:22px}
.merged li{margin:3px 0}
.merged blockquote{margin:12px 0;padding:10px 14px;background:var(--warn-bg);color:var(--warn);border-radius:6px;font-family:var(--sans);font-size:.93rem}
.src{font-family:var(--sans);font-size:.72rem;font-weight:600;color:var(--scrub);background:var(--scrub-tint);border-radius:4px;padding:1px 5px;margin-left:4px;white-space:nowrap;vertical-align:1px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="bar"><div class="barin"><span class="bartitle">Flash Kartlar</span><span class="nav"><a href="index.html">Tüm sorular</a></span></div></div>
<div class="wrap">
  <div class="info"><span id="pos"></span></div>
  <div class="scene"><div class="card" id="card" role="button" tabindex="0" aria-label="Kartı çevir"><div class="face front"><div class="topic" id="topic"></div><div class="qtext" id="qtext"></div><div class="hint" id="fhint"></div></div><div class="face back"><p class="qsmall" id="qsmall"></p><div id="answer"></div></div></div></div>
  <div class="ctrl"><button id="prev">‹ Önceki</button><button id="next">Sonraki ›</button></div>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const rows = {}; DATA.rows.forEach(r => rows[r.no] = r);
const L = i => String.fromCharCode(65 + i);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function inline(s){
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\s*\[([A-Z](?:\s*,\s*[A-Z])*)\]/g, (m, g) => g.split(/\s*,\s*/).map(x => `<span class="src" title="Gerçek cevap ${x}">${x}</span>`).join(''));
  return h;
}
function md(src){
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of src.split('\n')) {
    const l = raw.trim();
    if (!l) { close(); continue; }
    let m;
    if ((m = l.match(/^#{2,4}\s+(.*)/))) { close(); out.push(`<h4>${inline(m[1])}</h4>`); }
    else if ((m = l.match(/^>\s?(.*)/))) { close(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); }
    else if ((m = l.match(/^[-*]\s+(.*)/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = l.match(/^\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); }
    else { close(); out.push(`<p>${inline(l)}</p>`); }
  }
  close(); return out.join('');
}


const topicOf = {};
DATA.sections.forEach(s => s.clusters.forEach(c => c.rows.forEach(n => topicOf[n] = s.title)));
const cards = DATA.rows.filter(r => r.a && r.a.trim()).map(r => ({
  topic: topicOf[r.no] || '', q: r.q, meta: [r.hoca, r.tip].filter(Boolean).join(' · '),
  back: `<div class="ans">${esc(r.a)}</div>`
}));
let deck = [], i = -1;
function shuffle(){ deck = cards.map((_, k) => k); for (let k = deck.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [deck[k], deck[j]] = [deck[j], deck[k]]; } }
const el = id => document.getElementById(id), card = el('card');
function show(){
  const c = cards[deck[i]];
  card.classList.remove('flip');
  el('topic').textContent = [c.topic, c.meta].filter(Boolean).join(' · ');
  el('qtext').textContent = c.q; el('qsmall').textContent = c.q; el('answer').innerHTML = c.back;
  el('fhint').textContent = 'Cevap için dokun';
  el('pos').textContent = `${i + 1} / ${deck.length}`;
  el('prev').disabled = i === 0;
  card.scrollTop = 0; window.scrollTo(0, 0);
}
function next(){ if (i + 1 >= deck.length) { const last = deck[deck.length - 1]; shuffle(); if (deck[0] === last && deck.length > 1) deck.push(deck.shift()); i = 0; } else i++; show(); }
function prev(){ if (i > 0) { i--; show(); } }
card.addEventListener('click', () => card.classList.toggle('flip'));
el('next').addEventListener('click', next); el('prev').addEventListener('click', prev);
document.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && e.target === card) { e.preventDefault(); card.classList.toggle('flip'); return; } if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); });
shuffle(); i = 0; show();
</script>
</body>
</html>
