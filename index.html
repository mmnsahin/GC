title": "Nazogastrik sonda endikasyonları", "rows": [197], "merged": null}, {"id": "genel-06", "title": "Obezite cerrahisi", "rows": [107, 134, 287], "merged": null}, {"id": "genel-07", "title": "Kanser taraması (Türkiye) ve neden tararız", "rows": [101, 174], "merged": null}, {"id": "genel-08", "title": "Epidemiyoloji, risk ölçütleri (hazard, odds)", "rows": [169, 176], "merged": null}, {"id": "genel-09", "title": "Malign melanom", "rows": [319], "merged": null}, {"id": "genel-10", "title": "Maksilla altında şişlik", "rows": [349], "merged": null}, {"id": "genel-11", "title": "Karışık soru (tiroid, evisserasyon, hemoroid)", "rows": [61], "merged": null}]}, {"id": "kisisel", "title": "Kişisel / Hocaya Özel Sorular", "clusters": [{"id": "kisisel-01", "title": "\"Hangi dersi anlattım?\", sunum konusu, genel muhabbet", "rows": [119, 142, 206, 286, 295, 296, 350, 374], "merged": null}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const rows = {}; DATA.rows.forEach(r => rows[r.no] = r);
const L = i => String.fromCharCode(65 + i);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lowerTR = s => s.toLocaleLowerCase('tr');

function inline(s){
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\s*\[([A-Z](?:\s*,\s*[A-Z])*)\]/g, (m, g) => g.split(/\s*,\s*/).map(x => `<span class="src" title="Gerçek cevap ${x}">${x}</span>`).join(''));
  return h;
}
function md(src){
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of src.split('\n')) {
    const l = raw.trim();
    if (!l) { close(); continue; }
    let m;
    if ((m = l.match(/^#{2,4}\s+(.*)/))) { close(); out.push(`<h4>${inline(m[1])}</h4>`); }
    else if ((m = l.match(/^>\s?(.*)/))) { close(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); }
    else if ((m = l.match(/^[-*]\s+(.*)/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = l.match(/^\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); }
    else { close(); out.push(`<p>${inline(l)}</p>`); }
  }
  close(); return out.join('');
}

const totalQ = DATA.rows.length;
let totalC = 0, repC = 0;
DATA.sections.forEach(s => s.clusters.forEach(c => { totalC++; if (c.rows.length > 1) repC++; }));
document.getElementById('stats').textContent =
  `${totalQ} soru, ${totalC} başlık altında toplandı. ${repC} başlık birden fazla kez sorulmuş.`;

function hocaList(c){
  const set = [];
  c.rows.forEach(n => (rows[n].hoca || '').split(' / ').forEach(h => { h = h.trim(); if (h && h !== '?' && !set.includes(h)) set.push(h); }));
  return set.join(', ');
}

function rawCards(c, hl){
  return c.rows.map((n, i) => {
    const r = rows[n];
    const meta = [`<span class="letter">${L(i)}</span>`, `<span>Soru ${r.no}</span>`];
    if (r.hoca) meta.push(`<span>${esc(r.hoca)}</span>`);
    if (r.tip) meta.push(`<span>${esc(r.tip)}</span>`);
    meta.push(`<span>Sayfa ${r.pages.join(', ')}</span>`);
    const ans = r.a ? `<div class="ans">${hl(esc(r.a))}</div>` : `<div class="empty">Dosyada bu sorunun cevabı boş.</div>`;
    return `<div class="raw"><div class="meta">${meta.join('')}</div><p class="oq">${hl(esc(r.q))}</p>${ans}</div>`;
  }).join('');
}

function clusterHTML(c, hl){
  const n = c.rows.length;
  const freq = n > 1 ? `<span class="freq">${n}<small>×</small></span>` : `<span class="freq one">1<small>×</small></span>`;
  const hocas = hocaList(c);
  let main;
  if (n === 1) {
    const r = rows[c.rows[0]];
    main = `<p class="note">Bir kez sorulmuş; cevap dosyadaki haliyle.</p><p class="oq" style="font-style:italic;color:var(--muted);margin:0 0 8px">${hl(esc(r.q))}</p>` +
      (r.a ? `<div class="single"><div class="ans">${hl(esc(r.a))}</div></div>` : `<div class="pending">Dosyada bu sorunun cevabı boş.</div>`) +
      `<p class="note" style="margin-top:10px">${esc(r.hoca || 'Hoca belirtilmemiş')}${r.tip ? ', ' + esc(r.tip) : ''}, sayfa ${r.pages.join(', ')}</p>`;
  } else {
    main = c.merged ? `<div class="merged">${md(c.merged)}</div>`
      : `<div class="pending">Birleştirilmiş cevap henüz hazır değil. Aşağıdan ${n} gerçek cevabı tek tek okuyabilirsin.</div>`;
    main += `<button class="rawbtn" aria-expanded="false">Gerçek cevaplar (${n})</button><div class="raws">${rawCards(c, hl)}</div>`;
  }
  return `<div class="q" id="${c.id}"><button class="head" aria-expanded="false">${freq}<span class="qt">${esc(c.title)}${hocas ? `<span class="hocas">${esc(hocas)}</span>` : ''}</span><span class="chev" aria-hidden="true">›</span></button><div class="body">${main}</div></div>`;
}

const main = document.getElementById('main'), nav = document.getElementById('nav'), navlist = document.getElementById('navlist');
const search = document.getElementById('search'), onlyRep = document.getElementById('onlyRep');

function haystack(c){
  if (!c._h) c._h = lowerTR([c.title, c.merged || '', ...c.rows.map(n => rows[n].q + ' ' + rows[n].a + ' ' + rows[n].hoca)].join(' '));
  return c._h;
}

function render(){
  const q = lowerTR(search.value.trim());
  const hl = q.length >= 2
    ? s => s.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`)
    : s => s;
  let html = '', navHtml = '', any = false;
  for (const s of DATA.sections) {
    const cs = s.clusters
      .filter(c => !onlyRep.checked || c.rows.length > 1)
      .filter(c => !q || haystack(c).includes(q))
      .sort((a, b) => b.rows.length - a.rows.length);
    if (!cs.length) continue;
    any = true;
    const asked = cs.reduce((t, c) => t + c.rows.length, 0);
    html += `<section class="topic" id="s-${s.id}"><h2>${esc(s.title)}</h2><p class="sub">${cs.length} başlık, toplam ${asked} kez sorulmuş</p>${cs.map(c => clusterHTML(c, hl)).join('')}</section>`;
    navHtml += `<a href="#s-${s.id}">${esc(s.title)}<span>${asked}</span></a>`;
  }
  main.innerHTML = any ? html : `<p class="none">"${esc(search.value)}" için sonuç yok. Farklı bir kelime dene.</p>`;
  navlist.innerHTML = navHtml;
  if (q) main.querySelectorAll('.q').forEach(el => { el.classList.add('open'); el.querySelector('.head').setAttribute('aria-expanded', 'true'); });
}

main.addEventListener('click', e => {
  const head = e.target.closest('button.head');
  if (head) { const q = head.parentElement; const o = q.classList.toggle('open'); head.setAttribute('aria-expanded', o); return; }
  const rb = e.target.closest('button.rawbtn');
  if (rb) { const box = rb.nextElementSibling; const o = box.classList.toggle('show'); rb.setAttribute('aria-expanded', o); }
});
const burger = document.getElementById('burger'), scrim = document.getElementById('scrim');
function setNav(open){
  nav.classList.toggle('open', open); scrim.classList.toggle('show', open);
  document.body.classList.toggle('locked', open); burger.setAttribute('aria-expanded', open);
  if (open) nav.querySelector('a, button').focus(); else burger.focus({preventScroll:true});
}
burger.addEventListener('click', () => setNav(true));
document.getElementById('closeNav').addEventListener('click', () => setNav(false));
scrim.addEventListener('click', () => setNav(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && nav.classList.contains('open')) setNav(false); });
navlist.addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return;
  e.preventDefault(); setNav(false);
  document.querySelector(a.getAttribute('href')).scrollIntoView();
});
let t; search.addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 150); });
onlyRep.addEventListener('change', render);
render();
const bartitle = document.getElementById('bartitle');
const io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) bartitle.textContent = e.target.querySelector('h2').textContent; }); }, {rootMargin:'-60px 0px -80% 0px'});
const watch = () => { io.disconnect(); main.querySelectorAll('section.topic').forEach(s => io.observe(s)); };
watch(); new MutationObserver(watch).observe(main, {childList:true});
window.addEventListener('scroll', () => { if (scrollY < 120) bartitle.textContent = 'Genel Cerrahi Sözlü'; }, {passive:true});
if (location.hash) { const el = document.querySelector(location.hash); if (el) { el.classList.add('open'); el.scrollIntoView(); } }
</script>
</body>
