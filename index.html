 sık kanser. Ve polipler de polip kanser sekansı sebebiyle kanser için predispozan faktör o yüzden onlara bakmak için kolonoskopi yaparız %90ı polip zemininde gelişir diye, bir de gaytada gizli kan bakarız o da tarama için kullanılır.\nKolon kanseri yaklaşık 8-10 yıl zaman sürecinde polip zemininde gelişir bu yüzden tarama ile erken yakalama şansına sahibiz.", "pages": [39]}, {"no": 103, "q": "Fap hnpcc kimlerde görülür, fap(apc) hnpcc(missmatch repair)", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "Kolrektal kanserde 2 önemli genetik yolak rol oynar(OTOZOMAL DOMİANT)\n(bu arada kolon kanseri önemli genler: APC,DCC,P53 tümör süpresörleri ve K-RAS protoonkogeni )\n1) APC gen mutasyonu>\nFAP(malign,adenomatöz tip)\n2) Mikrosatellit instabilite> HNPCC (değişik bir tip kanser)", "pages": [39]}, {"no": 104, "q": "Amsterdam kriterleri", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "AMSTERDAM KRİTERLERİ\nHNPCC otozomal dominant geçiş görülür Amsterdam II Kriterleri) biri varsa bu o kişided de hnpcc görülebileceğini gösterir> ki bu da takibi gerektirir\n• Ailenizde üç veya daha fazla kolorektal kanser veya HNPCC ilişkili kanser (yumurtalık (over), endometrium, rahim (uterus), mide, ince bağırsak ve böbrek kanseri gibi) tanısı alan akrabanız varsa ve bu hastalardan ikisi birinci derece akraba ise,\n• Birbirini takip eden iki kuşakta kanser varsa, • tanısı 50 yaşından önce konmuşsa.", "pages": [39]}, {"no": 105, "q": "Kolorektal ca risk faktörleri, değiştirilebilir değiştirilemez", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "Kolorektal CA değiştirilebilir faktöreler\n• Aşırı kilo(düzenli egzersiz)\n• Sağlıklı besin maddeleri yenmeli\n• Hayvansal yağların aşırı yenmesinden ve devamlı kırmızı et işlenmiş vs kaçımılmalı\n• Lifli gıdalar yenmeli\n• Sigara ve alkol\nDeğiştirilemez\n• ileri yaş >50 yaş\n• -kendimizde daha önce kolon kanseri veya polip öyküsü\n• 8-10 yıldır iltahabi barsak hastalığı\n• Ailede birinde kollon kanser veya polip öyküsü • Kalıtımsal kolorektal ailelerden birine sahip olmak(FAP-HPNCC)\n• Tip2 diyabet", "pages": [39, 40]}, {"no": 106, "q": "Kendi konusu olan crohn ük divertikül", "tip": "Bilgi", "hoca": "Bülent Erkek", "a": "Crohn:Ağızdan anüse kadar segmenter inflamatuar tam kat duvar tutulumu. Kolonoskopide nonkazeifiye granülom tanı koydurur. Kolonoskopide kaldırım taşı manzarası yani lineer ve transvers ülserasyonlar görülür. En sık terminal ileumda. Hastaların %80’i 35 yaşın altında. Hastalar obstrüksiyona bağlı karın ağrısıyla gelir. Belirtiler: kanlı ishal, karın ağrısı, şişkinlik, kilo kaybı, ateş, anal semptomlar. Fibrozis ve striktür gelişimi sıktır. ÜK’ten farklı olarak perianal tutulum da olabilir. Küratif tedavisi yok. Cerrahi tedavi: fistül, perforasyon, kanser gelişimi, obs., abse gibi komplikasyonlar için uygulanır. Medikal tedavi: salisitatlar, sülfasalazinler, 5-ASA; akut alevlenmede kortikosteroid; idame tedavide immünsupresifler\nÜlseratif Kolit:Kolonun aralık bırakmadan mukozal inflamatuar tutulumu. Rektum çoğunlukla tutulur. Proktit sadece rektum tutulumudur. Proktosigmoid rektum ve sigmoid kolon tutulumu. Kanlı dışkılama görülür, kurşun boru görünümü, yaygın psödopolip varlığı.", "pages": [40]}, {"no": 107, "q": "Obezite cerrahisi endikasyonları", "tip": "Bilgi", "hoca": "Volkan Genç", "a": "Obezite cerrahisi, bariatrik cerrahi ya da metabolik cerrahi, mide ve ince bağırsaklarda cerrahi değişiklikler yapılarak, kişinin yemesini sınırlayan ve gıdaların eminimini azaltan böylece kilo vermesini sağlayan ameliyatlardır. Cerrahinin, obezlerde en etkili tedavi yöntemi olduğu kanıtlanmış bir gerçektir.1.Gastrik bypass 2.Sleeve gastrektomi 3.Ayarlanabilir gastrik band (Adjustable gastric band, mide kelepçesi) 4.Biliopankreatik diversiyon + duodenal switch (BPD + DS) Obezite cerrahisi yapılması için altın standart; BMI > 40 kg/m2 veya BMI > 35 + obezitenin neden sebep olduğu yandaş hastalık bulunması (diyabet, hipertansiyon, hiperlipidemi) ve hastanın diyet ve egzersizle kilo verememiş olmasıdır.Koroner arter hastalığı, ciddi akciğer yetmezliği, kanserli hastalar, karaciğer sirozu ve portal hipertansiyonu olanlar, alkol ve ilaç bağımlıları, Crohn hastaları ameliyat edilmemeli yada seçici olunmalıdır (relatif kontrendikasyon). 55-60 yaşın üzerindeki hastalarda, kilo kaybı daha az olmakta, tekrar kilo almakta ve daha fazla komplikasyon dolayısıyla da daha fazla mortalite görülmektedir.", "pages": [40]}, {"no": 108, "q": "Hiperparatiroidizm nedir tipleri neler, semptom ve bulgular", "tip": "Bilgi", "hoca": "Volkan Genç / İskender Alaçayır", "a": "Paratiroid bezlerinin hiperfonksiyonu. Hiperkalsemi. Böbrekte nefrokalsinozis, zamanla böbrek yetmezliği gelişebilir. Güçsüzlük, depresif bir duygulanım, kas ağrıları, iştasızlık ve bulantı, kabızlık ile çok su içme ve sık idrara çıkma. Serum fosfat düzeyleri düşüktür, alkalin fosfataze düzeyi yüksek olabilir. Solunum güçlüğü ve mide ülseri saptanabilir.\nKlinik: Stones,bones,moans,abdominal groans Tanı: Serum total Ca artışı, fosfat azalışı, Pth yüksekliği\n%80 adenom nedenlidir.( tedavisi cerrahi) Sekonder hiperparatiroidizm: Ca/P dengesini kronik olarak bozan bir neden (Böbrek yet) Tedavi diyaliz ya da P bağlayan ajan, Tersiyer hiperparatiroidizm: altta yatan neden düzeltilse de otonomik hipersekresyon olması", "pages": [41]}, {"no": 109, "q": "Şok nedir tipleri neler", "tip": "Bilgi", "hoca": "Volkan Genç / İskender Alaçayır", "a": "Yetersiz doku perfüzyonudur. Nedenlerine göre 4 çeşit şok vardır: Kardiyojenik, Hipovolemik şok, Toksik şok, Nörojenik şok. Şokun temel bulguları: Deri değişiklikleri, oligüri, taşikardi, hipotansyion ve ekg bulguları, nörolojik semptom ve bulgular. İlk ortaya çıktığında deri bulguları verir. (nemli, gri-sarı deri) Böbrekler dolaşım dışı kalır, en son kalp ve beyin fonk. bozulur.", "pages": [41]}, {"no": 110, "q": "Aort anevrizmas ında dışkıda nasıl kan görürüz? Aort anevrizması komplikasyonları (fistülden dolayı)", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Aortoenterik fistüller greft enfeksiyonlarının önemli ve fatal seyredebilen komplikasyonudur. Erken tanı ve tedavi prognozda önemli yer tutar. Aort anevrizması veya aorta iliak problemler nedeni ile uygulanan greft ameliyatları sonrası iskemik kolit, mekanik ileus, aortaduodenal fistüller postoperatif dönemde %16-67 oranında görülürler", "pages": [41]}, {"no": 111, "q": "Akut arter hastası olgusu, bulguları neler, etyolojisi, 1 saatlik muayene vs 36 saatlik muayene bulguları farkları, tedavi", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Ağrı, Paraestezi, Paralizi, Solukluk, Soğukluk, Nabızsızlık. Emboli üst ekstremite, tromboz altta sık. Travma nedenli olabilir. Tromboz en sık ateroskleroz kaynaklıdır.Emboli bifurkasyonlarda ortaya çıkar %75 kardiyak nedenlidir; AF, romatizmal kalp hast., MI, bakteriyal endokardit.\nGrade I, Moderate iskemi , Erken dönemde nabız döner. Aniskemik emboli (%30)\nGrade II, İlerlemiş iskemi, Sadece bir bölümde geç iyileşme Kronik postembolik iskemi (%23) Grade III, Ciddi iskemi, Çeşitli derecede gangren Metabolik komplikasyon %28\nGrade IV, Çok ciddi iskemi ,Fatal sonuçlanan %11\nTedavi: Acil önlemler: • Kapiller yatakta perfüzyonun arttırılması (dijitalizasyon) • Ekstremitenin aşağıya sarkıtılması ve pamukla gevşek sarılması • Sekonder trombozu önlemek için İV 10.000ü heparin Endovasküler girişim: İntra-arterial tromboliz, Perkutan trombektomi (Mekanik ,Aspirasyon yöntemi ) Cerrahi: Açık trombektomi, Bypass, Amputasyon\nEndovasküler tedavide amaç engelin kaldırılıp iskemik ekstremiteye kan akımının hızla sağlanmasıdır.12-24 saati geçen tıkanıklık ya da canlılığını yitiren ekstremitelerde yapılmaz. Akut Arter Tıkanıklığında Yaklaşım", "pages": [41, 42]}, {"no": 112, "q": "Doku iskemi süreleri, (sinir dokusu dakikalar vb.)", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Kalp:4 saat\nAkciğer: 4-6 saat\nKaraciğer: 6-10 saat\nPankreas: 12-18 saat\nBağırsaklar: 6-12 saat\nBöbrekler: 24 saat (may go up to 72 hours if placed on a perfusion pump following recovery) Kas:4 saat\nSinirler: 8 Saat\nYağ 13 Saat\nDeri: 24 Saat\nKemik:4 gün", "pages": [42]}, {"no": 113, "q": "Uyluk damarları,", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "av.poplitea\nav.tibialis anterior\nav.tibialis posterior av.fibularis(peronealis)\nv.saphena magna\nv.saphena parva", "pages": [42]}, {"no": 114, "q": "Antikoagülanlar, heparin aspirin warfarin antidotları", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Antikoagülanlar, yeni trombüslerin oluşmasını ve dolayısı ile mevcut trombüsün genişlemesini önler.\n-Heparinin antidotu ,protamin sülfat. Parenteral uygulanır. Yarı ömrü 0-2 saattir. Klasik dozu 80IU/kg heparin i.v. bolus uygulanır. Ardından, 18 IU/kg/saat. Kanama riski DMAHlerden fazladır.\n-DMAH antidotu yoktur. Subkutan uygulanır. Yarı ömrü 4-6 saattir. Dozu 1mg/kg/gün profilaktik dozu 0.5mg/kg/gün\n-Varfarinin antidotu K vitaminidir. Yarı ömrü 7-8 saattir. Kanama riski olanlarda dozu 5mg/gün", "pages": [42]}, {"no": 115, "q": "Divertikül tanımı?, yaşlıda en sık niye olur, gençte en sık niye, komplikasyonları", "tip": "Bilgi", "hoca": "Arda Çetinkaya", "a": "Bağırsak mukozasının ve submukozasının bağırsak duvarının zayıf yerlerinde kas tabakası içinden\nserozaya doğru fıtıklaşmasına divertikül denir. Bağırsak kanalında çok sayıda divertikül olmasına da\ndivertikülozis denir.\nGerçek divertiküllerde üç tabaka da bulunur. Psödodivertiküllerde sadece mukoza bulunur. Bu nedenle\npsödodivertikül duvarı incedir. Kalın bağırsakta görülen divertiküllerin %95’i psödodivertiküllerdir. Kuru ,sert dışkı,kabızlık sebepli ıkınma ve lümen iç basıncı artmasıyla kesecikler oluşur.Yalancı divertiküllerin gelişmesi uzun zaman içinde oluşur ve yaşlılarda incelmiş , dayanıksızlaşmış kolon duvarında sık yalancı divertikül oluşur.Sol tarafta daha sık görülür.Sağ kolondakiler genellikle çekumda, tek ve gerçek divertiküldür.Gençlerde daha sık gerçek divertikül görülür.\nKomplikasyonlar: Divertikülit , Karın ağrısı, apse gelişimi, perforasyon, kanama, obstruksiyon Tedavi:Komplikasyon gelişmemişse tedaviye gerek yoktur. Koruyucu önemler alınır.Lifli beslenme,bol su,egzersiz gibi.Komplikasyon gelişirse cerrahi tedavi uygulanır.", "pages": [43]}, {"no": 116, "q": "Divertikülit tanımı, hastanın fm bulguları nasıl olur,", "tip": "Bilgi", "hoca": "Arda Çetinkaya", "a": "Divertikül keselerinin iltihabı sonucu meydana gelen tabloya divertikülit denir. Divertikülün ağzı dışkı tarafından tıkanır. Bu kese içinde gıda artıkları veya dışkının birikmesi sonucu enfeksiyon ve inflamasyon başlar. Karın ağrısı, üşüme, titreme, ateş, bulantı- kusma ve bağırsak alışkanlıklarında değişiklik meydana gelir. Eğer bu iltihap karın içinde sınırlandırılamazsa tüm karın içine yayılır, apse gelişebilir veya iltihap diğer organlara yayılabilir.Daha şiddetli belirtiler perforasyon, apse oluşumu ve fistül gelişimi gibi ciddi komplikasyonlarla ilişkilidir.Tedavide genellikle antibiyotikler verilir. Ciddi kabızlık varsa laksatiflerden yararlanılır. Diyete dikkat edilir.\nAnaljezik ve spazmolitikler verilir. Uygulanan tedavi ile hastanın bulguları düzelmiyorsa, karın ağrısı artıyor ve ateşi yükseliyorsa cerrahi müdahale gerekebilir.", "pages": [43]}, {"no": 117, "q": "Akut karın, peritonit bulguları nasıl olur, yayılım yolu, organları sormuş?, retroperitoneal organlar nelerdir, bağırsaklar retroperitoneal mi (değil) neden?", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Ani başlayan karın ağrısı ile karakterize, Belirti ve bulguları karın bölgesinde yoğunlaşan, Travma dışındaki nedenlere bağlı olarak gelişen patolojilerin tümü >AKUT KARIN\nAkut karın > acil cerrahi girişim Semptomlar:\nAğrı başlangıçta yaygın (visseral faz), lokalizasyon vermez (c tipi lifler, myelinsiz) somatik fazdaki ağrı lokalize edilir, pariyetal periton ve mezenterden kaynaklanır.\n“daha önce hiç böyle bir ağrı çekmedim” İNFLAMATUAR AĞRI: ağrı başlar, yavaş\nyavaş şiddetlenir, sürekli hale gelir. Kendiliğinden geçen ağrı infalamatuar olamaz ancak azaldığında perforasyon düşünülür. KOLİK AĞRI: Düz kas spazmına bağlı.\nAralıklı ağrıdır.içi boş organların tıkanması ile ortaya çıkar.\nİSKEMİK AĞRI: karındaki en şiddetli ağrı. Ani başlar, şiddeti azalmadan devam eder. Beraberinde kardiyak hastalık varsa\nmezenter iskemi düşün.\nBulantı-kusma Gaz-gaita çıkaramama .Akut karın ile refleks ileus birlikte görülür. (sempatik aktivasyon) Distansiyon.\nSistemik muayene\nHipovolemi, şok bulguları (dış gebelik rüptürü, aort anevrizma rüptürü)\nSubferil ateş\nYüksek ateş (>38.5)à karın içi abse, jeneralize peritonit, kolanjit\nRektal ateş ile aksiller ateş farkı >1 à pelviperitonit ve jeneralize peritonit Ateşin normal olması akut karını ekarte ettirmez! bağırsak seslerinin varlığı, dakikadaki sayısı (4- 8/dk normal), ek sesler\nDefans, rebound, hassasiyet (+)\nPeritonit: Peritonun tamamen veya bir kısmının inflamasyonu.Kimyasal ve İnfeksiyöz nedenlerden olur.\n• Primer Peritonit:Spontan Peritonit ,Tbc peritonit,Diyaliz hastalarındaki peritonit Aerobik flora (Monomikrobiyal) Tedavi: Medikal\nÇocuklarda = Kulak inf./ ÜSYE\nErişkinlerde = Siroz / Dializ / Nefrotik sendr • Sekonder Peritonit :Organ Perforasyonu (en sık neden) ,En sık neden anastomoz kaçağı, travma\nİki fazlı infeksiyon\n– İlk faz: Fakültatif anaeroblar (akut peritonit yapar) ¬¬¬\nKronik faz: Zorunlu anareoblar (APSE)\n• Tersiyer Peritonit\nEtyolojisi belirsiz. Primer ve sekonderin iyileşmemesi ile ortaya çıkar. Retroperitoneal organlar: Böbrekler, Böbreküstü bezi, pankreas, üreter, aorta, v. cava inferior vs.\nİntraperitoneal: karaciğer, mide, dalak, jejenum, ileum vs.\nSec.retroperitoneal: Colon ascendens ve descendens", "pages": [43, 44]}, {"no": 118, "q": "Derin ven trombozu nedir, etyolojisi, virchow triadı, semptomları, kimlerde dvt riski artmıştır, medikal tedavide ne kullanılır, heparinin antidotu ne(protamin sülfat), warfarinin antidotu(k vit), heparinin dozu, unfraksiyone heparin mi daha iyi lmwh mi?, neden, cerrahi öncesi dvt riskini azaltmak için neler yapılmalı(varis çorabı),", "tip": "Bilgi", "hoca": "Seher Demirer", "a": "Tanım: Derin ven trombozu, ekstremitenin derin venlerinde meydana gelen trombozlardır. Çoğunlukla alt ekstremitenin derin venlerinde oluşurlar. Alt ekstremite derin ven trombozları %85 proksimal DVT’dir (iliak, femoral ve/veya popliteal), sadece %15’i distal DVT’dir. DVT’nin en önemli sonucu pulmoner\nembolidir.\nVirchow triadı: -Endotel hasarı, -Staz, - Hiperkoagülopati\nEndotel hasarı yapan nedenler: -Travma - Yanık -Varis -Geçirilmiş tromboz -Sepsis -Sigara -Kateterler -Hipertansiyon\nStaz yapan nedenler: -Hareketsizlik -Post op. dönem -Yolculuklar -Paralizi -Obezite Hiperkoagülopati nedenleri: -Trombofili - Gebelik/lohusalık -Kontraseptif & menapoz ilaçları -Malignite/Kemoterapi -Nefrotik sendrom -İnflamatuar bağırsak hastalıkları - Heparin induced trombositopeni (HIT)\nTanı: DVT Semptom ve Bulgular: -Bacakta ağrı ve hassasiyet -Bacakta şişme, çap farkı, venöz dilatasyon -Kramp ve sıkışma hissi -Homans belirtisi (+) -Tschmarke baldır sıkma belirtisi (+) -Ducing baldırın balotmanında ağrı (+) , Gode bırakan ödem ,Renk değişiklikleri,Isı artışı Kimlerde trombofili aranmalı? -Genç yaşta VTE -Nüks VTE -Heparin direnci -Pozitif aile öyküsü -Anormal lokalizasyonlarda tromboz - Gebelikte VTE -Gebelik komplikasyonları Tanısı için ise en çok kullanılan iki yöntem d- dimer ve Doppler USG’dir. BT ve MR venografi. DVT tedavide amaç: -Pulmoner embolinin engellenmesi -Venöz trombozun nüksünün engellenmesi -Ülser oluşumu engellenmesi\nDVT TEDAVİSİ\n1. Destek tedavisi: Kompresyon ve elevasyon. Kompresyon için kompresyon çorapları, bandajlar ve intermittant pnömotik kompresyon pompaları kullanılabilir\n2. Antikoagülan tedavi\n3. Trombolitik tedavi (tPA, streptokinaz , ürokinaz)\n4. Cerrahi (trombektomi, endovenöz şant)\n5. Vena cava filtresi (koymak zor çıkarmak daha da zor)\nUNFRAKSİYONE HEPARİN TEDAVİSİ\n-5000 IU heparin bolus (1cc), 1000 IU/saat infüzyon VEYA çok zayıf ve çok kilolu hastalarda, -80 IU/kg bolus, 18 IU/kg/saat infüzyon\n*Heparin izm), primer sekondder tersiyer hiperparatiroidzm nedir, primerin görüntümele yöntemi ve tedavisi?,", "tip": "Olgu", "hoca": "Volkan Genç", "a": "*Primer hiperparatiroidizm: Anormal paratiroid bezleri nedeniyle PTH üretiminin artmasından kaynaklanır ve serum kalsiyumun normal feedback kontrolünün bozulması sonucunda ortaya çıkar.\n*Sekonder hiperparatiroidizm: Yüksek PTH düzeyleri kronik böbrek yetersizliği ya da gastrointestinal kalsiyum emiliminin bozulması sonucunda ortaya çıkan hipokalsemik durumlara bir kompensatuar yanıt olarak da oluşabilir. Altta yatan sorunun düzeltilmesiyle geriye döndürülebilir.\n*Tersiyer hiperparatiroidi: Kronik olarak uyarılan bezler bazen otonom hale gelebilirler. Radyolojik görüntüleme: El ve kafatası grafileri osteoitis fibroza sistikayı gösterebilir. abdominal USG böbrek taşlarını gösterebilir. paratiroid bezlerinin lokalizasyonu için teknesyumlu sintigrafi kullanılabilir. Ayrıca USG de kullanılabilir. ektopik tümörlerin lokalizasyonunda BT ve MR kullanılablir. Selektif venöz örnekleme de yapılabilir. bu yöntemlerin herbirinin kendine has avantaj ve dezavantajları vardır. Tedavi: Cerrahi", "pages": [48, 49]}, {"no": 132, "q": "Künt karın travmasıile gelen hasta 7.8. Kostalar kırık, hastada ne olabilir? (dalak rüptürü), dalak rüptürünün tedavisi nedir?, konjenital dalak anomalileri?", "tip": "Olgu", "hoca": "Mehmet Gürel", "a": "Dalak ruptürü tedavisi splenektomidir.Dalak parçaları omentuma reimplante edilebilir. Konjenital dalak anomalileri ile alakalı bilgi bulamadım.", "pages": [49]}, {"no": 133, "q": "Kronik tıkayıcı arter hastalıkları(2 tane varmış ateroskleroz ve tromboanjiitis obliterans) bu ikisinin farkları belirti bulgular", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "Aterosklerozis sistemik bir hastalıktır çocukluktan itibaren yağlı çizgilenmeler başlar. Kesin bir tedavisi yoktur ancak risk faktörleri vardır bunlar azaltılabilir. Tromboanjitis obliterans Özellikle ekstremitelerin küçük ve orta çaplı arterlerini tutan, a endiksin gerilmesine bağlı olarak önce umblikal bölgede bir ağrı olur. İnflamasyon apendiks duvarını ve parietal peritonu etkilediğinde ise ağrı sağ alt kadrana kayar. Bu süreç ortalama 8 saattir.", "pages": [52]}, {"no": 141, "q": "Akut apandisit ilk 6-8 saat bulguları, önemi nedir, rebound, defans, topuk testi, diafragma altı hava görmek ne demek(perforasyon),", "tip": "Bilgi", "hoca": "Bülent Erkek", "a": "1. Lokalize edilemeyen ağrı (çok şiddetli değil, ağrı başlangıcı kesin değil)\n2. İştahsızlık (6-8 saat sonra bulantı ve kusma da eklenir)\n3. Dışkılama dürtüsü\nTopuk testi: Periton irritasyonu ile sağ alt kadranda ağrı oluşur.\nDefans: Sağ alt kadrana bastırıldığında kasların kasılması\nRebound: İndirektte sol alt kadrana bastırıldığında el aniden çekilirse şiddetli ağrı duyulmasıdır. Direkt reboundda ise sağ alt kadrana bastırılır.\nAyrıca hastada lökositoz görülebilir. Hastada rektal ve koltuk altı ateş farkı 1'den fazla olabilir. Perfore apandisitte diyafram altında serbest hava görülebilir.", "pages": [52]}, {"no": 142, "q": "Neye çalıştın", "tip": "Ters köşe", "hoca": "Ethem Geçim", "a": "", "pages": [52]}, {"no": 143, "q": "Dalak hastalıkları nelerdir, dalak apsesi neden olur, dalak enfeksiyonları neden olur, dalak ca sınıflandırması, dalak benign hastalıkları, dalak malign kanserler, dalak metastatik kanserleri neler, splenektomiyi hangi hastalıkta kür sağlamak için yaparız?", "tip": "Bilgi", "hoca": "Ethem Geçim", "a": "Dalak Hastalıkları\nDalak kistleri → %10-20 parazitiktir, en sık ekinokokkal kistler\nParazitik olmayanlar primer(gerçek) ve sekonder(yalancı) kistler olarak 2'ye ayrılır. Dalak abseleri → Sistemik enfeksiyon varlığında komşuluk yoluyla veya hematojen yolla (%70) var olan bir lezyonun (hematom, infarkt) enfeksiyonu gelişebiir.\nSplenik ven trombozu\nSplenik arter anevrizması\nKonjestif splenomegali\nDalağın primer tümörleri\nDalak rüptürü\nDalak Tümörleri\n1. Primer splenik tümörler\nlenfoma, sarkoma, hemanjioma ve hamartoma nadir olarak karşımıza çıkar. Lenfoma dışındakiler çok nadirdir. En sık görülen benign tümörü hemanjiomdur\n.\n2. Sekonder splenik tümörler (metastazlar) Akciğer, karaciğer, mide, pankreas, kalın barsak, over tümörlerinin dalak metastazları görülebilir Dalağın en sık görülen malign tümörü metastazlardır. Akciğer, karaciğer, mide, pankreas, kalın barsak, over metastazları görülebilir. Primer tümörü anjiosarkomdur. splenektomi endikasyonları\nherediter sferositoz\ndalak absesi,\nmassif dalak travması,\ndalakta kist hidatik hastalığı\nprimer dalak tümörleri\nspontan rüptürler\nlenfoma\n(splenomegaliye bağlı gelişen klinik semptomları gidermek,\nsitopeniyi düzeltmek veya tedavide kür sağlamak amacıyla)", "pages": [52, 53]}, {"no": 144, "q": "Hiatal herni tipleri, semptomlar, komplikasyonlar, fıtıkta olmazsa olmaz 3 şey??, tip1 hiatal herniye ne yaparsın?, ameliyat endikasyonları neler cevap:", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "fıtıkta olmazsa olmaz 3 yapı vardır;\n1. Fıtık çıkış deliği (orifis)\n2. Fıtık kesesi (periton)\n3. Fıtık kapsamı (omentum veya ince bağırsak) hiatal herni: midenin bir kısmının özofageal hiatus'tan yukarı kaçmasıdır.\n4 tipi vardır;\ntip ı (sliding hiatal herni); midenin üst kısmı gastroözofageal bileşkeyle beraber kayar (sliding).\nTip ıı (paraözofageal herni); midenin üst kısmı, fundusu yukarı devrilir (rolling), özofagogastrik bileşke yerindedir.\nTip ııı; mikst tip (tip ı ve ıı beraber). Tip ıv; herni kesesinde omentum kolon gibi başka organlar da bulunur", "pages": [53]}, {"no": 145, "q": "Potasyumu 2.5meq ne yaparsın?, 1 ampul kcl de kaç meq potasyum var, saatte kaç ampul verirsin, potasyum açığı hesaplama, potasyumun normal değeri, idrar çıkışı varsa verilir sadece çok önemli,", "tip": "Bilgi", "hoca": "Aydan Eroğlu", "a": "Potasyumun hücre dışı bölmede normal değeri 3,5-5 mEq/L. Plazma potasyum düzeyi <3.5 mEq/L ise Hipokalemi tedavisi. 1 ampul KCI=10 mEq. Saatte 4 ampülden fazla verilmez. 40 mEq/L üzeri konsantrasyonu periferden verilmez çünkü flebit olabilir. %5 dekstroz içinde 1-3 mEq/kg replasman-K monitörizasyonu. Sadece idrar çıkışı varsa verilir.!", "pages": [53, 54]}, {"no": 146, "q": "1 aydır anal bölge ağrısı arasıra kanaması var, anamnezde ne sorarsın, fizik muayanenede nelere bakılır, hangi görütüleme (tanı anal fissür)", "tip": "Olgu", "hoca": "Aydan Eroğlu / Mehmet Ali Koç", "a": "Makatta ağrı anal fissür, hemoroid, perianal abse, malign melanom, rektum kanseri, anal kanalda ülserizasyonla seyreden ÜC, Crohn, tbc, anal kanal kanserler, CMV, HSV, sifiliz, şankroid, Behçet Hastalığı gibi sebeplerden olabilir. Ayırıcı tanıda düşünülmelidir. Abse ağrısı zonklayıcı, anal fissür ağrısı dışkılama sırasında bıçak kesisi gibidir. Tromboze hemoroidal ağrı ise genel olarak ağrılıdır.", "pages": [54]}, {"no": 147, "q": "Kronik anal fissür triadı", "tip": "Bilgi", "hoca": "Aydan Eroğlu / Mehmet Ali Koç", "a": "Anal kanal dışında sentinel pili, anal kanal içinde büyümüş papilla (hipertropik papilla) ve fibrotik derin fissür tabanı, fissürün kendini iyileştirme çabası sonrası oluşan yapılardır.", "pages": [54]}, {"no": 148, "q": "İnguinal fıtık çeşitleri, direkt indirekt fıtık farkları, nerden çıkarlar, inguinal kanal sınırları, hasselbach üçgeni sınırları, femoral kanal sınırları, gebelerde sık görülen fıtık, fıtığın komplikasyonları, Strangülasyon nedir, inkarserasyon nedir?, inkarserasyonda kan akımı bozulmuyor ameliyat edelim mi (edelim)", "tip": "Bilgi", "hoca": "Aydan Eroğlu / Mehmet Ali Koç", "a": "1) İnguinal fıtıklar:\na) İndirekt inguinal fıtık: İnguinal kanal içerisinde seyreden, skrotuma inmeyi hedefleyen fıtıklardır. Her iki cinsiyette de en sık görülen fıtıklardır. (Erkeklerde daha sık) Spermatik fasyanın tüm katmanları tarafından sarılmıştır. (Direkt hernilerde eksternal katman sadece) İnternal inguinal halkadan inguinal kanala girer, eksternal inguinal halkadan çıkarak skrotuma kadar iner. (Direkt hernilerde sadece eksternal halkadan girer) (Kadınlarda round\nligamenti takip ederek labiuma iner) Konjenital sebeplidir. Genellikle sağ taraflıdır. (Patent processus vaginalis genelde sağda oluyor) Genellikle bilateral. b) Direkt inguinal fıtık: Fıtık hasselbach üçgeninden protrüze olur. Eksternal\nhalkadan girer. (vs indirekt) Eksternal spermatik fasya ile sarılıdır. (vs indirekt) Skrotuma inmez. (vs indirekt) Hasselbach üçgeninin tabanı olan transversalis\nfasyanın zayıflamasıyla ortaya çıkar daha çok yaşlı insanlarda görülür. (vs indirekt: konjenital). Genellikle unilateral.\nc) Femoral fıtık: Femoral halkadan\nprotrüze olan fıtıklardır. Fossa ovalise açılır. Kadınlarda daha sık (ama kadınlarda en sık inguinal indirekt) Femoral halkanın küçük olması sebebiyle inkarserasyon\n(geri itilmeme) ve buna bağlı\nstrangülasyon daha sık. (totale vurursak yine inguinal indirektlerde miktar daha fazla ama femorallerde yüzde daha fazla) Femoral fıtıklar inguinal ligamentin altında, indirekt/direkt ise ligamentin üstündedir.\nİnguinal kanal sınırları:\nAnterior:eksternal oblik kas apenovrozu inferior:lig. İnguinale\nsuperior: conjoined tendon posterior:transvers fasya ve transversus abdominis apenevrozu\nHasselbach üçgeni sınırları:\nmedial:rektus abdominis kası\ninferior:lig inguinale\nlateral:inferior epigastrik damarlar\nFemoral kanal:\nlateral:femoral ven\nposterior:pektinal ligaman\nanterior:inguinal ligaman\nmedial:lakünar ligaman(?)\nFıtık komplikasyonları Obstrüksiyon, Inkarserasyon (redükte edilememesi), Strangülasyon. (Fıtık bölgeinde ağrı ve obstürüksiyon bulguları) Tedavi cerrahidir.", "pages": [54, 55]}, {"no": 149, "q": "Kahve telvesi kusan hasta ne düşünürsün, neler yaparsın etyolojisi, ameliyat endikasyonları,", "tip": "Olgu", "hoca": "Kaan Karayalçın", "a": "Hematemez. Kanın mide asitiyle teması nedeniyle kan kahve telvesi rengindedir. Üst gis kanama bulgusudur. Üst gis kanamasıyla gelen hastaya endoskopi yapmak şarttır. Etyolojisi: peptik ülser hastalığı, hemorajik gastritis, özofagogastrik varisler, portal gastropati, barret ülserleri, mallory-weiss yırtığı vb.", "pages": [55]}, {"no": 150, "q": "Tiroid ca tipler, kimlerde daha çok görülür, papiller foliküler farkı, genel olarak tüm tiroid ca tipleri ve ameliyat planlarını sormuş", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "Differansiye: Papiller Foliküler Hurtle Undifferansiye: Anaplastik Lenfoma Metastatik Medüller\nRadyasyon, iyot eksikliği(FK için), onkogenler (BRAF, RAS, RET/PTC1) tiroid kanserine eğilimi arttırır.\nPapiller Tiroid Karsinomu\n• En sık görülen\n• Kadınlarda iki kat fazla\n• Ortalama yaş 30-40\n• Çoğunlukla lenfatik yolla yayılır\n• RAS gibi onkogenler sık bulunur\n• Tümör tek ya da multipl odaklar şeklinde olabilir\n• Bileteral olabilir (%20)\n• Servikal lenfadenopati (tiroid içi, paraktreal, servikal lenfatiklere yayılım) %25-43\n• Ekstratiroideal yayılım %15-21\n• Vasküler invasyon olabilir %3,5\n• Uzak metastaz bulunma ihtimali %1-2,8 Tedavi: Total tiroidektomi Tümörün olduğu taraftaki santral lenf nodu diseksiyonu, İkinci üçüncü ve dördüncü bölgeye sıkça metastaz olur (üst,orta ve alt juguler lenf nodları). Standart olarak temizlenir. Bölge beşte metastaz varlığı gösterilmemişse bölge beşe girmiyoruz Folliküler karsinoma\n• Kadınlarda 3 kat fazla\n• 50 yaş üstünde daha çok ortaya çıkar\n• Olguların genelinde tümör bir kapsülle çevrilidir\n• Vasküler invazyon hematojen yolla yayılmayı tercih eder.\n• Uzak metastazlar daha sık görülür. Akciğer karaciğer metastazları sıktır\n• Lenfatik yayılım enderdir. Geç dönemlerde görülür\n• Tümör hormonal faaliyet gösterebilir hiperfonksiyon gösterebilir o Hastalar hipertiroidizm bulgularıyla gelebilir (%1) Tedavi: Total tiroidektomi Lenfatik tutulum nadir olduğu için santral ya da lateral diseksiyona çoğu zaman ihtiyaç duyulmaz. Şüpheli lenf bezi büyümesi varsa ve metastaz varsa diseksiyon yapılır.", "pages": [55, 56]}, {"no": 151, "q": "Alt gis kanaması nedenleri, yaşa göre grupla, tanısını nasıl koyarsın, özellikle sintigrafi duymak istemiş???, alt gis kanaması yapan ilaç nedir, eritrosit işaretli sintigrafi yapıyormuşuz?", "tip": "Bilgi", "hoca": "Ekrem Ünal", "a": "Erişkinlerde Divertiküler hastalık, Anjiodisplazi, Kolit, Anorektal kanama, Neoplazm, Üst GİS kanama; çocuklarda Anorektal fistül, Enfeksiyöz kolit, İnflamatuar barsak hast., Juvenil polip, İntussepsiyon, Meckel divertikülü\nEndoskopi, kontrastlı BT, kolonoskopi tanıda kullanılır. Hoca özellikle sintigrafi duymak istemiş?", "pages": [56]}, {"no": 152, "q": "Derin ven trombozu tanımı tanısı bulguları semptomları tedavi ve profilaksi, kimlere profilaksi yapılır risk grubu kim, profilaksi de ne kullanırsın?", "tip": "Bilgi", "hoca": "Arda Demirkan", "a": "Tanım: Derin ven trombozu, ekstremitenin derin venlerinde meydana gelen trombozlardır. Çoğunlukla alt ekstremitenin derin venlerinde oluşurlar. Alt ekstremite derin ven trombozları %85 proksimal DVT’dir (iliak, femoral ve/veya popliteal), sadece %15’i distal DVT’dir. DVT’nin en önemli sonucu pulmoner\nembolidir. Pulmoner embolilerin %90’ı alt ekstremite derin venlerinden gelmektedir. Tanı: DVT Semptom ve Bulgular:\n-Bacakta ağrı ve hassasiyet\n-Bacakta şişme, çap farkı, venöz dilatasyon -Kramp ve sıkışma hissi\n-Homans belirtisi (+)\n-Tschmarke baldır sıkma belirtisi (+) -Ducing baldırın balotmanında ağrı (+)\n*Bu belirtiler akut olarak veya günler sonra ortaya çıkabilir. Hiçbir klinik belirti DVT'ye özgün değildir!\nMajor belirtiler: Ağrı, Uyluk ve baldırda şişme, gode bırakan ödem, Baldırda >3 cm çap farkı, Derin venler boyunca hassasiyet\nMinor belirtiler: Dilate yüzeyel venler, Renk değişikliği (mavi veya kırmızı), Kramp, Isı artışı Venöz Tromboembolizm Profilaksisi: Tercihen DMAH'ler (Düşük molekül ağırlıklı heparin) ile yapılır. Sıklıkla ameliyatın hemen öncesinde, daha az olarak ameliyattan 1 gün önce veya ameliyat sonrasında başlanır. Kesinlikle mobilize olana kadar, genellikle 7-10 gün devam edilir. -0.5 mg/kg doz (12 veya 24 saatte 1) Cerrahide riskli gruplar: MS yaralanması, Açık prostatektomi, Renal transplantasyon, Amputasyon, Pelvis femur kırıkları, Abdominal- jinekolojik cerrahi.", "pages": [56, 57]}, {"no": 153, "q": "Karaciğer malign kitle, en olası tanı nedir? (metastaz), primeri neresi olabilir, hasta kemoterapi ve ameliyatı kaldıramayacaksa ne yapılır(kribroablasyonve başka seçenekler? ), tümör metastaz mı primer mi testi (afp alfafetoprotein, yüksekse kc, testis, over tümörünü belirtir)", "tip": "Bilgi", "hoca": "Ekrem Ünal", "a": "Malign kitle en olası tanı: metastaz ,primeri erkekte gis ve akciğer kadında gis ve meme olabilir. Cerrahi ve Kemoterapi dışında RF/kimyasal ablasyon, kemoembolizasyon yapılabilir. tümör metastaz mı primer mi testi (AFP alfafetoprotein, yüksekse kc, testis, over tümörünü belirtir), Kc fonksiyon testleri bozulmuş ise Primer tümördür, Siroz genelde primer tümörde görülür. Hbs ve HCv+ primeri düşündürür, CEA ve CA19-9 metastazı düşündürür", "pages": [57]}, {"no": 154, "q": "İnguinal fıtık semptomlar, vs her şeyi sormuş, muayenesi nasıldır (skrotumdan parmakla inguinal kanala girilir, hasta öksürtülür, fıtık parmağın ucuna değiyorsa indirekt, kenarına değiyorsa direkt), boğulmuş fıtığa ne yapılır komplikasyonları ne", "tip": "Bilgi", "hoca": "Arda Demirkan", "a": "İndirekt inguinal fıtık:İnguinal kanal içerisinde seyreden, skrotuma inmeyi hedefleyen fıtıklardır. Her iki cinsiyette de en sık görülen fıtıklardır. Direkt inguinal fıtık: hasselbach üçgeninden protrüze olur. Eksternal halkadan girer.Eksternal spermatik fasya ile sarılıdır. Skrotuma inmez. Femoral fıtık: ,Femoral halkadan protrüze olan fıtıklardır. Fossa ovalise açılır.Kadınlarda daha sık (ama kadınlarda en sık inguinal indirekt) Muayene: skrotumdan parmakla inguinal kanala girilir, hasta öksürtülür, fıtık parmağın ucuna değiyorsa indirekt, kenarına değiyorsa direkt. Komplikasyonlar: Obstrüksiyon, Inkarserasyon (redükte edilememesi), Strangülasyon. (Fıtık bölgeinde ağrı ve obstürüksiyon bulguları) Boğulmuş fıtıkta: akut karın gelişmişse acil cerrahi. 6 saatten az ise önce redüksiyon sonrasında elektif cerrahi", "pages": [57, 58]}, {"no": 155, "q": "Alt gis kanaması nedenleri, ayırıcı tanı için ne yaparsın,", "tip": "Bilgi", "hoca": "Kaan Karayalçın", "a": "ETYOLOJİ:-En önemli etyoloji hemorroidlerdir.-Angiodisplazi-Divertiküller- İnf. Bağırsak hastalıkları-Polipler-Meckel divertikülü-Malignite TANI:-Anoskopi-Sigmoidoskopi-Kolonoskopi- Arteriografi", "pages": [58]}, {"no": 156, "q": "Meme başı akıntısı nedenleri, fibrokistik değişiklikte muayene bulguları neler, detaylı sormuş", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "1.İntraduktal Papillom 2.Malignite 3.Fibrokistik Değişiklikler 4.Duktektazi\nKitle sayısı ,\nKitle şekli,\nKitle kıvamı sert(?), Kitle iyi sınırlı, Mobildir, Duyarlılık yoktur,\nCiltte çekilme.", "pages": [58]}, {"no": 157, "q": "50 yaşında kadın hasta şikayeti yok, muayene olmaya geldi, ne sorarsın, meme koruyucu cerrahi nedir neden yapılır,", "tip": "Bilgi", "hoca": "Seher Demirer", "a": "Alkol Kullanımı-Sigara-Egzersiz-İyonize Radyasyon -Hormon Tedavisi-Diyet-Aile Hikayesi, menarş menapoz yaşları, ilk doğum yaşı vs\nMeme Koruyucu Cerrahi: Tümörün olduğu\nbölüm bir miktar sağlam meme dokusu ile birlikte çıkartılır. Mutlaka adjuvan RT yapılmalıdır.Ameliyat sonrası memenin kozmetik açıdan görünümünün bozulmasını engelleyerek yaşam kalitesini arttırmak için yapılır.", "pages": [58]}, {"no": 158, "q": "Tiroid ca sınıflaması(diferansiye un diferansiye olarak), tanı tedavi", "tip": "Bilgi", "hoca": "Seher Demirer", "a": "•Differansiye:Papiller (saplı, mantar şeklinde) §En sık ve prognozu en iyi,Folliküler,Hurthle •Undifferansiye:oAnaplastik,LenfomaoMetastat ik,Meduller\nPapiller Tiroid Karsinomu: Total tiroidektomi Tümörün olduğu taraftaki santral lenf nodu diseksiyonu İkinci, üçüncü ve dördüncü bölge (üst,orta ve alt juguler lenf nodları) Standart temizlenir.\nFolliküler karsinoma: Total tiroidektomi, Lenfatik tutulum nadir olduğu için lenf nodu diseksiyonuna çoğu zaman ihtiyaç duyulmaz Hurthle hücreli kanser: Total tiroidektomi ve santral diseksiyon\nMedüller Tiroid Karsinomu: Tanı Anamnez Aile öyküsü Artmış serum kalsitonin ve CEA. Mutlaka total tireidektomi + bilateral santral lenf nodu diseksiyonu yapılır. Lokal-ileri ve metastatik hastalığın tedavisi için Tirozin kinaz inhibitörleri: Vandetanib ve karbozantanib Anaplastik karsinom: Tanı tiroid ince iğne aspirasyon biyopsisi (TİİAB) ile Karakteristik dev ve multinükleer hücrelerin görülmesiyle konur. Total tireidektomi ve bilateral boyun diseksiyonu yapmak en iyi opsiyon fakat yapılamıyorsa, Kitle küçültücü cerrahi ile radyoterapi ve kemoterapi verilebilir. Lenfoma: Tanı için TİİAB yeterli değildir, Eksizyonel biyopsi ya da tru-cut biyopsi gerekir •Kemoterapiye çok hızlı yanıt verir. Metastatik karsinom: Semptomatik olgularda tireidektomi", "pages": [58, 59]}, {"no": 159, "q": "Papiller karsinom, medüller karsinom", "tip": "Bilgi", "hoca": "Seher Demirer", "a": "Papiller Tiroid Karsinomu•\nEn sık görülen•Kadınlarda iki kat fazla•Ortalama yaş 30-40•Çoğunlukla lenfatik yolla yayılır•RAS gibi onkogenler sık •Tümör tek ya da multipl odaklar şeklinde •Bileteral olabilir (%20 •Kötü prognoz kriterleri 20 yaş altı, 55 yaş üstü, Erkek cinsiyet, Ailede papiller tiroid kanseri öyküsü, Graves hastalığıyla birlikte, Kapsül dışına taşan lokal invazyonlu tümör, Tümör çapı >4cm, Lenf modu metastazı, Çocuklukta radyoterapi öyküsü olması\nMedüller Tiroid Karsinomu: Tiroidin kalsitonin salgılayan C hücrelerinden köken alır(Üst kutup lateralinde yer alır)•üst kutuplara yakın gelişir•Amiloid varlığı tanı koydurucudur•Kadınlarda 1,5 kat daha fazla görülür•%75 olgu sporadik %25 Ailevi, olgularda C hücre hiperplazisi görülür(Premalign bir lezyondur,Total tiroidektomi yapmak gerekir)•Sporadik olgular à50-60 yaşlarda•Ailesel olgular àdaha genç yaşlarda•Ailesel olgularda %95-98 RET (bir proto-onkogen) mutasyonu•Sporadik olgularda %50 RET mutasyonu•Hem lenfojen hem de kan yoluyla yayılım •Sporadik :Prognoz olarak üçüncü ,Diğer 3 tipte tümör multisenterik iken bunda tümör tek taraflıdır, Kötü seyirlidir•Ailesel non MEN :Prognozu en iyi olan,Geç yaşlarda görülür•Ailesel MEN IIA (Sipples sendromu):İkinci en iyi prognozlu •Ailesel MEN IIB:En kötü prognoz, En az görülen grup", "pages": [59, 60]}, {"no": 160, "q": "Total tiroidektominin unilateral lobektomiye göre avantajları dezavantajları", "tip": "Bilgi", "hoca": "Seher Demirer", "a": "Differansiye tiroid kanserlerinde total tireidektomi yapmanın avantajları nelerdir•Multifokal hastalığın yok edilmesi (%30-50) •Lokal nüks riskinin azaltılması•Rezidüel dokuda anaplastik tümör gelişme riskinin ortadan kaldırılması •Metastazların tiroid sintigrafisi ile saptanabilmesine imkan sağlaması •RAI tedavisi şansının artması •Kan TG düzeylerinin nüks ve persistant hastalık tanısında değer kazanması Dezavantaj: hipoparatiroidizm?", "pages": [60]}, {"no": 161, "q": "Papiller ca total tiroidektomi yaptın neyle takip edersin, tiroglobuin nedir", "tip": "Bilgi", "hoca": "Seher Demirer", "a": "papiller ca, bilateral total tiroidektomi yaptıktan sonra: tiroglubin düzeyi, TSH ve Sintigrafi ile takip edilir. Tiroglubin: tiroidde üretilir, tiroid hormonlarını folikülde bağlı tutmaya yarar. Tiroidektomi sonrasında yok denecek kadar az olması beklenir.", "pages": [60]}, {"no": 162, "q": "İleus", "tip": "Bilgi", "hoca": "Bülent Erkek", "a": "(Ayhan Kuzu - Akut İntestinal Obstrüksiyonlar dersinin tamamı söylenebilir.)\nİleus: Nedeni ne olursa olsun bağırsak tıkanıklığı demektir. Mekanik ve Fonksiyonel olmak üzere ikiye ayrılır. Aralarındaki fark, bağırsağı tıkayan engelin bağırsağın kas yapısının bozulmasına veya mekanik bir engelin tıkamasına bağlı olması ile ilgilidir.\nMekanik ileus: İntraluminal, intramural ve bağırsak dışı nedenler olmak üzere 3'e ayrılır. Fonksiyonel ileus da adinamik-inhibisyon, spastik bağırsak ve vasküler oklüzyon olmak üzere 3'e ayrılır... (Söyledikçe herhangi birinden sorulabilir. Ders notunda ayrıntılı yazıyor.) DETAYINI EKLE", "pages": [60]}, {"no": 163, "q": "17 yaşında genç kızda sağ alt kadran ağrısı ayırıcı tanı, (seçenekler arasında mezenterik lenfadenit istiyor)", "tip": "Olgu", "hoca": "Aydan Eroğlu / Mehmet Ali Koç", "a": "Ayırıcı tanılar arasında: akut apandisit, sağ over kist rüptürü, sağ over kist torsiyonu, idrar yolu enfeksiyonu, mezenterik lefadenit olabilir. (Bunlarında ne olduğu sorulabilir.)\nYanlış akut apandisit tanısında en çok Mezenterik Lenfadenit ile karışır.", "pages": [60]}, {"no": 164, "q": "SIRS kliniği bulguları neler", "tip": "Bilgi", "hoca": "Aydan Eroğlu / Mehmet Ali Koç", "a": "Vücut sıcaklığı > 38 veya < 36 derece,\nKalp hızı > 90/dakika,\nSolunum hızı > 20/dakika veya PaCO2 < 32 mmHg,\nBeyaz küre sayımı > 12,000/mm3 veya < 4,000 mm3.", "pages": [60]}, {"no": 165, "q": "En iyi bildiğini sorup ordan devam akut apandisit komplikasyonları, intestinal obstruksiyon bulguları, akut pankreatit kliniği tedavisi, pileflebit,", "tip": "Bilgi", "hoca": "Aydan Eroğlu / Mehmet Ali Koç", "a": "Akut Apandisit komplikasyonları: apse, paralitik ileus, plastron.\nİntestinal obstrüksüyon bulguları: distansiyon, bulantı, kusma, gaz-gaita çıkaramama, ağrı ayakta karın grafisinde hava sıvı seviyelerinin gözükmesi. Obstrüksüyon, en sık Brid ileus, Herni ve maligniteye bağlıdır.\nAkut pankreatit kliniği tedavisi: Oral Stop, İV sıvı, Analjezik, Antibiyotik, Cerrahi Tedavi olarak da: Enfekte nekroz ise kolesistektomi. Pleflebit: Vasküler yapı enfeksiyonu.", "pages": [60, 61]}, {"no": 166, "q": "Yaşlu hastada akut pankreatititklinğini vaka olarak verip tanı sormuş, pankreas kanserini sormuş", "tip": "Olgu", "hoca": "Aydan Eroğlu / Mehmet Ali Koç", "a": "(Pankreas kanserinin ne olduğu bilgisi Kaan Karayalçın hocanın anlattığı ders notlarında ayrıntılı olarak bulunmaktadır.) Erkeklerde 4. Kadınlarda 5. ölüm nedeni…(İlk beş nedenleri saydırabilir.) Sarılık, Epigastrik ve sırt ağrısı semptomlarındandır. %30-40 ana neden sigara, Alkol, obezite, herediter pankreatit risk faktörleri arasında. Palpabl safra kesesi, hepatomegali ve sarılık fizik muayene de görülür. USG ve BT tanıda kullanılır (Başkaları da var ama onlar çok çok az kullanılıyor). Hayatta kalma şansını artırmanın tek yolu cerrahi tedavi fakat ilk tanı anında %20 operabl: Kausch-Whipple pankreatikoduodenektomi.\nAkut pankreatitte tanı: Abdominal ağrı( epigastrik ve sırta vuran ısrarcı ağrı), Amilaz ve lipazda 3 kat artış, BT ve MR da karakteristik radyolojik bulgular. Bu 3 lüden 2 tanesi olması tanı için yeterlidir. BT de nekrozun içinde hava boşlukları görülüyorsa tedavi acil cerrahidir. Enfekte doku tamamiyle dışarı çıkarılmalıdır. Lokal komplikasyon: Abse pseudokist nekroz akut sıvı koleksiyonu\nSistemik komplikasyon: Solunum yet, Böbrek yet, GİS kanama, şok\nWON: Walled of nekrosis (sınırlandırılmış nekroz) var ise eğer cerrahi tedavi gerekmeden Cerrahi dışı yöntemlerle tedavi edilebilir. Biliyer akut pankreatitte mutlaka kolesistektomi yapılmalıdır.\nPankreas başı kanserinde sarılık gövde kuyruk kanserinde uzun süreli ağrı vardır, Tanıda Dinamik BT önemlidir.", "pages": [61]}, {"no": 167, "q": "Kist hidatik anlat, döngüsü konakları, nereyi tutar, kcde olursa tedavisi(pair), pair nasıl yapılır, endikasyonları neler, ilaç olarak ne verilir,", "tip": "Bilgi", "hoca": "Aydan Eroğlu", "a": "(Kist hidatik hakkında ayrıntılı bilgi Acar Tüzüner hocanın ders notlarında yazmaktadır.) Kist Hidatik Döngüsü: (çok uzun, lütfen nota bakın). Kist hidatik (ana) konakları: Köpek, kurt, tilki gibi canic türleri. Kist Hidatik (ara) konakları: Koyun, kuzu, keçi gibi otçul hayvanlar ve insan. Kist Hidatik nereyi tutar: Erişkin parazit, esas konakçının \"ileal mukoza\"sına yapışık olarak yaklaşık 1 yıl yaşar. Gaita ile yaklaşık 5000 yumurta bırakılır. Sonra çeşitli yollarla (notta yolları yazıyor) ara konakçının duodenumunda parazit yumurtaları embriyo haline gelir ve onkosfer olup mukozadan geçerek portal yol ile \"karaciğer\"e ulaşır (tutar) ve büyürler. Kist hidatik karaciğerde olursa tedavisi: Tip 1 için PAİR, Radikal ve Konservatif cerrahi tedavileri de vardır. Pair: perkütan karaciğer kist hidatik tedavisi, ameliyatsız iğne ile boşaltım. Pair de kistleri öldürmek için kist içine hipertonik sodyum klorür verilebilir. İlaç tedavisi olarak albendazol ve mebendozol fakat E.Granulosis'i öldürmesine rağmen kiste bir şey yapmaz.", "pages": [61, 62]}, {"no": 168, "q": "Gebe bir haftadır bacağı şiş, nefes darlığı, ne düşünürsün (dvt arterleri kontrol ederiz) phlegmansia alba ve celula dolens nedir, bu riskilerden dolayı ne verirsin (lmwh)", "tip": "Olgu", "hoca": "Mehmet Ali Koç", "a": "(DVT: Venöz tromboembolizm ve tedavisi notunda yazmaktadır.) Gebe pulmuner emboli olmuştur, DVT den akciğerlere pıhtı gider tıkar. Phlegmasia cerulae dolens: Venöz tromboz iliac damara kadar çıkar, komşu arterlere bası olur, nabız gitmiştir. Siyah-mor-mavi bir renktir, ödemlidir, venöz patoloji düzelirse kendiliğinden düzelir.\nPhlegmasia alba dolens: Artere bası var, ödem başlamış + beyaz ve soluktur. \"Süt bacağı\" denilen şişmiş beyaz bacaklı hastayı tarif eder, venöz drenaj azalmıştır fakat hala vardır. İkisini birbirinden ayıran şey P.Alba Dolens de siyanoz eksikliği vardır.\nLMWH: VTE (Venöz tromboembolizm) için antikoagülan tedavidir, cilt altına yapılır, aynı ders ayrıntılı notunda yazmaktadır.", "pages": [62]}, {"no": 169, "q": "Epidemiyoloji neden bilinmeli, önemi nedir", "tip": "Ters köşe", "hoca": "Ethem Geçim", "a": "Epidemiyoloji, toplumdaki hastalık, kaza ve sağlıkla ilgili durumların dağılımını, görülme sıklıklarını ve bunları etkileyen belirteçleri inceleyen bir tıp bilimi dalıdır.\nSağlığı geliştirmek ve hastalıkları azaltmak için sağlık bilgilerini toplamak, yorumlamak ve kullanmak bu bilim dalının amaçlarındandır. Sağlık olaylarının görülüş sıklığının ve dağılımının belirlenmesinin iki önemli yararı vardır.\n1. Sağlık hizmetlerinin planlanması sırasında öncelikli sorunların ve öncelikli grupların belirlenmesi. Örneğin, bir bölgede yeni bir sağlık hizmeti planlanacaksa; o bölgede en önemli hastalıkların neler olduğu, bu hastalıkların ne sıklıkta görüldüğü ve bu hastalıkların hangi gruplarda daha fazla görüldüğü bilinmelidir. Bunlar bilinmeden planlanan bir sağlık hizmetinin başarılı olması beklenemez.\n2. Sağlık olaylarının nedenlerinin ortaya çıkarılması amacıyla yapılacak olan araştırmaların hipotezlerinin oluşturulması. Hastalıkların ve diğer sağlık sorunlarının nedenlerini ortaya koyabilmek için, muhtemel nedenlerle ilgili hipotezlerin belirlenmesi gerekir. Uygun hipotezlerin kurulabilmesi için de, bu olaylarla ilgili gerekli ön bilgiler mevcut olmalıdır.", "pages": [62, 63]}, {"no": 170, "q": "Karın fıtıkları toplumun yüzde kaçında görülür, inguinal fıtık kadın erkek oranı,", "tip": "Bilgi", "hoca": "Ethem Geçim", "a": "Karın duvarı fıtığı temek patolojisi= karın içi P> karın duvarı R\nKarın fıtıkları=inguinal fıtık %75 (indirekt %80, direkt %11, femoral %9), umblikal %5, kesi fıtığı %10, epigastrik fıtık %5, diğer (spiegel,obturator…)\nYaşam boyu erkeklerin %27si, kadınların %3ü inguinal fıtıkla karşılaşır.\nErkeklerde kadınlara göre 25 kat daha sık kasık fıtığı olur.\nKasık fıtıklarının %86sı erkeklerde görülür. Femoral fıtıkların %84ü kadınlardadır ancak kadında en sık görülen inguinal herni femoral herni değil, indirekt hernidir.\nKadında da erkekte de en çok indirekt inguinal herni görülür.\nKomplikasyon geliştirme riski femoral > diğer İndirekt ingunal ve femoral herniler sağda sola göre 2 kat daha fazla görülür (sağda testisin skrotuma inmesinde ve proc.vaginalis atrofisinde gecikmeye bağlı, solda sigmoid kolonun sol femoral kanalı tampone etmesine bağlı)", "pages": [63]}, {"no": 171, "q": "İkinci en sık görülen karın fıtığı umblikal fıtıklarda çocuklara hemen neden müdahala etmeyiz,", "tip": "Bilgi", "hoca": "Ethem Geçim", "a": "Karın fıtıkları=inguinal fıtık %75 (indirekt %80, direkt %11, femoral %9), umblikal %5, kesi fıtığı %10, epigastrik fıtık %5, diğer (spiegel,obturator…)\nKarın fıtıklarından en sık inguinal fıtığı görmekteyiz, ikinci sıklıkta ise insizyonel fıtıkları görürüz.\nUmblikal fıtıklar linea alba üzerindeki fıtıklardır, kadında 10 kat fazla görülür.\nUmblikal defektler çocuklarda sıktır ve 2 yaş civarı spontan kapanır. %5inden azı kapanmaz.", "pages": [63]}, {"no": 172, "q": "Hematemez melena hematokezya nedir", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "Hematemez= Kanama sonrasında kusulan, mide asiti ile teması nedeniyle kahve telvesi gibi olan kanama. Treitz ligamanının üzerindeki kanamalarda görülür. Kahve telvesi/parlak kırmızı/ koyu kırmızı görünümde.\nMelena= Sindirilmiş kanın anal kanalla dışarı atılması. Katran gibi parlak siyah. %90-95 Treitz ligamanı proximalinden. Kanama az ise şekilli siyah az miktarda, kanama fazla ise parlak siyah erimiş katran görünümünde yumuşak fazla miktarda olur. Melena için 50 ml kanama yeterli. Hematokezya= GİSteki kanın fiziksel özelliği değişmeden taze kan şeklinde defekasyonla atılması. Genelde alt GİS kanaması nedeniyle olur. Ancak kanamanın çok fazla, bağırsak transit süresinin çok hızlı olduğu durumlarda üst bölgeden olan kanama da rektuma kırmızı kan olarak gelebilir. Üst GİSten hızlı kanayanların yaklaşık %10u hematokezya ile gelir.", "pages": [63, 64]}, {"no": 173, "q": "Evisserasyon evantrasyon ne", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "Evisserasyon= Karın içi doku ve organların cilt seviyesinin üstüne çıkması, karın tabakalarının hepsi açılmıştır.\nEvantrasyon= Karın içi doku ve organların cildin altında hissedilmesi veya açık yarada cilt altında görülmesi, deri veya peritondan biri kapalı kalmış ancak fasya açılmıştır.", "pages": [64]}, {"no": 174, "q": "Kanserleri neden tararız", "tip": "Bilgi", "hoca": "Ethem Geçim", "a": "Kanserleri erken aşamada yakalamak hatta bazı kanserleri (örneğin kolorektal kanseri) önlemek için taramalar yapılır. Erken evrede yakalanan kanserlerin prognozu çok daha iyidir. Erken evrede yakalanan ve tedavi edilen kanserler toplumsal anlamda da ekonomik yükten kurtarıcıdır.", "pages": [64]}, {"no": 175, "q": "Kolon poliplerinin tipleri, peutz jeghers nedir,", "tip": "Bilgi", "hoca": "Ethem Geçim", "a": "Kolon polipleri öncelikle neoplastik ve nonneoplastik olarak ikiye ayrılır. Neoplastik polipler= adenomatöz, karsinoid, bağ doku polipleri(\nNonneoplastik polipler= hamartamatöz, inflamatuar, hiperplastik\nPolipler en çok sol kolonda görülür. Poliplerin %67si adenomatözdür.\nHamartomatöz polip sendromları= peutz jeghers, juvenil polipozis, cronkhite canada Peutz Jeghers= OD, GİSte hamartomatöz polipler, mukokütanöz melanin pigmenti birikmesi (hiperpigmentasyon), polip görülme sıklığı jejenum>ileum> mide>duodenum>kolon, en sık intussisepsiyon ve buna bağlı mekanik barsak obstrüksiyonu ve rekürren karın ağrısı izlenir.\nTurcot sendromu, önceleri pediatrik beyin tümörleri görülen familyal adenomatöz polipozis koli (FAP) hastalarını tanımlamaktaydı. Günümüzde Turcot sendromu, beyin tümörü gelişen herediter nonpolipozis kolorektal kanseri de (Lynch sendromu) kapsamaktadır.\n• Turcot Sendromu tip 1 (OR Geçiş): Lynch(MSH2 mut) Sendromu + Merkezi Sinir Sistemi Tümörü\n• Turcot Sendromu tip 2 (OD Geçiş): FAP(APC mut) + Merkezi Sinir Sistemi Tümörü", "pages": [64]}, {"no": 176, "q": "Bir durumun hastalık riskini arttırmasınane denir (hazard oranı), bu risk hesaplamasını yaptığımızformül (odds ratio)", "tip": "Bilgi", "hoca": "Ethem Geçim", "a": "Hazard oranı= Hayatta kalma analizinde tehlike oranı. Eğer araştırmacılar Rölatif Riski (RR) belirli bir zaman dilimi için hesaplarlarsa buna Hazard Oranı (Riziko Oranı) adı verilir. Odds oranı= istatistiksel analiz ve özellikle biyoistatistik çalışmalarında risk faktörlerin sonuç değişkenlerine olan etkisini tespit etmek için kullanılan bir ölçü.", "pages": [64, 65]}, {"no": 177, "q": "Acilde akut kolesistiti nasıl tanırsın? Semptomları, görüntümele yöntemli, (ateş lökosit hafif ikterik sklera triadı) tedavisi", "tip": "Bilgi", "hoca": "Arda Çetinkaya", "a": "Safra kesesindeki taşın ductus sisticusa geçmesiyle oluşur. Obstrüksiyona bağlı olarak safra kesesinde akut inflamasyon gelişir. 12 saatten fazla sürer. Ateş, lökositoz ve hafif ikterik sklera (sarılık) görülür.\n- Sağ üst kadranda hassasiyet, defans, rebound - USG’de safra kesesi duvar kalınlığı ve hidrops (yaygın ödem) görülür\n- Murphy (+):Karaciğer palpasyonu yaparken hassas safra kesesine bası yapınca hasta nefes almayı keser.\nTedavi : Hasta ilk 72 saatte gelmişse tedavi cerrahidir (laparoskopik kolesistektomi). Eğer 72 saat geçmişse hastayı yatırıp oral beslenmeyi kesiyoruz. Antibiyotik veriyoruz, tablo düzelince ameliyat olabilir.", "pages": [65]}, {"no": 178, "q": "Akut mezenterik iskemi hakkında her şey,", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Akut mezenter iskemi (AMİ) gastrointestinal sistemi besleyen damarlarda (mezenterik atardamarlarda) meydana gelen tıkanıklık sonucunda ortaya çıkan ve mortalitesi çok yüksek olan bir durumdur.\n- Akut mezenter iskemi nedenleri\nEmboli (%50) – genelde kalp kaynaklı\nTromboz (%15) – ateroskleroza bağlı Nonoklüsiv mezenterik iskemi (NOMI) (%20- 30)\nMezenterik ven trombozu (%5-10)\n- Klinik bulgular\n*Fizik muayeneyle uyumsuz karın ağrısı kardinal bulgudur.\n- Laboratuvar: Sensitif yada spesifik değildir Lökositoz Asidoz/ laktat artışı (masif iskemi sonucu) olur. Amilaz D-dimer: AMİ dışlamak için önerilir.\nGörüntüleme\nDirekt grafide : Non-spesifik, Geç dönemde anormal olur\nBulgular: ileus, genişlemiş barsak lupları, hava- sıvı seviyeleri, serbest hava, portal vende hava BT'de : Ödem ve kanama nedeni ile barsak duvar kalınlaşması\nMezenterik anjiografi Genel durumu iyi, karın ağrısı dışında semptomları bulunmayan yani barsak infarktüsü bulguları olmayan hastalarda uygulanır.", "pages": [65]}, {"no": 179, "q": "Kist hidatik etkeni, döngüsü, konakçılar, katmanları tedavisi", "tip": "Bilgi", "hoca": "Acar Tüzüner", "a": "Halk arasında kist hastalığı olarak bilinen bu hastalığın etkeni, Echinococcus granulosus adı verilen bir parazittir. Bu parazitin esas kaynağı köpek, kurt, tilki gibi et yiyen hayvanlardır. Ancak, sıklıkla köpeklerdir. Parazit köpeklerin ince barsaklarında yaşar. Hastalık köpek dışkısı ile atılan yumurtalar ile insana bulaşır. İnsandan başka koyun, keçi, sığır ve manda gibi otla beslenen hayvanlar da yumurtaları alarak hastalanırlar. Alınan bu yumurtalar, barsaklarda açılarak barsak duvarını geçer, kan ve lenf yoluyla öncelik sırasıyla karaciğer, akciğer ve diğer organlara yerleşerek kist formunda yaşamlarını sürdürürler. Karaciğerde daha çok sağ loba yerleşir. Eğer hepatik vene açılırsa artık sistemik dolaşıma karışmıştır potansiyel olarak her organda kist gelişebilir.\nErken tanı konmazsa PERİTONEAL\nHİDATOSİS gelişebilir yani peritona açılır. Kist hidatik karaciğerde olursa tedavisi: Tip 1 için PAİR, Radikal ve Konservatif cerrahi tedavileri de vardır. Pair: perkütan karaciğer kist hidatik tedavisi, ameliyatsız iğne ile boşaltım. Pair de kistleri öldürmek için kist içine hipertonik sodyum klorür verilebilir. İlaç tedavisi olarak albendazol ve mebendozol fakat E.Granulosis'i öldürmesine rağmen kiste bir şey yapmaz.", "pages": [65, 66]}, {"no": 180, "q": "İleus tanımı, intestinal obstruksiyonların sınıflaması", "tip": "Bilgi", "hoca": "Salim Demirci", "a": "İleus: Bağırsak içeriklerinin sefalo-kaudal ilerlemesinin engellenmesidir. Nedeni ne olursa olsun bağırsak tıkanıklığı = ileus. İleus kliniğinde 4 kardinal bulgu var. Bunlar, gaz gayta çıkaramama, distansiyon, ağrı ve bulantı- kusma. Ağrı kramp tarzında kolik ağrıdır. İleus mekanik ya da fonksiyonel olabilir: Mekanik İleus\n- İntraluminal = Obturasyon (tıkanma)\n- İntramural = Barsak duvar lezyonları\n- Barsak dışı = Ekstrensek lezyonlar Fonksiyonel İleus\n- Adinamik inhibisyonu ileusu (nöromuskular sistemin inhibisyonu sonucu motilite yoktur) - Spastik ileus (barsak kas kitlesinin spazmı nedeni ile koordine ilerleyici hareket yoktur) - Vasküler oklüzyon (iskemi nedeni ile barsak duvarında motilite yoktur)", "pages": [66]}, {"no": 181, "q": "70 yaşında karnı şiş, pis kokulu ishal, gaz gaita çıkaramıyor, anamnezi fm, anamnezde önce semptomları sor sonra ek semptom ara sırayla, gaz gaita çıkarama özelliklerini sor, önce hangisini çıkaramaz (gaz), ne kadar süredir çıkaramaması bir problem (24 saat),", "tip": "Olgu", "hoca": "Salim Demirci", "a": "Arkadaşlar bu soru başlı başına bir konu. Bu sebeple kısa örneklerle sizi bilgilendirmeye çalıştım. Detaylı öğrenmek isteyen 100 soruluk staj soruları arasından 24-25. soruları inceleyebilir.\n70 yaşında karnı şiş, pis kokulu ishal, gaz gaita çıkaramıyor, anamnezi fm, anamnezde önce semptomları sor sonra ek semptom ara sırayla, gaz gaita çıkarama özelliklerini sor,\nönce hangisini çıkaramaz : (gaz)\nNe kadar süredir çıkaramaması bir problem : (24 saat)\nÖn tanılar neler : (mekanik bağırsak obstruksiyonu)\nMekanik obstrüksiyonun sebepleri en sık : (adezyon, fıtık, tümör)\nGörüntüleme : (direkt grafi hava sıvı seviyesi tıkanıklığın yeri, diafragma altı hava perforasyon) Tedavisi : (konservatif ve cerrahi) Cerrahi endikasyonları : (perforasyon vb..)", "pages": [66, 67]}, {"no": 182, "q": "Akut kolesistitli hastaya yaklaşım muayene, usg de ne görülür,", "tip": "Bilgi", "hoca": "Arda Demirkan", "a": "Safra kesesindeki taş ductus sisticusa geçince ağrı başlar. Buna ''bilier kolik'' denir. Bu sistik kanaldaki taş safra kesesine geri düşerse ağrı ve semptomlar ortadan kalkar (30 dk-6 saat). Ancak düşmezse ve ağrı 12 saatten fazla sürerse akut kolesistit tablosu ortaya çıkar.\nTanı: Sağ üst kadranda 12 saatten uzun süren ağrı,\nSağ üst kadranda hassasiyet,defans,rebound bulguları\nUSG'de safra kesesi duvar kalınlığı artmış olabilir\nMurphy (+)", "pages": [67]}, {"no": 183, "q": "Tuzak soru: safra taşı apsesi(apse değil ampiyem o), ampiyem apse farkı nedir,", "tip": "Bilgi", "hoca": "Arda Demirkan", "a": "Vücutta önceden bulunan bir boşlukta irin birikmesi ''Ampiyem''dir. Apseden farkı şudur: Apsede yeni bir boşluk oluşması söz konusudur, ampiyem ise zaten bulunan boşluklarda olur. Her ikisinde de pürülan sıvı bulunmaktadır.", "pages": [67]}, {"no": 184, "q": "Üst gis kanamaları", "tip": "Bilgi", "hoca": "Ekrem Ünal", "a": "Kanamaların yüzde 85 kadarı üst gis kaynaklıdır. Hematemez: Ağızdan kan gelmesi durumudur. Bulgusu daima üst gis kanamasını ifade eder. Parlak açık renkli olabilir ya da kahve telvesi gibi olabilir.\nMelena:Özellikle üst gis kanamalarında gözükür.Ancak alt gis kanamalarında da görülebilir.\nSebepleri:\nPeptik ülser , Atrofik gastrit , Özafajitler , Özafagus ven kanamaları , Mallory veis kanaması , Boerhaave sendromu,Maligniteler vs. TANI:\nHipotansiyon , Şok , Taşikardi , Hematemez, hematokezya(masif kanamalarda),melena\nKanama şiddeti tayyini genel olarak kan basıncı 100den düşükse ve kalp hızı 120 den yüksekse yapılır.\nTanıda altın standart yöntem endoskopidir. TEDAVİ:\nÖncelik olarak homeostazın sağlanması çok önemlidir.Acil sıvı replasmanı verilir. Cerrahi endikasyonlar:\n-Kanaması durdurulamayan hastalar\n-Ciddi derecede şok durumuna giren hastalar -Hemodinamik durum için fazla transfüzyon gereksinimi olanlar.\nRiskli endoskopik bulguları olanlar.", "pages": [67, 68]}, {"no": 185, "q": "Meme kitlesinde istenen testler(mammografi usg) mammografide malign bening ayrımı malignite bulguları", "tip": "Bilgi", "hoca": "Ekrem Ünal", "a": "Memede saptanan kitleler için izlenecek yol sırasıyla meme muayenesi, 40 yaş altı için meme ultrasonu, 40 yaş üstü için mamografidir. Hekim tarafından ihtiyaç duyulan hallerde meme MRI her yaşta istenebilir\nMammografide görülen non-palpabl lezyonların ¼ ü malign, malignite bulguları: 1.Küme Mikrokalsifikasyonlar-2.Asimetrik Dansite- 3.Duktal Asimetri-4.Normal Meme Yapısının Distorsiyonu-5.Ciltte veya Meme başında Distorsiyon-6. Spiküler uzantıları olan lezyon", "pages": [68]}, {"no": 186, "q": "Karın fıtıkları", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "Karın duvarı fıtıkları:\n1) İnguinal fıtıklar:\na) İndirekt inguinal fıtık: İnguinal kanal içerisinde seyreden, skrotuma inmeyi hedefleyen fıtıklardır. Her iki cinsiyette de en sık görülen fıtıklardır. (Erkeklerde daha sık) Spermatik fasyanın tüm katmanları tarafından sarılmıştır. (Direkt hernilerde eksternal katman sadece) İnternal inguinal halkadan inguinal kanala girer, eksternal inguinal halkadan çıkarak skrotuma kadar iner. (Direkt hernilerde sadece eksternal halkadan girer) (Kadınlarda round ligamenti takip ederek labiuma iner) Konjenital sebeplidir. Patent processus vaginalis denilen yenidoğanda kaybolması gereken periton katlantısının kaybolmaması sebebiyle oluşur ancak tek bu yeterli değildir. Üstüne ağır kaldırma ve ıkınma gibi basınç artışı eklenince fıtık oluşur. Yani hemen bebek doğduğunda fıtık olmaz (eğer mekanik ventilasyona bağlanırsa veya herhangi bir sebeple basınç artışından bebekte de fıtık gelişir), zaman ilerledikçe erişkin çağda patent processus vaginalisi olan ve risk faktörlerini sağlayanlar fıtık geliştirir. Genellikle sağ taraflıdır. (Patent processus vaginalis genelde sağda oluyor) Genellikle bilateral.\nb) Direkt inguinal fıtık: Fıtık hasselbach üçgeninden protrüze olur. Eksternal halkadan girer. (vs indirekt) Eksternal spermatik fasya ile sarılıdır. (vs indirekt) Skrotuma inmez. (vs indirekt) Hasselbach üçgeninin tabanı olan transversalis fasyanın zayıflamasıyla ortaya çıkar daha çok yaşlı insanlarda görülür. (vs indirekt: konjenital). Genellikle unilateral.\nc) Femoral fıtık: , Femoral halkadan protrüze olan fıtıklardır. Fossa ovalise açılır. Kadınlarda daha sık (ama kadınlarda en sık inguinal indirekt) Femoral halkanın küçük olması sebebiyle inkarserasyon (geri itilmeme) ve buna bağlı strangülasyon daha sık. (totale vurursak yine inguinal indirektlerde miktar daha fazla ama femorallerde yüzde daha fazla) Femoral fıtıklar inguinal ligamentin altında, indirekt/direkt ise ligamentin üstünde.\n2) Karın Ön Duvarı Fıtıkları:\na) Umblikal\nb) Paraumblikal\nc) Epigastrik : Linea albadaki defekt sonucu oluşur.\nd) Spiegel: Semilunar hat boyunca umblikusun altındaki seviyede semisirküler hattan çıkan, rektus kası ile m. transversus abdominisin aponörozu bölgesinin fıtığı. İleus ile acile gelirler.\ne) Post operatif/ İnsizyonel: İnguinal fıtıklardan sonra en sık 2. fıtık tipi. Ek hastalıklar, komplikasyonlar, kullanılan teknikler etkiler. f) Supravezikal\n3) Lumbal fıtıklar\n4) Pelvik fıtıklar\n5) Hiatal fıtıklar:\nTip 1: Sliding tipi, peritoneal herni kesesi yok, GERD’e sebep verirler. Hastanın durumuna göre cerrahi yapılır veya yapılmaz.\nTip 2: Paraözogageal tip, peritoneal herni kesesi var. GERD nadir. Strangülasyon ve obstrüksiyon sık: cerrahi endikasyonu var. Tip 3: Tip 1+ Tip 2: Tip 2 olduğu için cerrahi endikasyon var. Tip 1 olduğu için GERD var. Tip 4: Multiple organlar da herni kesesi içinde yer alır. (Diğerlerinde sadece mide) Cerrahi endikasyon var.\nKOMPLİKASYONLAR: Obstrüksiyon,\nInkarserasyon (redükte edilememesi), Strangülasyon. (Fıtık bölgeinde ağrı ve obstürüksiyon bulguları)\nTEDAVİ: Greftli onarım (18 yaş altında yapılmaz) Kasık bağı: hasta ameliyatı reddediyorsa yapılır ancak önerilmez. TANISI: Fizik muayene ile konur. Obezlerde USG/BT. Fizik muayenede parmak ucunda hissedilirse indirekt, pulpasında hissedilirse direkt. Orta parmağı poupart ligamentine yerleştirince işaret parmağıyla hissedilen femoral, yüzükle hissedilen inguinal. Öksürt, palpe et tekrar öksürt, yatır, skrotumdan parmak sok", "pages": [68, 69]}, {"no": 187, "q": "Tiroid nodülü ile gelen hastaya yaklaşım anamnez fm lab", "tip": "Bilgi", "hoca": "Volkan Genç", "a": "Tiroid parankimini oluşturan hücrelerden ( follikül hücreleri, parafolliküler C hücreleri, Hurthle hücreleri gibi ) köken alan benign ya da malign olabilen, hormon sentezleyebilen ya da sentezlemeyen, boyutu 1 – 2 mm’den 7 – 8 cm’e kadar ulaşan her türlü neoplaziye nodül denir. Anamnezde Ailede tiroid hastası var mı, Ailede tiroid kanseri var mı, nodül Ne zamandır var, nodül Büyüme hızı, Eski tetkikler, Yapılan tedaviler, Aspirasyon yapılmış mı ? Hipo veya hipertiroidi düşündürecek semptomlar var mı ? Bası bulguları var mı? Ses kısıklığı, nefes darlığı, yutma güçlüğü Başka hastalıkları var mı ? İyotlu tuz kullanımı Kullandığı ilaçlar Sigara içimi Malignite için yüksek riskli gruptan mı? Fizik muayenede Sistemik muayene (Kan basıncı, nabız, kardiak değerlendirmeye dikkat), Tiroid muayenesi ( Yer ,sayı ,boyut ,kıvam ,yüzey özellikleri , fikse ,sert olup olmadığı) ,komşu lenf bezi , Ses kısıklığı (vokal kord paralizi), Yutma güçlüğü ve solunum zorluğu,1 cm altı nodüller genellikle nonpalpabl, Hipotiroidi veya tirotoksikoza ait bulgular var mı ?\nİnspeksiyonla bir lob normal görülse bile muayene edilmelidir. Palpasyonla, büyümüş olan tiroidin sınırları Nodüllerin yeri, sayısı, büyüklükleri ve kıvamı (parankimatöz guatrlar yumuşak ve direngen, kolloidal guatr çok yumuşak, adenomlar katı) değerlendirilmelidir. Damardan zengin kitleler pulsatildir n Tiroidin üzerindeki ve arkasındaki oluşumlarla ilişkisi n Vertikal hareketsiz, Transvers hareketli n Büyümüş tiroidin etraf dokulara basısına bağlı etkiler (trakea=nefes darlığı, özofagus=disfaji ,damar) n Venöz bası ile siyanoz, yüz ve boyun yüzeyel venlerinde dilatasyon olabilir. n Subklinik venöz bası, hasta kollarını yukarı kaldırdığında daha belirgin hale gelir. Eksternal juguler ve süperfisyel boyun venlerinde şişkinlik oluşur ki buna (Maronon manevrası veya Pemberton belirtisi) denir. n Oskültasyon ile üfürüm duyulabilir. ü\nMalign bir nodülü düşündüren fizik bulgular genellikle; Nodülün çok sert, duyarsız, çevre dokulara fikse olması. Vokal kord paralizisi, Dispne, disfaji, bölgesel lap varlığıdır. Tiroid Nodülü İçin Kullanılacak Tanı Araçları • TFT : sT3, sT4, sTSH • Tiroid otoantikorları: Anti-tg, Anti-TPO, TRAb (TSH reseptör antikoru) • Tiroid Sintigrafisi • Tiroid Ultrasonografisi • Kord Vokal muayenesi • BT / MRI (boyun ve üst mediasten)\nTiroid nodülü ile başvuran hastada öncelikle plazma TSH ve sT3,sT4 düzeylerine bakılır. TSH baskılı durumda ise hastada hipertiroidi vardır. Hastada T3 ve T4 fazla miktarda salgılandığı için TSH baskılanmıştır. Bu durumda hastaya Tiroid Sintigrafisi yapılır.Sintigrafi sonucuna göre: 1. Toksik Noduler Guatr 2. Diffüz Toksik Guatr (Grave’s Hastalığı) 3. Toksik Multinodüler Guatr 4. Diffüz Toksik Goitre+Soğuk Nodül Saptanabilmektedir.", "pages": [69, 70, 71]}, {"no": 188, "q": "Anal kanaması olan hastada ne düşnürsün, (nedenleri say, özellikle yaşlı hastada anal fissür cevabını istiyor)", "tip": "Bilgi", "hoca": "Can Konca", "a": "Birçok rahatsızlık ilk belirti olarak dışkılama sırasında kanama ile ortaya çıkabilir.Hemoroidal hastalık (hemoroid - basur - mayasıl hastalığı),Makat ağzında çatlak (anal fissür), Kalın bağırsak kanseri (kolon ve rektum kanseri),Kalın bağırsak polipleri,İltihabi bağırsak hastalığı (ülseratif kolit ve crohn hastalığı),Bağırsak (barsak) sarkması (rektal prolapsus),Bağırsak divertikülleri,Besin zehirlenmesi,Peptik ülser(mide ülseri),Radyoterapi hasarı - proktit / rektit,Makatta iltihaplanma (perianal apse),Makatta fistül (perianalfistül)oluşumu,Dışkı kaçırma (inkontinans),Kaşıntılı makat hastalığı,Kabızlık (konstipasyon), Cinsel yolla bulaşan hastalıklar ve daha bir çok durum bu bölgeyi etkileyebilir.YAŞLI HASTADA ANAL FİSSÜR", "pages": [71]}, {"no": 189, "q": "İleus kardinal bulguları mekanik ileus bulguları, mekanik ileus nedenleri, safra taşı nasıl ileus yapar", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "İleus kliniğinde 4 kardinal bulgu var. Bunlar, gaz gayta çıkaramama, distansiyon, ağrı ve bulantı kusma. Ağrı kramp tarzında kolik ağrıdır, eğer strangülasyon varsa ağrı devamlıdır.\nMekanik İleus Nedenleri\nA) İntraluminal (lumenin obturasyonu) - Mekonyum - İntussusepsiyon - Safra taşı ileusu - Sıkışma (impaction) fekal ve / veya baryum taşlaşması, bezoar, parazit, yabancı cisim) B) İntramural (barsak duvar lezyonları) - Kongenital – atrezi, imperfore anüs, mekkel divertikülü, vs - Travmatik – intramural hematom (duodenum) - İnflamatuvar – Crohn hast., divertikulit, radyasyon, tuberküloz, vs - Neoplastik – primer , sekonder (metastaz) - Çeşitli – KCl tabletleri, endometriozis, iskemik striktür\nC) Ekstrensek (barsak dışı lezyonlar) - Adhezyonlar - Herni /yara ayrılmaları - Volvuluslar - Dışardan bası yapan kitleler –abse, anüler pankreas, damar anomalisi, gebelik, karsinomatozis. Safra taşı ileusu bir veya birden fazla safra kesesi taşının gastrointestinal sistemde mide ile rektum arasında herhangi bir lokalizasyonda impakte olup tıkanıklık oluşturmasıdır. Genelllikle rekürren kolesistit sonucu gelişen biliyoenterik fistül yoluyla geçiş gösterir. Genellikle ileri yaşlarda ve kadınlarda daha sık görülür. Kadınlarda safra taşı izlenme sıklığının daha fazla olmasına bağlanmaktadır. Obstrüksiyon genellikle terminal ileumda , daha az sıklıkla proksimal ileum, jejunum, kolon ve duodenumda meydana gelmektedir. Safra taşı ileusu tüm kolelithiazis olgularının %0,3-0,5’inde görülür. İntestinal obstrüksiyon genellikle taş 2,5 cm’nin üzerindeyse görülür. İleri yaş, yandaş hastalıklar ve tanıda gecikme sebepli yaklaşık %15 gibi bir oranla mortal seyreder.", "pages": [71, 72]}, {"no": 190, "q": "Rektal kanamalı hastaya yaklaşım anamnezde ne sorarsın detaylıca, fm de ne yapılır (rektal tuşe) kitle gelirse kolonoskopi", "tip": "Bilgi", "hoca": "Sancar Bayar / Şiyar Ersöz", "a": "Hemodinamik açıdan stabilize edilen hastadan detaylı bir anamnez alınmalıdır.\nAnamnez: Kanamanın özellikleri (yeri şiddeti sıklığı şekli süresi), Karın ağrısı var mı, kanamanın ne zaman başladığı, kanamanın tipi (melena, kematokezya), diğer gis patoloji bulguları (distansiyon, tenezm, kanlı ishal, bulantı, kusma), kilo kaybı var mı, kullandığı ilaçlar (asa nsaii antikoagülan..), konfüzyon senkop gibi şeylerin eşlik edip etmediği, dışkılama düzeni, diğer risk faktörleri( ailede kanama diyatezi, koagülopati, kanser öyküsü, hemoroidal hastalık varlığı..\nFizik muayene: bilinç, turgor, tonus, anemi, deri, solunum durumu, kan basıncı ve nabız bulguları değerlendirilmelidir. Nazogastrik tüp lavajı ile üst gis kanamasını ekarte ederiz. İnspeksiyon: Yara izi, ameliyat izi, göğüs duvarı solunuma katılıyor mu, ekimoz peteşi purpura varlığı, anal bölge inspeksiyonu, Oskültasyon: Bağırsak seslerinin yapısı ve sıklığı (metalik para sesi, hipoaktif, hiperaktif) Perküsyon: Genel organ muayenesi ve barsak içeriği hakkında bilgi verir\nPalpasyon: Ele gelen kitle, defans, rebound, tahta karın olup olmadğı\nRektal tuşe\nLaboratuvar: hemoglobin, hemotokrit, bun, Tam kan sayımı, kan grubu tayini, cross-match, koagülasyon testleri, BUN, kreatinin, elektrolitler, glikoz, lökopeni, trombosi KCFT gibi testleryapılmalı ve kanama durumu hematokrit tayini ile izlenmelidir. Görüntüleme: ng tüp aspirasyonu negatifse alt gis kanama var demektir, ilk olarak anoskopi, rektoskopi veya rektosigmoidoskopi yapılır, kanama odağı bulunamıyor ve kanama hızı kolonoskopi yapımına izin verecek kadar hafifse kolonoskopi yapıyoruz.", "pages": [72]}, {"no": 191, "q": "Peptik ülser karnı ağrıyor muayenede tahta karın olmuş (peptik ülser perforasyonu), en çok perfore olan tip ülser, (duodenal ülser), ülser duodenumun neresinde olur(bulbus), nerden perfore olur (ön duvardan olur, arka duvardan kanar) arka duvardan kanarken hangi arter etkilenmiştir (a.gastroduodenalis), bu hastada görüntüleme olarak ne istersin(direkt karın grafisi, diafragma altında serbest hava)", "tip": "Olgu", "hoca": "Sancar Bayar / Şiyar Ersöz", "a": "Peptik ülser perfore olmuştur, en çok perfore olan tip ülser duodenal ülserdir, ülser duodenumun bulbusunun ön duvarından olur, a. Gastroduodenalis hasarına bağlı olarak arka duvar kanar. Direkt karın grafisi isteriz.bağırsak duvarında öncelikle iskemik bir olay meydana gelir. Ani başlayan, keskin bir bıçak saplanır tarzda karın ağrısı olur. Buna eşlik eden vazoaktif aminlerin salınması sonucu taşikardi, ekstremitelerede soğukluk ve hipotermi gibi bulgular görülür. Perforasyon meydana geldikten sonra hasta rahatlar, ağrıları geçer. Ama daha sonra mide/bağırsak içeriğinin boşalması sonucu jeneralize peritonit gelişir. Hastada tahta karın, tüm karında abdominal distansiyon, rijidite ve hassasiyet tablosuyla hastalar bize başvururlar. Radyolojik olarak hastaların %80ininde gördüğümüz diyaframın altındaki serbest hava tanı koymada yardımcıdır. Tedavi: Mutlak cerrahidir. Perfore olan bölgenin primer sütur ve üzerine bir omentum yaması(omentopeksi) genellikle kontrol altına alınır. Ama malignansiyi ekarte edemiyorsak, özellikle mide ülserlerinde; rezektif cerrahiler düşünülebilir.", "pages": [72, 73]}, {"no": 192, "q": "Hipokalemi tedavisi ilkeleri (1 ampul kcl=10meqpotasyum, saatte 4 ampulden fazla verilmez, 40meq/l den fazla konsantrasyonlu periferden verme flebit olur, %5 dekstrozla verilir)", "tip": "Bilgi", "hoca": "Sancar Bayar / Şiyar Ersöz", "a": "Tedavi: idrar çıkışı takibi, etiyolojiye yönelik tedavi(asit baz bozuklukarı göz önüne alınmalı), Potasyum preparatları(potasyum klorür en sık kullanılan) ile replasman, potasyum tutucu diüretikler, Hipomagnezemi ile birlikte ise hipomagnezemi düzeltilir.\nPotasyumun esas rezervi hücre içi olduğundan dolayı replasman hesabı tam olarak yapılamaz, ampirik tedavi yapılır. 1 ampul kcl 10 meq, saatte 4 ampülden fazla verilmez(monitorize hastada 40a kadar çıkıyoruz hasta monitörize değilse saatte 10 meq üstüne çıkmıyoruz, %5 dekstroz içinde veriyoruz, periferden 40 meq üzeri konsantrasyonda vermiyoruz, flebit gelişebilir. Günlük total doz 160 meq geçmemelidir, oligüri ve anürisi olan hastaya k verilmemelidir, k replasmanı yapılırkan mutlaka ekg izlenmelidir.", "pages": [73]}, {"no": 193, "q": "Akut pankreatit komplikasyonlarıi lokal ve sistemik, sistemiklerden ARDS ve DİK sormuş, hangi tip şok gelişir, hiponatremi sınıflaması", "tip": "Bilgi", "hoca": "Deniz Balcı", "a": "Akut pankreatit lokal komplikasyonları: - nekroz -pseudokist -abse -akut sıvı kolleksiyonu Akut pankreatit sistemik komplikasyonları : - ards ve solunum yetmezliği –şok -böbrek yetmezliği - gis kanama - miyokard depresyonu Akut solunum sıkıntısı sendromu (ARDS) çeşitli etmenlere bağlı akut gelişen alveolokapiller permeabilitede artmaya sekonder oluşan pulmoner ödem ve ağır hipoksemi tablosunun görüldüğü akciğer hasarıdır.\nDİK : dissemine intravasküler kaogülasyon tromboz ve kanamalarla seyreden sistemik bir olaydır. Trombosit sayısı <100,000 Hipovolemik şok gelişir.\nHiponatremi sınıflandırması :\nHipovolemi : azalmış na alımı , gis kayıpları, renal kayıplar , diüretikler , primer renal hastalıklar\nÖvolemi : hiperglisemi, artmış plazma yağları, artmış plazma proteinleri, uygunsuz ADH salınımı sendromu ,su intoksikasyonu ,diüretikler Hipervolemi : artmış alım , postoperatif ADH salınımı , ilaçlar", "pages": [73, 74]}, {"no": 194, "q": "Psödokist tanımı, psödokistene olur", "tip": "Bilgi", "hoca": "Deniz Balcı", "a": "Psödokist pankreatit enzimleri içeren sıvı koleksiyodur. Karakteritik özellikleri müsin yokluğu ve düşük CEA düzeyleri ile ilşkili yüksek amilaz düzeyleri içerir. Akut dönemde psödokist gelişirse 6 hafta kadar izlemek gerekir. Bu süre içinde psödokistin kayboma olasılığı vardır. (%70). Asemptomatik ,4 cmden daha küçük çaplı, kuyrukta yerleşmiş ve ana pankreatit kanalla ilişkisi olmayan veya pankreatit kanal tıkanıklığı bulgusu olmayan hastalar için takip önerilir. Bu süre içinde kist küçülebilir veya cerrahi girişim için duvarı yeterince olgunlaşır. Mide ve duodenuma yakın psödokistlerde (1 cm den yakın ) endoskopik transgastrik veya transduodenal drenaj yapılır. Ana pankreas kanalıyla ilişkili kistlerde transkapiller drenaj yapılabilir. Endoskopik yöntemlerle iyileşmezse ameliyat (kistogastrostomi) yapılır.", "pages": [74]}, {"no": 195, "q": "Fistülün tanımı", "tip": "Bilgi", "hoca": "Deniz Balcı", "a": "Fistül, iç organlar arasında veya iç organlar ile vücut yüzeyi arasında ortaya çıkan doğal olmayan tüp şeklinde bağlantılardır.", "pages": [74]}, {"no": 196, "q": "Pankreasın komşulukları", "tip": "Bilgi", "hoca": "Deniz Balcı", "a": "Ön tarafında bulunan organ komşulukları şöyle sıralanabilir :\nYukarda : Düodenum, pilor, karaciğer ve dalak. Aşağıda : Düodenum, jejunum, transvers kolon ve dalak\nOrtada : Transvers kolon ve ona ait transvers mezokolon.\nArka komşulukları sağ böbreğin hilusu, solda dalak hilusu, ortada A. mesenterica superior ve Arteria mesenterica inferior ile olmaktadır. Bu alan içinde ayrıca sağdan sola doğru Vena cava inferior, Vena porta ve Vena mesenterica superior ve Aorta bulunmaktadır. Pankreas kuyruğu en solda sol böbreğe ve dalak hilusuna komşudur.", "pages": [74]}, {"no": 197, "q": "Nazogastrik sonda endikasyonları,", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "üst gastrointestinal sistem kanaması (tanı ve tedavi amacıyla), intihar ve kaza sonrası mide boşaltımı ve yıkanması, acil cerrahi gereken durumlarda mide içeriğinin boşaltılması, pilor stenozu, ileus, oral alımı zor olan hastalarda enteral besleme, bilincikapalı hastada aspirasyonu önlemek, ilaç uygulamak ve beslenmeyi sağlamak, mekanik ventilatörde takip edilen bazı hastalarda mide distansyonuna karşı, ameliyat öncesi ve ameliyat sonrası dekompresyon amaçlarıyla kullanılır", "pages": [74, 75]}, {"no": 198, "q": "Plegmasia cerula dolens tanımı tedavi edilmezse ne olur, (slaytında yokmuş bunun cevabı), böyle bi hastaya ne yapılır", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Plegmasia cerula dolens :\nMassif iliofemoral tromboz n Ekstremitede siyanoz n Aşırı ödem ve ağrı n Yüzeyel venler de tıkalı n Kompartman sendromu ve Akut arter tıkanıklığı kliniği\nPhlegmasia cerulea dolensde ise kolleteral venlerin tromboziside olaya katılarak venöz kangren, arteryel tıkanıklık, hipovolemik şok gibi komplikasyonlara neden olur. Phlegmesia caerula dolense bağlı en sık görülen komplikasyon %30 oranında pulmoner emboli ve yaşayanların %12-25’inde gelişen uzuv kaybıdır.", "pages": [75]}, {"no": 199, "q": "Ekonomi class sendromu,", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "3 saatten uzun hareketsiz uçak ve kara yolculuklarında risk başlar.12 saatten uzun uçan yolcuların %0.05’inde VTE olur. Ekonomi klas sendromunu önlemede çorap, heparin ve elevasyon yararlı olmaktadır.", "pages": [75]}, {"no": 200, "q": "Dvt antikoagülan tedavi, dozları", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Geleneksel antikoagulan tedavi Heparin ( Unfraksiyone ) LMWH (Düşük molekül ağırlıklı heparin K vitamin antagonistleri ( Warfarin ) Unfraksiyone heparin dozu ( Kısa etkili )\n- 5000 IU heparin bolus, 1000 IU /saat infüzyon VEYA 80 IU /kg bolus, 18 IU / kg/ saat infüzyon\nKimler hastanede yatırılarak heparin uygulanmalı ? n Pulmoner emboli, Massif ven trombozu /gangren, Aktif kanaması olanlar, GIS veya serebral kanama riski, İleri karaciğer hastalığı, Trombosit sayısı düşük olanlar, Çocuklar\nHeparin tedavisi aPTT ile takip edilir, normal aPTT düzeyinin 1,5 – 2 katı hedefenir. n Bu hedefe ilk 24 saatte ulaşmak doğru olur ! Düşük molekül ağırlıklı heparinler (Uzun etkili ) n\nEnoxiparin ( Oksapar, Clexane ) n Tinzaparin ( Innohep ) n Nadroparin ( Fraxiparin ) n Dalteparin ( Fragmin ) n Bemiparin ( Hibor ) Tedavi dozu ; Genelde 1 mg/kg Proflaxi dozu; Genelde 0.5 mg/kg\nUFH mi yoksa LMWH mi daha iyi? ( Gerçekte tedavi etkinliği açısından fark yok !) n Benzer oranlarda nüks VTE n LMWH % 24 daha az mortalite, n Daha az major kanama n Daha az trombositopeni n Daha fazla minor kanama Gerçekte tedavi etkinliği açısından fark yok ! n Ancak LMWH de uygulama kolay – Hastaneye yatış gerekli değil – Monitorizasyona ihtiyaç yok Heparin -- warfarin --- düşük molekül ağırlıklı heparin --- yeni antikoagülanlar\nYeni antikoagulanlar n Faktör Xa inhibitörleri – İndirekt (pentasakkaritler) ; subkutan n Fondaparinux (Arixtra) –\nDirekt ; oral n Rivoroxaban (Xarelto ) n Apixaban ( Eliquıs ) n Edoxaban ( Lixiana) Trombin (F IIa) inhibitörleri – Oral Dabigatran (Pradaxa )\nKlasik tedavide heparin ve warfarin başlanır 3-4 gün sonra heparin kesilir. Amaç ınr :2,5 değerine getirmek 3 aydan uzun bir tedavidir.\nDVT tedavi süresi: Nüks riski düşükse 3 ay, Nüks riski orta 3 - 6 ay, Nüks riski yüksekse 6 ay-ömür boyu – Nüksetmiş DVT – Kalıcı uyaran (Kanser, vb)", "pages": [75, 76]}, {"no": 201, "q": "Tiroid ca sınıflaması En sık görülen tiroid kanseri (papiller ca.), papiller ca lı hastaya tiroidektomi yapıldı, komplikasyonları neler (En sık komplikasyon hipoparatiroidi, N. Laryngeus recurrens ve N. Laryngeus superior yaralanmalarını ve hepsi tek tek neye neden olur anlattırdı. En ölümcül komplikasyon: kanama. Hastada hematom gelişmiş nefes alamıyorsa hemen cerrahi müdahaleyle hematom boşaltılır.)", "tip": "Bilgi", "hoca": "Aydan Eroğlu", "a": "Tiroid ca sınıflandırması=\nPapiller tiroid kanseri en sık görülen tip olup, tiroid kanserlerinin yaklaşık % 80’nini oluşturur. Papiller mikrokanser ise “Dünya Sağlık Örgütü” (WHO) tarafından tanımlanmış olup, tümör çapının 1 cm altındaki kanserleri kapsamaktadır . Çocukluk çağı ayrı olmak üzere bütün yaş gruplarında kadınlarda, erkeklerden üç misli daha sık görülür. Tüm yaş gruplarında papiller tiroid kanseri insidansı artış göstermekte olup, en fazla artış görülme oranı üreme çağındaki kadınlardır . Radyasyon en iyi bilinen risk faktörü.\nFoliküler tiroid=kanserleri tiroid epitelinin diferansiye tümörleri olup, yaklaşık % 5-10 . , Tiroid Kanserleri oranında ve daha çok iyot alımının yetersiz olduğu bölgelerde görülürler . ABD’de görülme sıklığı azalmakta olup, bu durum günlük iyot alımının artırılması ile ilgilidir.! Kadın erkek oranı 3/1 olup, 50 ve daha ileri yaşlarda sıklığı artar . Genel olarak guatır zemininde, solit hızlı büyüyen bir nodül ile kendini belli eder\nMedullar Tiroid Kanseri= Medullar tiroid kanser (MTK) bir nöroendokrin tümör olup, tiroidin parafoliküler (C hücreleri) hücrelerinden çıkar . Yaklaşık tiroid kanserlerinin % 2-5’ini oluşturur . Meduller tiroid kanserlerinin yaklaşık % 25’i herediter olup RET proto onkogende patoloji vardır. Multipl endokrin neoplazi (MEN) olarak adlandırılan bu hastalığın 3 ayrı tipi bulunur, MEN2a (medullar tiroid kanseri, feokromositoma, hiperparotiroidizm) ve MEN2b’de (medullar tiroid kanseri, feokromositom
