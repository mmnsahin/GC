a, ganglionöroma) görülür, bunların dışında tek ailevi tiroid kanseri bulunmaktadı. tiroidektomi sonrası postoperatif hipokalsemi ve rekurren laringeal sinir yaralanması, en sık karşılaşılan komplikasyonlardır Diğer\nönemli komplikasyonlar arasında süperior laringeal sinir hasarı, infeksiyon, havayolu zedelenmesi ve kanama sayılabilir.\nLarengeal paralizler üç majör soruna neden olmaktadır: Ses kısıklığı, hava yolu obstrüksiyonu ve aspirasyon.\nA-RLS tek taraflı yaralanmaları:\nses kısıklığı ve boğuk ses oluşur. Sinir larinksin alt kısmının duyusunu sağladığı ve tam kapanmadığı için aspirasyon meydana gelir\nB-Bilateral RLN yaralanmaları Bilateral vokal kord paralizileri tiroid cerrahisinin en ciddi komplikasyonudur. İnspiratuar stridor, dispne, minimal disfoni ile belirlidir. Ciddi hava yolu obstrüksiyonu oluşur. EXTERNAL SUPERIOR LARİNGEAL SİNİR YARALANMASI\nher ne kadar normal konuşma sesi genellikle mevcut olsa da, ses ve şarkı söylerken yüksek sesleri elde edememe, bozulmuş ses tonu ve vokal zayıflık veya yorgunluk görülür.", "pages": [76, 77]}, {"no": 202, "q": "Trafik kazası, kan basıncı 80/40 mmhg, nabzı 120, ne olmuş bu hastaya (hemorajik şoka girmiş) ne yapılır (2 tane geniş damar yolu açılır, kan grubu ve cross- match için kan alınır, IV sıvı resüsitasyonuna başlanır. Sıvının miktarını sordu, mesela dakikada 50 cc gidecek şekilde versek yeter mi bu hastaya dedi, yetmez, çok hızlı infüzyonlayükleme yapmamız lazım çünkü hasta kanıyor. Hoca hatta ilk 10-15 dk içinde 1000 cc sıvıyı hemen yükleyebiliriz dedi.) Sonra ne yaparız, (kanama odağı, açık yarası var mı, iç kanama mı,) karnı aşırı distandüyseve sıvı resüsitasyonuyla kan basıncı ve nabız değerleri biraz olsun düzelmiyorsa (karın boşluğuna kanama, parasentez yapılabilir), kanama nerden olabilir (kc, dalak), görüntüleme mi yaparsın, cerrah mı çağırırsın (cerrah)", "tip": "Bilgi", "hoca": "Mehmet Ali Koç", "a": "Kilosunun %5i veya daha az su kaybederse normal,%5-%9 unu kaybederse 1 kgsi için 50 ml su %10 veya daha fazzla kaybederse 1 kgsi için 100 ml su verilir bu açığı kapatmak içindir (defisit). Günlük idame için ortalama bir yetişkine 35 ml /kg", "pages": [77, 78]}, {"no": 203, "q": "Mammografide malignite bulguları, küme mikrokalsifikasyonlar nasıl görünür", "tip": "Bilgi", "hoca": "?", "a": "Memede kitle: Meme kanserinin en sık\ngörülen belirti ve bulgusudur. Meme kanserleri ağrısız, düzensiz sınırlı (pütürlü), sert kitlelerdir. Nadiren düzgün yüzeyli, yumuşak ve ağrılı olurlar. Meme kanserinde kitlelerin %33’ünü hasta kendisi tespit eder.Memede şişlik (Memenin bir bölümünde-tamamında) ya da asimetri (kitle ele gelmediği halde). İnvaziv lobüler karsinom bu şekilde olur\nDimpling: Gamze, meme cildinde çekinti demektir. Muhtemelen tümörün, cilde bağlı olan cooper ligamanını invaze etmesi ve çekmesine bağlıdır.Meme başı retraksiyonu: Meme başının içe çökmesi ya da dönmesidir. Areola arkasındaki meme kanserinin, meme başına giden süt kanallarına invaze olması, ve süt kanallarının meme başını çekmesi nedeniyledir. Meme başı akıntısı: Özellikle kanlı akıntı Meme cildinde eritem (kızarıklık) ya da ülser: Kanserin cilde invazyonunu gösterir.\nMeme başı ve areolada egzama, kaşıntı, sulanma: Memenin Paget Hastalığı’nda olur.Portakal kabuğu görünümü (peau d’orange): İnflamatuar meme kanseri ya da lokal ileri diğer meme kanserleri. Lenfatik ağın tutlumuna bağlıdır. Meme cildi ödemlidir, çöküntülerin nedeni uzayamayan ve cildi çeken ter bezi kanallarıdır Aksillada kitle: Lenf nodu metastazına bağlıdır", "pages": [78, 79]}, {"no": 204, "q": "Üst gis kanamaları nedenleri, diğer semptomlar, bilinci açık sürekli kusuyorsa elektrolit dengesi nasıl, tedavisi", "tip": "Bilgi", "hoca": "?", "a": "Üst GİS kanamaları: Treitz ligamanının proksimalindeki kanamalardır. Alt GİS kanamaları: Duodenum sonundan anal kanala kadar olan kanamalardır. Üst GİS\nkanamaları toplumda 100.000 kişide 100 oranında, Alt GİS kanamaları ise 100.000 kişide 20 oranında görülmektedir. Peptik Ülser Kanamaları : Üst GİS kanamalarının en sık nedenidir (%30-50). (en sık neden duodenal ülser) Nsaii, alkol, H.pylori enfeksiyonu, aşırı asit salgılanması önemli risk faktörlerindendir. Akut Gastrik Mukozal Lezyonlar (Stres gastriti, Eroziv gastrit, Curling ülseri, Cushing ülseri v.b.) Üst GIS kanamalarının %30’udur. NSAİİ, stres, sepsis, solunum yetersizliği, hemodinamik bozukluk, hipoperfüzyona bağlı gelişir. Varisler: Portal hipertansiyonun en ciddi komplikasyonudur. Sirozlu hastaların %90’ında ortaya çıkar. Varis kanamasından ölüm oranı %30 civarıdır. Özefageal varis kanaması, mortalitesi en yüksek olan üst GİS kanaması nedenidir. Şiddetli bulantı ve kusma sonrası gastroözofagial bileşkede oluşan mukozal lineer yırtıklar sonucu kanama görülmesidir. Bu mukozal yırtıklar üst GIS kanamalarının %5-15'inden sorumludur. Aşırı alkol kullanımı ve hiatal herni, hiperemezis gravidarum önemli sebeplerindendir.", "pages": [79]}, {"no": 205, "q": "Özefagus varis kanamaları belirtileri neler, (kcde siroz vs?)", "tip": "Bilgi", "hoca": "?", "a": "Özofagus varisleri kanamadıkça\nbir belirti vermez. Özofagus varisi\nkanadığı zaman hematemez (kanlı kusma), melena (kanlı dışkılama), kan kaybına bağlı şok gelişebilir (önce halsizlik, sonra şuur kaybı ve koma gelişebilir, ölümcül olabilir). Portal hipertansiyondan dolayı geliştiği için belki diğer portokaval anastomozlara bakabiliriz.", "pages": [79, 80]}, {"no": 206, "q": "En iyi bildiğin konu ne", "tip": "Ters köşe", "hoca": "Bülent Erkek", "a": "boş", "pages": [80]}, {"no": 207, "q": "Diyabetik ayak fotoğrafı gösterip anlat demişler, dvt fotosu gösterip anlat demişler, dvtde mavileşme ileri evre komplikasyonunun özel adı, dvt olduğundabeyne emboli atımının anatomik yolağı ve bunun adı,", "tip": "Bilgi", "hoca": "Salim Demirci / Cüneyt", "a": "ven trombozunun nadir görünen, ağır bir türüdür. Bu klinik tabloda, etkilenen segmentin tüm venöz yolları tıkanmıştır. Derin ven trombozu kökenli bu tablo, özellikle malinite barındıran durumlarda veya hamilelikle ilişkili olarak oluşmaktadır. Derin ven trombozu oluşumunu takiben, trombozun giderek ilerler biçimde tüm derin venöz sistemi tıkamasıyla oluşan bu tabloya arteryel vasospazmın da eklenmesi ile ekstremite ödemli, soluk, ağrılı bir hal alır ve bu duruma \"beyaz/soluk, ağrılı iltihap\" anlamına gelen \"Phlegmasia alba dolens\" denir. Ancak phlegmasia alba dolens'te kollateral damarlar ya hiç tutulmamış ya da coerulea dolens'teki kadar yaygın olarak tutulmamıştır, venöz dönüş sorunlu olsa da kısmen sağlanabilmektedir. Dolayısıyla ödem, Phlegmasia coerulea dolens tablosunda daha belirgindir. Venöz birikime bağlı olarak ağrı ve soğukluk olur. Sert ödem ve yumuşak doku şişmeleri mevcuttur. Oksijen eksikliğine bağlı olarak siyanotik görünüm ortaya çıkar ki bu durum tablonun ismine de adını vermiştir. Tedavi sürecine alınmazsa ekstremiteyi nekroza götürür", "pages": [80]}, {"no": 208, "q": "Peptik ülser komplikasyonları, ülser stazı", "tip": "Bilgi", "hoca": "Salim Demirci / Cüneyt", "a": "Kanama durmazsa ya da durdurulamazsa hastayı şoka sokarak ölümüne neden olabilir.\nMelena : Dışkıda sindirilmiş siyah kan görülmesi.\nHematemez : Kanlı kusma, siyah (sindirilmiş, yani beklemiş) ya da kırmızı olabilir.Perforasyon (delinme).Mide, duodenum, gastrojejunostomi ya da Meckel divertikülü delinebilir. Mide ya da barsak içeriği karın içine aktığında şiddetli karın ağrısı ortaya çıkar ve akut karın denen tabloya neden olur.\nObstrüksiyon (tıkanma) Pilor Stenozu: Mide ile duodenumu birleştiren bir geçiş noktası olan pilora yakın olan ülserler deformasyona neden olarak darlığa neden olurlar ve kusma, yemek yiyememe ve kilo kaybıyla kendini gösterir.", "pages": [80, 81]}, {"no": 209, "q": "Sıvı elektrolit asit baz dengesi", "tip": "Bilgi", "hoca": "Salim Demirci / Cüneyt", "a": "Arkadaşlar direkt konu verilmiş o yüzden konuyla alakalı önemli bulduğum yerleri spot bilgi halinde vereceğim.\nİdrar çıkarmıyorsa K verilmez. Kanamalı hastalara resussitasyonda kan ve kan ürünleri önceliklidir. Kristaloidler genellikle ilk basamak resussitasyon sıvılarıdır. Akut hastalarda dengeli tuz solüsyonları genellikle ilk sıra tedavide yer alır. Hipovolemi ve alkalozda %0,9 NaCl kullanılır. Kolloidlerin resussitayonda toksisite ve maliyet nedeniyle kristaloidlere bir üstünlüğü yoktur.HES sepsis ve septk şokta kontrendikedir .HES Jelatn ve Dekstranların güvenilirliği ortaya konmuş değildir. Septik şokta albumin erken resussitasyonda ilave olarak kullanılabilir.Travmatk beyin hasarı: %0,09 NaCl ve kristaloidler. Albumin kontrendikedir. Pozitf sıvı dengesi yan etkiler doğurur. Sodyumun % 98’i HDS’da bulunur, ortalama konsantrasyonu 140 meq/L kadardır.\nNa açığını hesaplama = ( istenilen Na düzeyi – mevcut Na düzeyi ) x VA x 0.6\n• Düzeltme hızı 0.5-1 meq/L/st’i geçmemeli. (12- 24 meq/L/gün yapar. )\n• Na < 120 meq/L ve nöbet varsa, düzeltme hızı 1-2 meq/L/st’e artrılabilir.\n• Hızlı düzeltmenin en önemli yan etkileri SSS’dir. (santral pontn myelinolizis)\nK intraselüler sıvının major iyonudur. Plazmada ortalama konsantrasyonu 4 meq/L kadardır. Hipokalemi durumlarında hastaya potasyum infüzyon şeklinde verilmelidir. Hasta monitörize değilse saatte 1 tüp monitörizeyse en çok 4 tüp verilebilir. Bir tüp KCL= 10 meq/L dir. Günde en fazla 160 meq/L potasyum verilebilir. Genelde dekstroz içinde verilir ve 1 litrelik çözeltiye en fazla 4 ampül potasyum konulur.\nİnsan kanındaki en temel ve en güçlü tampon sistemi Karbonik asit/Bikarbonat tampon sistemidir. Respiratuvar kompansatuvar yanıtlar iki aşamalıdır:\na) Hücre tamponlaması ile hızlı yanıt\nb) Renal adaptasyon ile yavaş yanıt Metabolik dengesizliklerde kompansasyon sadece alveoler ventilasyondur. Bu nedenle akut ve kronik olarak ayrılamaz.\nMetabolik Asidoz: Cerrahi hastalarda sıklıkla travma, kritik hastalık, postoperatif dönem ve özellikle şokta gözlenir. Anyonik Gap: Na- (Cl+HCO3) Anyon gapa göre metabolik asidozlar 2’e ayrılır.Artmış Gap metabolik asidoz: Organik asit bileşiklerinin artmasıyla meydana gelir.Non Gap metabolik asidoz: bikarbonat kaybına bağlı gerçekleşir. Beklenen Kompansasyon: pCO2 =(1.5x [HCO3- ])+8±2 ¯pCO2 = 1.2x ∆[HCO3- ]\nMetabolik Alkoloz: Cerrahi hastalarda sık görülür.Sıklıkla nedenleri; Gastrik HCl kaybı gibi H+ kaybı, Hipovolemi, Total vücut K+ eksikliği Sıklıkla hipokloremi ve hipokalemi ile birliktedir. Beklenen Kompansasyon :pCO2 =0.7x∆[HCO3- ]\nRespiratuar Asidoz: Akut respiratuar asidoz, ventilasyonun aniden yetersiz olması sonucunda gelişir.Kanda CO2 birikir ve karbonik anhidraz ile H2CO3 değişimi olur ve asidoz gelişir. Beklenen Kompansasyon :[HCO3- ]=1mEq/L,\nher 10 mmHg∆ pCO2 için\nRespiratuar Alkaloz: Hiperventilasyon, pCO2’yi azaltır (Hipokapni) ve respiratuar alkaloza neden olur.Cerrahi hastada en sık nedenleri;Anksiyete, Ajitasyon, Ağrı Beklenen Kompansasyon :↓[HCO3- ]=2mEq/L, her 10\nmmHg ∆ pCO2 için", "pages": [81, 82]}, {"no": 210, "q": "Künt karın travması, dalak travması, dalak ligamanları", "tip": "Bilgi", "hoca": "Hakan Uncu / Mehmet Gürel", "a": "Abdominal travma: Karın travmalarının %80 ini oluşturur. Sıklıkla dalak ve karaciğer etkilenmektedir.Bunun yanında :Bağırsak, Mezenter,diyafram nadiren etkilenir. Duodenum Pankreas Böbrek Aort gibi retroperitoneal organlar daha az etkilenir.\nDetaylı bir anamnez alınır. Kazanın şiddeti, emniyet kemeri kullanımı, hava yastığının açılıp açılmadığı, varsa başka yaralıların durumu vb. ile değerlendirilir.\nDalak travması: Dalak künt abdominal travmada en sık yaralanan ikinci organdır. Splenik yaralanmayı takiben intraabdominal kanamaya bağlı şok tablosunda gelen hastada splenektomi hayat kurtarıcı olabilir, Bilgisayarlı tomografi intraabdominal sıvı(kan) miktarını ve yaralanmanın spesifik organdaki derecesini gösterebilir. Hiler hasar veya parankimal parçalanmalar sıklıkla splenektomi ile tedavi edilir. Dalak parçaları (40x40x3 mm) omentuma reimplante edilebilir. Kliniğimizde dalak yaralanmalarında genellikle splenektomi yapılır. Dalak Ligamanları: Splenofrenik, splenorenal, splenokolik, splenogastrik", "pages": [82]}, {"no": 211, "q": "Men sendromlarındaki patolojileri", "tip": "Bilgi", "hoca": "Hakan Uncu / Mehmet Gürel", "a": "Multipl endokrin neoplazi (MEN), endokrin bezlerden (iç salgı bezleri) kökenli çok sayıda tümörlerinin saptandığı, otosomal dominant yolla aktarılan kalıtsal bir sendrom kümesidir. Endokrin tümörlerin yanı sıra, endokrin nitelik taşımayan organlardan ve dokulardan kökenli tümörler de görülmektedir; endokrin kökenli olsun ya da olmasın, iyi huylu ya da kötü huylu (kanser) tümör özelliklerini taşırlar.MEN1, MEN2A ve MEN2B gibi 3 fenotipi vardır.\nMen 1: Werner Sendromu: Pituiter Pankreas tümörleri ve paratiroid hiperplazisi bulunabiliyor bu hastalarda ve ilk bulguları genelde hiperparatiroidi oluyor.\nMen 2A: Sipple sendromu: Medüller tiroid karsinomu birincil bulgudur. Bu sendromda feokromositoma ve paratiroid hiperplazisi de görüleblir.\nMen 2B: En tipik bulgusu, mukozalarda saptanan çok sayıda sinir dokusu tümörleri (nöromalar).Bunun yanında meduller ca,feokromositoma,bağırsak ganglionörinomları ve marfanoid vücut yapısı da bulunabilir.", "pages": [82, 83]}, {"no": 212, "q": "Visseral parietal ağrı özellikleri farkalrı", "tip": "Bilgi", "hoca": "Hakan Uncu / Mehmet Gürel", "a": "Visseral ağrı köken aldığı dermatomlarda hissedilir. Lokalize edilemez C tipi miyelinsiz liflerle taşınır.İnflamasyon iskemi ve doku çeperinde gerilme ile uygarılır.Parietal ağrı ise A delta tipi miyelinli liflerle taşınır haliyle iletimi daha hızlıdır. Iyi localize edilebilirler ve tanı koydururlar.", "pages": [83]}, {"no": 213, "q": "Lenfödem tanımı, sınıflaması", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Çeşitli sebepler ile interstisyel sıvı artışına bağlı olarak gelişen şişliklere ödem denir. Kapiller filtrasyon ve lenfatik drenaj arasında dengesizlik vardır. Lenfödemde ise kapiller filtrasyonu normalken lenfatik drenajın çeşitli sebeplerle yetersiz kalmasıyla dokuda proteinden zengin interstisyel sıvı birikmesidir. Sınıflandırması primer ve sekonder olarak ikiye ayrılır. Primerler konjenital, precox ve tarda olmak üzere 3’e ayrılır. Sekonderler ise infeksyon, granülamatöz, travma, cerrahi, post-trombotik olarak ayrılırlar.", "pages": [83]}, {"no": 214, "q": "Erken mide ca nedir, mide ca da lenf nodu metastazı yüzdesi, patoloji raporunda adenokanser gelirse ne yaparız, (operabilite bakılır),inoperabl durumlar neler, mukoza sınırlamasına ne ile bakılır(endoskopik usg?),", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "Erken mide karsinomu: lenf nodu tutulumu bakılmaksızın mukoza veya submukoza ile sınırlı karsinomlara verilen addır. Mide karsinomlarının yüzde 90’ı maligndir dolayısıyla lenf noduna metastazı yaklaşık bu oranda bekleriz.Patoloji sonucu adenokanser gelirse eğer tümörü sınıflandırıp operabl mı non operabl mı ona bakarız.Evre 1A ise: lenf bezi tutulum oranı yüzde 5’in altında ise endoluminal laparoskopik cerrahi yöntemle sınırlı cerrahi yapılabilir. Evre 1B, Evre 2, Evre 3A mide kanserinde radikal cerrahiye uygun rezeksyon ve d2 lenf nodu disseksyonu.\nEvre 3B ve Evre 4 kanserlerde ise R0 rezeksyon mümkün olmadığı için kür sağlanamaz.\nmide kanserinde inoperabl durumlar: malign asit,metastatic plevral efüzyon,peritoneal karsinomatosiz,rektal muayenede kitle,umblikal kitle,servikal supraklavikuler veya aksiller lenf nodlarında metastazdır.Mukozal sınırlamayı endoskopik ultrasonografi ile anlarız.", "pages": [83]}, {"no": 215, "q": "Safra kesesi poliplerinde cerrahi endikasyon, malignite bulguları", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "Safra kesesi poliplerinin Cerrahi Endikasyonu:\n-6 mm ≤ polipler\n-Semptomatik polipler\n-Büyüme gösteren polipler\nSafra kesesi poliplerinde Malgnite riski:\n-1 cm ≤\n-Tek polip\n-50+ yaş\n-1 cm ≥ poliplerde malignite oranı % 7.4", "pages": [83, 84]}, {"no": 216, "q": "Splenektomi endikasyonları, masif splenektomi tanımı, sebepleri,", "tip": "Bilgi", "hoca": "Uğur Bengisun / Sancar Bayar", "a": "Splenektomi Endikasyonları: Hematolojik, malignite ve immünolojik nedenler olmak üzere 3 başlıkta incelenir.\nHematolojik: Herediter sferositoz, Herediter eliptositoz, orak hücreli anemi, enzim eksikliğine bağlı anemi,Talasemi\nMalignite: AML,PV,KML,KML,KLL,HODKİN LENFOMA, NON HODKİN LENFOMA İmmünolojik:ITP,TTP,Gaucher,niemann pick hastalığı\nMasif splenomegali: Dalağın ağırlığının 1000 gramdan fazla ve çapının 22 cm den büyük olması masif splenomegalidir.\nNedenleri: KML,Miyelofibrozis,Kala azar,Gaucher, Lenfoma,Malarya, Talasemi Major.", "pages": [84]}, {"no": 217, "q": "Meme koruyucu cerrahi endikasyonları, multifokal multisenterik, unifokal unisentreik tanımları", "tip": "Bilgi", "hoca": "Uğur Bengisun / Sancar Bayar", "a": "Meme koruyu cerrahi endikasyonları\n1-Hasta isteği\n2-Sağlam sınırlar (lumpektomi, kadrantektomi) 3-Uygun meme volümü\n4-Unifokal tm\nMultifokal:Aynı memede, aynı kadranda birden fazla (primer) odak (kanser) olması Multisenterik:Aynı memede, birden fazla kadranda (farklı kadranlarda), farklı meme kanseri odaklarının olması\nUnifokal:\nUnisenterik:", "pages": [84]}, {"no": 218, "q": "Anevrizma tanımı, anevrizma erkek kadın oranı, aortun çapı, anevrizma demek için ne kadar büyümeli", "tip": "Bilgi", "hoca": "Uğur Bengisun / Sancar Bayar", "a": "Anevrizma: Bir arterin normal çapından %50 fazla genişlemesi.\nErkek/Kadın=4\nAort çapı normalde 2cm, yani 3 cm olursa anevrizma.", "pages": [84]}, {"no": 219, "q": "Akut arter tıkanıklığı tanımı, etyolojisi, emboli ve tromboz oluşum mekanizmalarını, belli yerlerdeki tiplerin özel adı,", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Akut arter tıkanıklığı: arterde canlılığı tehdit edecek ölçüde perfüzyonunun akut olarak azalması ya da bozulması.\nArter veya greftin trambozu veya kalp ya da hastalıklı damardan emboli sonucu gelişir. Bu soruyu detaylıca açıkla çok kısa cevap ve yetersiz", "pages": [84]}, {"no": 220, "q": "Pankreas ca nedenleri tipleri belirti", "tip": "Bilgi", "hoca": "Sancar Bayar", "a": "Kadın ve erkekte eşit, en sık 7. dekaddadır. %95 duktal adenokanser, %5 norendokrin tümördür.\nSemptomları nonspesifik; işstahsızlık, bulantı, kilo kaybı, sarılık(pankreas başındaysa), ağrı. Fizik muayenede palpe edilebilr safra kesesi, hepatomegali, sarılık(pankreas başındaysa). Labaratuar bulguları; Bilirubin; ALP, GGT yüksek.\nCa19-9 tanıda önemli değil, takipte önemli. Yaşlılarda yeni başlayan DM'de pankreas kanseri akla gelmeli.\nTanı: İlk olarak USG, en güzeli Dİnamik BT. Tedavi: İlk tanı anında %20 opere edilebilir. %50 akciğer-karaciğer metastazı vardır. Cerrahi tedavi tek uzun survival şansıdır.\nPankreas başı tümörlerinde WHİPPLE Ameliyatı yapılır.\nPankreasın endokrin tümörleri(%5) -Fonksiyonel - Non-Fonksiyonel\n-Bening - Mallign\n-Sporadik - MEN şeklinde ayrılır.\nPankreasın fonksiyonel tümörleri -İnsulinoma: Bu hastalarda Whipple Triadı dediğimiz durum görülür. Hastanın plazma glukozu 55'in altına düşer, glukoz verip normala döndürürüz.\n-Gastrinoma: Gastrik, duodenal, pankreatik kökenli olabilir. Atipik peptik ülserasyonlar gelişebilir.", "pages": [84, 85]}, {"no": 221, "q": "Tıkanma sarılığı bulguları tiradın özel adı, pentatın özel adı, safra kesesinin palpe edilmesi durumunun özel adı,", "tip": "Bilgi", "hoca": "Sancar Bayar", "a": "Tıkanma sarılığında kolanjit olursa Charcot Triadı'ndan söz edilir.(sağ üst kadran ağrısı, sarılık, titremeyle yükselen ateş)\nEğer bu durum devam ederse Reynold Pentadı görülür.(sağ üst kadran ağrısı, sarılık, titremeyle yükselen ateş, biliyer septik şok, SSS depresyon bulguları)\nSafra kesesinin palpe edilmesinin özel adı da Courvoiser Terrier Bulgusu.", "pages": [85]}, {"no": 222, "q": "Uğur hoca telefondanfotoğraf gösterip ne işlemi yaptık demiş(emboli çıkarılmış, fogaty kateteri kullanılmış)", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Fogaty kateteri=Balon kateteri, işlemin adı balon anjiyoplasti", "pages": [85]}, {"no": 223, "q": "Karaciğer benign tümörleri, özellikleri, hemanjiyom radyolojide tipik olarak nasıl görünür, radyal skar hangisinde görülür,", "tip": "Bilgi", "hoca": "Sancar Bayar", "a": "Karaciğerin benign tümörleri; Hemanjiom, Fokal Nodüler Hiperplazi, Adenom, Hamartom, Anjiyomyoliporn, Hemanjioendoteliom, Teratom, Lipom ve Ekinokokus Alveolaris.(İlk dördü anlatılmış sadece)\nHemanjiyom; USG'de hipoekoik, izoekoik kitle. Özellikle MR bu lezyonun diğer lezyonlardan ayrımında önemlidir. Önce periferden tutulum sonra santrale geçen tutulum tipiktir. Anjigrafide ise damarların boyandığı ortada ise boyanmayan santral skar görülür.(?)\nRadyal skar Fokal Nodüler Hiperplazi'de(FNH) görülür.(Şimdi notta arkadaş FNH'de santral demiş ama textbooklarda radyal diyor.)", "pages": [85, 86]}, {"no": 224, "q": "Karaciğer malign tümör en sık hangisidir, HCC de kanda neler yükselir,", "tip": "Bilgi", "hoca": "Sancar Bayar", "a": "Karaciğerin malign tümörlerinde primer olarak en sık rastlanan hepatoselüler kanserdir (HCC) (%95). Sekonder olarak en çok metastatik tümörlerdir ve batı yarım kürede karaciğerin en sık rastlanan tümörleridir.\nHCC'de kanda AFP artar(%70)(genellikle HbV olanlarda). Bunla birlikte Hbs antijeni ya da antiHCV pozitifliği de görülür. Alkalan fosfataz yüksekliği de sıktır.", "pages": [86]}, {"no": 225, "q": "Arter tıkanıklığı nedenleri,", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Etyoloji:\n-Tromboz\n-Emboli\n-Travma\n-Phlegmasia Corulae Dolens\nTrombozda Etyoloji:\n-En önemli etyoloji aterosklerotik damar hastalığıdır(en sık)\n-Travmalar\n-Aorta diseksiyonu\nEmboli Etyoloji:\nDamar bifurcatiolarında ortaya çıkar\nEn önemli etyoloji kardiyak sebeplerdir:KKY,Kapak yetmezlikleri,MI,Atrial Fibrilasyon\n*Emboli ve tromboz arasındaki farklara gelirsek:\n-Embolide ani olarak ağrı başlar. Trombozda kladikasyo(Bacak ağrısı) vardır.\n-Embolide klinik durum daha ağırdır.\n-Emboli ani olarak geliştiği için anjiografide kollateral gözlenmez. Tromboz ise yıllar içinde geliştiği için kollateral oluşumu vardır. -Emboli de emboli öyküsü trombozda aterosklerotik öykü bulunur.\n-Emboli kardiyak sebeplere bağlı gelişirken tromboz ateroskleroza bağlı gelişir.", "pages": [86]}, {"no": 226, "q": "Fogaty kateterininen ucuna ne denir, çıkan şey ne renk olur,", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Balon ya da inflated cuff. Koyu kırmızı renkte çıkarılır (?)", "pages": [86]}, {"no": 227, "q": "Femoral arter neleri besler,", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Alt ekstremiteyi besleyen asıl arterdir . Femoral arter, birçok dal verir;\na.circumflexa İliaca superficialis, Siasa kadar uzanan küçük bir daldır\nA. gastrica superficialis, göbek bölgesine uzanan küçük bir daldır.\nA. pudendalis externa superficialis , skrotumun (veya labium majusun) derisini beslemek için medial olarak uzanan küçük bir daldır. A.pudendalis externa profunda, medial olarak uzanır ve skrotumun (veya labium majus) derisini besler.\nA. Femoralis profunda, femoral arterin lateral tarafından inguinal ligamanın yaklaşık 4 cm altından çıkan büyük ve önemli bir daldır. Medial olarak femoral damarların arkasından geçer ve uyluğun medial fasyal kompartmanına girer. Dördüncü perforan arter olarak sona erer. Orijininde medial ve lateral femoral sirkumfleks arterleri ve seyri sırasında üç perforan arteri verir.\nA.genus descendens , femoral arterden adduktor kanal içindeki ucunun yakınında çıkan küçük bir daldır. Diz ekleminin beslenmesine yardımcı olur.", "pages": [86, 87]}, {"no": 228, "q": "Doku iskemi süreleri, (sinir dokusu dakikalar, deri kas vb.)", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Kalp:4 saat\nAkciğer: 4-6 saat\nKaraciğer: 6-10 saat\nPankreas: 12-18 saat\nBağırsaklar: 6-12 saat\nBöbrekler: 24 saat (may go up to 72 hours if placed on a perfusion pump following recovery) Kas:4 saat\nSinirler: 8 Saat\nYağ 13 Saat\nDeri: 24 Saat\nKemik:4 gün", "pages": [87]}, {"no": 229, "q": "Şok tipleri, bu tiplerde ne azalır, (hipovolemide kan volümü, septikte vasküler rezistans, kardiyojenikte pompalama gücü)", "tip": "Bilgi", "hoca": "Salim Demirci / Cüneyt", "a": "Ana olarak 4 grup var(Hipovolemik-Septik- Kardiyojenik-Nörojenik)(Temel Cerrahi El Kitabı). Slaytta ek olarak Anaflaktik ve Obstrüktif şok yazıyor.\nHipovolemik Dolaşımdaki kan hacminin kaybı ile karakterizedir. Bu kaybın nedeni ani ve fazla miktardaki kanama ya da aşırı sıvı kaybı olabilir. Klinik olarak şok tablosu oluşması için dolaşımdaki kanın en az %25’ini kaybetmemiz gerekir\nSeptikte vasküler resistans azalır (2 aşamalı). Kardiyojenikte kalbin pompalama gücü azalır. Nörojenikte Semptomatik denervasyon sonucu arterioler ve venöz dilatasyon à Vasküler rezistans azalır àVasküler göllenme àRölatif Hipovolemi Kalbe venöz dönüş azalır.", "pages": [87]}, {"no": 230, "q": "Anevrizma komplikasyonları, aortoenterik fistül olursa ne görülür (gis kanaması), fistül en çok nereye olur(duodenuma)", "tip": "Bilgi", "hoca": "Salim Demirci / Cüneyt", "a": "Risk faktörleri: ileri yaş, erkek cinsiyet, sigara, ailede anevrizma öyküsü, koroner arter hastalığı, koah.\nAteroskleroz, proleotik enzim aktivasyonu, inflamasyon, enfeksiyon sonucunda görülür. Komplikasyonlar: rüptür, tromboz, distal emboli, bası, av fistül\n!!Rüptür riskini artıran faktörler: çap>5,5 cm, hipertansiyon, sigara, aile öyküsü büyüme hızı (yılda >10 mm büyüme), kadın cinsiyet (anevrizma oluşma riski erkekte yüksek, rüptür riski kadında!)\nRüptür triadı: sırt-karın ağrısı, karında pulsatil kitle, hipotansiyon, şok\nAoraenterik fistül olursa ,Gis kanaması görülür. Çoğu AEF, sekonder ve geçirilmiş aortik operasyonun –genellikle aortik greft yerleştirilmesi- komplikasyonu olarak kabul edilir. Genellikle abdominal aort anevrizmasının duedonumla bağlantısını içerir.\nGenellikle akut gastrointestinal kanamalarda, AEF’yi odak olarak gösteren çok az bulgu olur. Kanama akut veya kronik olabilir, alt veya üst GIS’den kaynaklanabilir ve ciddiyeti minör ile masif arasında değişebilir", "pages": [87, 88]}, {"no": 231, "q": "Üst gis kanaması sebepleri sistematik olarak, (peptik ülser?, mallory weis? Vb..)", "tip": "Bilgi", "hoca": "Salim Demirci / Cüneyt", 11 kriter var hepsi 1 puan)\n0-3 arası hafif akut pankreatit\n4-11 arası ağır akut pankreatit kabul edilir Ranson kriterlerine göre yaklaşık mortalite: 0-2 puan: %1-2 mortalite\n3-4 puan: %15 mortalite\n5-6 puan: %40 mortalite\n7-11: %100 mortalite *", "pages": [89, 90]}, {"no": 238, "q": "Anal kanal kanserileri, tipleri neler, nedenleri(hpv), hpv hangi sebepten sık görülür(HIV?),", "tip": "Bilgi", "hoca": "Ethem Geçim", "a": "Anal kanser hastalarının 2/3'ü kadın. 55-64 yaşta sık.\nRisk faktörleri:\n-Rahim ağzı kanserine de neden olan ve anüs ve çevresinde siğiller yapan human papillomavirus (HPV) adlı virüs infeksiyonu,\n-Anüs yoluyla cinsel ilişki (hem kadın, hem de erkeklerde),\n-Çok eşlilik,\n-Sigara, AIDS hastalığı ve benzeri nedenlerle bağışıklık sisteminin baskılanması\nKondloma akumilata(kanser değil ama eğilimi var): Podofilin, İmiquimod, triklor asetik asit ve 5 florourasil\nAnal epitelyal neoplazi(Bowden Hastalığı) : Geniş lokal eksizyon\nEpidermoid karsinom: Anal kanalda veya sfinkterleri invaze eden epidermoid karsinomlar lokal olarak eksize edilemezler ve ilk aşamada tedavi kemoterapi ve radyoterapiye dayanır. Verrükoz karsinom: Geniş lokal eksizyon ile tedavi edilir. Çok büyük lezyonlarda radyoterapi uygulanabilir.\nBazal hücreli karsinom: Tedavi geniş lokal eksizyon. Büyük lezyonlarda radikal rezeksiyon veya rt verilebilir.\nAdenokarsinom: Tedavi adjuvan kt, yapılamazsa radikal rezeksiyon\nMeme dışı paget hastalığı: Tedavi geniş lokal eksizyon\nMelanom: Tedavide ilk tercih geniş lokal eksizyondur ama radikal rezeksiyon da yapılabilir.\nBelirtiler:\nMakatta ağrı veya rahatsızlık ve kaşıntı hissi Dışkılama esnasında kanama olması\nMakat etrafında yaraların oluşması\nDışkının incelmesi\nBarsak alışkanlıklarında değişiklik\nTanı:\n-Rektal digital muayenede ele kitle gelmesi -Proktoskop ile anal kanalın değerlendirilmesi ve gerekli bölgeden biyopsi alınması -USG,MR,BT'den de faydalanabilir.\nTedavi:\nTedavi kararında hastalığın yeri, evresi, hastanın yaşı ve diğer sağlık sorunları gibi birden fazla faktör etkilidir.\nMultidisipliner bir çalışma gerektiren bu tedaviler ; radyoterapi,cerrahi kemoterapi gibi farklı seçenekleri içermektedir.", "pages": [90, 91]}, {"no": 239, "q": "Pankreas tümörleri?,", "tip": "Bilgi", "hoca": "Selçuk Hazinedaroğlu", "a": "Kadın ve erkekte eşit,en sık 7.dekaddadır. %95 duktal adenokanser,%5 nöroendokrin tümördür.\nSemptomlar nonspesifik: İştahsızlık,bulantı,kilo kaybı,sarılık(pankreas başındaysa),ağrı\nFMde palpable safra kesesi, Hepatomegali, Sarılık—(Pankreas başı ca) LAB:Bilirubin,ALP,GGT yüksek.\nCa19-9 tanıda değil fakat takipte değerlidir. Yaşlılarda yeni başlayan DM de pankreas kanseri akla gelmeli.\nTanı:İlk önce USG yapılır. En güzeli dinamik BT.\nTedavi:İlk tanı anında %20si operabledır. %50sinde akciğer karaciğer metastazları vardır. Cerrahi tedavi tek uzun survival şansıdır. Pankreas başı tümöründe WHIPPLE ameliyatı yapılır.\nPankreasın Endokrin Tümörleri(%5): Fonksiyonel-Nonfonksiyonel\nBenign-malign\nSporadik-MEN ilişkili şeklinde ayrılır. Fonksiyonel Tümörler:( Hoca bile bunları çok nadir görmüş önemsiz olabilir)\nINSULINOMA: Bu hastalarda whipple triadı dediğimiz durum görülür.Hastanın plazma glucoseu 55in\naltına düşer.Glucose veririz.Kan şekeri normale döner.\nGASTRINOMA: gastrik,duodenal,pankreatik kökenli olabilir.Atipik peptik ülserasyonlar gelişir", "pages": [91]}, {"no": 240, "q": "Whipple triadı", "tip": "Bilgi", "hoca": "Selçuk Hazinedaroğlu", "a": "Hipoglisemi tanısı Whipple Triadı (Whipple Üçlemesi) adı verilen bir yönteme dayanır. Bu yönteme göre tanı kriterleri şunlardır: Whipple Triadı – Whipple Üçlemesi 1-Hipoglisemi belirtileri ve bulgularının olması (Açıklık kan şekeri seviyesi 50-70 mg/dL ise hipoglisemi)\n2-Plazma kan şekerinin 45-50 mg ve altında olması\n3-Glukoz verilmesiyle belirtilerin kaybolması", "pages": [91]}, {"no": 241, "q": "Üst gis alt gis kanamaları özellikleri farkları, altgis kanamaları kolonoskopi anjiyografi sintigrafi diyagramı,", "tip": "Bilgi", "hoca": "Selçuk Hazinedaroğlu", "a": "alt gis kanamaları treitz ligamanının altından kaynaklanır gastrik aspirasyon temizdir. Üst gis kanamaları treitz ligamanının üstünden kaynaklanır ve gastrik aspirasyon kanlıdır. Melena ve hematemez üst gis kanaması bulgusudur. Hemotokezya ise genelde alt gis kanaması bulgusudur ancak %10 olarak üst gis kanaması da sebep olabilir.\nAlt GİS kanamalarında mortalite %5’in altında olup üst GİS kanamalarındakinden düşüktür. Alt GİS kanamalı hastaya ilk yaklaşım üst GİS kanamalı vakalardakinden farklı değildir. Kanama şiddeti belirlenmeli, hemodinamik stabilizasyon sağlanmalı ve prognoz belirlenmeye çalışılmalıdır.\nGenç yaş grubunda daha ziyade infeksiyöz\nve inflamatuar hastalıklar kanamaya sebep olurken ileri yaşlarda kolonik divertiküller ve vasküler ektaziler ana sebeplerdir. Sintigrafi tanısal olabilir ancak girişimsel tedavi imkanı sağlamaz. Hem tanıda hemde tedavide oldukça yararlanılan yöntemler kolonoskopi, anjiografi ve cerrahi şeklinde sıralanabilir.\nKanama çok hızlı ise veya acil kolonoskopi imkan dahilinde değilse anjiografi endike hale gelir. Böyle bir durumda anjiografi öncesinde gerekirse endoskopide yapılmak kaydı ile üst GİS kanaması mevcudiyeti ekarte edilmelidir.", "pages": [91, 92]}, {"no": 242, "q": "55 yaşında birinin alt gis kanaması sebepleri", "tip": "Bilgi", "hoca": "Selçuk Hazinedaroğlu", "a": "divertikülozis,anjiyodisplazi, inflamatuvar bağırsak hastalıkları, kolon polipleri ve karsinomlar, fissür, abse, hemoroid", "pages": [92]}, {"no": 243, "q": "Anjiyodiplazi nedir nasıl tanırsın", "tip": "Bilgi", "hoca": "Selçuk Hazinedaroğlu", "a": "submukozal venlerin ve mukozal kapillerlerin ektazik bir hal alması sonucunda ortaya çıkar.damar duvarının zayıflaması ile spontan kanamalar oluşur.Yaşlılarda en sık Gis kanaması sebebidir.", "pages": [92]}, {"no": 244, "q": "Elimde ben var bunu nasıl alırız, antisepsi asepsi sterilizasyon dezenfeksiyon", "tip": "Bilgi", "hoca": "Ayhan Kuzu / Arda Demirkan", "a": "Ben (nevüs ya da mole), ciltteki melanin denilen pigmenti üreten hücrelerin iyi huylu sınırlı oluşturduğu cilt lezyonlarının ortak adıdır. Benler iyi huylu cilt lezyonlarıdır. Kanserli hücreler değildirler.\ncerrahi eksizyon yapılmalıdır.\nCerrahi eksizyon işlemi ameliyathane gerektirmeyen, poliklinik şartlarında lokal anestezi uygulanarak yapılan işlemdir.", "pages": [92]}, {"no": 245, "q": "Abdominal travmayla gelen hastaya sırasıyla ne yapılır", "tip": "Olgu", "hoca": "Arda Demirkan", "a": "1-)ilk değerlendirme(hızlı primer bakı) 2-)resüsitasyon işlemleri\n3-)yatak başı radyolojik testler\n4-)detaylı ikincil bakı\n5-)tanısal çalışmalar\n6-)sık aralıklarla hastanın değerlendirilmesi 7-)hastanın tedavisi ve transferi", "pages": [92]}, {"no": 246, "q": "Grafi gösteriyor, karaciğerde hava var bu neden var(kolanjit), taş nasıl hava yapar( anaerobik bakteriler)", "tip": "Bilgi", "hoca": "Ayhan Kuzu", "a": "karaciğerde hava var bu neden var (kolanjit), taş nasıl hava yapar( anaerobik bakteriler)", "pages": [93]}, {"no": 247, "q": "Masif kan transplantasyonu komplikasyonları", "tip": "Bilgi", "hoca": "Ayhan Kuzu", "a": "sitrat toksisitesi, hiperkalemi, asit baz dengesizliği, hipotermi, koagülopati, trombositopeni", "pages": [93]}, {"no": 248, "q": "3 hasta var, birinde claudicatio, birinde istirahat ağrısı, diğerinde ülser, anamnez ve fm bunları ayır,", "tip": "Bilgi", "hoca": "Ayhan Kuzu", "a": "kladikasyo:yürüme sırasında oluşan ağrı bir süre dinlenildiği taktirde geçer.\ndinlenim ağrısı:\n1-)sürekli ön ayakta ağrı\n2-)geceleri kötüleşir.\n3-)ayakları sarkıtmak semptomları iyileştirir 4-)ağrı şiddetlidir narkotiklere bile dirençlidir.", "pages": [93]}, {"no": 249, "q": "Yaş gangren kuru gangren tanımı", "tip": "Bilgi", "hoca": "Ayhan Kuzu", "a": "Gangren ekstremitelerin koagülasyon nekrozudur. Lifekasiyon nekrozu(nötrofil enzimlerinin olması) eşlik ederse yaş gangren, etmezse kuru gangren denir.\nKuru gangren arter tıkanıklığı sonucu oluşur. Gangren bölgesi demerkasyon hattı ile canlı bölgeden belirgin bir şekilde ayrılır.\nYaş gangren beslenmesi bozulmuş dokuların enfeksiyona maruz kalması sonucu oluşur.", "pages": [93]}, {"no": 250, "q": "Tiroidektomi komplikasyonları, hastada hemotom olursa ne olur, nasıl ölür mekanizması", "tip": "Bilgi", "hoca": "Arda Demirkan", "a": "Tiroidektomi Komplikasyonları: 1)Kanama(hematom: boyun bölgesindeki bu loj çok küçük olduğu için 100-150 cc kanama bile trakeaya bası yaparak\narreste neden olabilir böyle bir durumda acil insizyon açlarak hematom boşaltılmalıdır.) 2)hipoparatiroidi, hipotiroidizm\n3) vokal kord paralizisi(iki taraflı ses telleri fonksiyon bozukluğu),\n4)Rekürren laringeal sinir hasarı(tek taraflı:ses kısıklığı; çift taraflı:zorlu solunum),\n5) superior laringeal sinir hasarı(tiz ses çıkarmada güçlük)", "pages": [93]}, {"no": 251, "q": "Akut mezenterik iskemi", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Uğur Bengisun- Akut mezenterik iskemi: Ortalama arteriyel kan basıncı 40 mmhg altına düşünce bağırsak beslenme bozukluğu ortaya çıkar. bu iskemiye en duyarlı doku bağırsak mukozasıdır.\nNekroze olan bağırsak mukoza hücreleri dökülmeye başlar ve submukozal kanamalar oluşur.\nMukozanın ortadan kalkmasıyla bakteriyel translokasyon görülür. Septik tablo gelişir. İskemi süresi uzadıkça tüm katlar etkilenir. 6-8 saat içinde tam kat nekroz ve perforasyon gelişir. Bunun sonucu peritonit ve sepsistir.\nKlinik: Fizik muayene ile uyumsuz şiddetli karın ağrısı kardinal bulgudur. Kalp hastalığı hikayesi vardır.\nErken tanının önemi nedeniyle AMİ açısından şüphelenmek önemlidir.\nnedenleri: en sık nedeni: SMA embolisi(%50), SMA trombozu(%25), NOMİ, SMV trombozu. Embolide ağrı: ani başlar,şiddetlidir ve yaygındır. Şiddetli karın ağrısına rağmen FM normaldir. Bulantı kusma olabilir. hastanın kalp hastalığına ait anamnez(özellikle atriyal fibrilasyon) veya emboli hikayesi önemlidir\nTrombozda ağrı: Önceki stenozdan dolayı kollateraller oluştuğundan ağrı daha hafif ve klinik daha siliktir. Bu hastalarda kronik iskemiye neden olabilecek yemek sonrası karın ağrıları hikayeleri önemlidir.\nNOMİ de ağrı: Karakteri daha belirsiz. Anamnezde risk grubu hastalarda vazokonstrüktör ilaç kullanımı gibi durumlarda şüphelenmek gerekir.\nMezenter Ven Trombozunda Ağrı: Hastaneye başvurudan birkaç gün önce başlayan ağrı genelde siliktir. Hatalarda bulantı, kusma, kanlı diare olabilir.\nAMİ nedeni ne olursa olsun FM ile uyumsuz karın ağrısı vardır.Erken döenmde bağırsak sesleri artar zamanla azalır ve kaybolur. İnfarktüs ile ateş olur, nabız artar. Hasta hipotansif kalır. Nekroz ve perforasyon ile peritonit ve sepsis olur. metabolik asidoz gelişir. Lab: Lökositoz, metabolik asidoz artmış anyon gap, laktat yükekliği.. d dimer testi negatifse AMİ dışlanmalıdır.\nGörüntüleme: Direkt karın grafisi, renkli doppler usg, BT, Anjiografi(en yararlı), MR anjiografi Tedavi: sıvı resüsitasyonu, intravenöz AB(bakteriyel translokasyon nedeniyle), Nazogastrik tüp ile GIS dekompresyonu, Mesane kateteri ile idrar çıkışıkontrol edilmeelidir. Peritonit varsa acil laparotomi. Yoksa : emboli veya trombüsde: anjiografik kateterden doku plazminojen aktivatörü, streptokinaz vs ajanlar veriilebilir.\nemboli: embolektomi, tromboz: bypass\nNOMİ: papaverin invazyonu : vazospazmı çözmek için. Altta yatan, düşük akıma neden lan olay çözülmelidir.\nAkut mezenter ven trombozunda heparinaizasyon ana tedavi yöntemidir.", "pages": [93, 94]}, {"no": 252, "q": "Önündeki ilaç kutusunu sormuş(heparin), nerelerde kullanılır, ne kadar verilir, heparinin molekül yapısı,", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Antikoagulan ilaçlar; warfarin (Coumadin), standart heparin (SH: anfraksiyone heparin), düşük molekül ağırlıklı heparin ve pentasakkarit olup başlıca venöz tromboemboli tedavi ve proflaksisinde, prostetik kalp kapağı ile ilgili ya da atrial fibrilasyona bağlı emboli gelişiminin önlenmesinde, seçilmiş hasta grubunda strok ve myokard infaktüsü tekrarını önlemede kullanılırlar.\nHeparin çeşitli konumlarında sülfat kökleri içeren idorinük asit ve D-glukozaminden oluşmuş bir polisakkarittir. Molekül ağırlığı ortalama olarak verilmektedir (3000-30.000 Da; ortalama 15.000 Da).\nHeparin tedavi uygulaması subkutan ve intravenöz yolla olmaktadır. Subkutan tedavi düşük doz (12 saat arayla 5,000 U), orta doz (12 saat arayla 12,500 U ya da 15,000 U) ve yüksek terapötik doz (>35,000 U toplam günlük doz iki eşit doza bölünerek) şeklindedir. Venöz tromboembolizm olguları için heparin dozu kiloya bağlı olup 80 U/kg bolus ve bunu 18 U/kg/saat infüzyon ile devam edilmesidir. Koroner trombozlu olgularda ise daha düşük dozlar uygulanır.\nek bilgi:DMAH’lerin standart heparine üstünlükleri\n1. Trombini Faktör Xa’ ya göre daha az inhibe eder.\n2. Deri altı yolu ile kullanıldığında biyoyararlanımı yüksektir.\n3. Yarılanma ömrü daha uzun, plazma proteinleri ve endotel hücrelerine, makrofajlara daha az bağlanır.\n4. Günde tek veya iki doz olarak kullanılabilirler. 5. Özel koşullar dışında laboratuar izlemi gerektirmeden devamlı antitrombotik etki gösterirler.\n6. Platelet Faktör 4’e daha az bağlanır, HIT (Heparine bağlı immun trombositopeni) daha az sıklıkla görülür.\n7. Osteoklast aktivasyonu ve osteopeni sıklığı daha azdır.\nDMAH’ler proflaksi amacıyla sabit dozda, tedavi amacıyla ise vücut ağırlığına göre uygulanır. Tedavi dozu ; Genelde 1 mg/kg Proflaxi dozu; Genelde 0.5 mg/kg", "pages": [94, 95]}, {"no": 253, "q": "Peptik ülser komplikasyonları, (kanama vb.) Kanamayı detaylı sormuş, neresi kanar (duodenum), hangi arter(a. Gastroduodenalis), kanayınca ne yaparız, hangi cerrahi yöntemle tamir edilir", "tip": "Bilgi", "hoca": "Sancar Bayar", "a": "Sancar Bayar -peptik ülser komplikasyonları, (kanama vb.) kanamayı detaylı sormuş, neresi kanar (duodenum), hangi arter(a. Gastroduodenalis), kanayınca ne yaparız, hangi cerrahi yöntemle tamir edilir ?\nEn sık görülen komplikasyonlar : kanama perforasyon ve obstruksiyondur.\nKanama ülser ile ilişkili mortalitesnin de ilk nedenidir. Melena ve hematemez sıklıkla izlenir. Nazogastrik sonda ile tanı koyulabilir. Peptik ülserin kanama komplikasyonu ile başvuran hastaların çoğunda asit supresyon tedavisi ve izlem kanamayı kontrol altına alır. Tedavide ilk tercih endoskopik hemostatik tedavi: epinefrin enjeksiyonu\nUygulanan cerrahi yöntemler: şokta ve genel duru bozukluğunda: gastrik rezeksiyon pyelerotomi, Kocher manevrası, Hasta stabil ise vagotomi\nTedavisi perfore ise primer sütur + omentopeksi(?) veya rezeksiyondur.(?)", "pages": [95, 96]}, {"no": 254, "q": "Men nedir hangi sistemlerde görülür,", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Hakan UNCU- men nedir hangi sistemlerde görülür?\nMultipl endokrin neoplazi sendromlarıdır.OD geçer. Bu sendromda ortaya çıkan tümörler daha erken yaşta, multipl odaklı, daha agresif tümrlerdir.\nMutipl endokrin neoplazi tip 1 (MEN-1) hiperparatiroidi (%95), enteropankreatik nöroendokrin tümörler (%60), ön hipofiz adenomları\n(%25) ve nonfonksiyonel adrenal korteks adenomları (%30) ile karakterizedir\nMultipl endokrin neoplazi tip 2 (MEN2) .\nBu sendromlar nadir olmakla birlikte, aile üyelerinin değerlendirilebilmesi ve tedavisi açısından tanınmaları önemlidir.\nMEN2 üç farklı tipe ayrılmaktadır: MEN2A, MEN2B ve familial medüller tiroid kanseri (FMTK).\nMEN2A medüller tiroid kanseri, feokromositoma ve primer paratiroid hiperplazisine herediter bir yatkınlıktır. MEN 2B; medüller tiroid kanseri (MTK) ve feokromositoma yanı sıra, mukozal nöromlar, kas-iskelet anormallikleri ve\nMarfanoid habitusu içine alan karakteristik fenotipiyle karakterize kalıtsal endokrin bir hastalıktır.\nMEN 2B, MEN 2'li hastaların %10'unu oluşturmakla birlikte, daha agresiftir, erken yaşta kendini gösterir ve prognozu MEN 2A'dan daha kötüdür", "pages": [96]}, {"no": 255, "q": "Dalak (anatomisi ağırlığı büyüklüğü, bağları komşulukları, künt travmada dalak hasar görmüş mü PA akciğer grafisinde nasıl anlaşılır(costa kırığı),", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "Mehmet Gürel- Dalak anatomisi(ağırlığı büyüklüğü, komşulukları,bağları), hasarı nasıl anlaşılır?\ncevap:Dalak karnın sol üst kadranında bulunan, mezoderm kökenli, 100-150 gram ağırlıkta, 12x7x5 cm boyutlarında olan intraperitoneal bir organdır.\nLigamentleri:\n1) Gastrosplenik ligaman\n2) Splenokolik ligaman\n3) Splenofrenik ligaman\n4) Splenorenal ligaman\nDalak; mide, sol böbrek, kolon, diyafram ve pankreasla(cauda pankreatis- hilum) komşuluk gösterir.\ndalağın 1-2 mm ince kapsülü, beyaz pulpası(immünolojik olaylarda) ve kırmızı pulpası(kusurlu kan hüc. yıkımı) vardır.\nA. splenica dalağı besleyen tek arterdir, truncus coleiacusun dalıdır.\nV. splenica arterle uyumlu seyreder. V. mesenterica superior ile birleşerek portal veni oluşturur.\nDalak, künt travmalarda en sık yaralanan intraabdominal organdır.\nDirekt grafide sol kosta fraktürü dalak yaralanmasını düşündürmelidir.", "pages": [96, 97]}, {"no": 256, "q": "Gastroözafagial bileşke reflü önleme mekanizmaları, hiatal herni nedir, tipleri neler, reflüyle ilişkisi ne,", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "Atıl ÇAKMAK- gastroözafagial bileşke reflü önleme mekanizmaları, hiatal herni nedir, tipleri neler, reflüyle ilişkisi ne?\nÜç Temel Antireflü Mekanizması Önemli ;•Ösefageal Asit Klirensi\n•Anormal Gastrik rezervuar\n•Özofagogastrik Bileşke\nÖzofagogastrik Bileşke\n•Alt özofagiyal sfnkterin intrinsik basınç kuvvet, •Diafragma kruslarının ekstrinsik basınç kuvvet, •Ösefagusun intraabdominal yerlesimi, •Frenoözofagiyal ligament\n•His açısının sagladıgı “fap valve” mekanizması(His açısının geniş açı olduğu durumlarda mide bir huniye dönüşür ve karın içi basınçta ani bir yükselişte mide içeriğini oesophagus’a geri yönlendirir.\n•His açısı daraldıkça antrefü etkisinin artmaktadır.)\n•Peristaltik hareketler- Özofagus doku direnci Hiatal Herni: Hiatal herni, gastroözefageal bileşke ve diyafragmatik hiatusun normal anatomik ilişkisinin bozulması ile ortaya çıkar. Gastroözefageal bileşkenin pozisyonuna, herni büyüklüğüne ve içeriğine göre hiatal herniler 4 tipe ayrılırlar\nSliding (kayıcı) tip: Midenin kardia denen başlangıç bölgesi göğüs boşluğuna doğru kayar. Rolling (paraözofageal) tip: kardia yerindedir, midenin fundusu göğüs boşluğuna doğru yer değiştirmiştir. Bu tip hernilerde midenin boğulma riski nedeniyle ameliyat endikasyonu vardır. Miks tip: Hem kardia hem fundus yer değiştirmiştir. Cerrahi onarım gereklidir Tip IV hiatal hernide Tip III herniye ek olarak mide ve özefagus dışında başka intra abdominal organlar (dalak, ince veya kalın bağırsak) da herni kesesinin içinde bulunur. en çok transvers kolon ve omentum katılır.\nTip I hiatal herni gastroözefagel reflüye karşı olan doğal bariyeri pek çok açıdan etkiler. Öncelikle Z çizgisinin intratorasik olarak yer değiştirmesi ile diyafragmatik krusların alt özefagus sfinkterine olan desteği kaybolur. Proksimal kardianın da yukarı çekilmesi His açısının da düzleşmesine sebep olacağıiçin reflü fiziksel olarak daha mümkün hale gelir.", "pages": [97, 98]}, {"no": 257, "q": "Bilgisayardan kolonoskopi videosu açıp bu ne demişler (sapsız polip), diğer tipleri ne, malignite düşündüren polipler hangileri(sapsız, çok sayıda, büyük, ülsere, yüzeyi girintli çıkıntılı serrated),", "tip": "Bilgi", "hoca": "Cihangir Akyol", "a": "bilgisayardan kolonoskopi videosu açıp bu ne demişler (sapsız polip), diğer tipleri ne, malignite düşündüren polipler hangileri(sapsız, çok sayıda, büyük, ülsere, yüzeyi girintli çıkıntılı serrated) Saplı polipler, saplar üzerinde büyür, aksine sapsız polipler kubbeler şeklinde düz uzanırlar. Polipektomi sonrası patoloji raporu beklenir ve polipin malign olup olmadığına karar verilip ona göre radikal tedaviye karar verilir. Bu malignite kriterleri:\n- Çap>1cm ( en önemli kriter, 1cm'den küçük polipler de kanserleşme riski %1'ken 1-2 cm'de %9 2cm'den büyüklerde %50'dir.)\n- Dejenerasyon varlığı (sert, ülserasyon, kanama, sapsız(sesil), tabanı oturmuş)\n- Eşlik eden poliplerin olması\n- Distal yerleşimli\n- Villöz komponent", "pages": [98]}, {"no": 258, "q": "Rektum kanseri nereye metastaz yapar, kolon kanseri nereye metastaz yapar, sebebi, venlerin yolu,", "tip": "Bilgi", "hoca": "Cihangir Akyol", "a": "rektum kanseri nereye metastaz yapar, kolon kanseri nereye metastaz yapar, sebebi, venlerin yolu\nKolorektal kanserler 5 şekilde yayılım gösterir:\n- komşuluk yoluyla\n- lenfatik\n- hematojen\n- peritoneal implantasyon\n- lümen içi yayılım.\nKolon venleri v.mezenterica superior ve inferior ile vena portaya açılırlar. Rectum venleri ise proximal 1/3'lük kısmı v.mesenterica inferior ile vena portaya açılırken, distal 2/3'lük kısmı v.ilica interna ve v.pudenda interna venleri ile vena cava inferiora açılır. Her iki kanser de akciğer ve karaciğer metastaz yapar ancak kolon kanseri karaciğere daha çok metastaz yaparken rektum kanseri ise akciğere daha çok metastaz yapar. Çünkü venlerin drenajına göre orta ve distal rektum portossistemik şanta uğramadan direk kaval sistemle akciğere dökülür. Lenfatik drenajlarını ise kolon ve prox. rectum inf. ve sup. mezenterik nodlara yaparken distal rectum nodi iliaci interni ve nodi inguinalis superficialise yapar.", "pages": [98]}, {"no": 259, "q": "Fıtık tipleri, inguinalleri daha detaylı istemiş, spigel hernisinin olduğu hat", "tip": "Bilgi", "hoca": "Cihangir Akyol", "a": "Karın içi organların önlerine peritonu alarak, katın duvarındaki bir delikten veya zayıf bir noktadan deri altına çıkmasına eksternal fıtık denir. Karın içindeki potansiyel boşluklara organların girmesi ile de internal fıtıklar oluşur. Eksternal fıtıklar\n- inguinal fıtıklar (en sık) ,\n- kesi fıtığı da denilen insizyonel fıtıklar (2. sıklıkta) ,\n- umblikal fıtıklar\n- epigastrik fıtıklar\n- diğer fıtıklar (spigel obturator fıtıklar) İnguinal herniler\n- indirekt herni (en sık inguinal herni) : İnguinal kanal iç halkasından girip kanal içinden skrotuma (kadınlarda labiuma) inmeyi hedefler. Sıklıkla konjenital ve gençlerde daha fazla, sıkıla unilateral.\n- direkt herni (2. sıklıkta) : Hasselbach alanından fascia transvetalisin zayıflaması ile oluşur. Kollajen zayıflamasına bağlı ileri yaşta oluşur, sıklıkla bilateral.\n- femoral fıtık : Femoral kanaldan fossa ovalise (v. saphena magnanın v.femoralise açıldığı nokta) çıkan fıtıklar. Kadınlarda daha sık, pelvis yapısına ve canalis femaralisin daha geniş olmasına bağlı.\nSpiegel Herni : Karında semilunar hattın (rectus laterali) linea arcuata altındaki seviyesinde çıkan, sıklıkla interparietal hernilerdir.", "pages": [98, 99]}, {"no": 260, "q": "Karsinoid sendrom nedir, neden olur, kliniği,", "tip": "Bilgi", "hoca": "Cihangir Akyol", "a": "Karsinoid Sendrom; nadir, yavaş büyüyen ve genellikle akciğerlerde ve mide-bağırsak kanalında oluşan karsinoid tümörlerle ilgili bir grup semptomu ifade eder. İşleyen bir nöroendokrin tümöründen salgılanan polipeptitler gibi vücut sıvılarının salgılanması yüzünden oluşan bir hormonal sendrom olarak karakterize edilen nadir bir neoplastik hastalıktır. Bu sendroma sahip bireyler; deri kızarıklığı, karın ağrısı, ishal, nefes almada zorluk, hızlı kalp atışı, düşük tansiyon, yüzde seri yaralar (telenjiektaziler), kilo kaybı veya artışı, peptik ülser, güçsüzlük, kas ve eklem ağrıları ve hırıltılı solunum deneyimleyebilirler. Hastalarda tümör nedeniyle; anemi, hemoptizi, zatürre, öksürük olabileceği gibi hiç semptom vermeden de var olabilir. Sonraki safhalarda, karsinoid sendrom kalp damarlarına zarar verebilir ve bu durum konjestif kalp yetmezliği ile sonuçlanabilir. Bu durum karsinoid tümör kan dolaşımına serotonin ve diğer kimyasalları salgıladığı zaman ortaya çıkar. Karsinoid tümöre sahip hastaların sadece %10’u karsinoid sendroma sahip olur ve bu sendroma sahip bireylerin çoğu karaciğere sıçrayan ileri safhalarda karsinoid tümöre sahiptir. Karaciğere yayılmış tümörü olmayan hastalarda bağırsak tümöründen salgılanan serotonin aktif olmayan maddelere parçalanacağı için karsinoid sendrom oluşmaz. Tedavide genellikle bu sendroma sebep olan karsinoid tümörün yeri anlaşılmaya çalışılır ve semptomlar ilaç tedavisi ile hafifletilir.", "pages": [99]}, {"no": 261, "q": "Kadın hasta umblikal herni, hiatal herni, safra kesesi taşı var bu sendromun adı ne", "tip": "Bilgi", "hoca": "Cihangir Akyol", "a": "kadın hasta umblikal herni, hiatal herni, safra kesesi taşı var bu sendromun adı ne Saint triadı: hiatal herni, kolelitiazis, umblikal herni ve kolon divertiküllerinin birlikte bulunduğu bir sendromdur.( bu nedenle bazı kaynaklarda klinik tetraloji olarak da isimlendirilmiş) Kadın cinsiyet, ileri yaş, obezite, doğum yapmış olmak, diyet ve fiziksel aktivite risk faktörleri arasındadır.", "pages": [99, 100]}, {"no": 262, "q": "Lateral aberrant tiroid nedir?, papiller tiroid kanseriymiş ?, tiroid ca tipleri sınıflaması, tiroid ca kimde kötü seyreder", "tip": "Bilgi", "hoca": "Selçuk Hazinedaroğlu", "a": "lateral aberrant tiroid nedir?, papiller tiroid kanseriymiş ?, tiroid ca tipleri sınıflaması, tiroid ca kimde kötü seyreder,(ileri yaş, erkek, büyük tümör, uzak metastaz, ileri evre). Lateral Abberant Tiroid = Papiller Tiroid Kanseri Tiroid kanserleri en sık endokrin kanserlerdir. Difernasiye (folliküler hc.lerden kaynaklanır) : - Papiller (%80)\n- Folliküler (%10)\n- Hurthle (%3)\nUndiferansiye\n- Anaplastik (%1) (insan vücudundaki en agresif tümörlerden)\n- Lenfoma\n- Metastatik\n- Medullar (%5)\nPTK kötü prognoz\n- 20 yaş altı 50 yaş üstü\n- erkek cinsiyet\n- aile öyküsü\n- çocuklukta rx öyküsü\n- kapsül dışına taşan lokal invazyonu tümör - agresif alt tipler ve az Difernasiye tümör - çap>4cm\n- multifokal olması\n- LN metastazı\nFolliküler kanserde kötü prognoz\n- yaşın 50 üstü olması\n- nodülün 3 cmden büyük olması.\n- yüksek grade\n- belirgin vasküler invazyon\n- tiroid dışına yayılım\nMedullar karsinomda iyiden kötüye prognoz: ailesel non MEN > ailesel MEN IIA > Sporadik > ailesel MEN IIB", "pages": [100]}, {"no": 263, "q": "Herediter ailesel kolorektal kanserler neler", "tip": "Bilgi", "hoca": "Selçuk Hazinedaroğlu", "a": "herediter ailesel kolorektal kanserler neler Kolorektal kanserlerin %4'ü LYNCH (HNPCC) sendromu %1'i FAP olmak üzere %5'ini herediter kanserler oluşturuyor.\nLYNCH Sendromu ( Herediter Non Polipozis Kolorektal Kanserler- HNPCC)\n- FAP'ta olduğu gibi yüzlerce polip gözlenme diği için non polipozis denmiştir ancak Sporadik kanserleden daha çok polip içerir.\n- Genellikle 50 yaş öncesi görülür.\n- Mismatch repair gen mutasyonları sonucu oluşur.\n- Bu hastalar over, uterus, mide, ib ve böbrek kanseri riski taşır.\n- Bu hastaların birinci derece akrabalarında kolon kanseri 7 kat, meme kanseri 5 kat risk teşkil eder. - Bu kanserler genellikle sağ kolon da bulunur. - Sporadik kanserlere göre prognozu daha iyidir. - Hastaların birinci derece akrabalarına 20 yaşından itibaren iki yılda bir tarama amaçlı kolonoskopi yapılmalı.\n- Tüm kolonu tutma riski olduğu için tedavide total kolektomi yapılır. Bazı hastalarda rektum da etkilenmiş olabilir, bu noktada da ileoanal poş ameliyatı yapılır.\nFAP\n- Kalın bağırsağın içinde yüzlerce, binlerce adenomatöz polip gelişimi ile seyreden kalıtsal bir hastalıktır.\n- APC gen mutasyonu sonucu oluşur. OD ya da %30 spontan gelişebilir.\n- 20'li yaşlarda polip 40'lı yaşlarda kanser gelişimi\n- Fap hastalarında 35 yaş ve öncesinde bağırsaktan yüzlerce polip görülme olasılığı %95'tir. Yaş ilerledikçe kanser riski artar. FAP hastalarında bağırsak kanseri gelişme riski %100'dür\n- Aile hikayesi varsa ailede 12 yaşın üzerinde çocuklarda tarama yöntemlerine başlanır. (Ayhan Kuzu sitesinde bu şekilde, bazı hocalar 16-20 demişti)\n- Polipler temizlemek mümkün olmadığı, temizlense de yeniden çıkacağı için hastada total kolektomiye gidilir.", "pages": [100, 101]}, {"no": 264, "q": "Men1 ne", "tip": "Bilgi", "hoca": "Selçuk Hazinedaroğlu", "a": "Multiple Endokrin Neoplazi Tip 1 ( MEN 1) - Wermer Sendromu\n- Otozomal dominant kalıtım gösteren, nadir rastlanan bir hastalıktır. Benign ya da malign olabilir, fonksiyonel veya non fonksiyonel olabilir.\n- MEN1 geni tümör supressör gendir.\n- Paratiroid hiperplazisi (en sık) ve adenomu, ön hipofiz adenomu, pankreas adacaık hiperplazisi, adenomu ve karsinom, adrenal korteks hiperplazisi\n- Hastada paratiroid nedeniyle hiperkalsemi ve metastatik kalsifikasyonlar; pankreas nedeniyle Zollinger Ellison Sendromu, hiperglisemi, anemi, venoz tromboz, diyare; hipofiz nedeniyle prolaktioma, oligımenore, amenore, galaktore, erkeklerde cinsel sorunlar ve jinekomasti; adrenal nedeniyle Cushing sendromu ve hiperaldosteronizm; deride oluşan tümörler; menangioma, ependimoma; karsinoid tümörler görülebilir.", "pages": [101]}, {"no": 265, "q": "Anevrizmanın tanımı, çeşitleri, aort kaç cm, kaç cm genişlerse anevrizma olur, gerçek ve psödo detaylıca anlat, anevrizmanın komplikasyonları, psödoanevrizma en sık hangi arterde görülür, neden orda görülür(fe moral arter, anjiyo için giriş yapılırken),", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Bir arterin çapının %50’den fazla genişlemesi Aortailiak anevrizmalar, periferik arter anevrizmaları, visseral arter anevrizmaları Aort yaklaşık 2-2.5 cm çapındadır. Aort çapının 3 cmden büyük olması anevrizma demek için gereklidir.\nBir damar yapısı 3 tabakadan oluşur (t. İntima, t. Medya, t. Advantisya) Gerçek anevrizmaların duvar yapısı bu 3 tabakayı da içerir. Psödoanevrizmada ise genellikle bir travma sonrası kan medya tabakası içine dolar.", "pages": [101, 102]}, {"no": 266, "q": "Safra kesesi taşı komplikasyonları görülme sıklığına göre,", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "Akut kolesistit, kronik kolesistit, koledokolitiazis, kolanjit, internal bilier fistül, pankreatit, safra kesesi kanseri", "pages": [102]}, {"no": 267, "q": "İnce bağırsak malign tümörleri neler (adenokarsinoma, net, gist, lenfoma vb.) hoca karsinoid tümör ne yapar diye sormuş karsinoid sendrom nasıl gelişir", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "Adenokarsinoma (en sık), leiomyosarkoma, lenfoma, karsinoid tümör\nKarsinoid sendrom %95 karaciğer metastazına bağlı, %5 portal dolaşımı bypass eden lokalizasyondaki primer tümörlere (retroperitoneal-over) bağlı oluşur. karsinoid tümör karsinoid sendrom yapar\nBu sendroma sahip bireyler; deri kızarıklığı, karın ağrısı, ishal, nefes almada zorluk, hızlı kalp atışı, düşük tansiyon, yüzde seri yaralar (telenjiektaziler), kilo kaybı veya artışı, peptik ülser, güçsüzlük, kas ve eklem ağrıları ve hırıltılı solunum deneyimleyebilirler.\nBu durum karsinoid tümör kan dolaşımına serotonin ve diğer kimyasalları salgıladığı zaman ortaya çıkar. Karsinoid tümöre sahip hastaların sadece %10’u karsinoid sendroma sahip olur ve bu sendroma sahip bireylerin çoğu karaciğere sıçrayan ileri safhalarda karsinoid tümöre sahiptir. Karaciğere yayılmış tümörü olmayan hastalarda bağırsak tümöründen salgılanan serotonin aktif olmayan maddelere parçalanacağı için karsinoid sendrom oluşmaz", "pages": [102]}, {"no": 268, "q": "Aort anevrizmalı hasta videosu göstermiş, karnında garip bir pulsasyon var, bu nedir, aort anevrizması en sık nerde görülür, aort anevrizması ameliyat endikasyonları, aort anevrizması tanısı nasıl konur, ameliyat edilmezse komplikasyonları,", "tip": "Bilgi", "hoca": "Cüneyt", "a": "Aort anevrizmalarının çoğu infrarenal aortada lokalize olur.\nEndikasyonlar: Semptomatik aaa, Komplikasyon oluşturmuş aaa, Rüptüre aaa, Rüptür riski yüksek anevrizma: >5.5 cm çap\nTanı: Muayene bulguları= Pulsatil kitle, üfürüm, distal iskemi\nUSG(Daha çok bununla tanı konur), BT- anjiografi, MR- anjiografi, DSA( katater ile arteriografi)(bu çok tercih edilmez). Ameliyat edilmezse %80 retroperitona, %20 peritona rüptür riski vardır.\n!!Rüptür riskini artıran faktörler: çap>5,5 cm, hipertansiyon, sigara, aile öyküsü büyüme hızı (yılda >10 mm büyüme), kadın cinsiyet (anevrizma oluşma riski erkekte yüksek, rüptür riski kadında!)\nKomplikasyonlar: rüptür, tromboz, distal emboli, bası, av fistül\nAoraenterik fistül olursa ,Gis kanaması görülür. Çoğu AEF, sekonder ve geçirilmiş aortik operasyonun –genellikle aortik greft yerleştirilmesi- komplikasyonu olarak kabul edilir. Genellikle abdominal aort anevrizmasının duedonumla bağlantısını içerir.", "pages": [102, 103]}, {"no": 269, "q": "Künt travma yönetimi, kanama nasıl tespit edilir,", "tip": "Bilgi", "hoca": "Salim Demirci", "a": "Künt travmalarda sıklıkla yaralanan organlar dalak ve karaciğerdir.\nFizik incelemede karın ağrısı, duyarlılık, defans, rebound varsa laparotomi gerekebilir. Hipotansiyon, taşikardi ve postural hipotansiyon karın içi kanamayı düşündür, hasta ajiditedir. Lab incelemelerinde hb, hematokrit düzeylerine bakılır ve lökosit sayımı yapılır. Serum amilazı yükselebilir. İdrar tetkiki yapılır. Nazogastrik sonda konur. Kan gazlarına bakılır. Radyoloji 1/3 olguda yardımcı olabilir. Parasentez oldukça yardımcıdır, pozitif olması anlamlıdır. Öykü alınamayan veya güvenilir fizik inceleme yapılamayan durumlarda, açıklanamayan hipotansiyonda, negatif parasentez durumunda, karın travması ile sıklıkla birlikte olan bulgular: hematüri, alt kosta kırıkları, lumbar vertebra kırıkları ve pelvik kırıklar varlığında peritoneal lavaj yapılabilir. Tanıda ayrıca arteriografi, sintigrafi ve bt kullanılabilir. Karın içi yaralanma saptanan hastaların tedavisi cerrahidir. Hastalar İntraperitoneal bulgular yönünden 24-48 saat gözlenmelidir.", "pages": [103]}, {"no": 270, "q": "Hemoroid nedir, hemoroid ilgili sorular", "tip": "Bilgi", "hoca": "Salim Demirci", "a": "Hemoroidler; anal kanala yerleşmiş içinde venül, arteriol ve düz kas lifleri bulunan submukozal yastıklardır.", "pages": [103]}, {"no": 271, "q": "Anal kanserler neler, tedavileri nasıl,", "tip": "Bilgi", "hoca": "Salim Demirci", "a": "Kondloma akumilata(kanser değil ama eğilimi var): Podofilin, İmiquimod, triklor asetik asit ve 5 florourasil\nAnal epitelyal neoplazi(Bowden Hastalığı) : Geniş lokal eksizyon\nEpidermoid karsinom: Anal kanalda veya sfinkterleri invaze eden epidermoid karsinomlar lokal olarak eksize edilemezler ve ilk aşamada tedavi kemoterapi ve radyoterapiye dayanır. Bu tümörlerin %70-80’ den fazlası bu tedavi ile kür edilebilir. Nüks gelirse genellikle radikal rezeksiyon( abdominoperineal rezeksiyon) gerekir.\nVerrükoz karsinom: Geniş lokal eksizyon ile tedavi edilir. Çok büyük lezyonlarda radyoterapi uygulanabilir.\nBazal hücreli karsinom: Tedavi geniş lokal eksizyon. Büyük lezyonlarda radikal rezeksiyon veya rt verilebilir.\nAdenokarsinom: Tedavi adjuvan kt, yapılamazsa radikal rezeksiyon\nMeme dışı paget hastalığı: Tedavi geniş lokal eksizyon\nMelanom: Tedavide ilk tercih geniş lokal eksizyondur ama radikal rezeksiyon da yapılabilir.", "pages": [103, 104]}, {"no": 272, "q": "Yassı hücreli kanseri kemoterapiyle nasıl tedavi ederiz", "tip": "Bilgi", "hoca": "Salim Demirci", "a": "?", "pages": [104]}, {"no": 273, "q": "Anal apseli hasta hangi şikayetlerle gelir semptomları, tedavisi, antibiyotik gerekir mi, anal apse nasıl oluşur, tedavi edilmezse ne olur, fistül nedir, fistülü olan hasta hangi şikayetlerle gelir semptomları, tedavi etmezsek ne olur,", "tip": "Bilgi", "hoca": "Nezih Erverdi / Cihangir Akyol", "a": "Anorektal apse: ağrı,şişlik,kızarıklık ,sıcaklık,fluktuasyon,hassasiyet,deri nekrozu, perianal endürasyon,krepitasyon, sistemik bulgular görülebilir. Tedavisi drenajdır. Antibiyotik selülit, immünsupresyon, diyabet, kalp hastalığı söz konusu ise endikedir. Sebep genellikle anal bezlerdeki infeksiyondur. Fistül bir organla başka bir yapı arasında oluşan anormal non anatomik bağlantıdır. Anal fistülün en sık nedeni anorektal apselerdir. travma, crohn, kanser, radyasyon,bazı enfeksiyonlar da sebep olabilir. Hastaların anal bölgede ağrı, şişkinlik, ateş, dolgunluk hissi, dışkılama sorunu, kaşıntı,akıntı,yanma,iç çamaşırlarda kirlenme gibi şikayetleri olur. Tedavideki amaç iltihabı ve fistülü engellemektir, nüksü önlemektir, dışkı kontrolünün bozulmamasını sağlamaktır. Tedavide fistülotomi,traktın küretajı veya koterlenmesidir. Ayrıca traktın tamamen çıkarılmasıyla fistülektomi, seton yapılabilir.", "pages": [104]}, {"no": 274, "q": "Anal fissür nedir , kronik akut ayrımı nasıl yapılır, akut ve kroniğin tedavisi, neden botoks yaparız, kronik fissür tedavisinde NO derivelerinin yan etkisi nedir,", "tip": "Bilgi", "hoca": "Nezih Erverdi / Cihangir Akyol", "a": "Anal fissür: Anal kanalı döşeyen çok katlı yassı hücreli epitelde dentat çizginin altında gelişen longitudinal yırtıktır. Akut kronik formu vardır. Akut formda yüzeyel bir yırtık vardır ama çok ağrılıdır. Dışkılamayı takiben damlar tarzda kanama olur. Her insanda konstipasyon ve bazen diyare atakları sonrası gelişebilir.\nKronik form derin ve inatçıdır. Lezyon çevresi kronik inflamasyon sebebiyle kabarıktır. 6-8 haftadan uzun süren ağrı semptomu vardır. Kronik anal fissürün 3 bileşeni vardır: hipertrofik anal papilla,derin ülser, sentinel skin tag(nöbetçi meme)\nTedavide öncelikle sıcak oturma banyosu, laksatifler, lokal anestezik pomadlar, posalı yiyecekler,su içilmesi önerilir. İyileşme sağlanamazsa topikal nitrogliserin(no donörü),arjinin(no kaynağı), kalsiyum kanal blokörleri, muskarinik agonistler kullanılır. Botulinium toksini enjekte edilebilir. Botox haftalarca süren paresteziye neden olur ve bu süreçte anal kanal basıncını düşürerek perfüzyonu iyileştirir. Bu da fissür iyileşmesini olanaklı kılar.\nAkut fissürlerde konservatif tedavi oldukça fayda sağlar. Kronik fissürde konservatif tedavi faydası azalır. Kronik fissürlü hasta gliseril trinitrat(nitrogliserin), botox ve sfrinkterotomiden fayda görebilir.\nNo donörleri internal anal sfinkter basıncını azaltarak anodermal kan akımına olumlu katkı sağlar. Non adrenerjik non kolinerjik mekanizma ile etki eder. Sfinkterde hasar oluşturmaz. Ancak genel olarak hastaların %20-25'inde baş ağrısı gelişir. Bu etki muhtemelen sistematik yoldan damar duvarında da gevşeme oluşturması sonucu gelişir. Baş ağrısı belirgindir ancak kısa sürelidir. Analjeziklere yanıt verir.\nHiçbir yöntem işe yaramazsa lateral internal sfinkterotomi yapılır. Altın standarttır ancak algoritma sırasına uyulur.", "pages": [104, 105]}, {"no": 275, "q": "Derin ven trombozlu hasta fotoğrafı gösterip bu ne demişler, dvt risk faktörleri, dvt'li hasta neden tedavi edilmeli, dvtde beyin embolisi nasıl gelişir, bu embolinin özel adı nedir, hastada hangi damar tıkanır, kronik arter yetmezliği bulguları, dvt'li hastada ampütasyon ne zaman gerekir, hastanın bacağı morarıp şişerse buna ne ad verilir,", "tip": "Bilgi", "hoca": "Cüneyt", "a": "Dvt risk faktörleri:\nstaz,endotel hasarı,hiperkoagülopati. Tedavideki amaç : pulmoner embolinin engellenmesi, nüksün engellenmesi,alt ekstremite semptomlarının azaltılması, kronik venöz yetnezliğin ve ülserin engellenmesi.\nBeyin embolisi nasıl gelişir özel adı??? İskemik stroke??inme?? serebral emboli genellikle kalp,üst göğüs ve boyundaki büyük arterlerde oluşan bir kan pıhtısıdır. Gevşer dolaşıma geçer ve atrial fibrilasyon gibi nedenlerle beynin küçük damarlarına ulaşır. middle serebral arter en çok tıkanan yerdir. (carotis internanın dalı) Kronik arter yetmezliği bulgukarı: kladikasyo,istirahat ağrısı,uçlarda ya da deride gangren,iskemik yara,empotans\nDvtli hastada plegmasia cerulae dolens gelişirse uygun tedaviye rağmen trombotik sürecin ilerlemesiyle gangren,amputasyon,ölümle sonuçlanabilir\nHastanın bacağı morarır şişerse? Phlegmasia cerulae dolens: etkilenen segmentin venöz yolları tıkanmış, arteriyal vazospazm var, kollateraller yaygın olarak tutulmuş, nabız gitmiş,bacak mavi mor,ödemli.", "pages": [105, 106]}, {"no": 276, "q": "Kolorektal kanser sebepleri, polipten adenokanser gelişime yolu mutasyonlarıyla, sağ kolon ve sol kolon kanseri bulgularındaki farklar", "tip": "Bilgi", "hoca": "Salim Demirci", "a": "Kolorektal kanser sebepleri:\nYaş: vakaların %90 ı 50 yaş üstündedir. En sık 60-70 yaşlar\nSigara, alkol, obezite, yağdan zengin beslenme,vitamin ve liften fakir diyet, ailede kolon kanseri öyküsü, akromegali, iltihabi bağırsak hastalıkları, hnpcc, kolesistektomi, meme over uterus kanserleri, tip2dm, üreterosigmoidostomi ve pelvik radyasyon uygulanması, 10 yıldan fazla olan ülseratif kolit,kolon polipleri hikayesi\nSağ kolonun çapı daha geniştir bu nedenle obstruksiyon bulguları daha nadirdir. Daha çok ele gelen kitle,sağ alt kadran ağrısı, gaitada gizli kan pozitifliği,hipokrom mikrositer anemi bulguları görülür.(anemi ön planda) ileoçekal valv bölgesi tutulumunda yaygın distansiyon, karın ağrısı, bulantı,kusma olur. Sol kolon tümörlerinde obstruksiyon ön plandadır ve rektal kanamayla beraber hematokezya görülebilir.\nApc dna hipomet. kras dcc kaybı\nNormal epitel------> hiperproliferatif epitel----- >erken adenom----->intermediate adenom------ >geç adenom----->kanser\nP53 mut.", "pages": [106]}, {"no": 277, "q": "İBH’ları nelerdir? Detaylı olarak ve karşılaştırmalı anlatınız. Ameliyat endikasyonları nelerdir?", "tip": "Bilgi", "hoca": "?", "a": "Inflamatuar bağırsak hastalıkları: crohn,ülseratif kolit,indetermine kolit. Ülseratif kolit erkeklerde daha sık.en erken bulgusu mukozal ödem. kript abseleri spesifik. Hastalık segmenter değildir. Psödopolipler yaygın.fibrozis olur bu nedenle haustral yapılar kaybolur. Kanama en sık komplikasyondur. Diğer komplikasyonlar: kanama,obstruksiyon,perforasyon,parakolik abse,perianal fistül,malabsorbsiyon.\nAkut cerrahi: perforasyon, peritonit, toksik megakolon, fulminan kolit, kanama.\nElektif cerrahi: maximal tıbbi tedaviye yanıt alamama, steroid yüksek doza bağlı komplikasyonlar, biopsilerde displazi saptanması.\nCrohn:en sık ileum tutulur. En erken lezyonlar aftöz ülserlerdir. Nonkazeifiye granülomlar spesifik. Fibrozis ve darlıklar olur. Transmuraldir. karın ağrısı semptomları sık görülür. hastalıksız alanlar vardır radyolojik olarak kaldırım taşı görüntüsü oluşur. Komplikasyonları en sık obstruksiyon daha sonra intraabdominal apse,internal fistül,perforasyon,kanama,perianal abse ve fistüldür. Cerrahi endikasyonları:akut başlayan ciddi hastalık,medikal tedaviye yanıtsızlık(en sık ) hastalığa bağlı komplikasyonlar.", "pages": [106, 107]}, {"no": 278, "q": "Hemoroid tipleri nelerdir?", "tip": "Bilgi", "hoca": "?", "a": "Hemoroidler internal ve ekstarnal tipte olabilir. Internal hemoroidler 4 tiptir.\n1. derece: ağrısız kanar\n2. derece: ağrısız kanar, prolabe olur,spontan redükte olur\n3. derece:ağrısız kanar,prolabe olur,elle redükte olur\n4. derece:kanar,prolabe olur,redükte olmaz. Eksternal hemoroidler inferior rektal venlerin dilatasyonu sonucu gelişir. Genelde asemptomatiktir. Tromboze olursa ağrılı olur.", "pages": [107]}, {"no": 279, "q": "Üst GİS kanaması.", "tip": "Bilgi", "hoca": "?", "a": "Üst gis kanaması:\nKanamaların %85i üst gis kaynaklıdır. Sebepleri: Peptik ülser(%40-50),hemorajik gastrit(%20), özofagogastrik varisler,portal gastropati,özafajit,özofageal ülserler(barret ülserleri),diğer özofajitler(hap,radyasyon vs.),mallory weis yırtığı, anjiyodisplaziler, dielafoy erozyonu,duodenal divertiküller, maligniteler...\nKesin tanı endoskopi ile konur. Hasta hemodinamik stabil ve şuurlu olmalıdır. Tedavisinde ampirik olarak ppi ve h2 reseptör antagonistleri verilebilir. Portal hipertansiyon bulguları varsa vazopressörler kullanılır. Endoskopik olarak termal tedavi, skleroterapi, varislerde bant ligasyonu yapılabilir. Mekanik kompresyon(balon tamponadı), terapötik anjiyografi ve cerrahi yapılabilir.(kanaması durdurulamayan hastalarda, şok durumuna giren hastalarda, riskli endoskopik bulguları olan hastalarda,fazla transfüzyon gerektiren hastalarda)", "pages": [107, 108]}, {"no": 280, "q": "Transplantasyonda en yüksek tolerojeniteye sahip organ hangisidir?", "tip": "Bilgi", "hoca": "?", "a": "En tolorojen organ böbrektir. 40-50 saat güvenle saklanabilir. En hassas organ kalptir. 5 saat içinde transplante edilir. (?????)", "pages": [108]}, {"no": 281, "q": "Melena nedir, melana yapan hastalıklar önem sırasına göre, Hangi hastalıklarla karışabilir, Melenalı gelen hastada anamnezde ne sorarsın, fizik muayenedeneye bakarsın", "tip": "Bilgi", "hoca": "Salim Demirci", "a": "• Melena: Sindirilmiş kan içeren, katran gibi siyah, cıvık ve pis kokulu bir gaitadır.\n• Melena şeklinde dışkılama genellikle üst Gİ kanamalarda görülür. Ancak, ince bağırsaklar ve kolonun proksimal düzeylerinden olan kanamalarda da melena görülebilir. En az 50 ml. kan melena yapabilir. 1000 ml.’lik kanama 5 gün melena yapabilir.\nYemek Borusu (Özofagus) Varisleri: Siroz hastalığı gibi bazı durumlarda yemek borusunda bulunan toplardamarların genişlemesi, özofagus varislerine yol açabilir. Genişleyen bu damarlarda bir yırtılma olduğunda ciddi kanamalar söz konusu olabilir. Yemek borusuna akan kan, dışkı yoluyla atılacağından siyah renkli dışkılamaya neden olur. Dışkıya ek olarak ağız yoluyla da atılan kandan kaynaklı olarak kanlı kusma (Hematemez) sorununun görülme olasılığı oldukça yüksektir.\nGastrit: Midenin iç yüzeyini kaplayan tabakada oluşan iltihaplanmalar, gastrit olarak adlandırılır. Sigara ve alkol kullanımı, Helicobacter Pylori adlı bakterinin neden olduğu enfeksiyon, sağlıksız ve aşırı baharatlı gıdalar ile beslenme gibi nedenlerden kaynaklanabilen akut ya da kronik gastritler, mukozal hasara neden olarak midede kanamaya yol açabilir. Bu durumda siyah renkli dışkılama sorunu ortaya çıkması muhtemeldir.\nÖzofajit: Yemek borusunun iç yüzeyindeki mukoza katmanında meydana gelen bir enfeksiyon veya mideden özofagusa asit reflüsü nedeniyle oluşan erozyon ve ülserler özofagusta kanamaya yol açarak melena görülmesine neden olabilir.\nMide Ülseri: Peptik ülser olarak da adlandırılan mide ülserleri, midenin iç yüzeyinde oluşan yaralardır. En yaygın nedeni gastrite de yol açan Helicobacter Pylori adlı bakterinin enfeksiyonu olsa da farklı nedenlerden kaynaklı olarak gelişen mide ülserleri, tedavi edilmediğinde ciddi kanamalara neden olabilir. Bu durum melenayı da beraberinde getirir.\nBasınç Kanamaları: Şiddetli öğürme, kusma, öksürük gibi nedenlerle karın içi basıncında ani ve şiddetli artış sonucu yemek borusunun mide ile birleştiği bölgede yırtılmaya ve dolayısıyla kanamaya neden olabilir. Bu tür kanamalarda melena önemli bir bulgudur.\nÇeşitli İlaçlar: Ağrı kesici ve antiinflamatuar ajan olarak çok sık şekilde kullanılan non- steroid (steroid olmayan) antiinflamatuar ilaçlar, vücutta kanama eğilimini artırır. Aynı şekilde kan sulandırıcı, pıhtılaşma önleyici veya antikoagülan olarak adlandırılan ilaçlar da kanama eğilimini artırır. Bunlardan kaynaklı olarak özellikle de gastrit, mide ülseri gibi hastalıkları olan bireylerde, uzun süre non- steroid inflamatuar ilaç veya antikoagülan ilaç kullanımı sonucunda gastrointestinal kanamalar gerçekleşebilir, ek olarak dışkıda siyah renk de gözlenebilir. Böyle bir durum görüldüğü takdirde ilacın bırakılması gerekebileceğinden derhal hekime danışılmalıdır.\nGastrointestinal Sistem Kanserleri: Sindirim sisteminde oluşan tümörler, gastrointestinal sistem kanamalarının bir diğer önemli nedenidir. Özellikle bağırsakların başlangıç kısmında, özofagusta ve midede oluşan tümörlerde kanama oluşması halinde dışkıda siyah renk görülmesi muhtemeldir.\nYenidoğanlarda Anne Kanının Yutulması:\nYeni doğmuş olan bebeklerde ilk birkaç gün siyah renkli dışkılama görülmesi doğaldır. Bu durum doğum esnasında bebeğin anne kanını yutmasından kaynaklanır. Genellikle birkaç gün içerisinde iyileşen bu durum eğer daha uzun bir süre boyunca devam ederse hekime danışılmalıdır.\nAnamnezde dikkat edilmesi gerekenler şunlardır:\n*Kanamanın özellikleri Kanamanın yeri (Üst? Alt?)\nKanama ciddiyeti Kanamanın şekli, süresi ve sıklığı Son 24-48 saat içindeki dışkılama sayısı kanama derecesinin tahmini için yardımcı olabilir.\nFM’de• Hastanın bilinç, turgor, tonus, anemi, deri, solunum durumu, kan basıncı ve nabız bulguları değerlendirilmelidir. • Az miktarda kanaması olan, genç bir hastanın genel durumu iyidir ve hasta sadece melena tanımlayabilir. • Fazla miktarda kanamış hasta ise şok tablosu içinde getirilebilir.\n• Masif kanama işaretleri: Hipotansiyon, taşikardi, nabız basıncında daralma, taşipne, hipovolemiye sekonder paradoksal bradikardi • Bu nedenle kanamanın şiddeti ve hastanın yaşı, birlikte olan hastalıklar FM bulgularını etkiler", "pages": [108, 109]}, {"no": 282, "q": "Boerhave sendromu nedir? Boerhave nerede yerleşir? Boerhave sendromunda komplikasyon nedir", "tip": "Bilgi", "hoca": "Salim Demirci", "a": "Boerhaave sendromu, şiddetli kusmalara bağlı olarak özofagusun spontan rüptürüdür. Boerhaave sendromunun kliniği silik olabildiği gibi Mackler triadı ile de ortaya çıkabilir: 1. Kusma ve sonrasında,\n2. Göğüs ağrısı\n3. Özofagus rüptürüne bağlı cilt altı amfizem. Bununla birlikte, klinik - semptomlar ile rüptürün yeri arasında önemli bir bağlantı vardır.\n• Boerhaave sendromunda özofagus rüptürü en sık, özofagusun distal (alt) ⅓ lük bölümünün posterolateralinde oluşur, buradan sol plevral boşluğa açılır.\n• Üst torasik veya orta özofagus perforasyonları, sağda plevral efüzyon veya hidropnömotoraks üretme eğilimindedir.\n• Servikal rüptürler genellikle daha lokalize olur ve retroözofageal boşluktan mediastene yayılma yavaş ve sınırlıdır.\nToraks içi özofagus perforasyonları, mediastene akan mide içeriğinden dolayı mediastinal inflamasyon (mediastinit), amfizem veya nekroza yol açar.", "pages": [109, 110]}, {"no": 283, "q": "Malory weiss yırtığı nerede yerleşir?", "tip": "Bilgi", "hoca": "Salim Demirci", "a": "Özofagus distalinde ve mide proksimalinde uzunlamasına mukozal laserasyon gelişmesidir.", "pages": [110]}, {"no": 284, "q": "İnguinal fıtıklar nelerdir, hangi kanallardançıkarlar? Hasselbach üçgeni sınırları", "tip": "Bilgi", "hoca": "Ethem Geçim", "a": "İnguinal fıtıklar:\na) İndirekt inguinal fıtık:\nİnguinal kanal içerisinde seyreden, skrotuma inmeyi hedefleyen fıtıklardır. Her iki cinsiyette de en sık görülen fıtıklardır. (Erkeklerde daha sık)\nSpermatik fasyanın tüm katmanları tarafından sarılmıştır. (Direkt hernilerde eksternal katman sadece)\nİnternal inguinal halkadan inguinal kanala girer, eksternal inguinal halkadan çıkarak skrotuma kadar iner. (Direkt hernilerde sadece eksternal halkadan girer) (Kadınlarda round ligamenti takip ederek labiuma iner)\nKonjenital sebeplidir. Patent processus vaginalis denilen yenidoğanda kaybolması gereken periton katlantısının kaybolmaması sebebiyle oluşur ancak tek bu yeterli değildir. Üstüne ağır kaldırma ve ıkınma gibi basınç artışı eklenince fıtık oluşur. Yani hemen bebek doğduğunda fıtık olmaz (eğer mekanik ventilasyona bağlanırsa veya herhangi bir sebeple basınç artışından bebekte de fıtık gelişir), zaman ilerledikçe erişkin çağda patent processus vaginalisi olan ve risk faktörlerini sağlayanlar fıtık geliştirir. Genellikle sağ taraflıdır. (Patent processus vaginalis genelde sağda oluyor)\nGenellikle bilateral.\nb) Direkt inguinal fıtık:\nFıtık hasselbach üçgeninden protrüze olur. Eksternal halkadan girer. (vs indirekt) Eksternal spermatik fasya ile sarılıdır. (vs indirekt)\nSkrotuma inmez. (vs indirekt)\nHasselbach üçgeninin tabanı olan transversalis fasyanın zayıflamasıyla ortaya çıkar daha çok yaşlı insanlarda görülür. (vs indirekt: konjenital). Genellikle unilateral.\nHasselbach Üçgeninin Sınırları\n• Dışta arteria epigastrica inferior.\n• İçte musculus rectus abdominis.\n• Aşağıda ligamentum inguinale.", "pages": [110, 111]}, {"no": 285, "q": "Asemptomatik safra kesesi taşına yaklaşım", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "kolesistit, kolanjit, pankreatit, safra kesesi kanseri gelişme riski var.\nyüksek risk faktörleri: 55 yaştan büyük olunması,\n20 yıldan fazla hayat beklentisi olması, sigara içilmesi, kadın cinsiyet olması, kilolu olunması, 2 ya da daha fazla safra kesesi taşı\nolması, yüzen safra kesesi taşlarının olması, 2 cm’den büyük ya da 3 mm’den küçük taş\nve sistik kanalın açık olması, non fonksiyone safra kesesi olması ve peroperatif insidental taşların saptanması, asemptomatik safra kesesi taşlarının semptomatik hale gelmesi ya\nda komplikasyon gelişmesi açısından yüksek risk teşkil etmektedir\nSafra kesesi taşına eşlik eden 1 cm’den büyük polip varlığı, porselen kese ve 3 cm’den büyük safra kesesi taşının olması, safra kesesinin taşla dolu olması ve insidansın yüksek görüldüğü yerleşim yerlerinde yaşanması safra kesesi kanseri gelişimi açısından yüksek risk teşkil etmektedir. Güncel literatürde safra kesesinde taş olmadan, 1 cm’in altındaki sadece poliplerin olması durumunda asemptomatikse sadece takip önerilirken beraberinde taş olduğunda semptom oluşturup oluşturmamasına bakılmaksızın kolesistektomi\nönerilmektedir", "pages": [111]}, {"no": 286, "q": "Ben hangi dersi anlattım?", "tip": "Ters köşe", "hoca": "Volkan Genç", "a": "Sürrenal bezin cerrahi hastalıkları ve obezite cerrahisi dersini anlattı(volkan genç)", "pages": [111]}, {"no": 287, "q": "Obezite cerrahisinde hastaların zayıflamasında neyin rolü büyüktür?", "tip": "Bilgi", "hoca": "Volkan Genç", "a": "Obezite cerrahisi, bariatrik cerrahi ya da metabolik cerrahi, mide ve ince bağırsaklarda cerrahi değişiklikler yapılarak, kişinin yemesini sınırlayan ve gıdaların eminimini azaltan böylece kilo vermesini sağlayan ameliyatlardır. Cerrahinin, obezlerde en etkili tedavi yöntemi olduğu kanıtlanmış bir gerçektir.", "pages": [111]}, {"no": 288, "q": "20 yaşında hasta hipertansiyonlu acile geldi neden şüphelenirsin?", "tip": "Olgu", "hoca": "Volkan Genç", "a": "Böbreklerin enfeksiyonları, taşları, böbrek damar hastalıkları, böbrek üstü bezi hormonlarının anormal çalışması, tiroid bezi bozukluklarından şüphelenirim.", "pages": [111]}, {"no": 289, "q": "Hiperaldosteronizmin tiplerini söyle.", "tip": "Bilgi", "hoca": "Volkan Genç", "a": "1- Primer Hiperaldosteronizm (conn sendromu):\na-aldosteron salgılayan adenoma\nb-adrenal hiperplazi ile giden idiyopatik hiperaldosteronizm\n2- Sekonder hiperaldosteronizm:\na-renal arter stenozu\nb-siroz\nc-konjestif kalp yetmezliği sonucu", "pages": [111, 112]}, {"no": 290, "q": "Katekolamin reseptörlerini say, hangisi nasıl etki eder? Katekolamin sentezini anlat.", "tip": "Bilgi", "hoca": "Volkan Genç", "a": "alfa1: vasküler/GİS düz kas kontra
