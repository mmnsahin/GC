ksiyonu, kc’de glikojenoliz-glikoneogenez, intestinal düz kaslarda relaksasyon, kalpte artmış kontraktil güç-aritmi.\nAlfa2: pankreasta azalmış insülin sekresyonu, trombosit agregasyonu, sinirden azalmış NE salınımı, vasküler düz kas kontraksiyonu. Beta 1: kalpte artmış kasılma hızı ve gücü, artmış AV nodal ileti. Jukstagromerüler hücrelerde artmış renin sekresyonu.\nBeta 2: düz kaslarda relaksasyon, iskelet kasları ve kc’de glikojenoliz.\nBeta3 : yağ dokusunda lipoliz.\nTirozinin hidroksilasyon ve dekarboksilasyonu ile noradrenalin oluşur. NA’nın metilasyonu ile adrenalin oluşur. Feniletaolamin N-metil transferaz (PMNT) aracılık eder.", "pages": [112]}, {"no": 291, "q": "Splenektomi endikasyonları,", "tip": "Bilgi", "hoca": "Uğur Bengisun / Sancar Bayar", "a": "Hastalığın kontrolü amacıyla:\no Herediter sferositoz (en fazla fayda)\no Eliptositoz\no Otoimmün anemi\no Trombotik Trombositopenik Purpura\no Dalak rüptürü\no İmmün trombositopenik Purpura\no Primer kist veya tümörler (dalak apsesi, ekinokokkal kist Kronik ve ciddi) Hipersplenizm nedeniyle:\no Hairy cell lösemi\no Lenfoproliferatif hastalıklar (KLL, Non- Hodgkin Lenfoma)\no Felty sendromu\no Agnojenik Miyeloid Metaplazi\no Talasemi majör\no Gaucher hastalığı\no Hemodiyaliz splenomegalisi\no Splenik ven trombozu (kanayan özofagogastrik varisler)\no Orak hücreli anemi\no Hb S/C hastalığı\no AIDS", "pages": [112]}, {"no": 292, "q": "Itp?", "tip": "Bilgi", "hoca": "Uğur Bengisun / Sancar Bayar", "a": "Trombositlerin immünolojik mekanizmayla yıkılması karakteristiktir. Hastalarda başlangıç semptomları minör darbeler sonrası deride morarmaların oluşumu ve burun kanamasıdır. Olgularda dalak normal boyutta fakat sinüsler konjesyonedir ve follikül merkezleri hiperplaziktir. Kemik iliğinde megakaryosit sayısında artış bulunur. Trombosit sayısı düşük, kanama zamanı uzundur.\n-Akut İTP: sıkılıkla çocuklarda bir viral enfeksiyonu takiben 2 hafta içinde izlenir. 6 ayda tamamen geçer. Trombositlerdeki yıkım direkt virüse karşı oluşan antijen antikor komplekslerinin trombositler üzerine adsorbe olmasının sonucudur. Trombosit sayısı 6 aydan uzun süre düşük kaldığı olgularda(%20) kronik İTP gelişir.\n-Kronik İTP: özellikle çocuk doğurma yaşlarındaki kadınlarda izlenir. Burada trombosit yıkımı, direkt trombositin IIb/IIIa ve Ib/IX glikoproteinlerine karşı gelişen antikorlar nedeni ile olur. Antikorlar dalakta yapılır ve trombositler dalakta yıkılır. Splenektomiden fayda görür.", "pages": [112, 113]}, {"no": 293, "q": "Enoksaparin nedir? Cerrahide neden antikoagülana ihtiyaç duyarız?", "tip": "Bilgi", "hoca": "Uğur Bengisun / Sancar Bayar", "a": "Antikoagülan bir ilaçtır. Tromboembolizmin proflaksisi için uygulanmaktadır. Cerrahi sonrası, immobil hastalara verilmektedir.", "pages": [113]}, {"no": 294, "q": "Akut apandisit", "tip": "Bilgi", "hoca": "Uğur Bengisun / Sancar Bayar", "a": "Appendiks vermiformisin akut inflamasyonudur. İlk 6-8 saat semptomları; Ağrı İştahsızlık Dışkılama dürtüsü-dışkılayamama. Ağrı epigastrik bölgeden başlayan, yeri net gösterilemeyen, karın orta hatta göbek çevresinde görülen ağrı(visseral ağrı); 6-8 saat içinde sağ alt kadrana lokalize olur(pariyetal ağrı). %95 hastada ilk semptom iştahsızlıktır, sonra ağrı gelir. Kusma ağrıyı takip eder, eğer ağrıdan önceyse tanıdan şüphe et! FM: Vücut ısısı 37.5-38 arasında (rektal ve aksiller farkı >1), Nabız normal ya da hafif taşikardi, Bağırsak sesleri normal ya da azalmış, Hassasiyet, Müsküler defans, Rebound tenderness, Rektal tuşe.\nÖksürük testi (Dunphy işareti): öksürmekle sağ alt kadranda ağrı.\nRovsing belirtisi: sol alt kadrana basıldığında inen kolondaki gaz yukarı doğru elle karın üzerinden itilince sağ alt kadranda ağrı ortaya çıkması.\nPsoas testi: retroçekal yerleşimli appandisitte pozitiftir. Hasta sol yana yatar ve sağ uyluk arkaya çekilir, ağrıya neden olur.\nObturator testi: appendiks pelvise dönük olanlarda görülür. Sağ uyluğa fleksiyon ve iç rotasyon yaptırılır, ağrı varsa pozitiftir. Ten-Horn bulgusu: sağ testis aşağı doğru çekildiğinde sağ alt kadranda ağrı hissedilmesi. Lab: Lökositoz (10000-18000), Tam idrar tetkiki, CRP, b-HCG. Görüntüleme: Ayakta direkt karın grafi, USG ve doppler USG, BT.\nKomplikasyonları:\n1-Perforasyon: en sık görülen komplikasyon. 2-Jeneralize peritonit: adinamik ileusa neden olur.\n3-Plastron: olayı lokalize edebilmek için omentum, ince bağırsak, kadında jinekolojik organlar appendiksi sarar, kitle oluşur. Bu hasta 24 saati geçmiş bir hastadır. Hastaneye yatırılır, ağızdan beslenme kesilmez, ab verilir. Konservatif yaklaşım, 4-6 hafta sonra apendektomi. Plastron ya küçülür kaybolur ya da plastron kitlesinin içinde appendiks perfore olur. 4-Periapendiküler abseler ortaya çıkar. Tedavi absenin drenajıdır+ ab. Bu esnada apendektomi yapılmaz çünkü çekum fistülüyle sonuçlanabilir. Komplikasyonsuz akut ap’de apendektomi yapılır(ALTIN STANDART).\n5-Pileflebit: portal venin septik trombozu. Laparoskopik apendektomi kontraendikasyonları; -Radyasyon tedavisi alanlar -Koagülopatisi olan hastalar -Daha önce operasyon geçirmiş ve trokar girişine engel olacağı düşünülen hastalar -Portal HT ile birlikte KC hastalığı olanlar.", "pages": [113, 114]}, {"no": 295, "q": "Ben hangi dersi anlattım?", "tip": "Ters köşe", "hoca": "Uğur Bengisun / Sancar Bayar", "a": "Sancar Bayar: Mide kanseri, Uğur Bengisun: Varis ve vasküler malformasyonlar, Anevrizma", "pages": [114]}, {"no": 296, "q": "Aksaray’ınplaka kodu?", "tip": "Ters köşe", "hoca": "Uğur Bengisun / Sancar Bayar", "a": "68", "pages": [114]}, {"no": 297, "q": "Poliüri polidipsiyle gelen soluk bir hastada ne düşünürsün?", "tip": "Olgu", "hoca": "Volkan Genç", "a": "Anamnez ve fizik muayene ile daha detaylı bilgiler istenebilir. Bu şekilde ayırıcı bir tanı yapamadım.\nHiperaldosteronizmden şüphelenmesi gerekiyordu.\nHiperkalsemi de bu bulguları yapıyormuş.", "pages": [114]}, {"no": 298, "q": "Akut arter yetmezliği nedir? Kliniği nasıldır? Nasıl tanı koyarsın?", "tip": "Bilgi", "hoca": "Arda", "a": "Ekstremitenin canlılığını tehdit edecek ölçüde ekstremite perfüzyonunun akut olarak azalması yada bozulması durumudur.\nKLİNİK (6P) (İlk 3’ü belirti, son 3’ü bulgu) Ağrı\nParestezi\nParalizi\nSolukluk\nSoğukluk\nNabızsızlık\nTANI\nAnamnez, FM, Lab, Ek incelemeler(trombofili taraması, ekokardiyografi), Doppler USG, ABI ölçümü, Anjiografi", "pages": [114]}, {"no": 299, "q": "Kusan bir hastada volüm durumu, iyon düzeyleri, asit-baz dengesi durumu nedir? Metabolik alkalozda respiratuvar olarak kompansatuvar mekanizma nedir? Hipoventilasyonda iyonların serum düzeyleri nedir? Midedeki iyon düzeyleri nedir?", "tip": "Bilgi", "hoca": "Salim Demirci", "a": "Kusan hastada volüm durumu: Hipovolemi, hemokonsantrasyon\nKusan hastada elektrolit durumu: Hipokalemi, hiponatremi, hipokloremi\nKusan hastada asit baz dengesi durumu: Metabolik alkaloz\nMetabolik alkalozda kompansatuvar mekanizma respiratuvar olarak pCO2’nin yükseltilmesi şeklindedir. Hipoventilasyon ile kompanzasyon sağlanır. HCO3’ün her 1 mEq/L artışına 0,7 mmHg CO2 yükselmesi beklenir.", "pages": [115]}, {"no": 300, "q": "Acildesin, akut kolesistitli hastaya öyle tedaviler uygula ki hastayı öldür", "tip": "Ters köşe", "hoca": "Salim Demirci", "a": "Semptom ve bulguları oluşalı 72 saati geçmiş hastalara bir antibiyotik tedavisi vermeden cerrahiye alırsam hastanın hayatını riske sokarım.\nKortikosteroid verirsem de hastanın hayatını tehlikeye sokarım.", "pages": [115]}, {"no": 301, "q": "Akut kolesistitli hastaya hangi medikal tedavi yaparsın (öldürmeyen)? Neden antibiyotik verdin? ...Neden cerrahi tedavi yapıyorsun? Diyelim iki kişi var safra kesesi yırtılmış birinin ona cerrahi tedavi ...yaptın, diğerinin yırtılmamışona neden cerrahi tedavi yaparsın bunu bana tıbbi olarak açıkla?", "tip": "Bilgi", "hoca": "Salim Demirci", "a": "Akut kolesistli hastada uygulanabilecek 2 medikal tedavi vardır: Antibiyotik ve analjezik. Eğer hastanın semptomları başlayalı 72 saati geçmediyse tedavi kolesistektomi ile olurken 72 saati geçenlerde önce antibiyotik tedavisi, sonra kolesistektomi uygulanır.\nAntibiyotik vermedeki amaç eklenmiş veya eklenebilecek bir enfeksiyonu engellemektir. Cerrahi tedavideki amaç ise kolesistitin genellikle tekerrür etmesinden dolayı bu riski engellemektir.", "pages": [115, 116]}, {"no": 302, "q": "Akut pankreatitiepidemiyolojik, endemik, tanı, komplikasyon, tedavi sırasıyla; ...dersi bana kitap cümleler ile anlat.", "tip": "Bilgi", "hoca": "Salim Demirci", "a": "ETYOLOJİ\nSafra taşı\nAlkol\nTravma\nHiperlipidemi, Hiperkalsemi\nGenetik\nDuodenum divertikülü\nKoledok kisti\nİlaçlar\nTANI\n3’ünden 2’si olmalıdır:\n1-)Abdominal ağrı(akut\nbaşlayan, ısrarcı, şiddetli, sırta yayılabilen epigastrik ağrı)\n2-)Serum lipaz veya amilaz değerinin labaratuar üst sınırının 3 katından fazla olması\n3-)BT veya MR ‘da karakteristik radyolojik bulguların olması\nLOKAL KOMPLİKASYONLARI\nNekroz\nPseudokist\nAbse\nAkut sıvı kolleksiyonu\nSİSTEMİK KOMPLİKASYONLARI\nSolunum yetmezliği\nŞok\nBöbrek yetmezliği\nGis kanama\nTEDAVİ\nOral stop\nİV sıvı\nAnaljezik\nAntibiyotik\nCERRAHİ ENDİKASYONU\nEnfekte nekroz\nKolesistektomi(Biliyer nedenli ise)", "pages": [116]}, {"no": 303, "q": "HCC’nin lab bulguları nelerdir? AFP’nin normal veya patolojik değerleri nelerdir? ...2 tane hemanjiyomu olan hasta var, birininki 3 cm ve hastanın AFP’si 300; ...diğerininki 10 cm ve AFP’si 30 hangisine cerrahi tedavi yaparsın önce, neden?", "tip": "Bilgi", "hoca": "Salim Demirci", "a": "1-)80-90 Hbs antijeni veya antiHCV pozitifliği 2-)AFP yüksekliği\n3-)Diğer enzimlerden bağımsız alkalen fosfataz yüksekliği\nAFP’nin normal aralığı 0-40 mg/dl’dir. AFP’si 30 olan 10 cm hemanjiomlu hastaya cerrahi tedavi uygularım. Çünkü hemanjiomda cerrahi tedavi endikasyonu semptom varlığıdır ve hemanjiomlar 5 cm’yi geçene kadar genelde semptom vermezler.", "pages": [116, 117]}, {"no": 304, "q": "Tiroid nodülünde malignite kriterlerinikitap cümleleri ile sırala.", "tip": "Bilgi", "hoca": "Volkan Genç", "a": "Anamnezde;\n1. Baş boyun bölgesine uygulanmış RT öyküsü veya radyoaktif kontaminasyon\n2. Nodülde hızlı büyüme\n3. Bası ve invazyon semptomlarının olması (disfoni, disfaji, hemoptizi, dispne)\n4. Erkek cinsiyet\n5. Yaş <20 veya >55 olması\n6. Ailede tiroid kanseri öyküsü ve MEN öyküsü 7. Tiroid hormonu ile supresyon yapılmasına rağmen nodülde büyüme olması\nFM’ de;\n1. nodülün çok sert olması\n2. nodülün 4 cm’den büyük olması\n3. duyarsız olması (ağrı belirgin değil)\n4. nodül yüzeyinin düzensiz olması\n5. çevre dokulara fikse olması\n6. vokal kord paralizisi\n7. dispne\n8. disfaji\n9. bölgesel lap varlığı\nUSG’ de;\n1. Düzensiz kenarlar\n2. Belirgin hipoekojenite\n3. Santral mikrokalsifikasyon\n4. İnkomplet halo\n5. Doppler bulguları (Tip 3): santral kanlanma şeklinde, çok kaotik bir görüntü (benign nodüllerde periferal kanlanma görülür.)\n6. Servikal LAP\n7. Daha küresel şekil\n8. Düşük elastisite (sert)\n9. Heterojen görünüm: kanlanma paterni nodülün büyümesine yetişemeyebilir, nodülün bazı kısımları nekroza gidebilir.", "pages": [117]}, {"no": 305, "q": "DVT komplikasyonları nelerdir? Neden DVT komplikasyonunda pulmoner emboli olur ve neden göğüse gider? Gittiğinde nereyi tıkar genelde ve hastada ne olur? Biz pulmoner embolili hastada ne tedavi yaparız?", "tip": "Bilgi", "hoca": "Arda", "a": "DVT Komplikasyonları;\nPulmoner Emboli (En ciddi), Venöz yetmezlik, Nüks tromboz, Post-trombotik sendrom ve Phlegmasia Cerulae Dolens.\nAlt ekstremite venlerideki tromboz (İliak, Femoral ve popliteal), vena cava inf'le sağ atriyuma ve pulmoner arterle akciğere gider ve akciğer arterlerini tıkar. Hastada ani başlangıçlı dispne, keskin angina pektorisi çarpıntı ve öksürük gelişir. Hipoksi gelişir, bu duruma hipotansiyon ve şok eşlik edebilir.\nTedavide antikoagülan ilaçlar (düşük molekül ağırlıklı heparin) kullanılır. Tekrarlayan PE ataklarında vena kava filtresi tercih edilir. Ani gelişen, şiddetli emboli vakalarında, pıhtının damar içinde eritilmesine yönelik damardan trombolitik ilaçlar verilebilir.\nAçık cerrahi: Tıkanan akciğer damarları, açık ameliyat yöntemiyle pıhtılardan temizlenebilir.", "pages": [117, 118]}, {"no": 306, "q": "Mide lenfoması olan bir kadın var, biliyorsun ki onlara kemoterapi yapıyoruz, cerrahi değil. Ama hasta bir ay sonra tahta karınla gelmiş, ne olmuş? Radyolojik olarak nasıl teyit edersin?", "tip": "Olgu", "hoca": "Sancar Bayar", "a": "Kemoterapi perforasyona neden olmuş olabilir. Ayakta direkt karın grafisiyle serbest hava görülmesi tanıyı destekleyicidir.", "pages": [118]}, {"no": 307, "q": "Meme kanseri bulguları, akıntının rengi nasıl olur", "tip": "Bilgi", "hoca": "Sancar Bayar", "a": "Memede ele gelen kitle, Memenin büyüklüğünde ve şeklinde değişiklik, portakal kabuğu görünümü, meme ucu akıntısı ve hassasiyeti, meme ucu çekintisi, aksiller lenf nodlarında büyüme, sol supraclavicular lenf nodunda büyüme.\nAkıntının rengi kırmızı kan rengi (hemorajik) veya berrak (seröz) olabilir.", "pages": [118]}, {"no": 308, "q": "İki hasta geldi, tek yumurta ikizi 70 yaşında erkek, ikisinde de akut arter tıkanıklığı var, biri tromboz biri emboli, sadece inspeksiyonla nasıl ayırırsın", "tip": "Bilgi", "hoca": "Ayhan Kuzu", "a": "Embolide klinik ani ve daha ağır seyreder. 6P bulgusu daha belirgindir. Distal ekstremite daha soluk, Hasta ağrıdan dolayı daha fazla ajite durumdadır ve de daha bitkindir.", "pages": [118, 119]}, {"no": 309, "q": "Sunum konun ne(meme kanserinde genetik), brca nedir açılımı ne, brca testini kimlere yapalım, erkeklere yapılır mı, bizim hastanede yapılıyor mu,", "tip": "Bilgi", "hoca": "?", "a": "BRCA'nın açılımı breast cancer gen.\nBRCA testi: 50 yaşından önce meme kanseri olanlar (ER, PR, ve Her-2 negatif aile anamnezi olsa bile.), DCIS, Ailede birden fazla erken yaşta meme kanseri olguları varsa, over kanseri, aynı hastada meme ve over kanseri, bilateral meme kanseri, erkek meme kanseri veya aile anamnezi olanlara uygulanır.\nBizim hastanede yapılıyor.", "pages": [119]}, {"no": 310, "q": "Derin ven trombozu için cerrahi hastaları risk altında, dahiliye hastalarında risk var mı? (uzun süre yatması gerekirse var dedim doğru dedi), hangi ameliyatlar dvt için daha riskli, hastanın trombositi 50.000 hem de dvt açısından riskli bir ameliyat olacak nasıl profilaksi yapalım en maliyetsizi (bacak elevasyonu, kompresyon çorabı, hastayı yürütme, profilaktik antikoagülan.. Vb.)", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Uzun yatış süresi gerektiren ameliyatlar DVT için risk taşır: Açık kalp ameliyatları, beyin ameliyatı, major abdominal ameliyatlar.. Profilaksi olarak hastaya zayıflamasını önerebilir, onu yürütebilir; kompresyon çorabıyla, düzenli bacak elevasyonlarıyla destek sağlayabilir, profilaktik antikoagülan tedavisi uygulayabiliriz.", "pages": [119, 120]}, {"no": 311, "q": "Böbrek transplantasyonunda alıcı ve verice bakılan testler, testleri açıkla", "tip": "Bilgi", "hoca": "Acar Tüzüner", "a": "HLA uyum testi: Alıcı ve vericinin HLA tiplerinin birbirine uyup uymadığına bakılır. ABO uyumu: Alıcının ve vericinin kan gruplarının, transplantasyon için uygun olup olmadığına bakılır.\nCross-match: Hiperakut rejeksiyonu engellemek için yapılır. Alıcının serumu (antikorları) ve vericinin lenfositleri (HLA antijenleri) alınır, üstüne kompleman eklenir. Alıcının kanında antikor varsa kompleman sist. aktive olur ve lenfositler parçalanır. %30dan fazla lenfosit parçalanırsa Cross-match (+)\nPanel Reaktif Antikor Ölçümü (%0-100)", "pages": [120]}, {"no": 312, "q": "Tiroid kanseri risk faktörleri neler, hangi risk faktörü hangi kanserin riskini arttırır, bethesda sınıflaması, bethesdaya göre nasıl bir yol izlenir, tedavisi nasıl olur uzun uzun anlattırdı", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "Risk faktörleri çıkmışlarda 2023 b3 grubunun açıklamalarında 73. soru ve devamında yazıyor. Bethesda Sınıflaması:\nBethesda 1- Non-diagnostik veya yetersiz. Tekrar İİAB gerekir.\nBethesda 2-Benign. Kistik yapıda ve (4cmden büyükse veya >3 kez tekrarladıysa) lobektomi, Kolloid yapıdaysa takip.\nBethesda 3- Önemi belirsiz atipi. %5-10 malign. İİAB tekrarla 2.de de bethesda 3 gelirse lobektomi(hemitiroidektomi)\nBethesda 4-Foliiküler Neoplazi veya FN şüphesi. %20-30 malign. Lobektomi\nBethesda 5- Şüpheli Malign. %50-75 malign. Lobektomi ya da Total tiroidektomi\nBethesda 6- Malign. Total ya da totale yakın tiroidektomi.", "pages": [120]}, {"no": 313, "q": "Tiroidle ilgili her şey", "tip": "Bilgi", "hoca": "İskender Alaçayır", "a": "TIROID", "pages": [120]}, {"no": 314, "q": "Sağ sol kolon tümörlerinde farklar", "tip": "Bilgi", "hoca": "Aydan Eroğlu", "a": "Sağ kolonun çapı daha geniş olduğu için tümör tarafından tıkanması zordur, obstrüksiyon bulguları hakim değildir. Klasik sağ kolon triadı; karında ele gelen kite, sağ alt kadran ağrısı, anemi. (ağrı embriyolojik köken aldığı bölgeye göre göbek etrafında olabilir). Bu bölge tümörlerinde gaitada gizli kan (GGK) pozitifliği ve hipokrom mikrositer anemi görülür. Sol kolon tümörlerinde obstrüksiyon daha ön plandadır ve rektal kanamaya bağlı hematokezya sık bulgudur. Obstrüksiyona bağlı perforasyon ve peritonit görülebilir.(ağrıları göbek altında olabilir, yine embriyolojik köken aldığı yere göre) İlioçekal valv bölgesi tutulumunda yaygın distansiyon, karın ağrısı, bulantı, kusma görülür.", "pages": [120]}, {"no": 315, "q": "Kist hidatikten korunma yolları", "tip": "Bilgi", "hoca": "?", "a": "* Köpek ve kedilere mümkün olduğu kadar çiğ et verilmemelidir.\n* Kişisel temizlik kurallarına dikkat edilmeli, içme ve kullanma suları temiz olmalı, çiğ yenen sebze ve meyveler bol su ile iyice yıkandıktan sonra tüketilmelidir.\n* Kesilen veya ölen hayvanların kist bulunduran organları köpeklerin ve diğer etçil hayvanların ulaşamayacağı şekilde gömülerek bertaraf edilmelidir. Özellikle kurban bayramlarında bu hususlara daha çok dikkat edilmelidir.\n* Köpekler yılda dört kez iç parazitlere karşı ilaçlanmalıdır.\n* Köpekler gezdirilirken etrafa dışkılamaları halinde dışkıları alınarak poşete konulmalı, ağzı bağlandıktan sonra çöpe atılmalıdır.\n* Parazit mücadelesi yapılmadan serbest dolaşan köpeklerin okşanması ve sevilmesi sırasında parazit yumurtaları ellere geçebilir. Bu şekilde kirlenen ellerin yıkanmadan ağza götürülmesi ile parazitin yumurtası alınır. Bu nedenle, özellikle çocukların köpeklerle temasından sonra ellerini bol su ve sabunla yıkamaları sağlanmalıdır.", "pages": [120, 121]}, {"no": 316, "q": "Melena nedir, nereden kaynaklanır, en az ne kadar kanaması lazım (50ml), total gastrektomi olan hasta 4 yıl sonra geldi, dışkıda siyah kan var diyor, buna melena der misin,", "tip": "Bilgi", "hoca": "?", "a": "Tıbbi adı “melena” olan siyah renkli kötü kokulu dışkı daha çok sindirim sisteminin üst bölgelerinde olan bir kanamanın belirtisidir. Bu bölge yemek borusu, mide ve on iki parmak bağırsağının başlangıç kısmıdır . en az ne kadar kanaması lazım (50ml)\ndemem çünkü melena olması için mide asidi gerekli)", "pages": [121]}, {"no": 317, "q": "Yara bakımı", "tip": "Bilgi", "hoca": "Ekrem Ünal / Kaan Karayalçın", "a": "Yara bakımı Pansuman önemli bir aşama •Bugün:–Optmum çevre = optmum iyileşme– Nemli bir ortam sağlayan–Isı kaybını engelleyen–Fiziksel etkilerden, travmadan koruyan–Oksijen geçişine imkan veren– Enfeksiyonu azaltan veya önleyen–Otolitk debridmanı hızlandıran–Granülasyon dokusunu artran–Ağrıyı azaltan ve ucuz olan bir pansuman hedefimizdir !!!", "pages": [121]}, {"no": 318, "q": "Antibiyotik profilaksisi", "tip": "Bilgi", "hoca": "Ekrem Ünal / Kaan Karayalçın", "a": "Antibiyotik profilaksisi, erken postoperatif dönemde cerrahi alanda meydana gelebilecek enfeksiyonu önlemek amacıyla yapılır. Böylece antibiyotiklerin gereksiz ve uygunsuz kullanımını önleyerek, antibiyotiklere direnç gelişimini önlemek amaçlanır", "pages": [121, 122]}, {"no": 319, "q": "Malign melanom", "tip": "Bilgi", "hoca": "Ekrem Ünal / Kaan Karayalçın", "a": "Malign melanoma, melanin pigmentini yapan nöral krest orijinli melanositlerin malign transformasyonu sonucunda oluşur.", "pages": [122]}, {"no": 320, "q": "Şoku tarif et", "tip": "Bilgi", "hoca": "Ekrem Ünal / Kaan Karayalçın", "a": "En basit ve genel tanımı “periferik dolaşım yetmezliği” veya “yetersiz doku perfüzyonu”dur. Sorun dolaşım sistemi yolu ile hücrelerin metabolik gereksinimlerini karşılayabilecek yeterli perfüzyonun sağlanamaması. Yetersiz oksijen ve besin alınımı sonucu normal hücresel metabolizma bozulur, bunun sonucunda hücre membran işlevleri bozulur ve sonuç olarak hücre ölümü olu", "pages": [122]}, {"no": 321, "q": "Akut pankreatit etyolojisi, enfekte olanın farkı ne, tanısında ne kullanılır, nereden sıvı örneği alınır, biliyerde tedavi farkı nedir,", "tip": "Bilgi", "hoca": "Kaan Karayalçın", "a": "Akut pankreatit etiyolojisi:\n• Safra taşları (%80)\n• Alkol kullanımı\n• Hiperlipidemi, hiperkalsemi\n• Otoimmün hastalıklar\n• Viral enfeksiyonlar\n• Genetik faktörler\n• İlaçlar\n• Pankreas divisum, Anüler pankreas\n• Duodenal duplikasyon duplikasyon, divertikül, koledok kisti\nPankreatitlerin %10-15’i nekrotizandır. Nekrotizanların 1/3’ü enfekte nekrotizan pankreatite dönüşür.\nEnfekte pankreas nekrozu\nGenellikle 2-4. Haftada görülür. Extraluminal gaz görülür.\nİİA’la kültür alınır ve Gram boyama yapılır. SIRS semptomları gözükür.\nTedavi edilmezse mortalite %100’e yakın. Biliyer akut pankreatitte kolesistektomi endikasyonu vardır.\nEnfekte nekrotizan pankreatitte cerrahi tedavi gerekir, kolesistektomi endikasyonu yoktur.", "pages": [122]}, {"no": 322, "q": "Septik şok", "tip": "Bilgi", "hoca": "Ekrem Ünal", "a": "Sepsis: SIRS semptomları + Pozitif kültürle desteklenmiş enfeksiyon varlığı\nSeptik şok: Sepsisli hastada yeterli sıvı resisütasyonuna rağmen düzelmeyen hipotansiyon ile birlikte organ disfonksiyonu veya hipoperfüzyona bağlı anomaliler mevcuttur. Sepsisteki hastaların %40’ında septik şok gelişir. SIRS olması, gösterilen enfeksiyon odağı olması, bilinç bozukluğu ve en az bir organ sisteminde yetmezlik olması septik şok tanısı koydurur.", "pages": [122]}, {"no": 323, "q": "Aort anevrizması neden olur, en sık sebebi, “Komşun var bir tane, duymuş böyle bir şey olduğunu hemen kontrol edilsin mi? Nelere bakarsın?”, Nasıl kontrol edilir?", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Anevrizma: Damar çapının %50’den fazla büyümesi.\nEn sık sebebi ateroskleroz.\nGenellikle asemptomatik. İnsidental olarak tanı konur.\nSemptomatik vakalarda karında nabız hissi, kompresyon belirtileri, sırt/bel ağrısı, distal embolizasyon (%2-5), alt ekstramite iskemisi, halsizlik, kilo kaybı, ağrı.\nRisk faktörleri: ileri yaş, erkek cinsiyet, sigara kullanımı, ailede anevrizma öyküsü, koroner arter hastalığı, KOAH.\nTanı:\nMuayene bulguları: Pulsatil kitle, üfürüm, distal iskemi\nUSG\nBT-anjiografi\nMR-anjiografi\nDSA (kateter ile arteriografi)(Dijital Subtraksiyon Anjiografi)", "pages": [122, 123]}, {"no": 324, "q": "Galaktore ne demek, tek memede mi, neden olur, en sık sebebi", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "Yüksek prolaktin seviyesiyle ilişkili, bilateral memede ve çok sayıda duktustan beyaz/şeffaf sıvı akıntısı.\nEn sık nedeni prolaktin üreten hipofiz adenomları.", "pages": [123]}, {"no": 325, "q": "Beyin ölümü nedir, teşhis nasıl konur, neden önemli", "tip": "Bilgi", "hoca": "Acar Tüzüner", "a": "Kişinin beyin ve beyin sapı fonksiyonlarının tam ve geri dönüşsüz kaybı.\nKişi bilinçsizdir ve kendi başına solunum yapmaz. (Mekanik ventilasyona bağlı)\nMekanik ventilasyon çekilip pCO2 >60 olana kadar beklenir. Solunum gerçekleşmiyorsa beyin ölümü gerçekleşmiştir. Hasta ortalama 24-36 saat içinde hayatını kaybeder.\nOrgan bağışında bulunulursa beyin ölümünden sonra organların yaşatılması amaçlanır.", "pages": [123]}, {"no": 326, "q": "Aspirinin antidotu, heparinin antidotu, kolon kanseri ameliyatı olacak 80 yaşındaki hasta aspirin kullanıyor, aspirini kesmeli mi, neden kesmeli, kaç gün önce kesmeli(5gün)", "tip": "Bilgi", "hoca": "Nezih Erverdi / Aydan Eroğlu", "a": "Aspirin antidotu: Spesifik antidotu yoktur. Salisilat zehirlenmesinde amaç resusitasyonu sağlamaktır. Sonrasında IV sıvı desteği sağlanır. Metabolik durum düzeltilmesi GİS’ten ilacın uzaklaştırılması ve salisilat düzeyinin azaltılması amaçlanır.\nHeparin antidotu: Protamin sülfat\nKolon kanseri ameliyatı olacak 80 yaşındaki hasta aspirin kullanıyor, aspirini kesmeli mi, neden kesmeli, kaç gün önce kesmeli? Ameliyat esnasında kanama riski olduğu için aspirin operasyondan 5 gün önce kesilir. Asprin trombositlerde irreversible değişiklik yapar bu sebeple trombositlerin yarı ömürlerinin süresi kadar öncesinden kesilmelidir.", "pages": [123]}, {"no": 327, "q": "Üst gis kanaması sebepleri nelerdir, üst gis kanamasına sebep olan ilaçlar ve piyasada en bilinen adı (NSAID, aspirin)", "tip": "Bilgi", "hoca": "Nezih Erverdi / Aydan Eroğlu", "a": "• Peptik ülser en sık\n• Özofagus ven kanamaları\n• Özofajit\n• Atrofik gastrit\n• Mallory weiss kanaması\n• Boerhaave sendromu\n• Maligniteler\nÜst gis kanamasına sebep olan ilaçlar: NSAİD, aspirin", "pages": [123, 124]}, {"no": 328, "q": "Mallory weiss", "tip": "Bilgi", "hoca": "Nezih Erverdi / Aydan Eroğlu", "a": "Şiddetli bulantı kusma sonrası gastroözofageal bileşkede oluşan mukozal lineer yırtıklardır. Hastaların çoğunda alkol kullanım öyküsü mevcuttur.", "pages": [124]}, {"no": 329, "q": "Koagülasyon mekanizması", "tip": "Bilgi", "hoca": "Nezih Erverdi / Aydan Eroğlu", "a": "1 Vasküler faz (Vazokonstrüksiyon)\n2 Trombosit fazı: Yaradaki açığa çıkmış kollajene(hasarlı endotellerin arasından) değen trombositler aktive olur.Trombositler yaraya (kollajene) yapışır ve salgılarıyla daha çok trombositi çekerek trombosit tıkacı oluştururlar. 3 Koagülasyon fazı:\n1) İnaktif faktör X un aktif hale geçmesi\n2) Protrombinin aktif hale, trombine çevrilmesi 3) Fibrinojenin fibrine dönüşmesi\n4 Pıhtının yıkımı (fibrinoliz): plazminojenden oluşan plazmin ile fibrini bir arada tutan fibrin iplikçiklerinin parçalanmasıdır", "pages": [124]}, {"no": 330, "q": "Ameliyatta kanayan bir hastaya ne verilmeli(taze donmuş plazma)", "tip": "Bilgi", "hoca": "Nezih Erverdi / Aydan Eroğlu", "a": "Kan kayıplarının telafisinde, optimum oksijen tasıma kapasitesinin elde edilmesi için eritrositler, kanama ve pıhtılasma problemleri için taze donmus plazma, trombosit süspansiyonu gibi ürünler tercih edilmelidir. TDP (Taze Donmus Plazma)\nTam kan 6 saat içinde santrifüj edilerek sekilli elemanlar ayrıstırılır ve kalan kısmı hızla dondurularak saklanır. TDP; bütün koagülasyon faktörleri, albumin ve globulin içerir", "pages": [124]}, {"no": 331, "q": "Cevabı 1 ünite trobosit verilmesi gerekir olan bir hasta sorulmuş soru hatırlanmıyo", "tip": "Bilgi", "hoca": "Nezih Erverdi / Aydan Eroğlu", "a": "Bir unite trombosit kan platelet sayısını 50.000- 60.000/ml yükseltebilir. Endikasyonları:\n- Plt sayısı 50.000 'in üzerinde ve trombosit disfonksiyonuna bağlı aşırı kanama varsa\n- Plt sayısı 50.000 civarında ya da üzerinde, majör cerrahi girişim uygulanacaksa ya da hastanın ciddi bir kanama belirtisi varsa - Plt sayısı 10.000-50.000 arası, travma ya da invaziv bir girişim için kanama riski artmıştır. Spontan ya da invaziv bir girişime bağlı gelişen kanamaların tedavisinde plt transfüzyonu yapılır.", "pages": [124]}, {"no": 332, "q": "Hemşire hastaya iv potasyum verdi hasta hiperkalemi ye girdi kalbi durdu, kalbi hangi evrede durmuştur? (diastol)", "tip": "Bilgi", "hoca": "Nezih Erverdi / Aydan Eroğlu", "a": "Potasyumun normalden yüksek konsantrasyonlarda ileti ileri derecede depresyona uğrar ve kalp diastolde durur. Çok düşük konsantrasyonda ise sistolde durur.", "pages": [124, 125]}, {"no": 333, "q": "Seminer konun ne, midenin malign hastalıklarını say (yüzdelerine göre saymış), bunlardan", "tip": "Bilgi", "hoca": "Sancar Bayar", "a": "Malign mide hastalıkları:\n1) Adenokarsinomlar midenin en sık görülen malıgnitesidir %90\n2)Lenfoma %5: lenfomada kemoterapi ve radyoterapi cerrahiden daha etkili. 3)Karsinoid tmr\n4)Gastrointestinal stromal tmr : Lenf nodlarına yayılım nadirdir ,genellikle lenf nodu diseksiyonu gerekmez.", "pages": [125]}, {"no": 334, "q": "Karaciğer kanserleri, HCC görülmesini arttıran faktörler neler", "tip": "", "hoca": "Sancar Bayar", "a": "KARACİĞER TÜMÖRLERİ\nBENIGN: Hemanjıom,fokal nodüler hiperplazi,adenom,hamartom,lipom MALIGN:Hepatoselluler karsinom, kolanjiosellüler karsinom ,hepatoblastom,sarkomlar ve metastatik tmr HCC riskini arttıran durumlar : Kronik hepatit b ve c ,siroz,erkek cinsiyet,aflatoksin ,alkolizm ,malnutrisyon,hormon kullanımı ,diyetteki karsinojenler", "pages": [125]}, {"no": 335, "q": "Anjiyografi gösterip hangi damara ne yapıldığını sormuş (vena cava filtresi), hangi durumlarda yapılır, dvt hastayı nasıl tanırsın, dvt hangi tarafta daha çok görülür neden", "tip": "Bilgi", "hoca": "Uğur Bengisun", "a": "Vena Cava Fitresi endikasyonları: Esas amacımız pulmoner emboli gelişimini engellemektir. Kesin endikasyonlar:\na. Yeterli antikoagülan kullanımına\nrağmen tekrarlayan venöz tromboemboli\nb. Antikoagülan kullanımının kontrendike olduğu durumlar\nc. Antikoagülan kullanımı esnasında komplikasyon gelişimi (santral sinir\nsistemi ve gastrointestinal sistem kanamaları, heparinin indüklediği trombositopenisi olan hastalar)\nDerin ven trombozunda semptomlar ve\nbulgular :bacakta ağrı, hassasiyet ve şişlik ,kramp hissi , bacakta renk değişiklikleri ,venöz ülserler ,varisler ,gode bırakan ödem . hangi tarafta neden daha çok görülür bulamadım4", "pages": [125]}, {"no": 336, "q": "Meduller tiroid karsinomu her şeyi, tiroidektomi sonrası hasta takibi, kalsitonin ve cea??, metastaz var nasıl takip ederiz, en sık metastaz yaptığı yerler, men ve nonmen hangi yaşlarda görülür", "tip": "Bilgi", "hoca": "?", "a": "Medullar tiroid karsinomu ,kalsitonin salgılayan C hücrelerinden köken alır. Amiloid varlığı tanı koydurucudur.%75 sporadiktir %25 aileseldir. Etyolojisinde RET mutasyonu bulunuyor. Hem lenfojen hem kan yoluyla yayılarak metastazlarını yapar. Radyoaktif iyot tedavisi yapılamayacağı için cerrahi en etkili tedavidir. tiroidektomi sonrasında takipte kalsitonin ve CEA düzeylerini kontrol edebiliriz. Kan yoluyla karaciğer ,kemik ve akciğere metastaz yapabilir. Ailesel Non Men genç yaşlarda görülüyor.", "pages": [125, 126]}, {"no": 337, "q": "Böbrek Kc tranplantasyonu sonrası kullanılan ilaçlar, Böbrek-kc yetmezliğine neler yol açar, Akut rejeksiyon oldu ne yaparız (medikal tedavisi varmış), 7cm’lik bir HCC var ne yaparız(milan kriterleri)", "tip": "Bilgi", "hoca": "?", "a": "337.) Böbrek ve karaciğer transplantasyonu sonrası tedavi olarak: Tacrolimus(prograf), cyclosporin(sondimmun neoral), azathioprine(imuran), MMF, rapamycin, everolimus, kortikosteroid\n// Kr. böbrek yetmezliği nedenleri: Diyabet, hipertansiyon, glomerülonefrit…\nAkut böbrek yetmezliği nedenleri: Travmatik nedenler, kusma ve ishala bağlı çok fazla sıvı kaybı, ağır yanıklar. //\nAkut Karaciğer yetmezlik nedenleri: Viral hepatitler (hepatit a-b-c), ilaçlar, Wilson hastalığı, otoimmün hastalık, budd-chairi sendromu, septik şok.\nKronik karaciğer yetmezlik: Kronik hepatit b-c enfeksiyonları, uzun süre alkol kullanma, siroz, primer sklerozan kolanjit, karaciğer kanseri…// milan kriterleri(HCC varlığında tx endikasyo) 1.) tek tümör varlığından max çapı 5 cm.\n2.) 2-3 tümörde çapı en çok 3cm\n3.) extrahepatik yayılım olmaması.", "pages": [126]}, {"no": 338, "q": "Tiroidde RAİ ile tedavi edilemeyen hastalık var mı,", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "338.) papiller tiroid karsinomda tek odak tümör varsa ve lenf metastazı yoksa ve hasta iyi prognazsa vermeyiz ve foliküler karsinomda minimal invaziv foliküller kanserde rai verilmez. Ayrıca oftalmapatisi olan graves hastalıklarında verilmez. Undiferansiye tiroid malignitlerinde de verilmez anaplastik karsinom, lenfoma, metastatik ve medullar karsinomda", "pages": [126]}, {"no": 339, "q": "Türkiyedeki meme kanseri taraması nasıl(20 yaş üstü kendi kendine muayene, 40 yaş üstü her yıl mammografi), memede USG mammografi farkları, mammografide neler görülür, neler maligne düşündürür,", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "339.) Kadınlarda 40 yaşından sonra mamografi ile tarama başlanır 2 yılda 1 50 yaşından sonra da yılda 1 . Eğer ailesinde hastalık varsa 10 yıl öncesinden tarama başlanması tavsiye edilir. Kadınların ergenliğe girdiklerinden sonra 18-20li yaşlarından sonra da kendisi fizik muayene ile tarama yapmaya başlamalı. // mamografi ile usg en belirgin farklarından biri mamografide mikrokalsifikasyonların görülmesidir. Usg nin mamografiye göre avantajı ise kesitsel görüntüleme olanakları sağlayarak görüntüleme alırken dokular üst üste binmez ve sağlıklı kararlar almamızı sağlar.\n// mamogrofide malign işaretleri: Noktalar şeklinde serpintili mikrokalsifikasyon odakların bulunması. Sınırları belirsiz yıldız gibi uzantıları olan kitle. Meme yapısında distorsiyon bölgesi. Asimetrik artmış dansite bölgeleri.", "pages": [126, 127]}, {"no": 340, "q": "Böbrek transplantı öncesi ne tedavi verilir(immunsupresyon) ilaç olarak ne verilir, ülkemizde böbrek yetmezliğine en çok sebep olan şey,", "tip": "Bilgi", "hoca": "Selçuk Hazinedaroğlu", "a": "340.) Böbrek transplantı öncesi immünosupresif tedavi olarak: metilprednisolone, OKT-3, antitymocytelenfoglobul in (ATG), basiliximab, daclizumab.\n// Ülkemizdeki böbrek hastalarının yaklaşık yüzde 40'ı diyabet oluşturmaktadır.", "pages": [127]}, {"no": 341, "q": "Karaciğerde en sık neden kitle görürüz, kc nakli için en çok ne sebep olur,", "tip": "Bilgi", "hoca": "Selçuk Hazinedaroğlu", "a": "341.) Karaciğerde en sık malign tümörü metasslarken en sık primer malign karaciğer tümörü ise hepataselüler karsinomdur(hcc) en sık benign sebep ise hemanjiomadır. // kc transplantasyonda en sık neden hepatit b ya da hepatit cye bağlı kronik hepatittir.", "pages": [127]}, {"no": 342, "q": "Akut apadisit ilk 6-8 saat bulguları, bu bulgularla geldi hasta naparsın, apandisit ağrısını nelerden ayırmak gerek nelerle karışabilir (Dış gebelik rüptürü, orta ağrı- mens. Siklus ile ilgili, üriner sistem enf. Vs vs)", "tip": "Bilgi", "hoca": "Selçuk Hazinedaroğlu", "a": "342.) İlk 6-8 saat bulguları: Epigastrik bölgede lokalize edilemeyen karın ağrısı, iştahsızlık ve dışkılama dürtüsüdür. Anamnezde ağrı lokalizasyonu ve karakterini sorgulamak önemli. Fizik muayende akut karın bulgularından hassasiyet, musküler defans, rebound, öksürük testi, rovsing belirtisi, obturator testi, tern horn bulguları… sorgulamak gerek. Labda lökositoz, tam idrar tetkiki, CRP, bHCG testlerini istemek önemlidir. Görüntülemede ise ilk olarak ayakta direkt karın grafisi, USG ve BT istenilir. Ama anamnez ile fizik muayene ile çok büyük oranda hastalığın tanısı konur zaten. //// Tanıda en sık karıştırılan hastalıklar: Dış gebelik rüptürü, üriner sistem enfeksiyonları, renal kolik, pelvik inflamatuvar hastalık, gastroenterit, biliyer sistem hastalıkları, mezenter lenfadeniti, Crohn hastalığı ve intestinal obstrüksiyon olarak sıralanabilir.", "pages": [127]}, {"no": 343, "q": "Filloides tümör tanısı koydun sonra naparsın (negatif cerrahi sınırla eksizyon), tanı neyle karışabilir kesin tanı için ne yapılır (fibroadenomla karışabilir, kesin tanı patolojiyle koyulur), filloides tümörde lenf nodu diseksiyonu yapar mısın, metastazları nereye olur, bethesda sınıflamasını", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "343.) Phyllodes tümör tanısı konulduktan sonra negatif cerrahi sınırla eksizyon yapılır. Tanısı genelde histolojik benzerliğinden dolayı fibroadenomla karışmaktadır. Fibroadenomdan ayıran esas farklılık phyllodes tümörlerde stromal hücre aktivitesi fibroadenomlardan daha belirgindir. Lenf nodu metastazı yok denecek kadar çok nadirdir bu yüzden axiller diseksiyona gerek yoktur. En sık hematojen yolla AC metastaz yapmaktadırlar.\nBethesda sınıflaması ise 6 maddeden oluşmaktadır. 1.si yetersiz materyel 2. Benign 3. Önemi belirsiz atipi 4. Foliküler neoplazi (3-4 gri zone olarak geçer ayrıca ve tiiab ile tanı koyulamamakta) 5. Şüpheli malign 6. Malign", "pages": [127, 128]}, {"no": 344, "q": "Kar  TSH baskılanmıştır.\nü Bu durumda hastaya Tiroid Sintigrafisi yapılır.Sintigrafi sonucuna göre:\n1. Toksik Noduler Guatr\n2. Diffüz Toksik Guatr (Grave’s Hastalığı) 3. Toksik Multinodüler Guatr\n4. Diffüz Toksik Goitre+Soğuk Nodül Saptanabilmektedir. Hastada TSH artmış ise hipotiroidi düşünülür, USG ile kitleye bakılır, Eğer kitle Mixt ya da solid ise TİİAB yapılır.", "pages": [131, 132]}, {"no": 356, "q": "İnguinal fıtık çeşitleri, Nereden geliştikleri, Hasselbach üçgeni sınırları, Femoral kanal sınırları, Direkt fıtık komplikasyonları, İnkarserasyon nedir, Fıtık tedavisi", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "İnguinal fıtıklar:\na) İndirekt inguinal fıtık:\nİnguinal kanal içerisinde seyreden, skrotuma inmeyi hedefleyen fıtıklardır. Her iki cinsiyette de en sık görülen fıtıklardır. (Erkeklerde daha sık)\nSpermatik fasyanın tüm katmanları tarafından sarılmıştır. (Direkt hernilerde eksternal katman sadece)\nİnternal inguinal halkadan inguinal kanala girer, eksternal inguinal halkadan çıkarak skrotuma kadar iner. (Direkt hernilerde sadece eksternal halkadan girer) (Kadınlarda round ligamenti takip ederek labiuma iner)\nKonjenital sebeplidir. Patent processus vaginalis denilen yenidoğanda kaybolması gereken periton katlantısının kaybolmaması sebebiyle oluşur ancak tek bu yeterli değildir. Üstüne ağır kaldırma ve ıkınma gibi basınç artışı eklenince fıtık oluşur. Yani hemen bebek doğduğunda fıtık olmaz (eğer mekanik ventilasyona bağlanırsa veya herhangi bir sebeple basınç artışından bebekte de fıtık gelişir), zaman ilerledikçe erişkin çağda patent processus vaginalisi olan ve risk faktörlerini sağlayanlar fıtık geliştirir. Genellikle sağ taraflıdır. (Patent processus vaginalis genelde sağda oluyor)\nGenellikle bilateral.\nb) Direkt inguinal fıtık:\nFıtık hasselbach üçgeninden protrüze olur. Eksternal halkadan girer. (vs indirekt) Eksternal spermatik fasya ile sarılıdır. (vs indirekt)\nSkrotuma inmez. (vs indirekt)\nHasselbach üçgeninin tabanı olan transversalis Bilgi", "hoca": "Mehmet Gürel", "a": "safra kesesindeki taşın ductus sisticusu tıkamasıyla ağrı olur bu bilier koliktir taş orayı tıkamaya devam eder ağrı 12 saatten fazla sürerse bu akut kolesistitdir komplikasyonları ampiyem nekroz ve gangren perikolesistik apse kese perforasyonu safra taşı ileusu . Safra taşı ileusu bilioenterik fistül sayesinde olur.", "pages": [142]}, {"no": 383, "q": "Beyin ölümü nedir", "tip": "Bilgi", "hoca": "", "a": "Beyin sapı da dahil tüm beyin fonksiyonlarının geri dönüşsüz kaybıdır beyin sapının hasarı ile solunum durur göz bebekleri büyür EEG kaybı görülür 48 saat içerisinde kalp durur. Apne testi ile beyin ölümü tanısı kesinleştirilir.", "pages": [142]}], "sections": [{"id": "tiroid", "title": "Tiroid", "clusters": [{"id": "tiroid-01", "title": "Tiroid anatomisi ve lokalizasyonu", "rows": [14], "merged": null}, {"id": "tiroid-02", "title": "Bethesda sınıflaması", "rows": [15, 87, 139], "merged": "**Tanım:** Bethesda sistemi, tiroid ince iğne aspirasyon (İİA) numuneleri için oluşturulmuş bir raporlama sistemidir; amacı tanıları kategorize ederek standardizasyon sağlamaktır. [A, B]\n\n### Kategoriler\n- **Kategori I – Non-diagnostik / yetersiz:** USG eşliğinde İİAB tekrarlanır. [A, B]\n- **Kategori II – Benign:** Klinik takip. [A, B]\n- **Kategori III – Önemi belirsiz atipi (AUS / ÖBA) / Önemi belirsiz foliküler lezyon (FLUS / ÖBFL):** Biyopsi tekrarlanır. [A, B, C]\n- **Kategori IV – Foliküler neoplazi veya şüphesi:** %20–30 malign; cerrahi lobektomi (hemitiroidektomi). [A, B]\n- **Kategori V – Malignite için şüpheli:** %50–75 malign; totale yakın tiroidektomi ya da cerrahi lobektomi. [A, B]\n- **Kategori VI – Malign:** %97–99; totale yakın tiroidektomi. [A, B]\n\n> ⚠ Kaynaklar çelişiyor: Kategori III malignite oranı A'da %5–10, B'de %10–30 olarak verilmiş.\n\n### Kategoriye göre yaklaşım\n- Kategori V ve VI'da kesin cerrahi uygulanır. Kategori III ve IV'te USG ve fizik muayenede malignite bulguları varsa cerrahi, yoksa takip. [B]\n\n### Sitolog neden kategori III'te karar veremez?\n- İnce iğne biyopsisinde yalnızca hücre örneği gönderilir; malignite kararı için doku gerekir. Bunun için tru-cut ile kalın iğne biyopsisi alınır. [C]\n- Kaynak önerisi: ATA tiroid sınıflandırmasına bakılması önerilmiş. [C]"}, {"id": "tiroid-03", "title": "Tiroid nodülüne / kitlesine yaklaşım (anamnez, FM, lab, algoritma)", "rows": [16, 18, 137, 187, 355], "merged": "**Tanım:** Nodül; tiroid parankimini oluşturan hücrelerden (foliküler hücreler, parafoliküler C hücreleri, Hürthle hücreleri) köken alan, benign ya da malign olabilen, hormon sentezleyebilen ya da sentezlemeyen, 1–2 mm'den 7–8 cm'e kadar ulaşan her türlü neoplaziye verilen addır. [D]\n\n### Anamnez\n- Genel semptomlar: halsizlik, yorgunluk, unutkanlık, üşüme, kabızlık ya da ishal, ses kabalaşması, sinirlilik, çarpıntı, terleme, sıcağa tahammülsüzlük, kas sertliği ve kas ağrıları. [A]\n- Kitleye özgü: hızlı büyüyen boyun kitlesi; bası ve invazyon semptomları (yutma güçlüğü, ses kısıklığı, nefes darlığı). [A, D]\n- Nodülün ne zamandır var olduğu, büyüme hızı, eski tetkikler, yapılan tedaviler, daha önce aspirasyon yapılıp yapılmadığı. [D]\n- Hipo veya hipertiroidiyi düşündürecek semptomlar var mı. [D]\n- Çocukluk döneminde baş-boyun bölgesine radyoterapi öyküsü ya da kemik iliği transplantasyonu için tüm vücut ışınlaması; çocukluk/adölesan döneminde iyonize radyasyona maruziyet (nükleer kazalar). [A, D]\n- Ailede tiroid hastalığı, ailede tiroid kanseri ya da birinci derece akrabada tiroid kanseri sendromu öyküsü. [A, D]\n- İnfertilite öyküsü, oligomenore, düzensiz ve yoğun kanamalar. [A]\n- Eşlik eden hastalıklar: pernisiyöz anemi, romatoid artrit, tip 1 DM, Addison, MEN sendromları, karpal tünel sendromu, depresyon, demans. [A]\n- İyotlu tuz kullanımı, kullandığı ilaçlar, sigara içimi, malignite için yüksek riskli grupta olup olmadığı. [D]\n\n### Fizik muayene\n- Sistemik muayene: kan basıncı, nabız, kardiyak değerlendirme. [D]\n- Tiroid bezi ve servikal lenf nodları dikkatle incelenir; nodül(ler)in yeri, sayısı, boyutu, kıvamı, yüzey özellikleri, fikse/sert olup olmadığı, bezin diffüz ve bilateral olup olmadığı, ağrı ve hassasiyet kaydedilir. 1 cm altı nodüller genellikle nonpalpabldir. [A, D]\n- İnspeksiyonla bir lob normal görülse bile muayene edilmelidir. [D, E]\n- Palpasyonla büyümüş tiroidin sınırları; nodüllerin yeri, sayısı, büyüklüğü ve kıvamı değerlendirilir (parankimatöz guatrlar yumuşak ve direngen, kolloidal guatr çok yumuşak, adenomlar katı). [D, E]\n- Damardan zengin kitleler pulsatildir. Tiroidin önündeki ve arkasındaki oluşumlarla ilişkisine bakılır: vertikal hareketsiz, transvers hareketlidir. [D, E]\n- Büyümüş tiroidin çevre dokulara basısı: trakea basısı nefes darlığı, özofagus basısı disfaji yapar; damar basısı ile siyanoz, yüz ve boyun yüzeyel venlerinde dilatasyon görülebilir. [D, E]\n- Subklinik venöz bası, hasta kollarını yukarı kaldırdığında daha belirgin hale gelir; eksternal juguler ve süperfisyel boyun venlerinde şişkinlik oluşur (Maronon manevrası / Pemberton belirtisi). [D, E]\n- Oskültasyonla üfürüm duyulabilir. [D, E]\n- Malign nodülü düşündüren fizik bulgular: nodülün çok sert, duyarsız, çevre dokulara fikse olması; vokal kord paralizisi; dispne, disfaji; bölgesel LAP varlığı. [D, E]\n- Ses kısıklığı (vokal kord paralizisi), yutma güçlüğü ve solunum zorluğu aranır. [D]\n\n### Tanı algoritması\n1. Öncelikle tiroid fonksiyon testlerine bakılır (sTSH, sT3, sT4). [B, C, D, E]\n2. **TSH yüksek veya normal:** Hipotiroidi düşünülür, nodüle ultrasonla bakılır; USG'de yerleşim, şekil, boyut, sınırlar, içerik, ekojenik yapı ve kanlanma değerlendirilir. [B, C]\n   - Nodül kistik ise takip edilir. Nodül mikst veya solid ise ve malignite şüphesi varsa (düzensiz kenar, santral mikrokalsifikasyon, küresel ve sert nodül) biyopsi (TİİAB) yapılır. [C, E]\n3. **TSH düşük:** Hipertiroidi gösterir (T3/T4 fazla salgılandığı için TSH baskılanmıştır); tiroid sintigrafisi yapılır (sebep tiroidin kendi parankimi mi yoksa nodül mü?). Sintigrafi sonucuna göre: toksik nodüler guatr, diffüz toksik guatr (Graves hastalığı), toksik multinodüler guatr, diffüz toksik goitre + soğuk nodül saptanabilir. [C, D, E]\n4. Hava yolu basısı, çevreye invazyon derecesi ya da retrosternal uzanım gösteren guatrlarda boyun ve üst mediasten BT/MR kullanılır. [C, D, E]\n\n> ⚠ Kaynaklar çelişiyor: B'de biyopsi kararı \"USG'de mikst veya soliter nodül görülmesi\" ile veriliyor; C ve E'de biyopsi için ayrıca malignite şüphesi bulguları (düzensiz kenar, mikrokalsifikasyon, sertlik) şart koşuluyor.\n\n### Diğer tanı araçları\n- Tiroid otoantikorları: Anti-Tg, Anti-TPO, TRAb (TSH reseptör antikoru). [D, E]\n- Kord vokal muayenesi. [D, E]"}, {"id": "tiroid-04", "title": "Tiroid nodülünde malignite kriterleri", "rows": [85, 138, 304], "merged": "### Anamnez\n- Baş-boyun bölgesine uygulanmış radyoterapi öyküsü veya radyoaktif kontaminasyon. [C]\n- Nodülde hızlı büyüme. [A, C]\n- Bası ve invazyon semptomları: disfoni, disfaji, hemoptizi, dispne. [A, C]\n- Tiroid hormonu ile supresyon yapılmasına rağmen nodülde büyüme olması. [A, C]\n- Ailede tiroid kanseri öyküsü, MEN öyküsü. [A, C]\n- Erkek cinsiyet; yaş <20 veya >55 olması. [C]\n\n### Fizik muayene\n- Nodülün çok sert olması. [A, C]\n- Nodülün 4 cm'den büyük olması. [A, C]\n- Duyarsız olması (ağrı belirgin değil). [C]\n- Nodül yüzeyinin düzensiz olması. [A, C]\n- Çevre dokulara fikse olması. [A, C]\n- Vokal kord paralizisi, dispne, disfaji. [C]\n- Bölgesel LAP varlığı. [A, C]\n\n### Ultrasonografi\n- Düzensiz kenarlı nodül. [A, C]\n- Belirgin hipoekojenite. [C]\n- Santral mikrokalsifikasyon. [A, C]\n- İnkomplet halo. [C]\n- Servikal LAP. [A, C]\n- Heterojen görünüm: kanlanma paterni nodülün büyümesine yetişemeyebilir, nodülün bazı kısımları nekroza gidebilir. [A, C]\n- Daha küresel şekil, düşük elastisite (sert). [C]\n\n### Doppler USG\n- Santral kanlanma (Tip 3): kaotik görüntü; benign nodüllerde periferal kanlanma görülür. [A, C]\n\n### Sintigrafi\n- Soğuk nodül olması. [A]"}, {"id": "tiroid-05", "title": "Tiroid kanseri sınıflaması, tipleri ve tedavisi", "rows": [19, 30, 39, 86, 150, 158, 159, 262, 313, 380], "merged": "**Tanım:** Tiroid kanseri en sık görülen endokrin kanserdir, tüm insan kanserlerinin %1–4'ünü oluşturur. Hastaların %80'i düşük risklidir, %10'unda nüks görülür. Etiyolojide radyasyon, iyot eksikliği, onkogenler (BRAF, RAS, RET/PTC1) rol oynar; Cowden sendromu, ailesel adenomatöz polipozis ve Gardner sendromu ile birliktelik görülebilir. [B, H]\n\n### Sınıflama\n- **Differansiye (foliküler hücre kökenli):** Papiller (%80), Foliküler (%10), Hürthle hücreli (%3). [B, C, D, H]\n- **Undifferansiye:** Anaplastik (%1), Lenfoma, Metastatik (%1–2), Medüller (%5). [B, C, D, H]\n- Medüller karsinom, foliküllerden değil parafoliküler C hücrelerinden köken aldığı için undifferansiye grupta sınıflandırılır; parafoliküler C hücreleri kalsitonin üretir. [J]\n\n> ⚠ Kaynaklar çelişiyor: D, medüller karsinomu \"undifferansiye\" grupta sayarken, bazı kaynaklar (B, C) medülleri ayrı bir satır olarak undifferansiye başlığı altında listeler; sınıflamanın kendisi tüm kaynaklarda aynı, sadece J bu ayrımın nedenini açıklıyor.\n\n### Papiller tiroid karsinomu\n- En sık görülen tiroid kanseridir, prognozu en iyi olanıdır. Kadınlarda erkeklere göre iki kat fazla görülür, ortalama görülme yaşı 30–40'tır. [B, E, F, G]\n- Hastaların çoğu ötiroittir. [C]\n- %95 sporodik, %5 ailesel; BRAF, RAS ve RET/PTC1 gibi onkogenler sık bulunur. [B, E]\n- Çoğunlukla lenfatik yolla yayılır; tümör tek odak ya da multipl odaklar halinde (%30–50) olabilir, bilateral olabilir (%20). [B, E, G]\n- Servikal lenfadenopati (tiroid içi, paratrakeal, servikal lenfatiklere yayılım) %25–43; ekstratiroideal yayılım %15–21; vasküler invazyon %3,5; uzak metastaz ihtimali %1–2,8. [E]\n- Lokal invaziv hastalıkta ses kısıklığı, disfaji, dispne olabilir. Uzak metastazın en sık geliştiği organlar akciğer, kemik, karaciğer ve beyindir. [C]\n- Tanı, tiroid bezindeki kitleden veya lenf nodundan yapılan İİAB ile doğrulanır. [C]\n- **Kötü prognoz kriterleri:** yaş <20 veya >55, erkek cinsiyet, ailede papiller tiroid kanseri öyküsü, agresif alt tipler (tall cell, diffüz sklerozan), Graves hastalığı ile birliktelik, çocuklukta radyoterapi öyküsü, kapsül dışına taşan lokal invazyonlu tümör, az differansiye tümör, tümör çapı >4 cm, multifokal tümör, lenf nodu metastazı. [B, G, H]\n- **Tedavi:** Total tiroidektomi (veya totale yakın tiroidektomi) + tümörün olduğu tarafa (ipsilateral) santral lenf nodu diseksiyonu. Karsinomun bulunduğu tarafta lenf nodu pozitifliği varsa o tarafa modifiye radikal boyun diseksiyonu yapılır. İkinci, üçüncü ve dördüncü bölge (üst, orta ve alt juguler lenf nodları) standart olarak temizlenir; bölge beşte metastaz gösterilmemişse bölge beşe girilmez. Total tiroidektomiden sonra hipotiroidiyi ve rekürrensi önlemek için tiroksin (TSH supresyonu) verilir. MikroPTK'da hasta iyi prognostik grupta ise unilateral lobektomi + ipsilateral santral lenf nodu diseksiyonu yeterli olabilir. [A, B, C, E, F]\n\n> ⚠ Kaynaklar çelişiyor: Papiller karsinomda kötü prognoz için yaş sınırı B ve G'de \"20 yaş altı, 55 yaş üstü\" iken H'de \"20 yaş altı, 50 yaş üstü\" olarak verilmiş.\n\n### Foliküler karsinom\n- Kadınlarda 3 kat fazla görülür, 50 yaş ve üstü grupta daha sık ortaya çıkar. İyot eksikliği olan bölgelerde sıklığı artmıştır. [B, C, E]\n- PAX8/PPARγ gen ekspresyonu görülür; genellikle soliter olup iyot eksikliği bölgelerinde sıktır; olguların genelinde tümör bir kapsülle çevrilidir. [B, E]\n- Kanser tanısı kapsül ve vasküler invazyon bulunmasıyla konur; İİAB ile foliküler adenom ile foliküler karsinom ayrımı yapılamaz. [B, C, J]\n- Metastatik yayılım hematojen yolla olur (vasküler invazyon); lenfatik yayılım enderdir, geç dönemde görülür. Kemik, akciğer ve karaciğer metastazları sıktır. [B, C, E]\n- Çoğunluğu ötiroittir; tümör hormonal faaliyet gösterip hiperfonksiyona (hipertiroidizm, %1) yol açabilir. [C, E]\n- **Prognozu kötü etkileyen faktörler:** yaşın 50 üstü olması, nodülün 3 cm'den büyük olması, yüksek grade, belirgin vasküler invazyon, tiroid dışına yayılım, tanı sırasında uzak metastaz olması. [B, H]\n- **Tedavi:** Total tiroidektomi (istmus ve piramidal lobu içerecek şekilde); lenfatik tutulum ender olduğu için santral ya da lateral diseksiyona çoğu zaman ihtiyaç duyulmaz; şüpheli lenf bezi büyümesi/metastaz varsa diseksiyon yapılır. [B, C, E, F]\n\n### Hürthle hücreli kanser\n- Foliküler hücreli tümörlerin bir varyantıdır, oksifilik hücrelerden gelişir. [B, C]\n- Tiroglobulin üretir ancak radyoaktif iyot (RAI) tutmazlar ya da az tutarlar; RAI tedaviye etkisizdir. [B]\n- Bilateral ve multifokal olma, daha sık servikal lenf metastazı yapma eğilimindedir; İİAB \"Hürthle hücreli neoplazi\" olarak raporlanır, radyoaktif iyot tutulumu nadirdir, İİAB ile tanı konamaz. [B, C]\n- **Tedavi:** Total tiroidektomi + santral diseksiyon, gerekirse lateral diseksiyon (C'ye göre lobektomi ve istmusektomi). Radyoterapi nadiren lokal invaziv veya nüks hastalıkta, RAI tutmayan kemik metastazlarında ağrı tedavisinde kullanılabilir. [B, C, F]\n\n> ⚠ Kaynaklar çelişiyor: Hürthle hücreli kanserde cerrahi kapsamı B ve F'de \"total tiroidektomi + santral (± lateral) diseksiyon\" olarak verilirken, C'de \"lobektomi ve istmusektomi yeterli\" denmiş.\n\n### Medüller tiroid karsinomu (MTK)\n- Tiroidin kalsitonin salgılayan parafoliküler C hücrelerinden köken alır (üst kutup lateralinde yer alır); bu hücreler nöral krest kökenli olup APUD sisteminin parçasıdır. [B, C, G]\n- Amiloid varlığı tanı koydurucudur; kadınlarda 1,5 kat daha sık görülür. [B, G]\n- %75 sporodik (sporadik olgular 50–60 yaşlarda), %25 ailesel (ailesel olgular daha genç yaşlarda); otozomal dominant kalıtılır. [B, C, G]\n- C hücre hiperplazisi premalign bir lezyondur ve ailesel olgularda görülür; bu olgularda total tiroidektomi yapmak gerekir. [B, G]\n- RET mutasyonu: ailesel olgularda %95–98, sporadik olgularda %50. [B, G]\n- Hem lenfojen hem de hematojen (kan yoluyla) yayılır. [B, G]\n- **Prognoz (iyiden kötüye):** Ailesel non-MEN (en iyi prognoz, endokrin/nöral lezyon eşlik etmez, geç yaşlarda görülür) > Ailesel MEN IIA / Sipple sendromu (ikinci en iyi, bilateral, feokromositoma ve hiperparatiroidizm ile birlikte) > Sporadik (üçüncü, tek taraflı, kötü seyirli; diğer tiplerde tümör multisenterik iken sporadikte tek taraflıdır) > Ailesel MEN IIB (en kötü prognoz, en nadir görülen, bilateral feokromositoma, mukozal ganglionöromalar, marfanoid vücut yapısı ve epifiz anomalileriyle birlikte). [B, G, H]\n- **Tanı:** Anamnez (aile öyküsü önemli), fizik muayene, artmış serum kalsitonin ve CEA düzeyleri tanısaldır; tiroiddeki nodüle TİİAB yapılır. MTK tanısından sonra RET mutasyon araştırması yapılır; RET pozitifse aile taraması, feokromositoma için 24 saatlik idrarda VMA ve metanefrin bakılır; aile taramasında RET onkogeni varsa profilaktik total tiroidektomi yapılır. [B, F]\n- **Tedavi:** Total tiroidektomi + bilateral santral lenf nodu diseksiyonu standart başlangıç ameliyatıdır; lateral boyunda metastaz varsa modifiye boyun diseksiyonu eklenir. Tümör C hücresi kökenli olduğu için radyoaktif iyot tedavisi ve T4 ile TSH supresyon tedavisi yararlı değildir. Nüks araştırması için boyun ve mediasten USG, BT/MR, PET/CT yapılır. Lokal ileri-metastatik hastalıkta tirozin kinaz inhibitörleri (vandetanib, kabozantanib) kullanılır. [B, C, F]\n\n### Anaplastik karsinom\n- İnsan vücudundaki en agresif tümörlerden biridir; çoğu kez differansiye tiroid kanserlerinden köken alır. [B, H]\n- Tanı sırasında çoğunlukla lenf nodu metastazı bulunur. [B]\n- Tanı, TİİAB ile karakteristik dev ve multinükleer hücrelerin, differansiasyonunu tamamen kaybetmiş atipik ve pleomorfik hücrelerin görülmesiyle konur. [B, F]\n- **Tedavi:** Total tiroidektomi ve bilateral boyun diseksiyonu en iyi seçenektir; yapılamıyorsa kitle küçültücü cerrahi ile radyoterapi ve kemoterapi verilebilir. [B, F]\n\n### Lenfoma\n- Genel bir lenfomanın tiroid tutulumu olabileceği gibi izole tiroid lenfoması da olabilir. [B]\n- Tanı için TİİAB yeterli değildir; eksizyonel biyopsi ya da tru-cut biyopsi gerekir. [B, F]\n- **Tedavi:** Kemoterapiye yanıt iyi ve hızlıdır; yanıt vermeyen hastalarda tiroidektomi yapılabilir. [B, F]\n\n### Metastatik karsinom\n- Başka kanserlerin tiroide metastazı nadirdir; hipernefroma, meme, akciğer, melanom ve bronkojenik kanserler tiroide metastaz yapabilir. [B]\n- **Tedavi:** Semptomatik olgularda tiroidektomi yapılır. [B, F]\n\n### Lateral aberrant tiroid\n- Lateral aberrant tiroid = papiller tiroid kanseri (boyunda ektopik görünen tiroid dokusu aslında papiller kanserin lenf nodu metastazıdır). [H]\n\n> ⚠ \"Tiroidle ilgili her şey\" sorusuna verilen cevap (\"TIROID\") konuyla ilgisiz / içeriksiz olduğu için değerlendirmeye alınmadı."}, {"id": "tiroid-06", "title": "Tiroid kanseri risk faktörleri ve prognoz", "rows": [312, 379], "merged": "### Risk faktörleri ve prognoz\n- Yaş <20 veya >60 (B'de \"60 üstü\", soru metninde \"65 yaşından büyük\" ifadesi geçiyor) olması riski ve kötü seyri artırır. [B]\n\n> ⚠ B'nin soru metninde yaş sınırı \"20 yaşından küçük, 65 yaşından büyük\" olarak geçerken, cevap metninde \"20 nin altı 60 ın üstü\" yazılmış.\n\n### Fizik muayene bulguları (malignite düşündüren)\n- Nodülün 4 cm'den büyük olması, fikse olması, sert olması, yüzeyinin düzensiz olması, beraberinde LAP olması kanseri düşündürür. [B]\n\n### USG bulguları (malignite düşündüren)\n- Heterojen görünüm, belirgin hipoekojenite, santral mikrokalsifikasyonlar, inkomplet halo, Doppler'de santral kanlanma, servikal LAP, dik yumurta görünümü, düşük elastisite, daha küresel şekil. [B]\n\n> ⚠ A'nın cevabı soruda istenen risk faktörleri yerine Bethesda sınıflamasını anlatıyor (konuyla ilgisiz / başka bir soruya verilmiş gibi görünüyor), bu nedenle buraya alınmadı."}, {"id": "tiroid-07", "title": "Tiroidektomi tipleri, total vs lobektomi", "rows": [20, 160], "merged": "### Tiroidektomi çeşitleri\n- Ekstrakapsüler tiroidektomi, lobektomi, total tiroidektomi, istmektomi, subtotal tiroidektomi, totale yakın tiroidektomi, Hartley-Dunhill operasyonu. [A]\n\n### Total tiroidektominin lobektomiye göre avantajları\n- Multifokal hastalığın (differansiye tiroid kanserlerinde %30–50) yok edilmesi. [B]\n- Lokal nüks riskinin azalması. [A, B]\n- Rezidüel dokuda anaplastik tümör / anaplazi gelişme riskinin ortadan kalkması. [A, B]\n- Metastazların tiroid sintigrafisiyle saptanabilmesi. [A, B]\n- RAI (radyoaktif iyot) ile tedavi şansının artması. [A, B]\n- Kan tiroglobulin düzeylerinin nüks ve persistan hastalık tanısında değer kazanması. [A, B]\n\n### Dezavantajı\n- Hipoparatiroidizm (riski). [B]\n\n### Hipokalsemi bulguları\n- **Chvostek bulgusu:** Hipokalsemi sonucu görülen tetani belirtilerinden biridir; hastanın fasiyal sinirine vurulduğunda yüz kasları, özellikle ağız köşesi seğirir ve kasılır. [A]\n- **Trousseau bulgusu:** Hipokalsemide görülür; tansiyon manşonu üst kola bağlanıp sistolik ile diyastolik basınç arası bir değerde şişirilir, el kaslarında spazm olur (ebe eli / obstetrik el). [A]"}, {"id": "tiroid-08", "title": "Tiroidektomi komplikasyonları, hipokalsemi, Chvostek–Trousseau", "rows": [34, 72, 201, 250, 373], "merged": "### Tiroidektomi komplikasyonları\n1. **Kanama / hematom:** Boyun lojunun hacmi çok küçük olduğu için 100–150 cc'lik kanama bile trakeaya bası yaparak solunum arrestine neden olabilir; hasta nefes alamıyorsa acil insizyonla hematom boşaltılmalıdır. En ölümcül komplikasyondur. [C, D, E]\n2. **Hipoparatiroidi / hipokalsemi:** Postoperatif en sık karşılaşılan komplikasyonlardan biridir. [C, D, E]\n3. **Hipotiroidizm.** [D, E]\n4. **Rekürren laringeal sinir (RLS/RLN) yaralanması:** Tek taraflı yaralanmada kalıcı ses kısıklığı / boğuk ses oluşur; sinir larinksin alt kısmının duyusunu sağladığı ve kordun tam kapanmadığı için aspirasyon meydana gelir. Çift taraflı (bilateral) yaralanma tiroid cerrahisinin en ciddi komplikasyonudur; inspiratuar stridor, dispne, minimal disfoni ile seyreder, ciddi hava yolu obstrüksiyonuna yol açar; hasta hayat boyu trakeostomi ile yaşamak zorunda kalabilir. [C, D, E]\n5. **Superior laringeal sinir (eksternal dal) yaralanması:** Normal konuşma sesi genellikle korunur, ancak ses/şarkı söylerken tiz/yüksek sesleri elde edememe, bozulmuş ses tonu, vokal zayıflık veya yorgunluk görülür. [C, D, E]\n6. **Hava yolu obstrüksiyonu.** [E]\n7. **Tiroid krizi.** [E]\n8. **Kötü kozmezis.** [E]\n9. Diğer: enfeksiyon, hava yolu zedelenmesi. [C]\n\n> ⚠ C'nin cevabının büyük bölümü sorunun \"tiroid ca sınıflaması\" kısmına ayrılmış (papiller/foliküler/medüller kanserlerin tanım, sıklık ve epidemiyolojisi); bu kısım bu kümenin konusuyla doğrudan ilgili olmadığı için merged cevaba alınmadı, yalnızca komplikasyonlarla ilgili bölüm kullanıldı.\n\n### Vokal kord innervasyonu\n- Vokal kordu larinksteki adduktör ve abduktör kaslar gerer ve gevşetir. Krikotiroid kas hariç tüm adduktör ve abduktör kaslar nervus laryngeus inferior (rekürren laringeal sinir) tarafından, krikotiroid kas ise nervus laryngeus superior tarafından innerve edilir. [E]\n\n### Paratiroid hasarını gösteren muayene bulguları (hipokalsemi)\n- **Chvostek bulgusu:** Kulağın ön tarafına / çene açısında masseter kası üzerine hafifçe parmakla vurulduğunda fasiyal sinir uyarılır, yüzün aynı tarafında yüz kaslarında (özellikle ağız köşesi, dudak kenarı, burun) seğirme/kasılma oluşur. [A, B]\n- **Trousseau bulgusu:** Kola uygulanan tansiyon aleti manşonuna sistolik basıncın üzerinde (yaklaşık 20 mmHg üstünde) basınç uygulanıp birkaç dakika (yaklaşık 3 dakika) tutulduğunda karpal spazm (el bileği ve metakarpofalangeal eklemlerde fleksiyon, parmaklarda hiperekstansiyon, başparmakta avuç içine fleksiyon = \"ebe eli\" / \"obstetrik el\" görünümü) ortaya çıkar. [A, B]\n\n### Tiroidektomi sonrası takip\n- Supresyon dozunda levotiroksin verilir (>125 mikrogram/gün); TSH değerleri 0.3–1 arasında tutulmaya çalışılır. [B]\n- Tiroglobulin ile izlenir; >3 ng/ml gelirse metastaz veya rezidü doku kalmasından şüphelenilir. Metastazdan şüpheleniliyorsa RAI ile sintigrafi çekilebilir. [B]\n\n### Hipokalsemide korkulan durumlar\n- Laringospazm, konvülsiyon, ventriküler fibrilasyon ve aritmi. [B]"}, {"id": "tiroid-09", "title": "Tiroglobulin ve tiroidektomi sonrası takip", "rows": [21, 161], "merged": "**Tanım:** Tiroglobulin, tiroidin foliküler hücrelerinden sentezlenir; tiroid hormonlarını folikül içinde bağlı tutmaya yarar. [A, B]\n\n### Tiroidektomi sonrası takip\n- Papiller kanser nedeniyle bilateral total tiroidektomi sonrası tiroglobulin düzeyi, TSH ve sintigrafi ile takip edilir. [B]\n- Total tiroidektomi sonrası tiroglobulinin yok denecek kadar az olması beklenir. [B]\n\n### Yüksek tiroglobulin ne anlama gelir?\n- Total tiroidektomi yapılan hastalarda tiroglobulin düzeyinin 3 ng/ml'nin üzerinde olması metastazı veya geride tiroid dokusu kaldığını gösterir. [A]\n- Foliküler hücre kökenli tiroid kanseri olan hastaların %95'inde persistan veya rekürren kanser varlığında tiroglobulin 3 ng/ml'nin üzerine çıkar. [A]"}, {"id": "tiroid-10", "title": "Medüller tiroid kanseri", "rows": [336], "merged": null}, {"id": "tiroid-11", "title": "RAİ ile tedavi edilemeyen tiroid hastalıkları", "rows": [338], "merged": null}]}, {"id": "paratiroid", "title": "Paratiroid ve Kalsiyum", "clusters": [{"id": "paratiroid-01", "title": "Hiperparatiroidi (primer, sekonder, tersiyer)", "rows": [33, 42, 108, 131, 362], "merged": "**Tanım:** Hiperparatiroidi, paratiroid bezlerinin hiperfonksiyonu sonucu PTH'nın aşırı salgılanmasıdır; primer, sekonder ve tersiyer olmak üzere 3 tipi vardır. [C, D, E]\n\n### Primer hiperparatiroidi\n- Paratiroid bezlerinden bir veya birden fazlası büyüyerek fazla PTH üretmeye başlar; serum kalsiyumun normal feedback kontrolü bozulmuştur. Normal bezde kalsiyum yükselince PTH üretimi azalırken, büyümüş bez bu baskılayıcı etkiden kurtulup otonomi kazanır ve kontrolsüzce PTH salgılamaya devam eder. [B, C, D]\n- Poliklinik hastalarında hiperkalseminin en sık nedenidir; hastanede yatan hastalarda ise en sık neden kansere bağlı kalsiyum yüksekliğidir. [B]\n- Kadınlarda erkeklere göre daha sık görülür; yaşla birlikte (özellikle 50 yaş sonrası) görülme sıklığı belirgin artar. [B]\n- **Etiyoloji:** %80–85 tek bezde paratiroid adenomu, %4–5 çift bezde adenom, %10–15 çoklu bez hastalığı (tüm bezlerde hiperplazi, tümör değil), <%1 paratiroid kanseri. [B, C]\n- **Sporadik primer hiperparatiroidizm:** En sık tiptir (%95); net etiyolojisi bilinmez, boyun bölgesine ışın alınması ve menopoz önemli etken faktörlerdir. [B]\n- **Ailesel hiperparatiroidizmler (%5):** Kalıtsaldır, daha genç yaşta ortaya çıkar, genellikle 4 paratiroid bezini de tutar.\n  - **MEN I:** 11. kromozomdaki menin genindeki mutasyonla oluşan otozomal dominant sendrom; paratiroid, hipofiz ve pankreas tümörlerini içerir. Bu mutasyonu taşıyanların %90–95'inde primer hiperparatiroidi gelişir, tüm bezler tutulur. [B]\n  - **MEN II:** 10. kromozomdaki RET protoonkogeninin aktive edici mutasyonuyla oluşan otozomal dominant sendromdur. [B]\n  - **Çene (jaw) sendromu:** HRPT2 genindeki mutasyonla oluşan otozomal dominant sendrom; paratiroid hastalığı ve çene kemiği tümörleri birlikte görülür, tek ya da birden fazla bez tutulabilir, paratiroid kanseri riski artmıştır. [B]\n- **Klinik:** \"Stones, bones, moans, abdominal groans\" — böbrek taşı / nefrokalsinoz (zamanla böbrek yetmezliği), kemik ağrıları, güçsüzlük, depresif duygulanım, kas ağrıları, iştahsızlık, bulantı, kusma, kabızlık, polidipsi/poliüri, kaşıntı, yorgunluk; solunum güçlüğü ve mide ülseri saptanabilir. [C, D, E]\n- **Biyokimyasal bulgular:** Kalsiyum yüksek, parathormon yüksek, fosfor normalin alt sınırında veya düşük, alkalin fosfataz yüksek olabilir, 24 saatlik idrar kalsiyumu normal (100–400 mg/gün) veya yüksektir (bu, idrar kalsiyumu düşük olan Familyal Hipokalsiürik Hiperkalsemiden ayırt edici özelliktir). [B, C]\n- **Görüntüleme:** El ve kafatası grafileri osteitis fibroza sistikayı gösterebilir; abdominal USG böbrek taşlarını gösterebilir; paratiroid bezinin lokalizasyonu için teknesyumlu sintigrafi ve/veya USG kullanılabilir; ektopik tümörlerin lokalizasyonunda BT ve MR kullanılabilir; selektif venöz örnekleme de yapılabilir — her yöntemin kendine özgü avantaj ve dezavantajları vardır. [D]\n- **Tedavi:** Etkili ve kalıcı tek tedavi cerrahidir. [B, C, D]\n\n### Sekonder hiperparatiroidi\n- Paratiroid bezlerinin, böbrek yetmezliği veya gastrointestinal kalsiyum emiliminin bozulması gibi hipokalsemik durumlarda kan kalsiyumunu normal sınırlarda tutabilmek için uyarılıp büyümesi ve fazla hormon salgılamasıyla oluşan tablodur; kompansatuar bir yanıttır. Altta yatan sorun düzeltilince geriye dönebilir. [B, D, E]\n- Kronik böbrek yetmezliği en sık sebebidir: fosfat atımı bozulur, kan fosfatı yükselir; yüksek fosfat serum kalsiyumunu baskılayarak kalsiyumu düşürür, bu da paratiroid bezlerini uyarıp PTH salgısını artırır. [B]\n- **Biyokimyasal bulgular:** Kalsiyum düşük, normal veya yüksek olabilir (ileri evrede bezlerde otonomi gelişmesiyle hiperkalsemi de görülebilir). Fosfat genelde yüksektir (böbrekten atılımın azalması, barsaktan emilimin sürmesi, yüksek PTH'ye bağlı kemikten fosfat salınımı). PTH düzeyi yüksektir ve hastalık ilerledikçe artar (normalin 3 katına kadar artış, düşük aktif D vitaminini kompanse etmek için fizyolojik kabul edilir); ALP kronik böbrek yetmezliğine bağlı düşüktür. [B]\n- **Tedavi:** Diyaliz ya da fosfat bağlayan ajanlar; medikal tedaviye dirençli PTH yüksekliğinde tek geçerli seçenek cerrahidir. [B, C]\n\n### Tersiyer hiperparatiroidi\n- Sekonder hiperparatiroidiye neden olan uyarı ortadan kalksa bile, hiperplazik paratiroid bezlerinin kontrolden çıkıp kendi başına çalışmaya devam etmesidir (otonom hipersekresyon). [B, C]\n- Tedavi edilmiş sekonder hiperparatiroidizmden en az bir yıl sonra, plazma kalsiyum ve fosfat düzeylerinden bağımsız olarak PTH salgılamaya devam eden adenom varlığı şeklinde de tanımlanır. [E]\n\n> ⚠ A'nın cevabı \"DETAYLI YAZ\" şeklinde boş/placeholder olduğu için değerlendirmeye alınmadı."}, {"id": "paratiroid-02", "title": "Hiperkalsemi ve hipokalsemi", "rows": [32, 41], "merged": "**Tanım:** Normal kalsiyum değer aralığı 2.1–2.6 mmol/L (8.8–10.7 mg/dl, 4.3–5.2 mEq/L)'dir. Hiperkalsemi, total kalsiyumun 10,5 mg/dl'nin üzerinde veya iyonize kalsiyumun 2,7 mEq/L'den fazla olmasıdır. [B]\n\n### Hiperkalsemi nedenleri\n- Vakaların %90'ından fazlası hiperparatiroidizm ve malignite ile ilişkilidir; malignite kökenli hiperkalsemi acil serviste en sık karşılaşılan nedenlerdendir. [B]\n- Hiperparatiroidizm en sık görülen nedendir, genellikle hafif, asemptomatik ve yıllarca devam eder; multipl endokrin neoplazi tip 1'in (MEN1, Wermer sendromu) bir parçası olabilir. [B]\n- Maligniteden kaynaklanan hiperkalsemi genellikle progresiftir; hızla yükselen kalsiyum seviyelerinde malignite akla gelmelidir (meme, akciğer, böbrek kanserleri, multipl miyelom, lenfoma, lösemi). Bu durumlarda periferik kan yayması ve/veya serum-idrar immünofiksasyon elektroforezi yapılabilir; doku histolojisi için solid tümörden veya kemik iliğinden biyopsi alınabilir. [B]\n\n### Hiperkalsemi şiddet sınıflaması\n- Hafif: Total Ca 10.5–11.9 mg/dL (2.5–3 mmol/L) veya iyonize Ca 5.6–8 mg/dL (1.4–2 mmol/L). [B]\n- Orta: Total Ca 12–13.9 mg/dL (3–3.5 mmol/L) veya iyonize Ca 8–10 mg/dL (2–2.5 mmol/L). [B]\n- Hiperkalsemik kriz: Total Ca 14–16 mg/dL (3.5–4 mmol/L) veya iyonize Ca 10–12 mg/dL (2.5–3 mmol/L). [B]\n- Yaklaşık 15 mg/dL üzerindeki seviyeler genellikle tıbbi acil durum olarak kabul edilir ve agresif tedavi edilmelidir. [A, B]\n\n### Klinik\n- Semptomların şiddeti sadece kalsiyum seviyesine değil, serum kalsiyumundaki yükselmenin hızına da bağlıdır: hafif ve uzamış hiperkalsemi asemptomatik seyredebilir veya tekrarlayan böbrek taşına yol açabilirken, ani başlangıçlı ve şiddetli hiperkalsemi konfüzyon ve letarji dahil dramatik semptomlara neden olabilir. [A, B]\n- Hiperkalsemi vücuttaki neredeyse tüm organ sistemlerini, özellikle merkezi sinir sistemini ve böbrekleri etkiler. Kardiyak etkiler aritmi kaynaklı senkopu içerir; kalsiyum pozitif inotropik etkiye sahiptir. Renal fonksiyon bozukluğuna ve direkt vazokonstriksiyona bağlı hipertansiyona neden olur. [A, B]\n- En karakteristik EKG değişikliği QT aralığının kısalmasıdır. [B]\n\n### Tanı\n- İmmünoreaktif PTH ve iyonize kalsiyum eş zamanlı ölçülmelidir. Hiperkalsemide PTH baskılanmış olmalıdır; normal PTH ile birlikte yüksek kalsiyum, hafif hiperparatiroidizmi gösterir. [B]\n\n### Hiperkalsemi tedavisi\n- **Hafif (Ca <12 mg/dL), asemptomatik veya hafif semptomatik:** Acil tedavi gerekmez; tiyazid diüretik ve lityum karbonat tedavisi, hacim tükenmesi, uzamış yatak istirahati/hareketsizlik ve yüksek kalsiyum diyetinden (>1000 mg/gün) kaçınılmalı; nefrolitiyazis riskini azaltmak için günde en az 6–8 bardak su ile hidrasyon önerilir. [A, B]\n- **Orta (Ca 12–14 mg/dL), kronik, asemptomatik veya hafif semptomatik:** Acil tedavi gerekmeyebilir, hafif hiperkalsemideki önlemler uygulanır; ancak belirgin yükselmede daha agresif önlemler gerekebilir. [A, B]\n- **Şiddetli (Ca >14 mg/dL):** Daha agresif tedavi gerekir.\n  1. Öncelikle 200–300 mL/saat hızında izotonik salinle volüm artırılır, ardından idrar çıkışı 100–150 mL/saatte tutulacak şekilde ayarlanır. Böbrek veya kalp yetmezliği olmayan hastalarda, kalsiyum atılımını artırmak için loop diüretik önerilmez (komplikasyon riski ve kemik rezorpsiyonunu inhibe eden ilaçların varlığı nedeniyle). [A, B]\n  2. Kalsitonin (4 IU/kg) uygulanır, serum kalsiyum birkaç saat içinde tekrar ölçülür; hipokalsemik yanıt alınırsa hasta kalsitonine duyarlıdır ve doz her 6–12 saatte bir tekrarlanabilir (4–8 IU/kg). Ca >14 mg/dL ve semptomatik hastalarda tipik olarak kalsitonin bifosfonatla birlikte verilir. [A, B]\n  3. Kalsitonin + salin, serum kalsiyumda 12–48 saat içinde belirgin azalmaya yol açmalıdır; bifosfonat 2.–4. güne kadar etkili olup hiperkalseminin kontrolünü sürdürür. [A, B]\n\n### Hipokalsemi muayene bulguları\n- **Chvostek bulgusu:** Hipokalsemiye bağlı tetani belirtilerinden biridir; hastanın fasiyal sinirine vurulduğunda yüz kasları, özellikle ağız köşesi seğirir ve kasılır. [A]\n- **Trousseau bulgusu:** Hipokalsemide görülür; tansiyon manşonu üst kola bağlanıp sistolik ile diyastolik basınç arasında bir değerde şişirilir, el kaslarında spazm (ebe eli) oluşur. [A]"}]}, {"id": "adrenal", "title": "Adrenal, MEN ve Nöroendokrin", "clusters": [{"id": "adrenal-01", "title": "MEN sendromları", "rows": [17, 211, 254, 264], "merged": null}, {"id": "adrenal-02", "title": "Adrenal insidentaloma", "rows": [65, 83, 365], "merged": null}, {"id": "adrenal-03", "title": "Feokromositoma", "rows": [64], "merged": null}, {"id": "adrenal-04", "title": "Cerrahi tedavi gerektiren adrenal hipertansiyon / genç hipertansif hasta", "rows": [288, 369], "merged": null}, {"id": "adrenal-05", "title": "Hiperaldosteronizm tipleri", "rows": [289], "merged": null}, {"id": "adrenal-06", "title": "Adrenal histoloji, katekolamin sentezi ve reseptörleri", "rows": [290, 370], "merged": null}, {"id": "adrenal-07", "title": "Poliüri–polidipsi ile gelen soluk hasta", "rows": [297], "merged": null}, {"id": "adrenal-08", "title": "Karsinoid tümör / karsinoid sendrom", "rows": [260, 267], "merged": null}, {"id": "adrenal-09", "title": "GİS'te en sık mezenkimal neoplazi (GIST)", "rows": [45], "merged": null}]}, {"id": "meme", "title": "Meme", "clusters": [{"id": "meme-01", "title": "Meme kanseri risk faktörleri", "rows": [5, 37, 96], "merged": null}, {"id": "meme-02", "title": "Meme ameliyatları, meme koruyucu cerrahi ve kontrendikasyonları", "rows": [6, 7, 157, 217], "merged": null}, {"id": "meme-03", "title": "Meme kanseri taraması", "rows": [35, 339], "merged": null}, {"id": "meme-04", "title": "Meme kitlesine yaklaşım, mamografide malignite bulguları", "rows": [135, 185, 203], "merged": null}, {"id": "meme-05", "title": "Meme baş  "kolorektal-01", "title": "Kolon polipleri, sınıflama ve malignite bulguları", "rows": [8, 9, 175, 257], "merged": null}, {"id": "kolorektal-02", "title": "Patoloji raporunun yorumu", "rows": [10], "merged": null}, {"id": "kolorektal-03", "title": "Kolorektal kanser taraması", "rows": [36, 102], "merged": null}, {"id": "kolorektal-04", "title": "Herediter kolorektal kanserler (FAP, HNPCC, Amsterdam, Gardner, Cowden)", "rows": [103, 104, 263, 346, 347, 348, 354], "merged": null}, {"id": "kolorektal-05", "title": "Kolorektal kanser risk faktörleri ve karsinogenez", "rows": [105, 276], "merged": null}, {"id": "kolorektal-06", "title": "Sağ ve sol kolon tümörleri farkları", "rows": [314], "merged": null}, {"id": "kolorektal-07", "title": "Kolorektal kanser yayılım yolları ve metastaz", "rows": [258, 361, 363], "merged": null}, {"id": "kolorektal-08", "title": "İnflamatuvar barsak hastalıkları (Crohn, ÜK)", "rows": [38, 70, 106, 277, 381], "merged": null}, {"id": "kolorektal-09", "title": "Divertiküler hastalık ve divertikülit", "rows": [115, 116, 368], "merged": null}]}, {"id": "anorektal", "title": "Anorektal Hastalıklar", "clusters": [{"id": "anorektal-01", "title": "Anal fissür", "rows": [1, 24, 146, 147, 274], "merged": "**Tanım:** Anal kanalı döşeyen çok katlı yassı epitelde, dentat çizginin altında gelişen longitudinal yırtık / çatlak. İnternal anal sfinkter basıncı anüsü kan basıncından daha çok sıkıyorsa iç yüzde küçük bir çentik oluşur, derin yaraya dönüşüp kronikleşebilir. Toplumda sık, her yaşta görülebilir. [A, E]\n\n### Etiyoloji\n- Travma (büyük katı feçes, diyare / konstipasyon atakları), hipertonik-hiperplastik internal anal sfinkter, azalmış kan akımı / iskemi. [A, E]\n\n### Anamnez ve semptomlar\n- Dışkılama sırasında bıçak kesisi gibi ağrı; defekasyondan sonra saatlerce süren perirektal ağrı ve spazm. [B, C]\n- Dışkının üzerinde parlak kırmızı çizgi şeklinde ya da damla tarzında kanama, sızıntı, defekasyonda zorlanma. [A, B, E]\n\n### Fizik muayene\n- Tanı inspeksiyonla konur: Sims ya da diz-dirsek pozisyonunda kalçalar aralandığında fissür kolaylıkla görülür. [B]\n\n### Akut – kronik ayrımı\n- **Akut:** Yüzeyel yırtık, ama çok ağrılı. [E]\n- **Kronik:** Derin ve inatçı, kenarları kronik inflamasyona bağlı kabarık; 6–8 haftadan uzun süren ağrı. [E]\n- **Kronik fissür triadı:** Anal kanal dışında sentinel pili (nöbetçi meme / skin tag), anal kanal içinde hipertrofik papilla, fibrotik derin fissür tabanı (derin ülser). Bunlar fissürün kendini iyileştirme çabası sonucu oluşur. [D, E]\n\n> ⚠ B'de \"triad\" sorusuna Currarino triadı (konjenital anal malformasyon, presakral kitle, sakral kemik defekti) yazılmış; diğer kaynaklar kronik fissür triadını veriyor.\n\n### Ayırıcı tanı (anal ağrı)\n- Eksternal / tromboze hemoroid, perianal apse (zonklayıcı ağrı), anal kanal kanserleri, rektum kanseri, malign melanom. [B, C]\n- Ülserle seyreden hastalıklar (özellikle fissür lateral yerleşimliyse): ÜK, Crohn, tüberküloz. [A, C]\n- Enfeksiyonlar: Klamidya trakomatis, kondiloma akuminata, şankroid, herpes / HSV, CMV, sifiliz; ayrıca Behçet. [B, C]\n\n### Tedavi (basamaklı)\n1. **Konservatif:** Sıcak oturma banyosu, laksatifler, posalı beslenme, su; topikal lokal anestezik / kortizonlu pomadlar. Akut fissürde oldukça etkili, kronikte faydası azalır. [A, E]\n2. **Kimyasal sfinkterotomi (sfinkter basıncını arteryel basıncın altına indirmek):** Topikal nitrogliserin / gliseril trinitrat (NO donörü), arjinin, kalsiyum kanal blokörleri, muskarinik agonistler. [A, E]\n3. **Botulinum toksini** internal sfinktere: Haftalarca süren parezi ile anal kanal basıncını düşürür, perfüzyonu iyileştirir, iyileşmeyi mümkün kılar. [A, E]\n4. **Lateral internal sfinkterotomi:** Cerrahi tedavi altın standarttır, ancak ilk basamaklar uygulanmadan yapılmaz. [A, E]\n\n### NO donörlerinin etkisi ve yan etkisi\n- Non-adrenerjik non-kolinerjik mekanizma ile internal sfinkter basıncını azaltır, anodermal kan akımını artırır, sfinkterde hasar oluşturmaz. [E]\n- Yan etki: Hastaların %20–25'inde baş ağrısı (sistemik damar gevşemesi); belirgin ama kısa süreli, analjeziklere yanıt verir. [E]"}, {"id": "anorektal-02", "title": "Hemoroid", "rows": [270, 278], "merged": null}, {"id": "anorektal-03", "title": "Anal apse ve fistül", "rows": [195, 273], "merged": null}, {"id": "anorektal-04", "title": "Anal kanal kanserleri", "rows": [238, 271, 272], "merged": null}]}, {"id": "ileus", "title": "İleus ve Akut Karın", "clusters": [{"id": "ileus-01", "title": "İleus: tanım, sınıflama, kardinal bulgular, nedenler", "rows": [43, 44, 51, 162, 180, 181, 189, 357, 364], "merged": null}, {"id": "ileus-02", "title": "Akut karın, peritonit, retroperitoneal organlar", "rows": [117], "merged": null}, {"id": "ileus-03", "title": "Visseral ve parietal ağrı", "rows": [212], "merged": null}]}, {"id": "apandisit", "title": "Akut Apandisit", "clusters": [{"id": "apandisit-01", "title": "Akut apandisit: patogenez, tanı, ilk saat bulguları", "rows": [94, 140, 141, 294, 353], "merged": null}, {"id": "apandisit-02", "title": "Akut apandisit ayırıcı tanısı", "rows": [93, 163, 342], "merged": null}, {"id": "apandisit-03", "title": "Akut apandisit tedavisi ve komplikasyonları", "rows": [95, 165], "merged": null}]}, {"id": "safra", "title": "Safra Kesesi ve Safra Yolları", "clusters": [{"id": "safra-01", "title": "Akut kolesistit: tanı ve yaklaşım", "rows": [71, 79, 130, 177, 182, 358], "merged": null}, {"id": "safra-02", "title": "Akut kolesistit tedavisi (\"hastayı öldür\" sorusu dahil)", "rows": [300, 301], "merged": null}, {"id": "safra-03", "title": "Kolesistit / safra taşı komplikasyonları", "rows": [266, 360, 382], "merged": null}, {"id": "safra-04", "title": "Biliyer kolik", "rows": [129], "merged": null}, {"id": "safra-05", "title": "Sağ üst kadran ağrısına yaklaşım", "rows": [50, 90, 128], "merged": null}, {"id": "safra-06", "title": "Tıkanma sarılığı, Charcot / Reynolds, Courvoisier", "rows": [91, 221], "merged": null}, {"id": "safra-07", "titl 10, 218, 230, 265, 268, 323], "merged": null}, {"id": "arter-09", "title": "Gangren (yaş – kuru)", "rows": [249], "merged": null}, {"id": "arter-10", "title": "Akut mezenterik iskemi", "rows": [178, 251], "merged": null}, {"id": "arter-11", "title": "Alt ekstremite arter anatomisi ve nabızlar", "rows": [113, 126, 227, 377], "merged": null}, {"id": "arter-12", "title": "Fogarty kateteri / embolektomi", "rows": [222, 226], "merged": null}, {"id": "arter-13", "title": "Künt travmada arteriyel tromboz", "rows": [47], "merged": null}, {"id": "arter-14", "title": "Kompartman sendromu", "rows": [55], "merged": null}, {"id": "arter-15", "title": "Crush sendromu", "rows": [48], "merged": null}, {"id": "arter-16", "title": "Diyabetik ayak, DVT fotoğrafı", "rows": [207], "merged": null}]}, {"id": "venoz", "title": "Venöz Hastalıklar ve Antikoagülasyon", "clusters": [{"id": "venoz-01", "title": "Derin ven trombozu: etiyoloji, risk, tanı, tedavi", "rows": [23, 118, 152, 168, 199, 236, 275, 310, 335], "merged": null}, {"id": "venoz-02", "title": "DVT komplikasyonları ve pulmoner emboli", "rows": [52, 62, 305], "merged": null}, {"id": "venoz-03", "title": "Phlegmasia alba / cerulea dolens, masif ven trombozu", "rows": [53, 54, 198, 233], "merged": null}, {"id": "venoz-04", "title": "Antikoagülanlar, heparin, enoksaparin, antidotlar", "rows": [114, 200, 252, 293, 326, 351, 375], "merged": null}, {"id": "venoz-05", "title": "Lenfödem", "rows": [213], "merged": null}]}, {"id": "hemostaz", "title": "Hemostaz ve Transfüzyon", "clusters": [{"id": "hemostaz-01", "title": "Hemostaz ve koagülasyon mekanizması", "rows": [74, 75, 329], "merged": null}, {"id": "hemostaz-02", "title": "Kanayan hastaya kan ürünü (TDP, trombosit)", "rows": [330, 331], "merged": null}, {"id": "hemostaz-03", "title": "Masif transfüzyon komplikasyonları", "rows": [247], "merged": null}]}, {"id": "sok", "title": "Şok, Sepsis ve Travma", "clusters": [{"id": "sok-01", "title": "Şok: tanım, tipleri, tanı ve tedavi", "r
