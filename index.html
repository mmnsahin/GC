<style>
html{scroll-padding-top:70px}
:root{
  --paper:#F6F7F4; --card:#FFFFFF; --ink:#18211D; --muted:#5E6B64; --line:#D5DBD6;
  --scrub:#1F5C4D; --scrub-tint:#E3EDE8; --warn:#8A5200; --warn-bg:#FBF1DF;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121614; --card:#1A201D; --ink:#E4EAE6; --muted:#9AA8A0; --line:#2C3531;
  --scrub:#7FC4AE; --scrub-tint:#1F2E28; --warn:#F0B86A; --warn-bg:#2D2414;}}
:root[data-theme="dark"]{
  --paper:#121614; --card:#1A201D; --ink:#E4EAE6; --muted:#9AA8A0; --line:#2C3531;
  --scrub:#7FC4AE; --scrub-tint:#1F2E28; --warn:#F0B86A; --warn-bg:#2D2414;}

*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
a{color:var(--scrub)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--scrub);outline-offset:2px}

header.top{max-width:900px;margin:0 auto;padding:28px 24px 20px}
header.top h1{font-size:clamp(1.7rem,3.5vw,2.4rem);line-height:1.15;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
header.top p{margin:0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}
.tools input[type=search]{flex:1 1 280px;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:1rem}
.tools label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.95rem;cursor:pointer}

.wrap{max-width:900px;margin:0 auto;padding:0 24px 80px}
header.top{display:block}
.bar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.barin{max-width:900px;margin:0 auto;padding:8px 24px;display:flex;align-items:center;gap:12px}
.bartitle{font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{flex:0 0 auto;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;padding:0}

.burger:hover{border-color:var(--scrub)}
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
nav.side{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);background:var(--card);border-right:1px solid var(--line);z-index:50;transform:translateX(-100%);transition:transform .22s ease;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 16px)}
nav.side.open{transform:none}
.sidehead{display:flex;justify-content:space-between;align-items:center;padding:0 6px 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.sidehead strong{font-size:1rem}
.closebtn{width:36px;height:36px;border:0;background:transparent;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted);border-radius:6px}
.closebtn:hover{background:var(--scrub-tint);color:var(--ink)}
nav.side a{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.95rem}
nav.side a:hover{background:var(--scrub-tint)}
nav.side a span{color:var(--muted);font-variant-numeric:tabular-nums}
body.locked{overflow:hidden}

section.topic{margin-bottom:44px}
section.topic>h2{font-size:1.45rem;margin:0 0 4px;font-weight:700}
section.topic>.sub{color:var(--muted);font-size:.92rem;margin:0 0 14px}

.q{border-top:1px solid var(--line)}
.q:last-child{border-bottom:1px solid var(--line)}
.q>button.head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:64px minmax(0,1fr) 20px;gap:14px;align-items:baseline;width:100%;padding:14px 4px;cursor:pointer}
.q>button.head:focus-visible{outline:2px solid var(--scrub);outline-offset:-2px}
.freq{font-size:1.6rem;font-weight:700;color:var(--scrub);font-variant-numeric:tabular-nums;line-height:1;text-align:right}
.freq small{font-size:.9rem;font-weight:600;margin-left:1px}
.freq.one{color:var(--muted);font-weight:500;font-size:1.25rem}
.qt{font-weight:600;font-size:1.05rem;line-height:1.35}
.hocas{display:block;font-weight:400;color:var(--muted);font-size:.88rem;margin-top:3px}
.chev{color:var(--muted);transition:transform .15s}
.q.open .chev{transform:rotate(90deg)}
.body{display:none;padding:2px 4px 22px 82px}
.q.open .body{display:block}

.merged{font-family:var(--serif);font-size:1.04rem;line-height:1.62;max-width:72ch}
.merged h4{font-family:var(--sans);font-size:.98rem;margin:18px 0 6px}
.merged p{margin:0 0 10px}
.merged ul,.merged ol{margin:0 0 10px;padding-left:22px}
.merged li{margin:3px 0}
.merged blockquote{margin:12px 0;padding:10px 14px;background:var(--warn-bg);color:var(--warn);border-radius:6px;font-family:var(--sans);font-size:.93rem}
.src{font-family:var(--sans);font-size:.72rem;font-weight:600;color:var(--scrub);background:var(--scrub-tint);border-radius:4px;padding:1px 5px;margin-left:4px;white-space:nowrap;vertical-align:1px}
.note{font-size:.9rem;color:var(--muted);margin:0 0 10px}
.pending{padding:12px 14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:.93rem;max-width:72ch}

button.rawbtn{margin-top:14px;padding:8px 14px;border:1px solid var(--scrub);border-radius:8px;background:transparent;color:var(--scrub);font-weight:600;cursor:pointer}
button.rawbtn[aria-expanded=true]{background:var(--scrub);color:var(--card)}
.raws{display:none;margin-top:14px}
.raws.show{display:block}
.raw{border-left:3px solid var(--scrub);background:var(--card);padding:12px 16px;margin-bottom:12px;border-radius:0 8px 8px 0}
.raw .meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:.86rem;color:var(--muted);margin-bottom:6px}
.raw .letter{font-weight:700;color:var(--scrub);font-size:1rem}
.raw .oq{font-style:italic;font-size:.92rem;margin:0 0 8px;color:var(--muted)}
.raw .ans{font-family:var(--serif);white-space:pre-line;line-height:1.58;max-width:72ch;overflow-wrap:anywhere}
.raw .empty{color:var(--muted);font-style:italic}
.single .ans{font-family:var(--serif);white-space:pre-line;line-height:1.6;max-width:72ch;overflow-wrap:anywhere}
mark{background:#F5E27A;color:#18211D;border-radius:2px}
.none{color:var(--muted);padding:30px 0}

@media (max-width:860px){
  .q>button.head{grid-template-columns:44px minmax(0,1fr) 16px;gap:10px}
  .freq{font-size:1.3rem}
  .body{padding-left:4px}
}
@media (prefers-reduced-motion:reduce){.chev,nav.side,.scrim{transition:none}}

zi veya Folliküler Neoplazi şüphesi (%20- 30 Malign) (Cerrahi lobektomi) (hemitiroidektomi sanırım)\n• Thy 5/ Bethesda kategori V – Malignite için şüpheli (% 50-75) (Totale yakın troidektomi ya da cerrahi lobektomi)\n• Thy 6/ Bethesda kategori VI – Malign (%97- 99)(Totale yakın tiroidektomi)", "pages": [5]}, {"no": 16, "q": "Tiroid muayenesinde kitleye yaklaşım, anamnezde ne sorulur, diğer fm bulguları ne olabilir,", "tip": "Olgu", "hoca": "Atıl Çakmak", "a": "Anamnezde sorulması gerekenler:Halsizlik, yorgunluk, unutkanlık, üşüme, kabızlık ya da ishal, ses kabalaşması, sinirlilik, çarpıntı, terleme, sıcağa tahammülsüzlük, kas sertliği, kas ağrıları, hızlı büyüyen boyun kitlesi, bası ve invazyon semptomları(yutma güçlüğü, ses kısıklığı, nefes darlığı) ,çocukluk döneminde baş- boyun bölgesine RT alıp almamak, Ki tx için tüm vücut ışınlaması, ailede tiroid ca veya birinci derece akrabada tiroid ca sendromu ,çocukluk ya da adölesan dönemde iyonize radyasyona maruz kalma (nükleer kazalar), infertilite öyküsü, oligomenore düzensiz ve yoğun kanamalar.Eşlik eden hastalıklar: Pernisiyöz anemi, Romatoid artrit, Tip 1 DM, Addison, MEN sendromları, Karpal tunel sendromu,Depresyon, Demans Fizik muayenede tiroid bezi ve servikal lenf nodları dikkatle incelenmelidir. Nodül ya da nodüllerin kıvamı , yeri ve boyutları, fikse olup olmadıkları, sertlikleri, bezin diffüz ve bilateral olup olmadığı saptanmalı ve kaydedilmelidir. Ağrı ve hassasiyet var mı kontrol edilmelidir.", "pages": [5]}, {"no": 17, "q": "Tiroid multipl endokrin neoplazi sendromları men1 men2b men2a vb", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "MEN1:Werner sendromudur.OD geçişli. Hiperparatiroidzim ,pitiüter adenom,pankreas karsinomu\nMEN2A:Medüller tiroid karsinomu, feokromasitoma, primer hiperparatiroidizm, liken planus, amiloidozis\nMEN2B:MTK, feokromasitoma, marfanoid görünüm. Mukokütanöz ganglionöromatozis, bağırsak ganglionörinomaları", "pages": [5, 6]}, {"no": 18, "q": "Tiroidde usg sintigrafi sonrası biyo pı>4cm, Multifokal tümör, Lenf nodu metastazı\nTEDAVİ\nTotal Tiroidektomi + tümörün olduğu tarafa ipsilateral santral lenf nodu diseksiyonu yapılmalıdır.\nMikroPTK’da hasta iyi prognostik grupta ise unilateral lobektomi + ipsilateral santral lenf nodu diseksiyonu yeterli olabilir. FOLLİKÜLER\nKadınlarda 3 kat fazla olup 50 yaş ve üstü grupta daha çok ortaya çıkar\nFK’da PAX8/PPAR gama gen ekspresyonu Genellikle soliter olup I eksiklik bölgelerinde sıktır\nVasküler invazyon, hematojen yayılım, kemik, akciğer ve karaciğer metastazları sıktır Hiperfonksiyon gösterebilirà hipertiroidi TİİAB ile folliküler adenom ve karsinom ayrımı yapılamaz.\nPrognozu kötü etkileyen faktörler\n-yaşın 50 üstü olması\n-nodülün 3 cm den büyük olması\n-yüksek grade\n-belirgin vasküler invazyon\n-tiroid dışına yayılım ve tanı sırasında uzak metastaz olmasıdır.\nTEDAVİ\nFolliküler karsinomda da total tiroidektomi yapılır.\nlenfatik tutulum ender olduğu için santral ya da lateral diseksiyona çoğu zaman ihtiyaç duyulmaz.\nHURTLE HÜCRELİ\nHurthle hücreli tümörler follikül hücreli tümörlerin bir varyantıdır\nTG üretir ancak RAI tutmazlar ya da az tutarlar Bilateral ve multifokal olma, daha sık servikal lenf metastazı yapma eğilimindedirler.\nTİAB Hurthle hücreli neoplazi olarak gelir TEDAVİ= total tiroidektomi + santral diseksiyon ve gerekirse lateral diseksiyon yapılır\nRAI ETKİSİZ.\nRADYOTERAPİ – nadiren lokal inavaziv veya nüks hastalığın tedavisinde. RAI tutmayan kemik metastazlarında ağrı tedavisinde kullanılabilir. MEDÜLLER\nTiroidin Kalsitonin salgılayan parafoliküler C hücrelerinden köken alır.\nAmiloid varlığı tanı koydurucudur\nKadınlarda 1,5 kat sık\n%75 sporodik, %25 ailesel\nC hücre hiperplazisi premalign lezyondur ve ailesel olguşarda görülür.\nRET mutasyonu\nHem lenfojen hem de hematojen yayılır. Ailesel non- MEN\nen iyi prognoz\nendokrin ya da nöral leyzon eşlik etmez Ailesel MEN IIA\nİkinci en iyi prognoz\nBilateral\nFeokromositoma, hiperparatiroidm ile birlikte görülür.\nSporodik\nÜçüncü en iyi prognoz\nTek taraflı\nKötü seyirli\nAilesel MEN IIB\nEn kötü prognoz\nen nadir görülen\nbilateral feokromositoma, mukozal ganglionöromalar, marfanoid vücut yapısı ve epifiz anomolileri ile birlikte görülür. TANI\nAnamnez (aile öyküsü önemlidir), Fizik muayene,\nArtmış serum kalsitonin ve CEA düzeyleri Tiroiddeki nodüle TİİAB\nMTK tanısından sonra RET mutasyon araştırılması\nRET (+) ise aile taraması\nFeo için 24 saatlik idrarda VMA, metanefrin Aile taramasında RET onkogeni varsa profilaktik total tiroidektomi\nTEDAVİ\ntotal tiroidektomi + bilateral santral lenf nodu diseksiyonu yapılır\nLateral boyunda metastaz (+) ise modifiye boyun diseksiyonu\nTümör C hücresi kökenli olduğu için radyoaktif iyot tedavisi, T4 ile TSH supresyon tedavisi yardımcı değildir\nnüks araştırması için boyun ve mediasten USG, BT ve MRI, PET/CT yapılır\nlokal ileri- metastatik—tirozin kinaz inhibitörleri, VANDETANİB ve CABOZANTANİB\nANAPLASTİK\nÇok agresifdir.\nÇoğu kez differansiye tiroid kanserlerinden köken alır.\nTanı sırasında çoğunlukla lenf nodu metastazı bulunur.\nTanı TİİAB ile karakteristik dev ve multinükleer hücrelerin görülmesiyle konur differansiasyonunu tamamen kaybetmiş atipik ve pleomorfik hücreler görülür\nTEDAVİ\ntotal tiroidektomi ve bilateral boyun diseksiyonu yapılamıyorsa kitle küçültücü cerrahi ile RT ve KT verilebilir\nLENFOMA\nGenel bir lenfomanın tiroid tutulumu olabileceği gibi, izole tiroid lenfoması da olabilir. TANI= Tanı için TİİAB yeterli değildir eksizyonel biyopsi ya da tru-cut biyopsi gerekir TEDAVİ\nKT’ye yanıt iyi ve hızlı. Yanıt vermeyen hastalarda tiroidektomi yapılabilir. METASTATİK\nBaşka kanserlerin tiroide metastazı nadir görülür. Hipernefroma, meme, akciğer, melanoma ve bronkojenik kanserler tiroide metastaz yapabilmektedir.\nSemptomatik olgularda tiroidektomi yapılır", "pages": [10, 11, 12, 13]}, {"no": 31, "q": "Asit baz dengesi,", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "TAMPON SİSTEMLERİ\nKİMYASAL= En hızlı, saniyeler içinde\nHücre içinde protein ve fosfat, Hücre dışındà bikarbonat ve karbonik asit\nSOLUNUM\nDakikalar içinde, Hiperventilasyon / hipoventilasyon\nBÖBREK\n6-8 saat içerisinde, Bikarbonat geri emilimi ve H sekresyonu\nMETABOLİK ASİDOZ\nPlazma bikarbonat azalma veya H artışı NEDEN: Aşırı SF verilmesi, Anyon açığıà Na- (Cl+HCO3), Ketoasitoz, Laktik asidoz, Kronik böbrek yetmezliği, Salisilat kullanımı, Dışarıdan asit alnımı , İshal à hipokalemi ve hiperklor, İntestinal, pankreatik fistül, İleostomi- kolostami, Total parenteral beslenme, Renal tübüler asidoz BULGULAR: Myokard depresyonu,\nBradikardi, Periferik vd, Hiperkalemi, Kussmaul TEDAVİ: Önce altta yatan neden , HCO3 ile tamponlama—ventilasyon iyi ve HCO3<15 ise Açık=0.5*kg*fark Yarısı bolus, yarısı infüzyon THAM= Trihidroksimetil aminometan\nMETABOLİK ALKALOZ\nBikarbonat fazlalığı veya H kaybı, N= 22-26 mEq/L\nNEDEN: Kusma, Nazogastrik aspirasyon, Diüretikler, Mineralokortikoidlerle potasyum kaybı, Kan transfüzyonu, Süt alkali sendromu, Bikarbonat replasmanı\nBULGULAR: Yavaş ve yüzeyel solunum,\nArtmış SSS duyarlılığı, Hiperakitf refleksler, Hipokalemi, Taşikardi\nTEDAVİ: Önce altta yatan neden, Cl ve K içeren sıvı, Acetazolamidà sıvı açığı yoksa, Dirençli olgularda asit\nSOLUNUM ASİDOZ\nPCO2 artışı, N=35-45 mmHg\nNEDEN:\nAlveolar ventilasyonda azalma :Atelektazi, hemotoraks, pnömotoraks, ampizem, astım, KOAH, abdominal distansiyon\nCO2 artışı: malign hipertermi, titreme, nöbet, tiroid krizi, yanık\nBULGULAR:\nTanı: PCO2>45\nBaş dönemesi, Güçsüzlük , Tremor, Kırmızı ve sıcak deri, Bradikardi\nTEDAVİ: Önce altta yatan neden, O2 , Solunum desteği, Bikarbonat verme\nSOLUNUM ALKALOZU\nNEDEN: Ağrı, Anksiyete, Solunum desteği, Ateş, sepsis, şok, Tirotoksikoz, Hipermetabolizma\nBULGULAR: Serebral vk , Kas krampları, Senkop , Taşikardi, Bulantı kusma, Hipofosfatemi\nTEDAVİ: Önce altta yatan neden, Ağrı varsa analjezik , hipoksemi varsa O2", "pages": [13, 14]}, {"no": 32, "q": "Hiperkalsemi, hipokalsemi muayene bulguları, tedavisi", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "Hafif uzamış hiperkalsemi, semptomsuz ya da tekrarlayan böbrek taşı gibi problemler üretebilirken; ani başlangıçlı ve şiddetli hiperkalsemi, genellikle konfüzyon ve letarji de dahil olmak üzere dramatik semptomlara neden olabilir. Yaklaşık 15 mg/dL’den daha yüksek serum kalsiyum seviyeleri genellikle tıbbi bir acil durum olarak kabul edilir ve agresif olarak tedavi edilmelidir.\n*Hiperkalsemi, vücuttaki neredeyse tüm organ sistemlerini etkiler, ancak özellikle merkezi sinir sistemi (MSS) ve böbrekleri etkiler. Kardiyak etkiler aritmi kaynaklı senkopu içerir. Kalsiyum pozitif bir inotropik etkiye sahiptir. *Hiperkalsemi renal fonksiyon bozukluğu ve direkt vazokonstriksiyondan kaynaklanan hipertansiyona da neden olur.\nChovstek bulgusu:Hipokalsemi sonucu görülen tetaninin belirtilerinden biridir. Hastanın fasial sinirine vurulduğunda yüz kasları özellikle ağız köşesi seğirir kasılır.\nTrousseau: Hipkokalsemide görülür. Tansiyon manşonu üst kola bağlanarak sistolik ile diyastolik tansiyon arası bir basınçta şişirilir. EL kaslarında spazm olur ve ebe eli oluşur ***Tedavi Yaklaşımı:\n**Hafif hiperkalsemi:\nAsemptomatik veya hafif semptomatik hiperkalsemisi (kalsiyum <12 mg / dL) olan hastalar acil tedavi gerektirmez. Bununla birlikte, tiyazid diüretikler ve lityum karbonat tedavisi, hacim tükenmesi, uzamış yatak istirahati veya hareketsizlik ve yüksek kalsiyum diyeti (> 1000 mg / gün) dahil olmak üzere hiperkalsemiyi artırabilecek faktörlerden kaçınmaları önerilmelidir. Nefrolitiyazis riskini en aza indirmek için uygun hidrasyon (günde en az altı ila sekiz bardak su) önerilir.\n**Orta derecede hiperkalsemi:\nKronik orta derecede hiperkalsemili (12 ila 14 mg / dL arasındaki kalsiyum) asemptomatik veya hafif semptomatik kişiler acil tedavi gerektirmeyebilir. Bununla birlikte, hafif hiperkalsemi için yukarıda açıklanan önlemleri almaları gerekir. Fakat bu konsantrasyonlarda ciddi bir yükselme, daha agresif önlemler gerektirebilir.\n**Şiddetli hiperkalsemi:\nKalsiyum> 14 mg / dL olan hastalar daha agresif tedavi gerektirir.\n-Öncelikli olarak 200 ila 300 mL / saat hızında izotonik salinle volüm arttırılır, daha sonra idrar çıkışını 100 ila 150 mL/saatte tutacak şekilde ayarlanır. Böbrek yetmezliği veya kalp yetmezliği olmayan hastalarda, potansiyel komplikasyonlar ve öncelikle hiperkalsemiden sorumlu olan kemik rezorpsiyonunu inhibe eden ilaçların mevcudiyeti nedeniyle, kalsiyum atılımını doğrudan artırmak için ilmek loop tedavisi önerilmemektedir.\n-Kalsitonin (4 international units/kg) uygulayın ve serum kalsiyum ölçümünü birkaç saat içinde tekrarlayın. Bir hipokalsemik cevap alınırsa, hasta kalsitonin duyarlıdır ve kalsitonin her 6 ila 12 saatte bir tekrarlanabilir (4 ila 8 international units/kg). Tipik olarak Kalsiyum> 14 mg/dL ve semptomatik olan hastalarında kalsitonini (bifosfonat ile birlikte) veriyoruz. [Yalnızca ne uyguladığımızı kabaca bilin]\nKalsitonin artı salin verilmesi, serum kalsiyum konsantrasyonlarında 12 ila 48 saat içinde önemli ölçüde azalmaya neden olmalıdır. Bisfosfonat, ikinci ila dördüncü güne kadar etkili olacak ve böylece hiperkalseminin kontrolünü koruyacaktır.", "pages": [14, 15]}, {"no": 33, "q": "Hiperparatiroide bağlı karın ağrısına yaklaşım, neden sırtta ağrı olmadı, tedavisi", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "DETAYLI YAZ", "pages": [15, 16]}, {"no": 34, "q": "Tiroidektomi sonrası paratiroid çıkarıp çıkarmadığımızı nasıl anlarız? Hangi 2 muayene bulgusu bulabiliriz (chavstok, trousso)", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "İki muayene bulgusu var:\n- Chavstok bulgusu: Yüz sinirinin uyarılmasından sonra anormal bir reaksiyon olarak ortaya çıkar. Çene açısında masseter kası üzerine parmakla vurulduğunda fasial sinir uyarılır ve yüzün aynı tarafında yüz kaslarında kasılmalar (genellikle burun ve dudaklarda seğirmeler) meydana gelir.\n- Trousso belirtisi: kola uygulanan tansiyon aleti manşonuna 3 dakika ssitolik basıncın üzerinde (genelde 20mmhg üzerinde) basınç uygulanması ile elde karpal spazm (el bileğinde ve metakarpofalengeal eklemlerde fleksiyon, parmaklarda hiperekstansiyon, başparmakta avuç içi üzerine fleksiyon) gözlenmesidir.", "pages": [16]}, {"no": 35, "q": "Meme ca taraması, 20 yaş altında kanser riski?", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "40 yaş ve üstü kadınlarda meme kanseri taramasında ideal yöntem iki yılda bir uygulanacak mammografi ile taramadır.\n20 yaşından önce meme kanseri görülme insidansı 100.000de 1dir.", "pages": [16]}, {"no": 36, "q": "Kolorektal kanser taraması nedir, gaitada gizli kan nasıl bakılır", "tip": "Bilgi", "hoca": "Ethem Geçim", "a": "İdeal yöntem yılda bir uygulanacak Gaitada Gizli Kan Testi (GGK) ve 10 yılda bir yapılacak kolonoskopi ile taramadır.\nGaitada gizli kan testi poliklonal veya monoklonal antikorlar kullanarak gaitada hemoglobin varlığını gösterebilmeli ve testlerde kullanılan antijenler sadece insan hemoglobinine hassas olmalıdır.\nGGK: Gaita örneği guaiac kağıdına sürülür. Sonra üzerine hidrojen peroksit damlatılır. Eğer gaitada heme molekülü (kan) varsa guaiac kağıdında saniyeler içinde mavi renk oluşur.", "pages": [16]}, {"no": 37, "q": "Meme ca risk faktörleri (NEDENLERİYLEE)", "tip": "Bilgi", "hoca": "Seher Demirer", "a": "Kadın cinsiyeti (Erkeklere göre 8 kat fazla) 30 yaşın üstünde olmak\nBRCA gen mutasyonu\nAile hikayesi\nGebelik öyküsü: Gebe kalmamak, ilk gebelik >30 yaş\nAH, LCIS, DCIS\nEndokrin faktörler\nDiğer memede kanser varlığı karşı memede görülme riskini arttırır.", "pages": [16]}, {"no": 38, "q": "Crohn hastalığı", "tip": "Bilgi", "hoca": "Bülent Erkek", "a": "Ağızdan anüse kadar tüm gastrointestinal sistemin iltihaplanmasına neden olan bağırsak hastalığıdır. Özellikle ileum ve kolonun başlangıç kısmında görülür. En çok 20 30 yaş arasındaki kişilerde görülür. Görülme oranı kadın ve erkeklerde eşittir.\nHastalar ishal ve karın ağrısıyla gelebilir. Bağırsak krampları, ishal veya kabızlık, ağrı, dışkıda kanama, ateş iştahsızlık, kilo kaybı görülebilir. Anüs çevresinde ortaya çıkan iltihaplı ve akıntılı fistüller, çatlak ve apseler de belirtiler arasındadır.\nCrohn hastalığının tedavisi hastalığın şiddetine ve hastalığın tutulum yerine (ince bağırsak, kalın bağırsak, makat) göre belirlenir. Genellikle ağızdan alınan ilaçlar ve makattan verilen lavmanlar ile tedaviye başlanır. Sadece komplikasyon varlığında (internal fistül, abse, obstrüksiyon) cerrahi endikasyonu var. Cerrahi sonrası nüks çok fazladır, crohnda çok fazla cerrahi yapılmak istenmez.", "pages": [16, 17]}, {"no": 39, "q": "Tiroid ca sınıflaması, tanı tedavi", "tip": "Bilgi", "hoca": "Seher Demirer", "a": "Tiroit Maligniteleri Differansiye-----------------------Undiferansiye Papiller %80----------------Anaplastik %1 Foliküler %10-----------------Lenfoma\nHurtle %3------------------- Metastatik %1-2 Medüller %5\nPapiller kanserler:\n- En sık görülen tiroit kanserleridir.\n- Hastaların çoğu ötiroittir.\n- Lokal invaziv hastalıkta ses kısıklığı, disfaji, dispne olabilir.\n- Uzak metastazın en sık geliştiği organlar akciğerler, kemik, kc ve beyin olarak sıralanır. - Tanı tirit bezindeki kitleden veya lenf nodundan yapılan İİAB ile doğrulanır.\n- Total veya totale yakın tirodektomi yapılır. Serviakl lef düğümlerine yayılım varsa o tarafa modifiye radikal boyun diseksiyonu yapılır. Foliküler kanserler:\n- Iyot eksikliği olan bölgelerde sıklığı artmıştır. - Kanser tanısı kapsül ve vasküler invazyon bulunması ile konur.\n- Metastatik yayılım hematojen yolla olur.\n- Çoğunluğu ötiroit olarak saptanır.\n- İİAB ile foliküler kanser ile foliküler adenom ayırt edilemez.!\n- Isthimus ve piramidal lobu daiçerecek şekilde tiroid lobektomi yapılmalıdır.(Hemitiroidektomi) Hürtle hücreli kanser:\n- Oksifilik hücrelerden gelişir.\n- Radyoaktif iyot tutulumu nadirdir.\n- İİAB ile tanı konamaz.\n- Lobektomi ve istmusektomi yapılır. Medüller kanser:\n- C hücrelerinden kaynaklanır. Bu hücreler nöral krest kökenlidir. APUD sistemin parçasıdır. - Çoğunluğu sporadiktir. Yaklaşık %25i aileseldir.\n- Otozomal dominant kalıtılır.\n- Tanı İİAB ile konur.\n- Tiroit bezinde kitle ile birlikte yükselmiş kalsitonin düzeyleri medüller tiroit kanseri için tanısaldır.\n- Total tiroidektomi + santral boyun diseksiyonu standart başlangıç ameliyatıdır.", "pages": [17, 18]}, {"no": 40, "q": "Acilde araba çarpmasıyla gelen hastaya ne ypaılır", "tip": "Olgu", "hoca": "Bülent Erkek", "a": "Travma hastasının ilk değerlendirilmesi:\nİlk muayene\nResüsitasyon\nİkinci muayene\nTanısal çalışmalar\nKesin tedavi\nAraba çarpması künt karın travması örneğidir (?). En sık yaralanan organ karaciğer ve dalaktır. Bilinci açık olan hastalarda fizik muayenede periton irritasyon bulgularının olması laporotomi endikasyonudur. Acil serviste yapılan karın travmasına yönelik ultrasonografi (FAST: Focused abdominal sonography for trauma; travma için odaklanmış karın ultrasonografisi) büyük ölçüde parasentez ve diyagnostik periton lavajının yerini almıştır.\nFAST, BT, DPL(diyagnostik periton lavajı) yapılabilir.", "pages": [18]}, {"no": 41, "q": "Hiperkalsemi nedenleri bulguları tedavisi", "tip": "Bilgi", "hoca": "Seher Demirer", "a": "*Normal kalsiyum değer aralığı: 2.1–2.6 mmol/L (8.8–10.7 mg/dl, 4.3–5.2 mEq/L) Hiperkalsemi de total kalsiyum miktarının 10,5 miligram/dl’nin üzerinde veya iyonize kalsiyum seviyesinin 2,7 mEq/L’den fazla olması olarak tanımlanır. %90’dan fazlası hiperparatiroidizm ve malignite ile ilişkilidir ve malignite kökenli hiperkalsemi acil serviste en sık karşılaşılan nedenlerindendir. Semptomların şiddeti sadece kalsiyum seviyesine bağlı değil aynı zamanda serum kalsiyumundaki yükselmenin ne kadar hızlı gerçekleştiğine de bağlıdır. Hafif uzamış hiperkalsemi, semptomsuz ya da tekrarlayan böbrek taşı gibi problemler üretebilirken; ani başlangıçlı ve şiddetli hiperkalsemi, genellikle konfüzyon ve letarji de dahil olmak üzere dramatik semptomlara neden olabilir. Yaklaşık 15 mg/dL’den daha yüksek serum kalsiyum seviyeleri genellikle tıbbi bir acil durum olarak kabul edilir ve agresif olarak tedavi edilmelidir. *Hiperkalsemi, vücuttaki neredeyse tüm organ sistemlerini etkiler, ancak özellikle merkezi sinir sistemi (MSS) ve böbrekleri etkiler. Kardiyak etkiler aritmi kaynaklı senkopu içerir. Kalsiyum pozitif bir inotropik etkiye sahiptir. *Hiperkalsemi renal fonksiyon bozukluğu ve direkt vazokonstriksiyondan kaynaklanan hipertansiyona da neden olur.Hiperkalsemi, toplam serum ve iyonize kalsiyum seviyelerine göre şu şekilde sınıflandırılabilir:\nHafif: Toplam Ca 10.5-11.9 mg/dL (2.5-3 mmol/L) veya İyonize Ca 5.6-8 mg/dL (1.4-2 mmol/L)\nOrta: Toplam Ca 12-13.9 mg/dL (3-3.5 mmol/L) veya İyonize Ca 8-10 mg/dL (2-2.5 mmol/L) Hiperkalsemik kriz: Toplam Ca 14-16 mg/dL (3.5-4 mmol/L) veya İyonize Ca 10-12 mg/dL (2.5-3 mmol/L)\n*Maligniteden kaynaklanan hiperkalsemi genellikle progresiftir; bu nedenle, hızla yükselen kalsiyum seviyeleri malignite akla gelmelidir. Meme, akciğer ve böbrek kanserleri, multipl miyelom, lenfoma ve lösemi gibi düşünülmelidir. Bu gibi durumlarda yapılacak testler periferik kan yayması ve/veya serum ve idrar immünofiksasyon elektroforezi içerebilir. Biyopsi örnekleri, doku histolojisi çalışmaları için solid bir tümörden veya kemik iliğinden alınabilir.\n*Hiperparatiroidizm en sık görülen hiperkalseminin nedenidir ve genellikle hafif, asemptomatik ve yıllarca devam eder. İmmünoreaktif paratiroid hormonu (PTH) ve iyonize kalsiyum aynı anda ölçülmelidir. Hiperkalsemide PTH seviyeleri baskılanmalıdır; Bu nedenle, normal PTH seviyeleri ve yüksek kalsiyum seviyelerinin kombinasyonu hafif hiperparatiroidizmi gösterir. Hiperparatiroidizm multipl endokrin neoplazi tip 1’in bir parçası olabilir ( MEN1,Wermer sendromu) *Hiperkalsemide en karakteristik elektrokardiyografik (EKG) değişikliği QT aralığının kısalmasıdır.\n***Tedavi Yaklaşımı:\n**Hafif hiperkalsemi:\nAsemptomatik veya hafif semptomatik hiperkalsemisi (kalsiyum <12 mg / dL) olan hastalar acil tedavi gerektirmez. Bununla birlikte, tiyazid diüretikler ve lityum karbonat tedavisi, hacim tükenmesi, uzamış yatak istirahati veya hareketsizlik ve yüksek kalsiyum diyeti (> 1000 mg / gün) dahil olmak üzere hiperkalsemiyi artırabilecek faktörlerden kaçınmaları önerilmelidir. Nefrolitiyazis riskini en aza indirmek için uygun hidrasyon (günde en az altı ila sekiz bardak su) önerilir.\n**Orta derecede hiperkalsemi:\nKronik orta derecede hiperkalsemili (12 ila 14 mg / dL arasındaki kalsiyum) asemptomatik veya hafif semptomatik kişiler acil tedavi gerektirmeyebilir. Bununla birlikte, hafif hiperkalsemi için yukarıda açıklanan önlemleri almaları gerekir. Fakat bu konsantrasyonlarda ciddi bir yükselme, daha agresif önlemler gerektirebilir.\n**Şiddetli hiperkalsemi:\nKalsiyum> 14 mg / dL olan hastalar daha agresif tedavi gerektirir.\n-Öncelikli olarak 200 ila 300 mL / saat hızında izotonik salinle volüm arttırılır, daha sonra idrar çıkışını 100 ila 150 mL/saatte tutacak şekilde ayarlanır. Böbrek yetmezliği veya kalp yetmezliği olmayan hastalarda, potansiyel komplikasyonlar ve öncelikle hiperkalsemiden sorumlu olan kemik rezorpsiyonunu inhibe eden ilaçların mevcudiyeti nedeniyle, kalsiyum atılımını doğrudan artırmak için ilmek loop tedavisi önerilmemektedir.\n-Kalsitonin (4 international units/kg) uygulayın ve serum kalsiyum ölçümünü birkaç saat içinde tekrarlayın. Bir hipokalsemik cevap alınırsa, hasta kalsitonin duyarlıdır ve kalsitonin her 6 ila 12 saatte bir tekrarlanabilir (4 ila 8 international units/kg). Tipik olarak Kalsiyum> 14 mg/dL ve semptomatik olan hastalarında kalsitonini (bifosfonat ile birlikte) veriyoruz. [Yalnızca ne uyguladığımızı kabaca bilin]\nKalsitonin artı salin verilmesi, serum kalsiyum konsantrasyonlarında 12 ila 48 saat içinde önemli ölçüde azalmaya neden olmalıdır. Bisfosfonat, ikinci ila dördüncü güne kadar etkili olacak ve böylece hiperkalseminin kontrolünü koruyacaktır.", "pages": [18, 19, 20]}, {"no": 42, "q": "Hiperparatiroidi primer sekonder tersiyer nedenleri", "tip": "Bilgi", "hoca": "Seher Demirer", "a": "Primer Hiperparatiroidi: Paratiroid bezlerinden bir veya birden fazlası büyüyerek, fazla PTH üretmeye başlar. Yüksek PTH düzeyi kan kalsiyum düzeyinin yükselmesiyle hiperkalsemiye neden olur. Normal paratiroid bezinde kan kalsiyumunun yükselmesi ile PTH üretimi azalır. Fakat büyümüş paratiroid bezi bu baskılayıcı kalsiyum etkisinden etkilenmez, yani otokontrolden çıkıp otonomi kazanmıştır, kontrolsüz bir şekilde fazla PTH üretmeye ve salgılamaya devam eder. Poliklinik hastaları içinde hiperkalseminin en sık nedeni primer hiperparatiroididir. Hastanede yatan hastalarda ise en sık kalsiyum yüksekliği nedeni kanserler bağlı kalsiyum yükselmesidir. Primer Hiperparatiroidi kadınlarda erkeklere göre daha sık görülür. Yaşla birlikte görülme olasılığı artmaktadır. 50 yaşından sonra görülme oranı belirgin olarak yükselmektedir.\n**Primer hiperparatiroidili hastalarda hastalığın sebebi % 80-85 tek bezde gelişen paratiroid adenomu, % 4-5 çift bezde gelişen paratiroid adenomu, % 10-15 çoklu bez hastalığı (tüm bezlerde büyüme, tümör değil -hiperplazi) ve % 1’den az hastada ise paratiroid kanseridir. *Primer hiperparatiroidizm 2 farklı grupta değerlendirilebilirler.\n-Sporadik primer hiperparatiroidizm. En sık görülen tipi olup, hastaların % 95’i bu grupta yer alır. Oluşmasına etkili olan net özellikler bilinmemektedir. Boyun bölgesine ışın alınması, menapoz bilinen önemli etyolojik (etki eden) faktörlerdir.\n-Ailesel hiperparatiroidizmler: Hastalıkların yaklaşık % 5’i ailesel hastalıktır. Bunlar kalıtsal olarak geçiş gösteren hastalıklardır. Bunlar daha genç yaştaki hastalarda ortaya çıkar. Genellikle 4 paratiroid bezinde de hastalık mevcuttur. Bunlarla ilgili hastalıklar:\n--Multipl Endokrin Neoplazi (MEN) Sendromları:\nMEN I: 11. kromozomda bulunan menin genindeki mutasyon sonucu ortaya çıkan ve otozomal dominant geçiş gösteren bir sendromdur. Paratiroid, hipofiz bezi, pankreas bezi tümörlerini içeren gruptur. Primer hipreparatiroidi bu mutasyonu taşıyan hastaların % 90-95’inde ortaya çıkar. Hastalarda hastalık tüm bezleri tutar.\nMEN II: 10. kromozomda yerleşmiş olan RET protoonkogeninin mutasyonla aktive duruma gelmesi sonucu oluşan otozomal dominant geçişli bir sendromdur.\n--Çene Sendromu: Hastalarda paratiroid hastalığı ve çene kemiğinde tümörler mevcuttur. HRPT2 genindeki mutasyonla oluşan otozomal dominant geçişli bir sendromdur. Tek veya birden fazla paratiroid bezini tutan hastalık olabilir. Bu sendromu taşıyan kişilerde paratiroid kanseri riski artmıştır.\nPrimer Hiperparatiroidide Biyokimyasal Bulgular: Kalsiyum: Yüksek, Parathormon: Yüksek, Fosfor: Normalin alt sınırı veya düşük, 24 saatlik idrar kalsiyumu: Normal (100-400 mg/gün) veya yüksek [Familyal Hipokalsiürik Hiperkalsemiden farkı bu; FHH de düşük seviyede]\n**Primer hipreparatiroidinin etkili ve kalıcı tek tedavisi cerrahidir.\nSekonder Hiperparatiroidi: Paratiroid bezlerinin böbrek yetmezliği, D vitamini eksikliği gibi durumlarda kan kalsiyum düzeyini normal sınırlar içinde tutabilmek için uyarılması ile büyümesi ve fazla hormon salgılaması ile ilgili olluşan tabloya sekonder hiperparatiroidi denir. Eğer sekonder hiperparatiroidiye neden olan uyarı ortadan kalkmasına rağmen, büyümüş (hiperplazi) olmuş paratiroid bezleri tamamen kontrol dışı olarak kendisi çalışmaya başlarsa buna da tersiyer hiperparatiroidi denir. Kronik böbrek yetmezliği sekonder hiperparatiroidinin en sık sebebidir. Kronik böbrek yetmezliğinde fosfat atımı bozuılur ve kan fosfat düzeyi yükselir. Artan kan fosfat düzeyi serum kan kalsiyum düzeylerini baskılayarak, kan kalsiyumu düşmesine neden olur. Bu kalsiyum düşüklüğü paratiroid bezlerini uyararak parathormon salgısını arttırır.\nSekonder Hiperparatiroidide Biyokimyasal Bulgular: Kalsiyum: Düşük, normal veya yüksek olabilir. İleri evre sekonder hiperparatiroidide paratiroid bezlerinde otonomi gelişmesi nedeni ile hiperkalsemi ortaya çıkmaktadır. Fosfat: Kronik böbrek hastalığında hastalık ilerledikçe pozitif fosfat dengesine müdahale edilmedikçe fosfat yüksekliği (hiperfosfatemi) genel olarak oluşur. Bunun temel nedenleri böbrekten fosfat atılımının azalması, barsaktan zorunlu fosfat emiliminin devam etmesi ve yüksek parathormon seviyesine bağlı kemikten serbestleşen fosfattır. PTH düzeyi: Yüksek parathormon düzeyleri aktif D vitamini biyosentezinde azalma, paratiroid yüzeyinde kalsiyuma duyarlı reseptör varlığının azalması ve fosfat yüksekliğine bağlı olarak gelişir. Hastalığın ilerlemesi ile düzenli olarak artış göstermektedir. Normalin 3 katına kadar olan parathormon artışları düşük aktif D vitamini düzeyini kompanse etmek için fizyolojik olarak kabul edilir. Sekonder hiperparatiroidi ilerledikçe parathormon yükselir ve ilaç tedavisinin dozunu arttırmak gerekir. Medikal tedaviye dirençli parathormon yüksekliğinde tek geçerli tedavi seçeneği cerrahidir. ALP: KBY'ye bağlı düşük", "pages": [20, 21, 22]}, {"no": 43, "q": "Acilde distansiyonla gelen hasta, ayırıcı tanı, ileus nedir bulguları neler,", "tip": "Olgu", "hoca": "Bülent Erkek", "a": "*Abdominal distansiyon karında şişkinlik ve gerginlik hissi demektir, GİS'te motilite bozukluğu, obstrüksiyon, kitle, perforasyon ve enflamasyon gibi patolojilere bağlı olarak karında sıvı, gaz, gaita birikimi sonucu ortaya çıkan karın içi basınç artış durumudur. Başlangıcına göre ani başlayıp saatler içinde gelişen akut ve haftalar-aylar içinde yavaş seyirli kronik olarak gelişir. En sık yapılan hata yemek sonrası basit hazımsızlık veya psikolojik denilip geçiştirmektir.\n*Akut Abdominal Distansiyon (Akut Karın Sendromu Oluşturan Nedenler):\n1-Akut Apandisit, 2-Akut Kolesistit, 3-Peptik Ülser Perforasyonu, 4- İntestinal Perforasyon, 5- Akut Pankreatit, 6-Yenidoğanda Nekrotizan Enterokolit, 7-İntestinal Obstrüksiyon-İleus 8- Psödoobstrüksiyon, 9-Kolit\n*Kronik Abdominal Distansiyon:\n1:Obezite, 2-İrritabl Bağırsak, 3-GİS motilite bozuklukları, 4- Mide Çıkış Obstrüksiyonu, 5- Assit, 6-Pelvik Kitle ;\n**İntestinal Obstrüksiyon-İleus: İnce bağırsaklarda ve kolonda lümenin çeşitli hastalıklara bağlı obstrüksiyonu sonucu bağırsak içeriğinin akışının durmasıdır. En sık sebebi geçirilmiş abdominal cerrahi sonrası yapışıklıktır (brid ileus).\nDiğer nedenler GİS tümörleri, lümen içi yabancı cisimler, safra taşı ileusu, inkarsere herni, volvulus ve dıştan basıdır. İntestinal obst. ve psödo obst.da (nöral-musküler yetersizlik) distansiyon belirgindir. Ayırıcı tanısında ani başlayan, keskin, periumblikal ağrı görülür. Ağrıyı takiben belirgin distansiyon, bulantı ve kusma gelişebilir. Kusmakla ağrı rahatlar. Obstrüksiyon ince bağırsak proksimalindeyse epigastrik bölgede ağrı ile birlikte safralı kusma, İ.B distalindeyse periumblikal ağrıyla birlikte fekaloid materyal içeren kusma görülebilir. Gaz ve gaita çıkaramama söz konusudur. Oskültasyonda bağırsak sesleri hiperaktiftir. Şiddetli bağırsak sesleri saptanır ve zamanla bağırsak sesleri azalabilir. Lab bulguları non spesifiktir, elektrolit kaybı bulguları vardır; BUN ve kreatinin yüksekliği, hiponatremi, hipokloromi ve metabolik asidoz gözlenir. Ayakta direkt grafi ve BT'de obstrüksiyonun proksimalindeki bağırsak segmentlerinde dilatasyon ve hava-sıvı seviyesi, distalinde ise segmentlerde kollaps görülür. BT'de oral kontrastın obstrüksiyonun distaline geçemediği görülür.", "pages": [22, 23]}, {"no": 44, "q": "İleus tipleri inraluminal intramural bağırsakdışı en sık sebepleri neler, adezyonların en sık sebebi", "tip": "Bilgi", "hoca": "Bülent Erkek", "a": "İleus öncelikle Mekanik İleus ve Fonksiyonel İleus olmak üzere iki tipte incelenir. Mekanik İleus: İntraluminal (Obturasyon), İntramural (Bağırsak duvar Lezyonları),Bağırsak Dışı (Ekstrensek)\nFonksiyonel İleus: Adinamik (İnhibisyon- nöromusküler sistem inh.), Spastik(Kas kitlesi spazmı), Vasküler Oklüzyon (İskemi sebepli motilite yok)\nMekanik İleus Sınıflaması: Tam/Parsiyel, Akut/Kronik(kaşektik karın duvarında bağırsak hareketi izlenebilir), Yukarı(proksimal)/Aşağı(Distal), Basit/ İnvajinasyon (Proksimal bağırsak ansı distalin içine girer)/Strangüle (Kan akımı bozulmuş)/ Kapalı Ans (Her iki taraf da tıkalı)/ Birleşik Volvulus (Bağırsaklar birbiri etrafında dolanır. Mekanik\nİntraluminal Tıkanıklık: Mekonyum, İntusepsiyon, Safra Taşı İleusu, Sıkışma( Fekal veya baryum taşlaşması, parazit vs) İntramural Tıkanıklık: Konjenital (atrezi, imperfore anüs, mekkel divertikülü), Travmatik (Duodenumda İntramural hematom), İnflamatuvar (Crohn, divertükilit, radyasyon, tüberküloz), Neoplastik (primer, sekonder yani metastaz), Çeşitli sebepler KCl tablet endometriyozis, iskemik striktür.\nEkstrensek Tıkanıklık: Adhezyonlar, Fıtıklar, Volvuluslar, Dışardan bası yapan kitleler (abse,anüler pankreas, gebelik)\nFonksiyonel:\nAdinamik: Nörojenik (spinal kord lezyonları, yaralanma, hematom), Metabolik (Elektrolit imbalansı-hiponatremi, hipokalsemi- hipotiroidizm), Farmakolojik (Morfin, antiasit, antikolinerjik), İnfeksiyöz (Pnömoni pyelonefrit); En sık mide perforasyonunda peritonitle beraber görülür.\nSpastik: Ağır metal zehirlenmeleri, porfiria, üremi\nVasküler Oklüzyon: Mezenterik İskemi\n!İnce bağırsak tipi ileusun çocuklarda en sık nedeni fıtık, erişkinlerdeyse adhezyonlardır (%40-60), fıtıklar (%15-25), Tümör (%10-20) (Türkiye'de erişkinlerde en sık neden fıtıktır) !Kalın bağırsak tipinde en sık neoplaziler tıkanıklığa yol açar, volvuluslar, inflamatuar bağırsak hastalıkları ve divertiküller de sık sebepler arasındadır.\n-Sıklık olarak inceleme Ayhan Kuzu'nun dersinde de böyle verilmiş.", "pages": [23, 24]}, {"no": 45, "q": "Giste en çok görülen histopatolojik neoplazi nedir?", "tip": "Bilgi", "hoca": "Bülent Erkek", "a": "*Gastrointestinal sistem malignitelerinin %70'i Adenokarsinoma, %25 e yakını da yassı hücreli karsinomadır. Neoplastik lezyonların dağılımında, kolon kanserleri %45 ile en sık gözlenirken arkasından %33 ile özofagus kanserleri gelir.", "pages": [24]}, {"no": 46, "q": "Akut arter tıkanıklığı etyolojisi nedenleri hepsi önemli, iatrojenik olarak nasıl olur? Tedavisi,", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Ekstremitenin canlılığını tehdit edecek ölçüde perfüzyonun bozulması sonucu oluşur *Etyoloji: Tromboz, Emboli, Travma, Phlegmasia Corulae Dolens\n**Trombozda Etyoloji: En önemli etyoloji aterosklerotik damar hastalığıdır(en sık), Travmalar, Aorta diseksiyonu,\nİatrojenik Travma: İnvaziv kateterizasyon - Arteriel Kan Gazı girişimi\n**Emboli Etyoloji: Damar bifurcatiolarında ortaya çıkar, En önemli etyoloji kardiyak sebeplerdir: Kronik Kalp Yetmezliği, Kalp Yetmezlikleri, MI, Atrial Fibrilasyon\n*Ortak Belirti ve Bulgular:\n**Belirtiler: Ağrı, His kaybı, Motor kayıp **Bulgular: Nabızsızlık, Solukluk, Soğukluk *Emboli ve Tromboz Arasındaki Farklar -Embolide ani olarak ağrı başlar-Trombozda kladikasyo (bacak ağrısı) vardır / Embolide klinik durum daha ağırdır. / Emboli ani olarak geliştiği için anjiografide kollateral gözlenmez- Tromboz yıllar içinde geliştiği için kollateral oluşumu vardır. / Emboli kardiyak sebeplere bağlı gelişirken tromboz ateroskleroza bağlı gelişir.\nTedavi: Heparin-Analjezi-Hidrasyon (İlk basamak tedavi)\nAkut arter tıkanıklıklarında tedavi evreye göre yapılır:\nEVRE 1:Kritik iskemi gibi tedavi edilir.Ardından rehabiliyasyon ve antikoagülan tedavi uygulanır\nEVRE2a:Acil anjio yapılır,tromboliz- trombektomi-fasciatomi gerekirse yapılır. Ardından rehabiliyasyon ve antikoagülan tedavi uygulanır\nEvre 2b ve Evre 3:Acil revaskülarizasyon yapılır.Başarısız ise amputasyona gider,başarılı ise rehabiliyasyon ve antikoagülan tedavi uygulanır\nKomplikasyonlar: Nekroz ve doku kaybı, Reperfüzyon hasarı\n1)Kompartman sendromu: *Karın içi ödem birikerek sinirler ezilir santral sinirlerde kayıp meydana gelir. Reperfüzyon hasarı ortaya çıkar. Önlemek için fasciatomi yapılarak fascialar kesilir.Sinirler üzerindeki baskı azalır. 2)Uzak organ hasarı", "pages": [24, 25]}, {"no": 47, "q": "Künt travma nasıl olur, tromboz nasıl olur", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Künt Travma Etyolojisi: Kompresyon (ezilme), Yırtılma (Sabit olan ve olmayan organlar arasında): Örn torasik aorta & arkus aorta; dalak, böbrek pedikülü & organ, Basınç (Taşıtla önden çarpışma, örn direksiyon): Diyafram, mesane, bağırsaklar, akciğerler\nTrombozda Etyoloji: En önemli etyoloji aterosklerotik damar hastalığıdır(en sık), Travmalar, Aorta diseksiyonu, İatrojenik Travma: İnvaziv kateterizasyon - Arteriel Kan Gazı girişimi", "pages": [25]}, {"no": 48, "q": "Crush sendormu nedir nerelerde görülür", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Crush Sendromu: Ezilme biçiminde yaralanma, uzun süreli sıkışma ve hareketsizlik sonucunda ortaya çıkar. İş ve trafik kazalarındaki darbeler, çığ düşmesi ile kar kitlesinin altıda kalmak crush sendromuna yol açsa da en sık ve yaygın neden deprem sebebiyle göçük altında kalmaktır. Belirgin doku zedelenmesi ve kas nekrozu vardır. Kasların aşırı derecede ezilmesi, hızlı ve etkili bir tedavi uygulanmadığı durumda ölümle sonuçlanabilecek bir sürece ilerleyebilir. Crush Sendromu'nda ölüm nedeni ileri derecede hipovolemik şok, hiperkalemi, hipokalsemi, metabolik asidoz, akut myoglobulinürik böbrek yetmezliği ve kompartman sendromudur. Şokun temel nedeni hücre dışı sıvının büyük bölümünün zedelenen kaslarda birikmesidir. Şok gelişimi; zedelenen kaslardaki azot oksite bağlı damar genişlemesi, hiperkalemi (K ve ezilen doku proteinlerinin kana karışır, bu sebeple olur) ya da hipokalemi ile hızlanarak tüm dolaşım sistemini olumsuz etkiler. Crush sendromunda ilk başvurulan yöntem kandaki sıvı oranını arttırmaktır (saatte 1,5 litre hızla). Potasyum değerinin düşürülmesi ve fasiotomi yaygın bir tedavi yöntemidir.", "pages": [25]}, {"no": 49, "q": "Hipopotasemi etyolojisi nedenler tedavi ve dozlar…", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Hipopotasemi (hipokalemi) serum K düzeyinin 3mEq/L nin altına düşmesidir.\nEtyolojisi\nBöbreklerden aşırı K kaybı (diüretikler, amfoterisin b, alkalozda böbreğin H tutmak için K atması)\nHastaya K içermeyen sıvıların uzun süre verilmesi\nPotasyumsuz TPN (total parenteral nütrisyon) Hiperaldosteronizm\nGI kayıplar (kusma, nazogastrik drenaj, ileus, kolon fistülleri, ağır ishaller)\nYanıklarla ciltten olan kayıp\nİlaçlar (diüretikler, insülin, gentamisin, B12, laksatifler, kortikosteroidler, teofilin, tetrasiklin, sempatomimetikler)\nBelirti ve bulgular\nKardiyovasküler: Primer olarak kalp etkilenir. EKG'de düz T dalgası, deprese ST, yüksek P, uzamış PR, geniş QRS. Düşük voltaj ve arrest, postüral hipotansiyon, solunum yetmezliği Nöromuskuler: Letarji, yorgunluk, kramplar, azalmış refleksler, konfüzyon, paralizi, parestezi GİS: İleus, iştahsızlık, kusma, kabızlık Tedavi\nK açığı net olarak hesaplanamaz, ampirik olarak verilir.\nAçık yavaş yavaş kapatılmalıdır.\nK verilmesi için hastanın saatte en az 30-50 ml idrar atımı olmalıdır. (hiperpotasemi gelişirse tedavisi daha zor)\nVerilen çözeltinin litresinde en fazla 40 mEq/L K bulunmalı, günlük total doz 160 mEq/L'yi geçmemeli.\nK verilen hastada EKG izlenmeli, EKG normale dönene kadar tedaviye devam edilmelidir. Oral intravenöz replasman, oral suplementasyon tercih edilir.\nMg replasmanı şarttır, Mg normal sınırlara yükselmedikçe hipokalemi refrakter kalır. Her 100 mEq/L replasmana karşılık serum K düzeyi 1 mEq/L yükselir.", "pages": [25, 26]}, {"no": 50, "q": "Sağ üst kadran ağrısı sebepleri, ayırıcı tanı", "tip": "Olgu", "hoca": "Can Konca", "a": "Sağ üst kadranda bulunan organ ve yapılar: Karaciğer, safra kesesi ve safra yollları, midenin antrum ve pilor kısmı, duodenum, pankreas başı, sağ böbrek ve adrenal bez, kolonun hepatik (sağ) fleksurası\nSağ üst kadranda ağrı sebepleri:\nSafra kesesi ve safra yolları (Akut kolesistit, bilier kolik (taş), kolanjit, hemobili vb) Hepatit\nKaraciğer apsesi\nKalp yetmezliğne bağlı hepatomegali\nPeptik ülser\nPankreatit\nRetroçekal apandisit\nBöbrek ağrısı\nZona (herpes zoster)\nMyokardial iskemi\nAlt lob pnömonisi\nAmpiyem\nAyırıcı tanı ?", "pages": [26]}, {"no": 51, "q": "İleuss nedir", "tip": "Bilgi", "hoca": "Can Konca", "a": "İleus, intestinal içeriğin gastrointestinal sistem içerisinde sefalokaudal yani distale doğru ilerleyişinin tam ya da parsiyel olarak engellenmesidir. Nedeni ne olursa olsun tüm tıkanmalar ileustur.", "pages": [26]}, {"no": 52, "q": "Pulmoner emboli nasıl gelişir, neye bağlıdır", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Pulmoner emboli, vücudun başka bir bölggesinde oluşan trombüsün akciğerin bir kısmına giden kan akımına engel olmasıdır. Embolinin kaynağı çoğunlukla bacaklardaki DVT olmakla beraber diğer kaynaklar pelvis, kol ve kalptir. Belirtiler: Ani başlayan ve giderek artan nefes darlığı, göğüs ağrısı, öksürük, öksürükle beraber kan tükürme (Hemoptizi), bacakta şişme, kızarıklık ve ağrı, bayılma hissi, terleme, huzursuzluk, ölüm korkusu", "pages": [26, 27]}, {"no": 53, "q": "Masif ven trombozu nedir, hangi venlerde olur,", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Masif: ağır, çok fazla\nMasif ven trombozu DVT'nin şiddetli ve yaygın halidir. Pelvis ve ekstremitede tüm venlerde olabilir.", "pages": [27]}, {"no": 54, "q": "Phlegmesia cerulae dolens, alba dolens", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Phlegmasia Cerulea Dolens, DVT sebebiyle tıkanan vende kanın toplanması sonucu bacağın şişmesi ve sonuç olarak arterin dolaşımı sağlayamamasıyla gangren gelişmesidir. Bacağın kaybına neden olabilen tek toplardamar rahatsızlığıdır.\nDVT'nin ilerlemesiyle tüm derin venlerin tıkanmasına arteryel vazospazm da eşlik eder. Ekstremitede ödem, solukluk ve ağrı izlenir. Buna phlegmasia alba dolens denir. Phlegmasia alba dolens'te kollateral damarlar ya hiç tutulmamış ya da coerulea dolens'teki kadar yaygın olarak tutulmamıştır, venöz dönüş sorunlu olsa da kısmen sağlanabilmektedir. Dolayısıyla ödem, phlegmasia coerulea dolens tablosunda daha belirgindir.", "pages": [27]}, {"no": 55, "q": "Kompartman sendromu", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Kompartman sendromu kol ve bacak kaslarındaki basıncın tehlikeli ve ciddi seviyelere ulaşması sonucu ortaya çıkan çok ağrılı bir klinik durumdur. Kaslardaki doku basıncı ve gerginliğin artması içinden geçen arter ve venlerin tıkanmasına yol açarak kangren ve uzuv kaybı ile sonuçlanan ciddi ve acil müdahale gerektiren bir klinik tablodur. Akut kompartman sendromu (AKS) acil tedavi ve müdahale gerektirebilir. Genellikle trafik kazası, yüksekten düşme veya iş kazaları sonrası gelişir. Tedavi edilmez ise kalcı kas hasarı veya uzuv kaybı ile (amputasyon) ile sonuçlanabilir. Kronik kompartman sendromu (KKS) ise genellikle aşırı egzersiz ve sportif aktiviteler sonucu ortaya çıkan ve acil tedavi gerektirmeyen klinik durumlara denir.", "pages": [27]}, {"no": 56, "q": "Alt gis kanaması nedenleri, 2 ye ayrılıyormuş", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Alt GIS kanaması sebepleri\n60+ en sık sebepler vasküler ektazi (anjiyodisplazi), divertikülozis. 60- en sık sebep divertikülozis. Alt GIS kan kayıplarının en sık nedeni ise karsinomlar.\nSüt çocuğu ve çocuklar: Meckel, polip, ülseratif kolit\nAdolesan ve genç erişkin: Meckel, inflamatuvar bağırsak hastalığı, polip\n60- erişkin: Divertiküler hastalık, inflamatuvar bağırsak hastalığı, neoplastik hastalıklar 60+ erişkin: Anjiyodisplazi, iskemik kolit, divertiküler hastalık, neoplastik hastalık Diğer nadir nedenler çekal ülserasyon, sarkom, lenfoma, lösemi, hematolojik hastalıklar, CMV enfeksiyonları, iskemik sendromlar", "pages": [27]}, {"no": 57, "q": "Anjiyodisplazi nedir kimlerde görülü", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Gastrointestinal sistemin en sık görülen damar anomalisidir. Çeşitli sistemik hastalıklarda veya yaşlanmayla kolon mukozasındaki kapiller ve venöz yapılar dilate olarak damar duvarı zayıflar\nve bunun sonucunda spontan kanamalar görülebilir. Anjiyodisplazi alt GİS kanamalarında özellikle yaşlılarda(60 yaş üstü) en sık görülen sebeptir.", "pages": [28]}, {"no": 58, "q": "Akut pankreatit komplikasyonları", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Akut pankreatitin en sık görülen\nsistemik komplikasyonları: Atelektazi,ARDS,Hipovolemi,Hipokalsemi,DIC, Azotemi,Hiperglisemi,Tromboemboli,Yağ nekrozu,Çoklu Organ yetmezliği\nAkut pankreatitin en sık görülen l\nokal komplikasyonlar:\nPseudokist(Akut pankreatitin en sık komplikasyonudur.Alkolik pankreatitlerde daha sık görülme eğilimindedir.Tanıda en değerli yöntem BT'dir.),apse,flegmon,asit,komşu organlara ait(nekroz,sarılık,fistül...)\nAkut pankreatitin en mortal komplikasyonu enfekte pank.nekrozu", "pages": [28]}, {"no": 59, "q": "Sistemik ve lokal kist hidatik komplikasyonları, peritona açılırsa ne olur, safraya açılırsa ne olur, kist hidatiği nasıl önleriz", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Kistin toraks içine rüptürü akciğer semptomlarına , kistin enfeksiyonu karaciğer apselerine ,peritonel hidotosis karın içinde kız veziküllerin oluşmasına,safra yollarına fistülizasyonu kolanjite\nportal ven trombozu veya portal vene basıyla portal hipertansiyona,deriye fistülizasyonuna,vasküler erozyonla ani kanamalara ,anaflaktik şoka neden olur. Nasıl önleriz yazarsın", "pages": [28]}, {"no": 60, "q": "Hipertansiyonu olan hastada cerrahi hazırlık?", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "İlaçlarla kontrol altında tutulan hipertansiyon ameliyat için ciddi bir sorun yaratmaz ancak kan basıncı ısrarla 200/100mmHG'dan yüksek bulunuyorsa ameliyattan önce araştırılması ve tedavi edilmesi gerekir.\nHipertansiyonu tedavi edilmemiş ya da güçlükle kontrol edilebilen ve son organ hasarı bulunan hastalarda operasyonun kan basıncı regülasyonu sağlanıncaya kadar ertelenmesi önerilir.\nSon organ hasarsız, tedavi edilmemiş ya da güçlükle kontrol edilmiş hafif orta derecede hipertansiyonda kardiyovasküler instabilitenin dikkatli takibi ve tedavisi gerekir.Akut perioperatif beta bloker tedavisi faydalı olalbilir.", "pages": [28]}, {"no": 61, "q": "Tiroid görh evisserasyon evantrasyon hemoroid tedaivisi", "tip": "Bilgi", "hoca": "Hakan Uncu", "a": "Görh tedavisi: Yaşam tarzı değişiklikleri: kilo verme,yatak başını 10-15cm yükseltme,kahve ve sigaradan uzak durmak,yatmadan önce yemek yememek\nMedikal tedavi: Medikal tedavide amaç,semptomların ortadan kaldırılması, özofajitin iyileştirilmesi ve komplikasyonlardan korunma olmalıdır .PPI, H2 reseptör blokörleri, antiasitler,prokinetikler\nEndoskopik tedaviler: Bileşkeye dikiş veya radio-frekans enerji\nCerrahi tedavi:Nissen ameliyatıdır.Midenin fundusunu özofageal bileşke etrafında 360 derece sarıp dikmedir.\nEvisserasyon fasya ve cilt dikişlerinin beraber açılmasıyken evantrasyon fasya dikişlerinin açılıp cilt dikişlerinin sağlam kalmasıdır. Hemoroid tedavi konservatf :Diyet ilaç sıcak duş uygulama\nNonoperatif: Lastik band ligasyonu, infrared koagülasyon, bipolar koagülasyon, skleroterapi, radyofrekans, direkt akım,\nCerrahi: Klasik (kapalı submukozal hemoroidektomi, açık hemoroidektomi) Stapler hemoroidopeksi(LONGO), THD(Hemoroid\narteri ligasyonu)\nEksternal hemoroidler asla bantlanmaz.Hasta çok şiddetli ağrı duyar.!", "pages": [28, 29]}, {"no": 62, "q": "Yaşlı hasta stazı var ne olabilir pulmoner emboli", "tip": "Olgu", "hoca": "Nezih Erverdi", "a": "Venöz staz,tromboz oluşumuna yardımcı bir faktördür.Yaşlılık yatağa bağımlı olma,konjestif kalp yetmezliği,uzun süre aynı pozisyonda oturmayı gerektiren seyehat...trombüs oluşumuna yol açar\nPulmoner embolizmin nedeni %90 derin ven trombüsüdür.", "pages": [29]}, {"no": 63, "q": "Kist hidatik döngüsü, korunma yolu", "tip": "Bilgi", "hoca": "Nezih Erverdi", "a": "Parazitin esas konakçısı köpekler, tilkiler gibi kanin türleridir. Küçükbaş hayvanlar, insanlar ara konaktır. Erişkin parazit kanin türlerinin ince bağırsağının ileumunda 1 yıl yaşar ve feçesle yumurtalarını atar. İnsanlar ve küçükbaş hayvanlar kontamine olmuş sebzeleri veya su kaynaklarını\ntüketirler ve parazit ara konağa geçer. Duodenumda yumurta aktive olur, portal vene penetre olarak karaciğere ulaşır karaciğerde kist hidatiğe neden olur.\nBu kistik lezyon içerisindeki germinatif membrandan protoskoleks ve skoleks oluşur. Döngü koyunların kesilmesi sonucu kist içeren karaciğerleri\nköpekler yediğinde tekrar köpek, skoleks ve protoskoleksleri alır. Erişkin parazit, köpeğin ince bağırsağında oluşur.\nBu döngüyü köpeklerin alması aşamasında kırarsak hastalığın yayılmasını engelleyebiliriz.Bu konuda yapılması gereken köpeklerin albendazol ve mebendezolle tedavi edilmesi,\nhayvan kesim kontrolü(kistik karaciğerlerin köpeklere verilmesinin engellenmesi) sebze meyvelerin iyi yıkanmasıdır.", "pages": [29]}, {"no": 64, "q": "Feokromasitoma klinik tanı yöntemleri", "tip": "Bilgi", "hoca": "Volkan Genç", "a": "Katekolaminler akut olarak artan reaktanlardır.Katekolaminler spot kanda ölçmenin anlamlılığı yok o yüzden yıkım ürünlerine(metanefrin normetanefrin) bakabiliriz. Plazma metanefrin en sensitivitesi yüksek testtir.\nKlonidin(santral etkili alfa2 adrenerjik) verdiğimizde kan katekolamin düzeyinin düşmesini bekleriz fakat feokromasitomada baskılanmaz.\nKromogranin A ve Nöropeptid Y artışı görülür. Görüntülenme yöntemlerinde tomografi altın standart, şüphe halinde MR çekilir.Tomografi ve MR negatifse veya adrenal glanddaki Feo > 10cm saptandıysa\nmutlaka ekstraadrenal bir doku var mı diye (bir paraganglioma eşlik ediyor mu diye) MIBG sintigrafisi yapılır.", "pages": [30]}, {"no": 65, "q": "Adrenal insidentaloma nedir", "tip": "Bilgi", "hoca": "Volkan Genç", "a": "adrenal insidentaloma farklı sebeplerle yapılan görüntülemeler sonucunda adrenal bezde rastlantısal olarak bir kitleye rastlanmasıdır. CT de bu oran yüzde 1-4 kadardır. Akla primer ( aldesteronoma, FEO, kortizol salgılayan adenom, virilizan kitleler, kist, karsinom…) ve metastatik(AC, meme, melanom, lenfoma...) gelmelidir. ayırıcı tanıda deksametazon supresyon testi, sex streoidleri için 17- ketosteroidler, FEO için 24 saat idrar metanefrin, hipertansiflerde K, Na, aldosteron ve renin bakılır. kanser düşündüren CT bulguları >18 HU, inhomojen, irregüler sınır, lokal invaze, LAP.", "pages": [30]}, {"no": 66, "q": "Peptik ülser olgusu perfore olmuş tanı ?", "tip": "Olgu", "hoca": "Sancar Bayar", "a": "başlangıç faz( 2 saat): ani başlayan keskin karın ağrısı. Genelde epigastriumda. Taşikardi. Ekstremitlerde soğukluk. Pnömoperitoneum %75.\nikinici faz: ağrı azalır ancak tüm karında mevcuttur.\nÜçüncü faz: abdominal distansiyon. Ağrı rijidite hassasiyet --> tahta karın\ntedavisi primer sütur + omentopeksi(?) veya rezeksiyondur.", "pages": [30]}, {"no": 67, "q": "Yara tanım çeşitleri, dikilen yaralar dikilmeyen yaralar, yara iyileşme aşamaları", "tip": "Bilgi", "hoca": "Salim Demirci", "a": "travma sonucu doku bütünlüğünün bozulmasına yara denir.\ncerrahi yara çeşitleri: temiz, kontamine, kirli kontamine kirli.\nyara iyileşme aşamaları: inflamasyon 1-4 gün proliferasyon 2-22gün matürasyon 6-12 ay primer yaralar dikilir, gecikmiş pimer yaralar sonradan dikilir, sekonder yaralar açık bırakılıp iyileşmeye bırakılır örn pilonidal sinüste", "pages": [30]}, {"no": 68, "q": "Sepsis, sepsis çeşitleri, her sepsis aynı mı septik şok, hipovolemik şok- septik şok inspeksiyondaki farkı", "tip": "Bilgi", "hoca": "Acar Tüzüner", "a": "sırs + enfeksyiona sepsis denir. Şiddetli sepsis: doku hipoperfüzyonu ve organ disfonk. İle beraber sepsis.\nSeptik şok: yeterli resüsitasyona rağmen devam eden hipoperfüzyon ve organ yetmezliği. Sepsis şok hipovolemik şok farkı: septik şokta ateş var, septik şokta erken dönemde kalp debisi normal veya artmıştır, hipovolemik şokta ise azalmıştır. septik şokta erken dönemde hastaların ciltleri ılık ve pembedir, hipovolemik şokta cilt soğuk ve soluktur.", "pages": [30, 31]}, {"no": 69, "q": "Mide ca risk faktörleri", "tip": "Bilgi", "hoca": "Kaan Karayalçın", "a": "mide ca risk: erkek, düşük sosyoekonomik güç, herediter diffüz mide ca( cdh-1 mut.), FAP(APC mut.), HNPCC(MLH-1 mut.), tütsülenmiş besin, aşırı tuz, az antioksidan ve c vitamini, polip, h. Pylori(hem adeno ca hem lendoma için risk), e. Barr, intestinal metaplazi, atrofik gastrit, displazi, aile öyküsü...", "pages": [31]}, {"no": 70, "q": "Crohn hastalığı ve ülseratif kolit farkları", "tip": "Bilgi", "hoca": "Kaan Karayalçın", "a": "ülseratif koliti ük, crohn u c diye kısaltacağım. Ük rektumdan başlar yavaş yavaş proximale yayılır, c tüm giste yamasal tutulum yapar. Ük mukoza ve submukozayı tutar, c tüm duvarı tutar. Ük daha ağır diyare ve kanama yapar ve dışkılama mukusludur, c de bu daha hafiftir. c de ateş ve karın ağrısı daha şiddetlidir. c daha sinsi ilerler. ük da geniş ülserler vardır, c de ülserler aftöz ve lineerdir. ük da haustralar bozulur ve kurşun boru görünümü izleriz. c de mezo duvarı sarmaya başlar. perianal hastalık: fissür, fistül vb crohnda görülür. c sıklıkla ileumu tutar, ük kolonla sınırlıdır. striktür ve abdominal kitle c de daha sık ük da ise nadirdir. ikisi de ekstraintestinal bulgu verebilir ( üveit, stomatit, dermatit, kc hasarı...) vr bimodal dağılım gösterirler 20-30y ve 60-70y.", "pages": [31]}, {"no": 71, "q": "Akut kolesistitli hastaya yaklaşım", "tip": "Olgu", "hoca": "Kaan Karayalçın", "a": "semptomlar :biliyer kolik, kusma bulantı, iştahsızlık…\nbulgular: ateş, taşikardi, murphy bulgusu, sağ üst kadranda kitle gelebilir…\nlab : lökositoz, hastaların yarısında bilirubin ve amilaz da yükselir.\nUSG : safra taşı, duvar kalınlaşması, perikolesistik sıvı, hidropik kese.\nayrıcı tanı: akut appendisit, peptik ülser perforasyonu veya penetrasyonu, akut pankreatit, hepatit, kc apse.\nkomplikasyonlar: en sık perikolesistik apse, gangren, perforasyon, ampiyem, kolesistoenterik fistül. tedavi ilk 72 saat içinde ameliyat( kolesistektomi) , gecikirsek analjezik . antispazmodik . antibiyotik tedavisi sonra ameliyat.", "pages": [31]}, {"no": 72, "q": "Tiroidektomi sonrası takip, chovstek ve trousseau bulguları, bu bulgular ne demek(hipokalsemi), hipokalsemide neyden korkarsın (konvülzyon, ventriküler fibrilasyon, laringospazm)", "tip": "Bilgi", "hoca": "Ethem Geçim", "a": "tiroidektomi sonrası suspresyon dozunda levotiroksin ver( >125 mikrogram/gün) tiroglobülin ile izle eğer >3ng/ml gelirse metastastaz ve rezidü doku kalmasından şüphelen. TSH değerlerini izle ve supresyon tedavinle 0.3-1 arasında tutmaya çalış. metastazdan şüpheleniyorsan RAİ ile sintigrafi çekebilirsin. tirodektomi sonrası hipoparatiroidi görülebilir dolayısıyla hipokalsemı olabilir: cvhostek ve trousseau bulguları bunu gösterir. chvostek e kulağın ön tarafına hafifçe parmak ucu ile vurulduğunda dudak kenarının aynı tarafa seğirme belirtisi.\ntrousseau ise klinikte tansiyon aletinin manşonunun sistolik basınç üzerinde bir süre sıkılması ile ebe eli görünümünün meydana gelmesidir. hipokalsemide laringospazm, konvülziyon ve ventriküler fibrilasyondan ve aritmiden korkarım.", "pages": [31, 32]}, {"no": 73, "q": "Yara nedir, iyileşme basamakları,", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "Herhangi bir travma sonucu doku bütünlüğünün bozulmasına yara denir.\nyara iyileşme aşamaları: inflamasyon 1-4 gün proliferasyon 2-22gün matürasyon 6-12 ay primer yaralar dikilir, gecikmiş pimer yaralar sonradan dikilir, sekonder yaralar açık bırakılıp iyileşmeye bırakılır", "pages": [32]}, {"no": 74, "q": "Hemostaz(primer, sekonder detaylı), hemostaz bozuklukları,", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "Vasküler yanıt ve trombosit tıkacının oluşması primer hemostaz, koagülasyon sistemi ise sekonder hemostaz olarak tanımlanır.\nVasküler faz-Trombosit fazı-Koagülasyon fazı-Fibrinoliz fazı\nBirincil hemostaz hasar yerlerinde trombosit tıkacının oluştuğu olaya verilen isimdir. Hasarı izleyen saniyeler içerisinde gelişir. Esas olarak kapillerlerden, küçük arteriol ve venüllerden kan kaybının durdurulması bakımından önem taşır. İkincil hemostaz plazma pıhtılaşma sistemi reaksiyonlarını kapsar ve sonuçta fibrin oluşur. Bunun tamamlanması birkaç dakika alır. Oluşmuş olan fibrin lifleri birincil hemostaz tıkacının oluşmasını artırır. İkincil hemostaz daha büyük damarlarda önem taşır.\nVWF eksikliği primer hemostaz bozukluğu iken faktör eksiklikleri sekonder hemostaz bozukluklarıdır.", "pages": [32]}, {"no": 75, "q": "Pıhtılaşma zamanları?", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "PTT testi (aktif parsiyel tromboplastin zamanı testi), kanınızın pıhtılaşma süresini ölçen bir kan tahlilidir.\nPIHTILAŞMA ZAMANI Normal hemostazda yukarda saydığımız maddelerin ve pıhtılaşma faktörlerinin yanında damar duvarlarını döşeyen endotel hücrelerinin ve de onları çevreleyen bağ dokusunun sağlıklı olması gereklidir.\nKANAMA ZAMANI\nNormal değer 2-4 dakikadır. Kanama zamanının normalden uzun olması, daha çok trombositler ya da damar çeperi ile ilgili bir patolojik olayın varlığını düşündürmelidir", "pages": [32]}, {"no": 76, "q": "Richter fıtığı", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "Richter ftğı: Pincement laterale: Barsağın antimesenterik duvarının fasyal defekt içersinde sıkışması ve strangüle olmasıdır. Bu durumda ileus meydana gelmediği için doktoru yanıltabilir gangren ve perforasyon ile peritonite yol açabilir", "pages": [32]}, {"no": 77, "q": "Bilateral olabilen mastektomi yapılan meme ca (lobüler karsinom)", "tip": "Bilgi", "hoca": "Ethem Geçim", "a": "Lobüler Ca’nın bilateral olma riski daha fazladır duktal ca’ya göre", "pages": [32, 33]}, {"no": 78, "q": "Safradaki poliper", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "Safra kesesi poliplerinin Cerrahi Endikasyonu:\n-6 mm ≤ polipler\n-Semptomatik polipler\n-Büyüme gösteren polipler\nSafra kesesi poliplerinde Malgnite riski:\n-1 cm ≤\n-Tek polip\n-50+ yaş\n-1 cm ≥ poliplerde malignite oranı % 7.4 Kolesterol Polipleri\n•\nEnfamatuar Polipler\n•\nAdenomatoz Polipler\n•", "pages": [33]}, {"no": 79, "q": "Akut kolesistit, biliyer kolik, visseral parietal ağrı, belirti ve bulgular, komplikasyonlar", "tip": "Bilgi", "hoca": "?", "a": "", "pages": [33]}, {"no": 80, "q": "Apse ampiyem farkı", "tip": "Bilgi", "hoca": "?", "a": "Vücutta önceden bulunan bir boşlukta irin birikmesi ''Ampiyem''dir. Apseden farkı şudur: Apsede yeni bir boşluk oluşması söz konusudur, ampiyem ise zaten bulunan boşluklarda olur. Her ikisinde de pürülan sıvı bulunmaktadır.", "pages": [33]}, {"no": 81, "q": "Asepsi antisepti dezenfeksiyon sterilizasyon", "tip": "Bilgi", "hoca": "?", "a": "Asepsi, herhangi bir invaziv girişimde ortamın ve kullanılacak aletlerin sporlu formları dahil tüm mikroorganizmalardan arındırılmasıdır. Antisepsi, canlı dokuların yüzeyinde bulunan sporlu formları hariç tüm patojen mikroorganizmaların kimyasal yöntemler kullanılarak yok edilmesidir.\nSterilizasyon, cansız materyallerin yüzeyindeki sporlu formları dahil tüm mikroorganizmaların fiziksel yöntemler kullanılarak yok edilmesidir. Dezenfeksiyon, cansız materyellerin yüzeyindeki sporlu formları hariç tüm mikroorganizmaların kimyasal yöntemler kullanılarak yok edilmesidir.", "pages": [33]}, {"no": 82, "q": "Mide karsinomu predispozan faktörler, premalign lezyonlar", "tip": "Bilgi", "hoca": "?", "a": "Mide kanseri risk faktörleri; Erkek olmak, Yaş, Diyet (Tütsülenmiş etler, tuz ve nitrat[gıda koruyucular] yönünden zengin besinler), Sigara- Alkol kullanımı, Helicobacter Pilori enfeksiyonu, Gastrit, A kan grubu, Genetik yatkınlık (p53, c- erb, B2), Obezite, Radyasyona maruziyet, Midede polip, Displazi, EBV. Mide kanseri premalign lezyonları; Midenin hiperplastik polipleri, Mide adenomları, Gastrik epitelyal displazi.", "pages": [33, 34]}, {"no": 83, "q": "Adrenal insidentaloma nedir ayırıcı tanısı, tedavisi malignite kriterleri", "tip": "Bilgi", "hoca": "?", "a": "Adrenal İnsidentaloma, belirgin adrenal hastalık kuşkusu yokken raslantısal olarak saptanan adrenal kitlelere denir. Ayırıcı tanısı; Fonksiyonel hastalıklara yönelik anemnez alınır, Cushing sendromu için -> Deksametazon supresyon testi, Feokromositoma için -> Plazma Metanefrin düzeyi, Conn sendromu (Primer Hiperaldosteronizm) için -> Aldesteron-Renin oranı. Malignite kriterleri; Radyolojik görüntülemede 4cm'den büyük olması, malignite düşündüren özellikleri olması. Tedavisi; 4cm üzerindeyse cerrahi, 4cm altındaysa ancak malignite şüphesi varsa cerrahi, non-fonksiyonel ise ve 4cm altındaysa yıllık tomografiler ile hasta takip edilir.", "pages": [34]}, {"no": 84, "q": "Karaciğer kist hidatiği bakterisi döngüsü,", "tip": "Bilgi", "hoca": "Kaan Karayalçın", "a": "Ara konakçı enfektif yumurtaları ağız yoluyla alır > Yumurtalar duodenumda embriyo haline gelirler > Onkosfere dönüşüp mukozadan geçerek portal sistem ile karaciğere ulaşırlar > En sık sağ loba yerleşirler ve kist formasyonu oluştururlar > Hidatik kistin germinatif tabakasından skoleks ve protoskoleksler büyür (Kist içinde küçük kistler oluştururlar) > Hastalıklı karaciğer ana konakçı tarafından yenir ve döngü devam eder.", "pages": [34]}, {"no": 85, "q": "Tiroid malignite kriterleri", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "Anamnezde; Nodülde hızlı büyüme, Bası ve invazyon semptomları (Disfoni, Disfaji, Hemoptizi, Dispne), Tiroid hormonu ile supresyon yapılmasına rağmen nodülde büyüme olması, Ailede tiroid kanseri öyküsü MEN öyküsü. Fizik Muayenede; Nodülün çok sert olması, 4cm'den büyük olması, yüzeyinin düzensiz olması, çevre dokulara fikse olması, Bölgesel LAP varlığı. Ultrasonografide; Düzensiz kenarlı nodül, Santral mikrokalsifikasyon, Servikal LAP, Heterojen görünüm (Nodülün bazı kısımları nekroza gitmiş olabilir.) Doppler USG'de; Santral kanlanma görülmesi. Sintigrafide; Soğuk nodül olması.", "pages": [34]}, {"no": 86, "q": "Tiroid ca tipleri diferansiye un diferansiye", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "Differansiye= Papiller Tiroid Karsinomu, Folliküler Karsinomu, Hurthle Hücreli Kanser. Undifferansiye= Anaplastik Karsinom, Lenfoma, Metastatik Karsinom, Meduller Tiroid Karsinomu.", "pages": [34]}, {"no": 87, "q": "Bethesta sınıflaması", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "Bethesda sınıflaması tiroid ince iğne aspirasyon numuneleri için oluşturulmuş bir raporlama sistemidir. Bethesda kategori 1= Non-diagnostik. Bethesda kategori 2= Bening. Bethesda kategori 3= Önemi belirsiz atipi/foliküler lezyon (%10-30 malign). Bethesda kategori 4= Foliküler neoplazi veya şüphesi (%20-30 malign). Bethesda kategori 5= Malignite için şüpheli (%50-75). Bethesda kategori 6= Malign. [5. ve 6. kategorilerde kesin cerrahi uygulanır. 3. ve 4. kategorilerde USG ve fizik muayenede malignite bulguları varsa cerrahi uygulanır, yoksa takip edilir.]Bethesda 3’te tekrar biyopsi yapılır.", "pages": [34, 35]}, {"no": 88, "q": "Sıcak havada çok terlemiş hasta, ne yaparsın(hiponatremi), detaylarını sormuş, nasıl tedavi edilir takviyesi nasıl", "tip": "Olgu", "hoca": "Aydan Eroğlu", "a": "Sodyum açığı hesaplanır [istenilen Na(140? meq/L) - mevcut Na x Vücut ağırlığı x 0.6]. Düzeltme hızı saatte 0.5-1 meq/Lyi geçmemeli (osmotik demiyelinizasyona neden olabilir.) Hafif ve orta dereceli hiponatremi olgularının tedavisinde %0.9 NaCl çözeltisi kullanılır. Şiddetli hiponatremilerde %3-5 NaCl çözeltisi kullanılır.", "pages": [35]}, {"no": 89, "q": "Şok nedir, tipleri neler, tanısı tedavisi", "tip": "Bilgi", "hoca": "Ethem Geçim", "a": "ŞOK, hemodinamik bozukluk ve organ disfonksiyonuna yol açan yetersiz doku perfüzyonudur. Yani hücresel düzeyde aerobik metabolizmayı sürdürebilecek metabolik bileşenlerin -ki bu temel olarak oksijendir- yetersiz kalmasıdır.Hipovolemik, septik, kardiyojenik, nörojenik, obstrüktif ve anaflaktik şok tipleri vardır.\nŞokun klinik bulguları: ajitasyon, hipotansiyon, taşikardi, zayıf periferik nabızlar, soğuk ve nemli ekstremitelerin olmasıdır. Kinik olarak belirgin bir şok tablosunun gelişebilmesi için kan hacminin en azında %20-30 kaybı gerekir.Klinik tablonun gelişiminde kaybın şekli, süresi,miktarı, hastanın yaşı ve genel durumu belirleyicidir.Hipovolemik şokta hastanın nabzı hızlı, ekstremiteleri soğuk ve soluk, solunumu hızlı ve yüzeyel, vücut sıcaklığı düşüktür ayrııca hastada susuzluk hissi vardır. Tedavisinde devam eden kanamanın kontrolü tedavinin temelidir. Bu nedenle önce kan kaybı kontrol altına alınır, hipotansif hastada kan ürünleriyle iv resüsitasyon yapılır ve hava yolu emniyete alınır. Septik şok, ciddi sepsisi olan ve yeterli sıvı resüsitasyonuna rağmen hipotansif kalmaya devam eden hastaları tanımlar. Bu hastaların sistolik kan basıncını sürdürebilmek için vazoaktif ilaç kullanmak gerekir. (çıkmışlar sayfa 69 da SIRS kriterleri var lütfen bakın) Septik şoklu hastalarda ateşle birlikte taşikardi, takipne ve konfüzyon, oligüri, hipotansiyon gibi hipoperfüzyon belirtileri olabilir. En sık septik şok nedeni gram negatif bakterilerin enfeksiyonudur. Tedavide önce kaynak kontrolü yapılmalıdır. Cerrahi girişimlerle ve antibiyotiklerle enfeksiyon kontrol edilmeye çalışılır. Sıvı replasmanı, vazoaktif ilaçlar da yardımcı tedavidir. Kardiyojenik şok yeterli intravasküler hacim olmasına rağmen gerekli kardiyak debinin sağlanamadığı şok tipidir en sık nedeni MI. Nörojenik Şok, periferik vasküler yatakta vazomotor tonusun kaybına bağlı azalan doku perfüzyonu sonucu gelişir. Bradikardi, azalmış kan basıncı, motor ve duyu kayıpları, kuru sıcak ekstremiteler (periferik vd'a bağlı) görülür. Hava yolu ve yeterli ventilasyon sağlanır ve ıv sıvı tedavisi verilir. Obstrüktif şokta, primer kardiyak yetmezlik veya bozukluk olmaksızın kardiyak debiyi düşürecek şekilde dolaşımın mekanik olarak bozulmasından kaynaklanır. Perikard tamponadı, pulmoner emboli, tansiyon pnömotoraks neden olabilir. Anaflaktik şok, duyarlı kişilerin yabancı antijenle karşılaşması sonucu oluşur.", "pages": [35, 36]}, {"no": 90, "q": "Sağ üst kadran ağrısı sebepleri, ayırıcı tanı tıkanma sarılığı", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "Sağ üst kadran ağrısı nedenleri; Safra kesesi ve safra yolları (akut kolesistit, biliyer kolik, kolanjit, hemobilia..) , hepatit, karaciğer apsesi, kalp yetmezliğine bağlı hepatomegali, peptik ülser, pankreatit, retroçekal apandisit, böbrek ağrısı, Zona (herpes zoster) , MI, alt lob pnömonisi, ampiyem olabilir.\nTıkanma sarılığında ayırıcı tanı (emin değilim) : akolik gayta, kaşıntılı sarılık ve çay rengi idrar olmasıdır Tıkanma sarılıklı hastalarda ilk olarak yapılması gereken görüntüleme yöntemi usgdir. Usgde intrahepatik safra yollarının dilate olarak izlenmesi ekstrahepatik kolestaz tanısı koydurur.\nTıkanma sarılığı (TS) acil cerrahi başvurularında önemli bir antitedir ve yönetimi oldukça karmaşıktır. Temel sorun karaciğerde üretilen safranın duodenuma akışının kesilmesidir. Bilirubinin kana geri difüze olması ve karaciğerin bilirubin matabolizmasının bozulması sonucu olarak; deri, göz ve müköz membranlar sararır, gayta rengi açılır, idrar rengi koyulaşır. Kanda bilirubinin 2,5 mg/dl üzerine çıkması sarılığı belirginleştirir.", "pages": [36]}, {"no": 91, "q": "Tıkanma sarılığının sebepleri,", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "Koledok taşları en sık nedenidir. Peri ampüller bölge tümörleri (periampüller bölge tümörleri, ekstrahepatik safra yolları tümörleri, ampulla vateri kanserleri, duedonum tümörleri), Koledok striktürleri, parazitlere bağlı koledok kistleri özellikle askariazis kist hidatik", "pages": [36]}, {"no": 92, "q": "Safra taşı nasıl pankreatit yapar", "tip": "Bilgi", "hoca": "Atıl Çakmak", "a": "Safra yolları ve pankreas kanalı birleşip wirsung kanalını oluşturur. Safra taşının ampulla vateri tıkadığı durumlarda safra içeriği pankreas kanalına doğru akar. Safra ile sindirim enzimleri karşılaşır, pankreas kanalı genişler ve irrite olur. Pankreas enzimlerinin pankreas içinde aktifleşmesi ve pankreasın otodigesyonu sonucu oluşur.?", "pages": [36]}, {"no": 93, "q": "Akut apandisit ile karışan kadınlardaki pelvik jinekolojik ağrının sebebi", "tip": "Bilgi", "hoca": "Kaan Karayalçın", "a": "Mittelschmertz(döngü ortası ağrısı,yumurtlama ağrısı), dış gebelik rüptürü (bu iki cevap akut apandisit slaytından) !!", "pages": [36]}, {"no": 94, "q": "Akut apandisit tanısı nasıl konur anamnez fm özellikle USG ve BT demesini istemiş", "tip": "Bilgi", "hoca": "Kaan Karayalçın", "a": "Anamnez ve fizik muayene. Usgde 6mmden\nbüyük appendiks, yağ dokusunun ekojenitesinin artması, apendikolit ve sıvı varlığı apandisiti düşündürür. BT akut apandisit tanısında en güvenilir görüntüleme yöntemidir; genişlemiş lümen, 6mmden kalın çift duvar kalınlığı, tek duvarın 2mmden kalın olması, periappendiks yağ planlarında kirlenme ve apandikolit görülmesi. Direkt karın grafisi duyarlılığı ve özgüllüğü çok düşük fakat ib hava sıvı seviyesi görüşmesi perforasyon göstergesidir. Ayrıca hamile hastada usg negatif bulundugunda MRI yapılır.", "pages": [37]}, {"no": 95, "q": "Akut apandisit tedavisi nasıl olur ameliyatın adı nedir apendektomi", "tip": "Bilgi", "hoca": "Kaan Karayalçın", "a": "Mortaliteyi azaltmanın tek yolu erken tanı ve cerrahi müdehaledir. Oral alım kesilir, kaybedilen sıvı ve elektrolitler yerine konulur. Özellikle peritonit vakalarında nazogastrik uygılamak ve antibiyotik tedavisi başlamak gerekir. Tedavi Apendektomidir. Komplikasyonsuz akut apandisit ve perfore apandisitte apendektomi yapılır. Plastron apandisitte hastanın agrısı geçene kadar oral alım kesilip antibiyotik başlanır. Ağrı geçince oral alım açılır.4-6 hafta sonra apendektomi yapılır. Karın içi oluşuma bağlı apse ya da peritonit oluşumu varsa bu bölgelerin drenajı ve yıkanması gerek. Periapendiküler apsede önce konservatif tedavi ardından drenaj ve en son apendektomi yapılır.", "pages": [37]}, {"no": 96, "q": "Meme ca risk faktörleri, en önemlisinden en az önemliye sırala", "tip": "Bilgi", "hoca": "İlknur Bayram", "a": "Kadın cinsiyet e/k:130, yaş (50yaş pik) (çünkü menopozdan sonra süt kanallarının yerini bağ dokusu alıyor hedef doku azalıyor ve tm artıyor. Dna tamir mekanizmalarındaki mutasyonlar neden oluyor.) Toraksta radyoterapi öyküsü , BRCA mutasyonu x10, Atipik hiperplazi ,atipik kolumnar hücre değişiklikleri, lobüler karsinoma in situ ( x10-12), duktal karsinoma in situ x3-4 , aile hikayesi x2-4, erken menarş, geç menapoz, (hormon replasman tedavisi görmek x1.3 , bu aşamadan sonra sıralama var mı bilmiyorum. oral kontraseptif kullanımı aydan hocalara göre artırır ilknur hocaya göre anlamsız artış, hiç çocuk dogurmamak riski artırır. 35 yaş üzeri gebelik meme kanseri riskini artırır.obezite riski artırır( yag dokusu ne kadar fazlaysa menopozdan sonra östrojen o kadar fazla olur o da meme kanseri riskini artırır) sigara riski artırır.", "pages": [37]}, {"no": 97, "q": "Mide ca inoperabilite faktörleri, uzak metastaz, fm de 7 kriter var,", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "Mide ca inoperabilite kriterleri: 7 FM kriteri var\n1) Virchow nodülü( sol supraclavicular lenf nodu)\n2) irish nodülü(sol aksillada)\n3) mary joseph nodülü göbekte(peritoneal karsinomatoziste umblicuta ele gelen sert kitle) 4) rektal muayenede ele gelen sert kitle(douglas çıkmazında blummer rafı)\n5) overde klukenberg tümörü,\n6) hepatomegali elegelen kitle (kc metastazı) 7) perküsyonda assit", "pages": [37, 38]}, {"no": 98, "q": "Assit fm de nasıl anlaşılır (ışınsal perküsyonda açıklığı yukarı bakan matite ve distansiyon)", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "karın muayenesinde fm 4 aşamadan oluşur sırasıyla:\nİnspeksiyonda: karında distansiyon görürüm, Karında asit var ve cilt gevşekse, hasta yatarken karın yanlara yayılır ve ortası düzdür. Oskültasyonda bişi bulamam,\npalpasyonda: (dalgalanma hissi). Bir yardımcı karın ortasına vertikal olarak elinin kenarıyla bastırır. Muayeneyi yapan kişi sağ taraftan bir fiske vurur, dalgalanma hissini solda hisseder Ballotman:Eliniz karına temas halindeyken, elinizi kaldırmadan vuruyormuş gibi hızlıca bastırın. Asit işinde yüzen kitleler, büyümüş karaciğer ya da dalak elinize çarpar.\nşimdi şöyle ki karın perküsyonunda umblikustan aşağı doğru yaptığımız ışınsal tarzda perküsyonlarda matiteye dönen noktaları birleştiren hayali bir çizgi çekersek ve bunun açıklığı yukarı bakıyorsa (yani en basitinden U gibi düşünün) o zaman >assiti gösterir", "pages": [38]}, {"no": 99, "q": "Aşağı bakan matite ne zaman olur", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "Açıklığı yukarı bakan matite assit, aşağı bakan matite kitle, hidropik mesane ya da gebelik göstergesidir.\nPozisyonla yer değiştiren matite: Hastayı sağına ya da soluna döndürünce matite olan bölgelerden timpan ses geliyorsa, içeride asit olduğu doğrulanmış olur.", "pages": [38]}, {"no": 100, "q": "Mide ca 5 yıllık survive, prognozu etkileyen faktörler ve etyolojisi,", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "birinci evrede yakalanırsa yani mide dışına yayılmadan teşhis ve tedavi edilirse, 5 yıllık sağ kalım oranı % 70' dir.\nKanser ikinci evrede ise tedavi sonrası 5 yıllık sağ kalım oranı %32-45,\nüçüncü evrede % 9-20'dir. dördüncü evre ise % 4'tür.(uzak organ metastazlı)\nBence prognozu etkileyen durumlar:\nTümör boyutu lenf nodu metastazı yapıp yapmadığı, uzak organ metastazı varlığı, hastanın yaşı, kronik hastalığı olup olmadığı, kanserin differansiye derecesi,", "pages": [38]}, {"no": 101, "q": "Türkiyedeki tüm kanser taramaları meme(20+kendi kendine muayene ve 40 yaş üstü 2 yılda bir mammografi) kolorektal (50+ kolonoskopi ve gaytada gizli kan) mide (gastroskopi) prostat( PSA Prostat Spesifik Antijen taraması) ac kanseri (spiralli yüksek rezülüsyonlu bt)", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "ülkemizde DSÖ nün önerdiği 3 kanser tipinde tarama yapılıyormuş\nMEME:\n20 yaş üzeri:Ayda 1 kendi kendine meme muayenesi ve 2 yılda bir klinik meme muayenesi 40 yaş sonrası: ayda bir kendi kendine meme muayenesine ek yılda bir klinik muayene ve 2 yılda bir mamaografi\nSERVİKS:\n30 yaşından sonra 5 yılda bir hpv dna testi ve pap-smear testi\nKOLREKTAL:\n50 yaşından sonra yılda bir ggk ve 10 yılda bir kolonoskopi\n(ek olarak da mide için gastroskopi,prostat için kanda PSA taraması ve AC ca için de spiralli yüksek reülüsyonlu BT)", "pages": [38, 39]}, {"no": 102, "q": "Kolorektal ca taraması neden önemli (poliplere bakarız %90 polip zemininde gelişiyor %90 önlenebilir)", "tip": "Bilgi", "hoca": "Mehmet Gürel", "a": "Çünkü kolorektal kanserler en sık gis kanseri ve erkeklerde 3. Kadınlarda 2. En
